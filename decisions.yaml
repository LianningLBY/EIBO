- id: D076
  date: 2026-09-14 09:27 UTC
  summary: 'X11 measured 0.1608 vs the primary corpus''s 0.3434 with no tuning - a
    result against our own C1 headline. I recomputed both artifacts myself: 64.7%
    of the 18.3-point gap is per-pair evidence volume and service granularity (82
    services at smaller n vs 45), median tv converges to 0.5935 vs 0.5805 under matching,
    so 0.1608 must not be cited as corpus non-extrapolability. The residual ~6.5-point
    gap is the real signal. X11 must be registered, with the stratification carried
    inside it.'
  rationale: 'X11 (cross-corpus feasibility on CESNET-QUIC22) completed and produced
    a result that argues AGAINST our own headline number: the upper-side certifiable
    fraction is 534/3321 = 0.1608 on QUIC22 versus 340/990 = 0.3434 on the primary
    corpus, with tuning_performed = false. That is the single most important scientific
    result of the session so far, because it speaks directly to the hardest reviewer
    objection (single-corpus, unknown month coverage) and it goes against us.


    The Reviewer raised a warning that the comparison may be confounded, and I RECOMPUTED
    IT MYSELF from the two artifacts rather than accepting either the agent''s framing
    ("half, does not reproduce") or the Reviewer''s summary. Both corpora''s per-pair
    rows are in tracked artifacts: artifacts/X11/data/x11_feasibility.json (protocol.per_pair_summary.rows,
    3,321 rows) and artifacts/_project/data/q1_absolute_counts.json (pairs with M=1,
    990 rows).


    WHAT I MEASURED:

    - Primary corpus (990 pairs): min(n_a,n_b) min 2,791 / p25 7,679 / median 13,049
    / p75 50,953 / p90 159,842 / max 1,375,270. frac eps_hi<0.5 = 0.3434. median tv
    = 0.5805.

    - QUIC22 (3,321 pairs): min 2,080 / p25 3,208 / median 7,565 / p75 13,211 / p90
    42,294 / max 339,731. frac = 0.1608. median tv = 0.6892.

    - QUIC22 stratified by min-n: all 0.1608 (3,321) / >=5,000 0.1941 (1,891) / >=10,000
    0.2217 (1,326) / >=13,049 0.2485 (861) / >=20,000 0.2822 (528) / >=40,000 0.2934
    (351) / >=80,000 0.2789 (190). This reproduces the Reviewer''s table exactly.

    - Matched comparison at the primary median n: raw gap 0.3434-0.1608 = 0.1826;
    matched gap 0.3434-0.2789 = 0.0645; so 64.7% of the raw gap is explained by per-pair
    evidence volume and service granularity alone.

    - median tv CONVERGES under matching: 0.6892 unmatched -> 0.5935 matched, versus
    the primary''s 0.5805. The residual is 0.013 matched against 0.109 unmatched,
    so the "QUIC22 services are intrinsically more separable" explanation is itself
    largely an n effect.

    - A common-n-band tv comparison has MIXED SIGN across bands: primary higher in
    20k-50k (0.6857 vs 0.5785), QUIC22 higher in 5k-10k (0.7594 vs 0.6380) and 10k-20k
    (0.6745 vs 0.5257), roughly equal at >=200k (0.4732 vs 0.5251). So pooled tv medians
    are band-noisy and are not a corpus property either.

    - Structural: 990 = C(45,2) and 3,321 = C(82,2). QUIC22 has 82 retained services
    at smaller per-service n against the primary''s 45 services. That is a different
    measurement design, not the same experiment on a different corpus.


    RULING: `reproduces_upper_fraction: false` STAYS as recorded - it is honest and
    I am not softening it, and the absence of tuning (tuning_performed: false), the
    absence of object substitution, and the artifact''s own statement that the full
    two-sided decision is unavailable because the lower classifier pipeline did not
    run are all to the agent''s credit. BUT the single pooled point 0.1608 must NOT
    be cited as evidence of "single-corpus non-extrapolability", and X11 must NOT
    be used as either falsification or confirmation of C1 until a scale-matched resampling
    is done. The citable sentence is: under a fixed protocol QUIC22''s marginal upper-certifiable
    fraction is lower; at matched per-pair evidence the gap narrows from 18.3 to ~6.5
    points and the median tv converges (0.594 vs 0.581); the raw single-point figure
    is a composition-affected marginal proportion, not a corpus property.


    The residual ~6.5-point gap is the real, still-unexplained signal, and it is far
    smaller and more interesting than the "half" framing suggests. Also required:
    X11 is UNREGISTERED - the Reviewer greps 0 hits in both registry.yaml and manifest.yaml
    - which is the same "ran it but recorded it as never run" pattern seen with X6
