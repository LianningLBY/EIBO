- id: D096
  date: 2026-09-15 00:20 UTC
  summary: 'D096: do not force X9_C to terminal; accept the status-vocabulary gap
    and annotate (costs passive mode, not integrity)'
  rationale: 'The passive-mode gate refuses entry while X9_C is non-terminal, and
    the state machine refuses PREPARING->DONE (only PENDING/QUEUED permitted). Reaching
    DONE therefore requires walking QUEUED->ALLOCATED->RUNNING->DONE, which would
    write transition checkpoints asserting a managed run for a design that was withdrawn
    and never executed - exactly what M131 forbids. DECISION: accept the non-terminal
    status, do not force the transition, and annotate the row to say why. This follows
    D094, which was written about this precise row: a refused transition on an object
    the state machine does not govern is a categorisation fact, and the remedy is
    annotation, not a workaround. It does not reverse D088 (a withdrawn design must
    not read as live) - it accepts that the status vocabulary cannot express ''withdrawn'',
    so the note carries that meaning instead, and the fields that would be fabricated
    (pid/allocation/tmux) stay null. TRADE-OFF ACCEPTED: the project cannot enter
    passive mode while this row is non-terminal. That is a tool-vocabulary gap (no
    cancelled/withdrawn value), not unfinished work, and it costs only the quiet-idle
    convenience, not any scientific or provenance integrity. Flagged for the platform.'
  related_experiments:
  - exp_id: X9_C
    result: withdrawn, never run; status cannot reach a terminal value without fabricating
      history
    role: subject
  depends_on:
  - D088
  - D094
