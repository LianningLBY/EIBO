- id: D138
  date: 2026-09-16 18:13 UTC
  summary: 'RETRACTED D136: the pairwise->open-set reduction is NOT impossible. The
    summation step is a valid textbook generalisation of Le Cam (refutation was a
    harness bug — 100/400 violations came from scoring a mislabelled classifier; 0/400
    with the correct Bayes error), and the counterexample''s true error is 0.0753
    against a floor of 0.0452, so the formula holds. No paper edit: the existing "no
    aggregation" scope is correct and needed no strengthening. A conditional open-set
    corollary exists and was verified, but must cite Le Cam as the standard result.'
  rationale: 'D136 claimed the pairwise->open-set reduction is impossible and was
    about to be written into the paper. Independent scrutiny found it wrong and I
    reproduced both errors myself. (1) The summation step IS valid for all K: constructing
    the binary test from the classifier itself (psi_ij(X) = 1{phi(X)=i}) gives, under
    Y=j, {phi=i} subset of {phi!=j}, so the test''s error is at most err_j; Le Cam
    then applies unconditionally. My ''more classes => more information'' objection
    does not apply because the reduction uses the same classifier, hence the same
    information set. (2) The ''counterexample'' is not one: recomputed, the per-class
    Bayes errors are [0.014113, 0.0875 x5], mean 0.075269, against a floor of 0.045161
    — the formula holds with slack 0.030. Separability would require rest=0 i.e. tv=1
    and a floor of 0, so the two conditions I claimed cannot co-occur. Root cause
    of my error: the verification script scored argmax(P,axis=1)==arange(K), which
    assumes class i''s modal symbol is the i-th column — true only for index-aligned
    one-hot supports; the duplicated-support mode broke it and measured a mislabelled
    classifier. Re-run with the correct uniform-prior Bayes error: 0 violations in
    400 cases (100 with the broken scorer). (3) The general impossibility is a direct
    corollary of Le Cam and therefore also NOT our finding, and Le Cam/Fano/Assouad/Tsybakov
    are absent from references.bib, so this would have had to be cited rather than
    claimed. What IS available and verified: the conditional open-set corollary, which
    holds in all three forms tested (mean, max, min over i of tv(P_i,U)) on both benign
    and adversarial configurations — including U close to one known class, where it
    correctly still holds. Paper impact: none on C1/C2/C3 or the headline numbers;
    the existing scope wording (measurement_design.tex:20-33, abstract.tex:10, introduction.tex:78)
    is already correct and safe, so no paper edit is required and the planned edit
    is withdrawn.'
