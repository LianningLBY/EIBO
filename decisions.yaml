- id: D082
  date: 2026-09-14 13:01 UTC
  summary: 'X9 measured a +0.38 SNI-inclusion delta, but the two arms differ in alphabet
    size by ~10^24 and C2 already showed a finer alphabet inflates TV - so the SNI
    dependence and the cardinality increase are the same treatment and the attribution
    is OPEN. Ruled the number unreportable as the price of SNI until a matched-cardinality
    control (ARM C: same-width random identifier, independent of the SNI, fixed seed)
    separates the two.'
  rationale: 'X9 ran and produced a large, consistent result: over 703 pairs, delta_tv_hat
    median +0.3769 / mean +0.3923, and delta_eps_hi median +0.3879 / mean +0.3897,
    with outcome field MEASURED_SNI_CHANNEL_INCLUSION_DELTA.


    I fetched and read the artifact myself rather than accepting the outcome field,
    and found the measurement is confounded by a second treatment change.


    The design is correct in every respect that was specified: same_flow_set_across_arms
    true, flow-disjoint and time-disjoint verified, k=5/M=1, service threshold 2000,
    buffer month 202412 unused, cpu_only true, no packet-level split. The object declaration
    - that both arms are laws over the same object differing only by whether the SNI-derived
    DST_IP participates - is supported by the method section. The execution is correct
    and the plumbing is right.


    But the artifact''s own alphabet block shows the arms differ in a second way:
    ARM A''s fixed alphabet size is 32 (the declared (direction,size) k=5 prefix)
    while ARM B''s is 38685626227668133590597632 = 256^10 (the full fixed-width DST_IP
    storage domain), a ratio of about 10^24. So ARM B is not "the same channel plus
    SNI" - it is a partition whose alphabet is 24 orders of magnitude finer. And this
    project has already established as C2''s headline mechanism that a finer alphabet
    RESOLVES MORE rather than less: tv medians at k=5 rise 0.5805 -> 0.8833 -> 0.9248
    -> 0.9462 -> 0.9673 as M increases.


    Therefore a +0.38 shift has two available explanations - SNI genuinely separating
    services, or a vastly finer partition inflating TV as an alphabet-cardinality
    property - and this artifact cannot separate them, because the SNI treatment and
    the cardinality treatment are the same treatment. I searched the artifact for
    any control or caveat and found none: cardinality, control, matched, confound,
    caveat, limitation all zero hits. Nothing warns a reader that the arms differ
    in alphabet size by 24 orders of magnitude.


    RULING: the +0.39 must not be reported as the price of SNI/ECH in any surface
    until the confound is separated. Required remedy, dispatched: add a third arm,
    ARM C - matched cardinality, SNI-independent - partitioning by the packed (direction,size)
    k=5 prefix concatenated with a random identifier drawn from the SAME fixed-width
    storage domain as DST_IP but assigned independently of the SNI, per flow, same
    width, fixed seed recorded. Then the reading is decisive: if ARM C''s delta versus
    ARM A is also about +0.38, the shift is cardinality and the SNI reading collapses;
    if ARM C''s delta is about zero while ARM B''s stays +0.38, the shift is genuinely
    the SNI dependence. Also required: an explicit arms block in the artifact giving
    each arm''s alphabet size, so a reader sees 32 / 256^10 / 256^10 side by side
    - that block is what was missing and what let the confound hide. X9 stays ANALYZING
    rather than advancing to DONE with the confounded delta as its conclusion. Option
    (b), writing the confound into the artifact and refusing the price-of-SNI reading,
    is available but leaves the experiment''s central question unanswered; the control
    is a small addition to a runner that already runs in 190 seconds.


    This is the same class as M055, where the word "marginal" silently named two objects
    and cost a conclusion. Caught by reading the artifact''s alphabet block rather
    than its outcome field, and before the number reached any paper-facing surface.'
  related_experiments:
  - exp_id: X9
    result: 'SNI-inclusion delta measured at +0.38 median TV over 703 pairs, but confounded:
      ARM B''s alphabet is 256^10 vs ARM A''s 32, a 10^24 ratio, and C2 already showed
      a finer alphabet inflates TV. Attribution OPEN pending a matched-cardinality
      control.'
    role: subject
