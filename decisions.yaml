    0.0784, p75 0.1119, max 0.2214, with ZERO negative widths (no invalid bracket).
    So the title object can be characterised and the claim "the lower side saturates"
    is substantively supported: the median lower bound is 0.5548, far above the 0.05
    gate. DECISION: add a quantile summary of eps_lo and of the bracket width, computed
    from q1_lower_side_full_n.json, rather than hedging the text.


    RT-W7 — ONE ALIGNING SENTENCE, NOT A REWRITE. I read all three sentences rather
    than the summaries. introduction.tex:30 says the sides "differ in construction
    and in tightness, not in whether a guarantee is available"; measurement_design.tex:211-222
    (§3.5) says both carry a confidence level, differing "in construction, in the
    provenance of their constants, and in tightness", with the upper radius a fixed-form
    finite-sample-derived constant and the lower constant asymptotically derived and
    hence NOMINAL rather than exact; related_work.tex:124-130 (§6.4) claims priority
    on "asymmetric guarantee strength". §1 and §3.5 agree with each other; §6.4''s
    phrase is the one in tension, and §3.5''s nominal-vs-exact distinction IS a kind
    of asymmetric strength. So Reviewer 3''s reading is right and Reviewer 2''s "cannot
    stand" is too heavy: the fix is to make §6.4 name WHICH asymmetry (nominal vs
    exact, and construction) and cite §3.5, in one sentence. DECISION: aligning sentence,
    not a rewrite, and not a downgrade of the novelty claim.


    RT-W9 — DO ALL THREE, they are cheap and the reviewers are right. The heterogeneous-i.i.d.
    confound demonstration belongs in Contributions (it is genuinely one of the strongest
    results and currently appears in none of the five entries); "certification-grade"
    should be defined on first use; the novelty boundary should be surfaced in the
    Introduction, which is where a reader decides whether the paper is for them. All
    are text and all fit the reflow that W3 requires anyway.


    RT-W11 — name the sparse-inflation confound against the paired-increment test:
    the increments establish significance but do not separate genuine resolution from
    sparse-inflation, and the saturating column is the tell. Text fix.


    With all four settled, the entire Round 3 list is now actionable and moves to
