    from HEAD — so the INPUT the delivered PDF depends on existed in no commit at
    all. HEAD's main.pdf was also the superseded de5e4b63, not the delivered 4e0a80a2.\nI
    had carried forward \"the deliverable is committed\" from the earlier 14eafe6
