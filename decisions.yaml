- id: D055
  date: 2026-09-14 06:16 UTC
  summary: 'Both controls landed and SPLIT the question: the heterogeneous-i.i.d.
    arm returns DEAD (45/45, reproducing the real vote exactly), so the vote is NOT
    evidence -- my D052 point was right and my D053 withdrawal was wrong; but the
    arm''s dBIC is ~58x SMALLER than real, so heterogeneity does not explain the magnitude
    either. The dose-response shows deflation tracks thinning in both synthetic arms,
    contradicting B''s real-data scan. (ii) demoted to NOT EVIDENCE; (i) untouched.'
  rationale: 'Both dispatched controls landed and they reconcile into a split verdict
    that supersedes BOTH my D052 finding 1 and my D053 withdrawal of it. Neither prior
    position was wholly right.


    CONTROL (a) HETEROGENEOUS-i.i.d. ARM — the vote is NOT diagnostic, and my original
    D052 finding was right about that. Preregistered decision rule (verbatim from
    the artifact): dead if the arm returns Markov favoured for essentially all items;
    survives if it returns IID favoured; operationalized as >=44/45 (0.9778). Measured:
    each cached service keeps its exact usable-flow count; each flow independently
    draws ONE rate with replacement from the pooled empirical per-flow rate distribution
    (n_flows = 5,058,007), then emits 30 i.i.d. Bernoulli bits — so within-flow dependence
    is ZERO by construction. Result: verdict = DEAD. At k=30 the arm gives markov_favours
    45/45, iid 0/45, ties 0. Over the full k=2..30 scope: 1281 Markov vs 24 IID =
    0.9816, i.e. essentially all. Per-prefix it reaches 45/45 from k=8 onward and
    never falls below 35/45. So between-flow heterogeneity ALONE reproduces the real
    data''s "Markov 45/45 at every k" vote. The vote therefore carries NO evidence
    for within-flow dependence.


    CONTROL (a) ALSO CONFIRMS THE MAGNITUDE IS NOT EXPLAINED BY HETEROGENEITY — so
    the independent review''s ratio argument was right about MAGNITUDE. The arm''s
    k=30 median dBIC is ~1896 while the real data''s is ~110,091 — roughly 58x larger
    (the review''s independent simulation gave ~47x on the per-observation likelihood
    advantage; these are the same phenomenon measured two ways). So heterogeneity
    reproduces the VOTE but not the SIZE.


    RECONCILIATION: the two measurements are not in conflict — they answer different
    questions. (i) The DIRECTIONAL VOTE (45/45) is reproduced by a zero-within-flow-dependence
    null, so it is not diagnostic of within-flow structure; my D052 finding 1 stands
    on that point and my D053 withdrawal of it was WRONG. (ii) The MAGNITUDE exceeds
    the heterogeneity null by ~47-58x, which means heterogeneity alone does not account
    for the observed likelihood advantage either. Neither "the dependence is real
    and first-order" (D046) nor "heterogeneity fully explains it" (D052 as first written)
    nor "heterogeneity is refuted, dependence is real" (D053) is the correct summary.
    The honest summary: THE VOTE IS NOT EVIDENCE; THE MAGNITUDE EXCEEDS THE HETEROGENEITY
    NULL BUT DOES NOT ESTABLISH "FIRST-ORDER", because the null is a single global
    p and any per-position marginal drift suffices.


    CONTROL (b) OCCUPANCY DOSE-RESPONSE — the deflation DOES track thinning in both
    synthetic arms, which partially REVERSES my D052 finding 2. Measured: thinning
    levels retained_fraction 1.0/0.5/0.25 (and 0.125/0.0625); the statistic is the
    mean over k=5..30 and both laws of the fraction of observed contexts with fewer
    than 5 retained transitions. Decision rule: deflation tracks thinning iff that
    statistic is nondecreasing AND the fitted exponent p is nonincreasing as retained_fraction
    falls. Result: tracks_thinning = True for BOTH the plain_iid arm and the twin_real_occupancy
    arm, and joint_tracks_thinning = True. So sparse occupation IS dose-dependently
    associated with more sublinear fits in these synthetic arms. HOWEVER this does
    not straightforwardly restore "sparse occupancy is the mechanism", because variant
    B''s real-data threshold scan moved the OPPOSITE way (tightening the occupancy
    threshold made the plain arm MORE sublinear, p 0.539 -> 0.210). The synthetic
    dose-response and the real-data threshold scan therefore disagree in direction,
    and that disagreement is itself unexplained. Mechanism remains NOT ESTABLISHED,
    but now for a sharper reason: two controls point in opposite directions.


    DISPOSITION: (ii) is demoted from "sanity corroboration" to "NOT EVIDENCE — the
    vote is reproduced by a zero-dependence null". C3 remains a methods/limits finding
    on part (i), which is untouched by any of this. The position-wise i.i.d. null
    and the parametric route remain REQUIRED and unrun. A two-claim paper becomes
    a live option rather than a fallback, because (ii) no longer supports even the
    non-vacuity framing at the strength claimed — though part (i) alone ("the standard
    plug-in cannot adjudicate this on this data") still stands as a reportable negative.'
  related_experiments:
  - exp_id: X3
    result: heterogeneous-i.i.d. arm returns DEAD (45/45 at k>=8, 98.2% overall) --
      the vote is not diagnostic; but arm median dBIC 1896 vs real 110,091 (~58x)
      so heterogeneity does not explain the magnitude either; dose-response shows
      deflation tracks thinning in both synthetic arms, contradicting variant B's
      real-data scan direction
    role: subject
