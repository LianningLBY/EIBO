- id: D012
  date: 2026-09-13 13:11 UTC
  summary: 'The ladder quantifies Q1: at k>=5 no design-stage rung passes both conjuncts,
    and the best-k_cert rung has eps_lo ~0.0004 — the trivial-pass mechanism measured.
    But it is design-stage only, so the real per-rung TV compression becomes the decisive
    measurement; and the lower side must be re-run with divisibility, which could
    reverse Q1.'
  rationale: 'The channel ladder landed and quantified the Q1 trade that D009 had
    only characterised qualitatively. Design-stage ensemble (P=(1-tv,tv,0), Q=(1-tv,0,tv)
    on three fixed k-prefix cells, n=1e4 per law, Michel lower side on a one-hot-cell
    feature map), verified here against the artifact:


    | rung | M | base | k_cert (n=1e4, tv=0.3) | eps_hi median @k=5 | eps_lo median
    @k=5 | joint fraction @k=5 |

    |---|---|---|---|---|---|---|

    | 0 | 1 | 2 | 8 | 0.089 | 0.0004 | 0 |

    | 1 | 2 | 4 | 4 | 0.373 | 0.0174 | 0 |

    | 2 | 4 | 8 | 2 | >1 | — | 0 |

    | 3 | 8 | 16 | ~1 | >1 | — | 0 |

    | 4 | 16 | 32 | ~1 | >1 | — | 0 |


    At k >= 5 no design-stage rung satisfies both conjuncts, and eps_lo is far below
    the 0.05 threshold at every rung. The pattern is exact: the rung with the best
    k_cert (M=1) has eps_lo median 0.0004, because coarsening collapses the channel
    TV so the two laws become nearly identical and no discriminative evidence survives.
    That is the trivial-pass mechanism measured rather than predicted — the third
    time this failure mode has surfaced and the first time it has been quantified.
    Two hard limits are also confirmed: at tv_hat = 0.50, k_cert = 0 for every rung
    and every n (the certified stratum is TV < ~0.48 by construction), and max_certifiable_tv
    approaches but never reaches 0.5.


    **But this is a design-stage statement, not a statement about QUIC, and that distinction
    is decisive.** Each rung''s `compression_factor` (0.02 / 0.1 / 0.35 / 0.7 / 1.0)
    is an *assumed* mapping from service-pair full-flow TV to channel TV. So "no rung
    passes" describes that data-generating process, not real traffic. The single most
    load-bearing empirical quantity for Q1 is therefore the **real per-rung TV compression**:
    if real services separate less than assumed, Q1 fails outright; only if they separate
    more does M=1 or M=2 clear both conjuncts. This should be measured **before**
    the full bracket run, because it decides Q1 earlier and more cheaply. Note also
    that the design-stage eps_hi uses the known true TV to isolate channel effects,
    so real data must supply an empirical tv_hat.


    Two corrections to the ladder''s own execution, both of which could change the
    Q1 conclusion:

    1. **The lower side is miscalibrated.** It was run through `tv_lower_bound` on
    a one-hot-cell feature map — a representation on which no classifier can generalise,
    so eps_lo is necessarily noise-level. That explains the 0.0004 median. Re-running
    with the **divisibility / rejection-generic** route, which works directly on the
    discrete cell alphabet without needing a low-dimensional embedding and needs no
    alphabet bound, could raise eps_lo above threshold and reverse Q1 at M=1 or M=2.
    Both lower sides should be reported side by side with their respective strengths.

    2. **eps_hi must never be silently clipped to [0,1].** The worked-numbers table
    retains 16.595 for M=2, k=15 — a value above 1 is the *signal* that the certificate
    is lost, so it is information, not a defect to tidy away.


    Also verified directly this round: `tests/write_report.py:103` still reads `if
    radius < 0.5:` unchanged, and line 140''s `informative_fraction` still computes
    a single pair''s boolean while its name reads as a fraction. Both remain outstanding,
    and until the criterion is repaired none of its numbers may be cited.'
