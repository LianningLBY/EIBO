    STILL WANTED FROM THE REVIEWER: the guard assertion that mechanically binds a
    constant to its stated joint level, since at alpha = 0.05 the two candidates coincide
    numerically and this whole defect class is invisible to any check comparing numbers
    rather than provenance. Both of our reports erred in derivation while conclusions
