- id: D198
  date: 2026-09-23 04:38 UTC
  summary: 'Audited §4.4''s resolution-substitution direction claim against §4.2''s
    certificate-loss finding: NOT a contradiction (fewer pairs with a usable certificate
    vs a lower bar for those that have one). But the underlying assertion — that eps_hi
    rises with M — could not be verified from released artifacts, since no non-scratch
    artifact exposes per-pair tv_hat/eps_hi across rungs. Not verified and not refuted;
    recorded as an unverified assertion with the check that would settle it.'
  rationale: 'Checked a claim I had repeatedly cited as a strength but never tested:
    §4.4''s resolution-substitution argument, which asserts that at finer resolution
    both the plug-in divergence and the confidence radius increase, lowering the predicted
    floor and making a violation EASIER to observe, so the detector''s non-breach
    on the finer observable is the stronger statement. This sits in apparent tension
    with §4.2''s finding that finer resolution DESTROYS the certificate (340 pairs
    at M=1 -> 0 at M=8/16), so it was worth resolving.


    STEP 1 — LOGIC. The two statements are compatible, not contradictory. (b) §4.2
    is about how MANY pairs retain a usable certificate (it collapses with M). (a)
    §4.4 is about the HEIGHT of the floor for those that do (it falls with M, making
    the bar easier). Fewer pairs, each with a lower bar. No contradiction, so nothing
    to correct in the paper on this axis. The paper also states the substitution''s
    direction explicitly and brackets it honestly with "a breach on the finer channel
    would not, however, falsify the coarser certificate; this validation is a consistency
    check, not a falsifiable test" — which correctly caps the claim.


    STEP 2 — VERIFICATION STATUS, recorded so it is not over-claimed. I could NOT
    verify claim (a) from the released artifacts. I searched for an artifact carrying
    per-PAIR tv_hat and eps_hi across the M rungs (the paper''s §4.2 says Table 5
    "comes from the released per-pair ledgers, which carry all five M-rungs for the
    same pairs at every k"), and found no artifact in the non-scratch tree exposing
    per-pair values across rungs — only per-rung aggregates (e.g. the M=1 median tv_hat
    0.5805 reported in §4.2''s text). So the M-trend of eps_hi that (a) depends on
    is asserted in the prose and backed by the rung-level aggregates the paper reports,
    but I have not re-derived it per pair.


    DISPOSITION: no edit, no finding. Not verified and not refuted — recorded as an
    unverified assertion so a future session does not (i) treat this audit as having
    confirmed it, or (ii) claim it is unsupported. If it ever needs hardening for
    review, the check is: expose per-pair (tv_hat, eps_hi) at M=1 and M=2 from the
    released ledgers and confirm the paired increment is positive. The near-term items
    are unchanged (PI verdict, Table 5 placement); this does not add work at the current
    stage.'
