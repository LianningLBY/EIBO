- id: D245
  date: 2026-09-25 07:12 UTC
  summary: Built scripts/verify_bibliography.py — a field-level publisher check with
    a self-test, executed on known-good and known-bad input, whose own 3-of-6 false-positive
    rate I measured and fixed — and re-dispatched the bib fix that two context rotations
    had silently swallowed, adding a mandatory starting-state check so a third non-execution
    cannot read as success
  rationale: 'Built the mechanism whose absence let a fabricated bibliography entry
    reach a submitted PDF, and re-dispatched the fix that two context rotations had
    swallowed.


    1. WHY A NEW MECHANISM WAS NEEDED. Both checks that already ran on this project
    passed while real defects were live, and the reason is structural:

    - The platform reference check is a CITE-to-BIB-KEY resolution check. It cannot
    see whether a title or an author list is TRUE. Worse, its input is a snapshot:
    it verified 64 entries on 2026-09-23, and the five entries added the next day
    were never in its input at all. One of those five was veicht2023deepsewf, which
    carried a fabricated title and two invented given names to the rendered PDF.

    - The bulk author comparison arms ran twice and produced 28 flags, every one a
    formatting artifact (BibTeX "Surname, Given" vs Crossref "Given Surname"; LaTeX
    accents). Its author recorded the near-miss and stopped filing.

    So the standing claim that "the check is not mechanised anywhere" was correct,
    and the second entry in the fabricated-field class still had no detector.


    2. WHAT I BUILT: `scripts/verify_bibliography.py`. It asks the publisher (Crossref
    / DataCite / arXiv) what each entry''s OWN identifier names, then compares titles
    and author-family SETS. Design choices that matter:

    - It SELF-TESTS its comparison before trusting any output (`--self-test`), including
    a synthetic correct entry whose author list wraps across source lines and uses
    brace-quoted surname particles -- the exact shape that produced the false luxemburk2023cesnet
    defect. Refusing to run when the self-test fails is deliberate.

    - Executed on BOTH known-good and known-bad input, per the standing guard rule:
    on a synthetic file of the three known defects plus one correct wrapped-field
    entry it returns ok=1 MISMATCH=3 exit 1 (catches all three, does not flag the
    good one); on the real file it returns parsed=69 checked=65 ok=62 MISMATCH=3 unverifiable=4
    exit 1.

    - It reports UNVERIFIABLE (no DOI, no arXiv id) as its own list that does NOT
    fail the run, so "not checked" can never be read as "correct".

    - Its own false-positive rate was measured: the first real run produced 6 mismatches
    of which 3 were its own artifacts (a title read as "na ive" because the accent
    rule `\\[a-zA-Z]+` does not match the backslash-then-punctuation form `\\"i`;
    and two IEEE titles carrying raw `<inline-formula>`/`tex-math` markup). I fixed
    both (added `html.unescape`, tag stripping, `$...$` removal, and the punctuation-accent
    rule), added both cases to the self-test, and the signal dropped to exactly the
    3 genuine items. An instrument that cries wolf on half its output gets ignored,
    which is how the false Siska report survived in the first place. Documented limitation
    kept in the docstring: it cannot see CROSS-FIELD inconsistency, so it would not
    have caught the entry whose booktitle names a conference while its DOI belongs
    to the preprint.


    3. DISPATCH FAILURE MODE, now addressed. The batched edit instruction was recorded
    as queued twice and executed zero times: each time the Agent went idle with an
    empty queue and references.bib unedited (mtime still 2026-09-24 20:26, sekeh DOI
    still the dead 2999953, li2023facing still 5 authors). The Agent''s own reports
    confirm it was consumed by context rotation. This time the system reported the
    Agent had just finished rotating AND the Agent is demonstrably processing (it
    ran a scratch-cleanup worker off the earlier message). I re-assigned with a mandatory
    STEP 0 that makes the starting state explicit and reportable, so a third silent
    non-execution cannot look like success, and I told it to run my verifier on its
    own edits as an independent check (it must read MISMATCH=1 afterwards, the held
    entry only).


    4. SCORED THE OUTSTANDING WORKER FINDING as a checker artifact, not a defect:
    the archive-coverage worker''s only UNRESOLVED item names three estimator scripts
    (x3_variant_a_estimator_family.py, x3_variant_b_support_conditioning.py, x3_controls.py)
    that NO .tex file mentions. The string comes from a manifest entry description,
    one instance marked SUPERSEDED/do-not-cite. The paper''s actual script promise
    is the Figure-generators line, resolved by four present members.'
