  depends_on: []
- id: D104
  date: 2026-09-15 06:53 UTC
  summary: 'D104: W10 cluster bootstrap confirmed correct — retract my replication-based
    complaint; final headline 33.9% with CI [26.5%, 43.1%]'
  rationale: 'The W10 cluster bootstrap artifact (art_20260915_1ea3c0) is CONFIRMED
    CORRECT as delivered, and I retracted my request to change its construction. Resolution
    of the three-way discrepancy:


    - Artifact: joint gate [0.2645, 0.4310], ratio 2.84x, median replicate pair count
    406 (p5 300, p95 496).

    - My ad-hoc replication: [0.2635, 0.4365], ratio 3.00x, median 396 (and 378 on
    a sloppier variant). WRONG.

    - Resolution: a 50000-trial simulation of the artifact''s exact construction (45
    services drawn with replacement, deduplicated to a SET, complete graph rebuilt
    on the set) gives median 406, p5 300, p95 496 - an exact match. So the artifact
    is right and my replicate-row construction was faulty. Retracted the instruction;
    the only ask now is a documentation clause stating that duplicates are deduplicated
    before the graph is rebuilt.


    Also recorded: the independent Reviewer reached the CORRECT conclusion about the
    artifact via faulty arithmetic. It computed C(45*(1-(44/45)^45), 2) = C(28.63,2)
    = 395.6 and wrote "= 406". C(K,2) is convex, so C(E[K],2) is not median C(K,2);
    the median distinct count is 29 and C(29,2) = 406 exactly. The check blessed the
    right answer for the wrong reason.


    FINAL HEADLINE (unchanged point estimate, corrected interval): joint gate 336/990
    = 33.9%, 95% cluster-bootstrap CI [26.5%, 43.1%]. The naive pair bootstrap understated
    the interval width by ~65% (2.84x narrower). Sanity: a naive sqrt(990/45) = 4.7x
    expectation exceeds the observed 2.8x, consistent with only part of the per-pair
    TV variance being service-level - so the magnitude is internally sensible, not
    over-correction.


    Logged as mistake M133 (two instances this round of flagging a defect in another
    role''s artifact that was a defect in my own replication). Standing rule recorded
    to memory: reproduce their stated construction exactly; verify absence exhaustively
    rather than from a truncated display; simulate distributions rather than evaluating
    convex functions at means.'
