- id: D083
  date: 2026-09-14 13:44 UTC
  summary: 'Ruled the X9 SNI arm: keep DST_IP as primary per spec (do not substitute
    the raw QUIC_SNI hostname, which would change what the experiment is about), add
    a cheap premise test of whether DST_IP is a deterministic function of QUIC_SNI
    on the shared flows since both fields exist and the claim had never been verified,
    and defer a QUIC_SNI arm with the trigger being a NO from that premise test.'
  rationale: "The X9 spec's founding claim is that the anonymised destination-host
    identifier DST_IP is a deterministic function of the SNI, and that claim is what
    justifies excluding it from the declared channel. RC5's purpose is to convert
    that exclusion from an unstated assumption into a measured price.\n\nThe artifact's
    own source block reveals that BOTH fields exist in the corpus and are recorded:\n\n
    \ sni_derived_destination_host_identifier_field : DST_IP\n  sni_field                                     :
    QUIC_SNI\n\nSo the derivation is no longer something we must assume - it is directly
    testable on the shared flows, in the same pass, at essentially no cost. And it
    had never been tested: the object declaration asserts \"the SNI-derived destination-host
    identifier DST_IP\" as a description and nothing in the artifact verifies it.\n\nRULING,
    in three parts:\n\n(a) PRIMARY ARM stays DST_IP, per spec. Do NOT switch to QUIC_SNI.
    QUIC_SNI is the raw hostname; DST_IP is the anonymised identifier. The declared
    channel excludes the identifier and RC5 justifies that exclusion, so the price
    to measure is the identifier's. Substituting the raw hostname would change what
    the experiment is about rather than control it.\n\n(b) ADD THE PREMISE TEST: is
    DST_IP a deterministic function of QUIC_SNI on the shared flows? Same pass, both
    columns already being read. Report either way. If YES, the exclusion is justified
    exactly as claimed and the artifact should say so rather than ask a reader to
    take it on trust. If NO, the object declaration's central phrase is unproven and
    the anonymisation destroyed information - itself a finding, and one that would
    justify keeping a QUIC_SNI arm as the stronger object rather than as a substitute.\n\n(c)
    QUIC_SNI AS A THIRD MEASUREMENT is DEFERRED with an explicit trigger: add it only
    if (b) returns NO, or if an explicit upper bound on the leak is wanted. Two arms
    already exist plus B' and C for the cardinality question, and a raw-hostname arm
    changes the claim being made rather than controlling it. If (b) is NO, I rule
    on the SNI arm then, with that fact in hand.\n\nThis turns the spec's load-bearing
    assumption into a measured fact, which is the same discipline the session has
    applied throughout - the premise was central to RC5 and had never been checked.\n\nAlso
    relevant to this ruling: the artifact's recorded runner_sha256 (63f2a3564357172b...)
    matches x9_sni_channel_delta.py exactly, so the artifact is explicitly bound to
    its producer. A worker was found rebuilding that same runner; it was stopped,
    and the sha binding verified intact."
  related_experiments:
  - exp_id: X9
    result: 'DONE/negative with M127+M128 recorded: delta_eps_hi is identically 1.0
      minus ARM A''s mean and carries no SNI information, because ARM B declared m
