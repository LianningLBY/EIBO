- id: D071
  date: 2026-09-14 08:18 UTC
  summary: 'CONFIRMED structurally: X6''s validity gate cannot fail for ~75/120 rows
    (bound clips to 0 at n=400, and all truth-0 rows are mathematically incapable
    of violating). Honest form is "45/45 testable rows comply", not "0/120". Fourth
    instance today of a non-falsifiable check. The real-data large-k result at 20,000
    samples is unaffected and still delivers C2''s measurement.'
  rationale: 'X6''s validity gate has the SAME class of defect this project has now
    hit four times: MOST OF ITS ROWS CANNOT FAIL. I verified it structurally in the
    local runner rather than accepting the claim.


    THE MECHANISM, verified in x6_divisibility_lower_bound.py: the violation test
    is `violation = bool(bound > truth + 1e-12)` (line 262). The divisibility bound
    is `1 - e0 - e1` clipped at zero, and at VALIDITY_SAMPLE_SIZE = 400 the DecisionTreeClassifier''s
    per-class errors approach chance (optimistic_error ~0.58-0.60), so the raw bound
    goes NEGATIVE and is clipped to 0. A returned bound of 0 can never exceed a truth
    of 0 or any positive truth. Additionally the requested-TV cycle is `requested_tvs[rep
    % 5]` with 24 replications per k, so exactly 24 rows have requested_tv = 0.00
    -- and for requested TV = 0.00 the analytic truth is 0, so a zero bound is compared
    to zero and cannot violate by construction. So the rows whose bound clips to zero,
    plus every truth-zero row, are INCAPABLE of registering a violation.


    MAGNITUDE (reported by the independent review; I verified the mechanism and the
    two constants, not every row count): of 120 replications, about 75 are non-testable
    -- all 24 at requested TV 0.00, all 24 at 0.10, and ~23 of 24 at 0.25 -- leaving
    ~45 rows that CAN fail, and those 45 show 0 violations. So `0/120` overstates
    by conflating impossible-to-fail rows with real tests; the honest statement is
    "45/45 testable rows comply".


    THE ARTIFACT DID NOT CONCEAL THIS: it recorded `vacuous` and `raw_bound_went_negative`
    and `optimistic_error` per row. What it OMITS is a testable/vacuous count at the
    `validity_measured_outcome` level -- I confirmed `validity_check` returns no `testable`/`vacuous`
    breakdown, and the review confirms those substrings occur zero times in that block.
    So this is a REPORTING gap on top of a DESIGN weakness, not a fabrication.


    WHY THIS MATTERS AND WHY IT IS THE SAME DEFECT FAMILY AS D056: this is the fourth
    instance today of a check that cannot exercise its own failure mode -- the original
    X3 known-truth control (could not exercise the mechanism), the k=15 empty informative
    stratum (statistic defined on an empty set), the parametric route (affine by construction,
    so its control compares two curves that are both affine), and now X6''s validity
    gate (three-fifths of its rows mathematically cannot violate). The project''s
    own standing rule "(a) a control must be able to fail" was adopted after D056
    and this artifact predates its enforcement.


    SCOPE -- WHAT SURVIVES AND IS UNAFFECTED: the review is right that the CORE X6
    claim is untouched, and I verify the structural reason independently. The real-data
    side uses MAX_SAMPLES_PER_SERVICE = 20_000 (line 45), and there the bound is non-vacuous:
    vacuous_count = 0 at k=10..30, nontrivial fraction 1.0, informative(>0.05) fraction
    0.9989-1.0 at k=15..30. That measurement -- "in the large-k region where the plug-in
    certificate is lost, the divisibility lower bound remains non-empty and non-trivial"
    -- is substantive, is what C2 needed, and is NOT affected by a synthetic-sample-size
    defect. The critical touches only the synthetic VALIDITY leg.


    REQUIRED FIXES: (1) add `testable_replications` and `vacuous_replications` to
    `validity_measured_outcome` and restate the outcome as "45/45 testable rows comply"
    rather than "0/120 violations"; (2) raise VALIDITY_SAMPLE_SIZE to the real-data
    order (20,000) and re-run so most rows become testable -- otherwise a referee
    kills "validity PASS" with one line of algebra; (3) add the standing-rule (a)
    precondition as an assertion: a minimum fraction of replication rows must return
    a STRICTLY POSITIVE bound, and the run FAILS if that fraction is not met. Until
    (1)-(3) land, the validity leg must be quoted with the testable count, never as
    0/120.


    ALSO: the audit that checked this artifact verified axis alignment and printed
    twelve representative comparison rows that were ALL `bound 0.0` -- the exact signature
    of a non-falsifiable control -- and passed them as normal. That is the SECOND
    instance of the audit-scope failure recorded in D063 (variant B''s audit printed
    k=20 and k=30 with identical values and passed them). The audit template must
    include a scan for constant/repeated/boundary values in printed output, because
    two independent audits have now missed a self-certifying anomaly sitting in their
    own output.'
