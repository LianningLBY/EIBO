- id: D021
  date: 2026-09-13 15:19 UTC
  summary: 'Refused to relax the process-attribution fence or escalate the kill; the
    fence is moot because the hung fetcher writes zero bytes, so the fix is a new
    fetcher against a working mirror writing to separate staging. Root cause corrected:
    840 uniform HTTP 504s, zero successes, not a stall.'
  rationale: 'The month fetch has been the sole blocker on both Q1 and Q2 for ~2.5
    hours. Diagnosis is now precise, and the fix turns out not to require the action
    that was blocked.


    **What is actually wrong.** The fetcher process (PID 512584) is alive and has
    written zero bytes for 2.7 hours: `2024-07.zip` frozen at 4,973,604 B, all three
    `.parts/` directories with `file_count: 0`, zero delta over a dual sample. But
    the operative finding is in its log: **840 `PART_RETRY` entries, every one `HTTP
    Error 504: Gateway Time-out`, and zero `PART_OK` — failing from the very first
    attempt at 14:35:29.** So the honest description is not "the months are stalled"
    but "the fetcher has been retrying a uniformly failing endpoint"; the process
    is hung *because* every request fails. A stall would suggest a hung process or
    network partition; a uniform 504 points at the endpoint refusing or throttling
    these range requests. Different diagnoses, different fixes.


    The process also started with its cwd at the container root, which is plausibly
    why the managed kill tool cannot uniquely attribute it to this project.


    **The ruling on the safety fence.** I refused option (c) — permitting the worker
    to stop the process when cwd/cgroup resolves to this project''s data disk but
    unique attribution does not — and refused to escalate the kill to myself (option
    b). Three reasons. The fence is protecting something real: this host genuinely
    runs other work (the process list shows another project''s HuggingFace download
    alongside resident tensorboard/jupyter), so "attribution check failed" is the
    shape it *should* reject. My assertion that the process belongs to us cannot substitute
    for the fence''s factual cwd/cgroup check, and overriding a factual check with
    an assertion is the wrong mechanism even when the assertion is right. And the
    worker handled it correctly: it validated PID and command, found attribution mismatched,
    and refused to bypass with raw SSH or a second fetcher.


    **Why the fence is moot anyway.** The hung process writes zero bytes, so it contends
    with no writer. We do not need it stopped to begin correct fetching: start a new
    fetcher against a working mirror, writing to a separate staging directory, verify,
    then move into `raw/`. Since the old process cannot write and the new one writes
    elsewhere, there is not even a possibility of contention — the attribution question
    never needs answering, and no safety fence needs relaxing.


    **Correcting one description.** The current code already uses the direct content
    endpoint (`BASE + name + "/content"`), so the problem is not a wrong endpoint
    *shape* — that endpoint is now uniformly failing. The remedy is to switch to a
    working *mirror*, and the description should say so. The proven-working endpoint
    on this host is the CESNET DataZoo server, which served the 3.5 GB XS h5 at ~2.4
    MB/s; the months live in the same bucket family.


    **Provenance handling for a mirror switch.** User constraint is "do not substitute
    a different dataset." A mirror switch is not substitution, but the source chain
    must be explicit: verify each file against the authoritative Content-Length published
    by the Zenodo record, plus any checksum that record publishes, and record which
    mirror and which verification were used. Also reduce concurrency to 2 workers
    x 1 file for the first probe to take concurrency out of the variable set, and
    prove a single 16 MB range returns HTTP 206 with a `Content-Range` header before
    launching the full batch — that one probe would have prevented the 840 failed
    retries.


    **Lesson recorded:** a long-running process launched with cwd at the container
    root can lose project attribution, which is likely why the kill was refused. Long-lived
    processes should be started with the data-disk project path as cwd so the platform
    can attribute them. Same family as C009 (absolute paths).'
