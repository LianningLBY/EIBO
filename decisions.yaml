    four of these because the paper escapes underscores, so its regex missed every
    escaped id. Uncited set is 33, not 15.


    REMEDY REVERSED — fix at the boundary, not in the artifacts. I inspected what
    the leaking fields actually are: provenance and runner records (runner_path, runner_sha256,
    lookup_report, source_files, assembled_canonical_files, h5_read, run, runtime,
    method_execution, reproduction_verdict, source). Several carry runner_sha256 over
    the runner that produced them. These artifacts exist to record how they were produced,
    so editing them would damage evidence to hide metadata — and for the 6 cited ones
    would invalidate a hash the paper prints. Revised ruling: ship all 39 byte-identical;
    state plainly in the archive README that these artifacts carry recorded execution
    paths from the producing environment (a project directory name and machine-local
    prefix), that this is provenance rather than identifying information about people
    or institutions, and that the bytes are unedited so the printed content hashes
    stay valid; keep the content scan but as a census that REPORTS (so a future build
