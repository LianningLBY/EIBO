  date: 2026-09-13 12:49 UTC
  summary: A_k verified independently and unblocks the gate. Promote the M_max frontier
    from limitation to stated result (beyond M ≈ 2-4 no certificate exists at these
    k and n); add the missing M=1 rung, which is both the strongest and the most trivial-pass-prone;
