    an id-suffixed copy), never the source" — and traces it across three callers and
    two rounds. So the Agent''s report re-derived a known property of the write path
    rather than finding a defect. Its practical conclusion was correct anyway.


    Nuance worth stating, because the Agent''s phrasing ("the hash cannot be set from
    an Agent session") understates what happened: C053 says it cannot be set from
    an AGENT session, and that the remedy is a manual hash pass. I set it as Director
    via direct filesystem access, which is exactly that remedy. I verified my pass
    satisfies C053''s first trap: the hash is taken over the path the entry names
    (artifacts/_project/data/supplementary.tar.gz), which is not an id-suffixed copy,
    and it byte-matches the recorded value. So the entry is correct AND the method
    complied with the constraint that anticipates it.


