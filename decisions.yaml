- id: D057
  date: 2026-09-14 06:45 UTC
  summary: 'REJECTED the parametric route''s LINEAR verdict: verified from the runner
    that D_k is affine in k BY CONSTRUCTION for any fitted order >= 1 (and identically
    0 for order 0), so sublinear is unreachable and the test carries no information.
    The D053 narrowing of part (i) does not apply; the route is recorded as attempted
    and structurally non-diagnostic, and the control that "passed decisively" is likewise
    incapable of failing.'
  rationale: 'The parametric route returned LINEAR on real data, and its own fitted-model
    control "passed decisively". By the D053 pre-registered rule this would narrow
    part (i) from "the question cannot be adjudicated" to "the PLUG-IN estimator cannot
    be adjudicated". I REJECT THAT NARROWING, because the route''s LINEAR verdict
    is a MATHEMATICAL TAUTOLOGY -- it is forced by construction and therefore carries
    no information about the data.


    VERIFIED BY ME, from the local runner x3_parametric_growth.py, reading the code
    AND reproducing the curve numerically:

    1. The route (a) fits a Markov model of order 0/1/2 by BIC ONCE per service (select_model(bits)
    -> fit_markov at the selected order), then (b) computes the curve via marginal_and_entropy_curve(model,
    30) with NO per-k refit, as D_k = cross_entropy - joint_entropy where cross_entropy
    = sum_{i<=k} H(marginal_i) and joint_entropy = H(state) accumulated by pushing
    the model''s OWN transition matrix forward from its initial distribution.

    2. For any stationary chain, H(X_1..X_k) grows by the CONSTANT entropy rate h
    once k exceeds the order, and the marginal entropies are constant (order-1) or
    become constant after a finite transient. Hence D_k is AFFINE in k with slope
    (H(X) - h) >= 0. The order-0 branch returns D_k identically 0.

    3. I reproduced the script''s exact arithmetic: for a first-order chain with transition
    [[0.8,0.2],[0.3,0.7]] the increments are constant at +0.128424 for every k from
    2 to 30 (six decimal places), and D_k equals (k-1)*MI exactly at k = 2, 5, 10,
    30. For an order-2 chain the increments are constant at +0.187831748 for every
    k >= 4 (spread 3.55e-15).

    4. CONSEQUENCE: the only reachable outcomes are D_k identically 0 (order 0 selected)
    or D_k affine (any order >= 1 selected). LINEAR IS FORCED and SUBLINEAR IS UNREACHABLE.
    The route cannot distinguish "linear growth" from "sublinear growth" on real data;
    it can only report the MI accumulation of whatever model it fitted. So its LINEAR
    result asserts nothing about the dependent-prefix question.


    WHY THIS MATTERS AND WHAT IT DOES NOT CHANGE: the route does bypass occupancy
    collapse (its conditional probabilities come from fitted low-order contexts, not
    empirical k-prefix tables) -- that design goal is met. But bypassing occupancy
    was supposed to make the growth question ADJUDICABLE, and instead the route made
    the answer a structural constant. A test that cannot fail is not a test (this
    project''s own recurring principle, applied here to the very control meant to
    break the deadlock).


    CONSEQUENCE FOR PART (i): the wording must NOT narrow to "the plug-in estimator
    cannot". The parametric route does not demonstrate that the question IS adjudicable;
    it demonstrates that the fitted-model route is vacuous. So (i) returns to: the
    standard plug-in chain-rule estimator cannot adjudicate the dependent-prefix growth
    question at this k window, n, and occupancy-collapse curve -- with the parametric
    route recorded as ATTEMPTED AND STRUCTURALLY NON-DIAGNOSTIC, not as a counterexample.
    The honest statement is that no route tried so far can adjudicate it, which if
    anything slightly strengthens (i) while leaving it correctly scoped.


    REQUIRED FOLLOW-UP BEFORE ANY REFRAMING: the route can be made non-vacuous only
    by changing WHAT IS COMPARED -- e.g. compute D_k against a genuine alternative
    (the model''s own position-wise marginal product is what makes it affine) or fit
    the model per k and compare the fitted growth across k to the exact growth of
    a known source. That is a NEW design, not a bug fix, and must not be dispatched
    as a repair. The pre-registered control passing "decisively" is expected and carries
    no weight, because the control ALSO cannot fail: it checks that the exact and
    fitted curves get the same verdict from fit_growth, and both are affine by construction.
    So the control is not merely weak, it is structurally incapable of detecting the
    defect it was meant to catch.'
  related_experiments:
  - exp_id: X3
    result: parametric route's LINEAR verdict found to be a mathematical tautology
      (D_k provably affine for any fitted order >= 1, identically 0 for order 0);
      the D053 narrowing of part (i) is REJECTED and the route is recorded as attempted
      and structurally non-diagnostic
    role: subject
  depends_on:
