  summary: 'D086: X9_E verdict — negative on dose-only hypothesis; positive on channel-sensitivity
    finding'
  rationale: 'X9_E falsified the "move-together" hypothesis: at matched declared m,
    the SNI-dependent arm (DST_IP hash) yields systematically higher TV than the SNI-independent
    arm (random ID hash), with median delta_tv_hat growing monotonically from 0.03
    (B=2) to 0.36 (B=256) before collapsing to 0 once both arms saturate. 703 matched
    pairs per rung, train/test flow-disjoint and time-disjoint. Additionally, DST_IP
    is non-deterministic (8,323 of 10M rows map one QUIC_SNI to multiple DST_IPs),
    yet the identifier effect dominates through the conflation. This establishes that
    the epsilon bracket is NOT identifier-agnostic: the choice of identifier channel
    is a methodological degree of freedom that affects the certificate value. Paper
    treatment: explicit "channel sensitivity" discussion paragraph beyond a mere methods
    caveat — the dose-response curve is a quantitative finding, not an auxiliary limitation.'
