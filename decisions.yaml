- id: D073
  date: 2026-09-14 08:41 UTC
  summary: 'Fixed .gitignore so artifacts/ (the evidence chain) is tracked and logs/
    (incl. chat transcripts) is not; wrote a correct README; init''d the repo, bound
    origin, committed 123 files as 3860c7b. The push failed from my shell (framework-managed
