- id: D199
  date: 2026-09-23 06:07 UTC
  summary: 'Measured the Table 5 move instead of relaying the estimate: moving tab:grid
    into the body at §4.3 pushes the body to p.14, breaching the 13-page cap — so
    the trade-off is real and the PI''s ruling is genuinely required. Also caught
    two flawed scratch attempts that each would have produced a confident wrong answer
    (a table* floating past a clearpage into back matter looked free; a failed anchor
    edit silently deleted the table and looked like no change).'
  rationale: 'MEASURED the Table 5 placement trade-off directly instead of continuing
    to relay the inherited estimate, because that estimate came from the same page
    arithmetic I had twice found unreliable. The PI''s decision could have been dissolved
    if the move cost nothing; it does not.


    METHOD AND RESULT: moved `tab:grid` (a full-width `table*`, 10 data rows plus
    a midrule and a saturated block — 1,110 source chars) from the appendix into results.tex
    at its citation site (§4.3, after the sec:results/horizon label), rebuilt in scratch.
    Result: 25 pp, **body ends p.14** — the 13-page cap is breached. Baseline for
    the same scratch tree is 24 pp / body p.13. So the trade-off is REAL: moving the
    table into the body requires cutting roughly a page of body prose, and the PI''s
    ruling is genuinely needed.


    TWO FLAWED ATTEMPTS WORTH RECORDING, because each would have produced a confident
    WRONG answer and I caught them only by checking where the table actually rendered
    rather than trusting the page count:

    (1) First build inserted the table just before `\section*{Ethical Considerations}`
    (the body''s end). The `table*` floated PAST the intervening `\clearpage` into
    back matter, landing on p15 — the body stayed p.13 and total went to 25. Read
    naively this says "moving the table is free, the extra page is uncapped back matter".
    FALSE: the table simply was not in the body. Detected by grepping for the table''s
    content on pp.1-13 and finding none.

    (2) Second build targeted a `\label{sec:results/horizon}` that lives in results.tex,
    not main.tex; the anchor assertion failed, so the script removed the table without
    inserting it and the build returned 24 pp. Read naively this says "no change".
    It had actually DELETED Table 5.

    (3) Third build, anchor corrected into results.tex, gives the true measurement:
    body p.14.


    LESSON: for a float placement question the page count alone is not the observable
    — you must confirm WHERE the float rendered. A `table*`/`figure*` silently relocates
    across a `\clearpage`, and a failed script edit silently deletes. Both produce
    plausible page counts that mean the opposite of what they appear to.


    STATE: delivered paper untouched (still 32dadd14…); all scratch trees removed.
    The Table 5 question remains open with the PI and now has a measured basis rather
    than an estimate.'
