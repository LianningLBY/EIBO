  rationale: 'Verified the overfull-box fix, and found a toolchain route that may
    remove the content-cut requirement from the venue decision altogether.


    1. OVERFULL BOXES — FIXED, VERIFIED BY ME. I rebuilt from the current source (main.tex
    sha ccad43c2…) in a clean scratch dir and measured: count 44 → **19**, max 92.6pt
    → **21.0pt**, boxes over 30pt 11 → **0**, over 10pt 18 → 5. Top five are now 21.0/18.7/16.9/13.7/12.8pt
    — all inside the margin. Mechanism is a `\begingroup\sloppy … \endgroup` scoped
    to the Open Science section, letting the `\texttt{art\_…}` IDs and `\seqsplit{…}`
    hashes break at word boundaries in acmart''s narrower column. **The three tested
    artifact hashes survived byte-exact** (checked by whitespace-stripped substring
    match), which was the constraint I set.

    The writer''s FIRST summary called these "cosmetic — none exceeds 30pt" while
    the log said 92.6pt; it has since accepted the correction and re-measured. Recording
    because the pattern recurs: a summary line asserted about a log rather than read
    from it.


    2. PAGE-COUNT DISCREPANCY — RESOLVED, AND THE ERROR WAS MINE. The writer reported
    "consistently p.13 across seven clean compiles" and flagged a disagreement with
    my earlier p.12. There is no live disagreement: **my p.12 was measured on a build
    with a DOUBLED ABSTRACT and I had already retracted it (D256).** Its p.13 and
