- id: D106
  date: 2026-09-15 07:10 UTC
  summary: 'D106: W9 cluster bootstrap flips the scale-matched gap (3/5 strata include
    zero) — weaken that claim, keep the all-pairs finding; canonicalize the cross-corpus
    artifact'
  rationale: "The W9 cross-corpus cluster bootstrap flips the scale-matched gap claim,
    and I verified it from the artifact before acting on it. Both pair sets are complete
    graphs (primary C(45,2) on 45 services degree 44; QUIC22 C(82,2) on 82 services
    degree 81), so the pair bootstrap was anti-conservative exactly as in W10.\n\nVERIFIED
    NUMBER: under the cluster bootstrap, 3 of 5 strata include zero:\n  all      gap
    -18.3  cluster [-0.2744,-0.1000]  excludes 0\n  >=13049  gap -15.5  cluster [-0.2838,-0.0289]
    \ excludes 0 (barely)\n  >=20000  gap  -9.3  cluster [-0.2420,+0.0515]  FLIPPED\n
    \ >=40000  gap -13.0  cluster [-0.3007,+0.0429]  FLIPPED\n  >=80000  gap -15.4
    \ cluster [-0.3361,+0.0293]  FLIPPED\n\nCONSEQUENCE: the >=20000 stratum is exactly
    the one the paper cites as the scale-matched comparison, and it no longer excludes
    zero. So the KEEP is the all-pairs claim (\"the upper-side gate is not reproduced
    across corpora\" - excludes zero under both methods, the robust finding), and
    the WEAKEN is the scale-matching defence: the gap is negative at every stratum
    as a point estimate but at matched evidence the interval includes zero, so the
    residual gap is NOT statistically resolved at this n. This compounds with the
    earlier non-monotone finding (the series minimises at >=20000 then widens), so
    \"matched evidence\" is not even a single well-defined point. The lower-side reproduction
    claim still holds (primary 0.9960 vs QUIC22 0.9967, overlapping, ratio only 1.22
    because that side is saturated).\n\nPROVENANCE DEFECT ALSO FOUND AND FIXED: the
    cluster result sat in a versioned sibling while the canonical ci_cross_corpus.json
    still held the superseded pair interval, whose note field pointed readers back
    at itself - the \"live name carries the dead value\" trap. Canonicalized as W10
    was done in place: ci_cross_corpus.json now holds the cluster construction, the
    pair bootstrap is retained as ci_cross_corpus_pairbootstrap.json, byte-identical
    versioned siblings removed, note repointed. ALSO FIXED A LIVE-WRITE BUG: compute_r1_w9_bootstrap_ci.py
    had OUTPUT_PATH = ci_cross_corpus.json, so the PAIR runner would have overwritten
    the cluster result on its next run; both runners are rewired so each writes its
    own name and the cluster runner owns the canonical path. Two manifest entries
    now dangle at the removed filenames and require re-registration (Agent's primitive).
    W10 has the same four-files-per-quantity problem (ci_main_table.json, _1ea3c0,
    _27333a, and the _d59fd8 duplicate from a failed edit) and needs the same canonicalization.\n\nMY
    OWN ERROR THIS ROUND: a dangling-path sweep I ran reported 20 \"missing\" artifacts,
    which was my flat-path probe being wrong - those files live in nested dirs (artifacts/X3/data/,
    artifacts/X6/data/, etc.) per the documented two-tree layout. No real defect;
