- id: D002
  date: 2026-09-13 11:43 UTC
  summary: 'Proceed with the reduced-scope MVP (2 month-files) instead of requesting
    capacity now: the full 12-month time-disjoint split needs the entire 28.2 GB dataset
    and does not fit the bound server''s 28 GB free. Reduction is labelled, not silent;
    post-MVP revisits capacity.'
  rationale: 'The bound server''s visible disk is 30 GB total with 28 GB free. The
    CESNET-QUICEXT-25 record is 12 monthly ZIPs totalling 28.2 GB compressed, and
    the brief''s pre-registered design mandates flow-disjoint AND time-disjoint splits
    — train 2024-06..2025-01, test 2025-02..2025-05 — which requires 13 month-files,
    i.e. the entire dataset before decompression. The pre-registered split therefore
    cannot execute on this machine as configured.


    Two scoping facts also emerged. First, there is no "XS subset" artifact in the
    record: XS/S/M/L are `cesnet-datazoo` library options, not downloads, so the brief''s
    phrasing would have produced a failing task. Second, QUICEXT-25 exposes only `QUIC_SNI`
    with no explicit service-label column, so the service count the gate depends on
    must be derived with CESNET''s own rule under a fixed minimum-flow threshold before
    it can be counted at all.


    Decision: accept the reduced-scope MVP (2 month-files) rather than request additional
    capacity now. The reasoning is that the MVP''s question is scale-invariant — "is
    the bracket computable and non-trivial on real wire data" has the same answer
    at 2 months as at 12, and the reduced run is strictly cheaper than the large acquisition
    even in the branch where the MVP fails. The full 12-month environment axis and
    the time-disjoint split become post-MVP requirements, to be revisited with concrete
    capacity requirements once the method is validated and the paper''s actual data
    demand is known rather than assumed.


    Guardrail attached to this decision: the reduction must be *labelled*, not smoothed.
    Every reported MVP number carries the reduced-scope caveat, and the fact that
    the time-disjoint split degrades to a within-month split under reduced scope must
    be stated explicitly wherever the split is described. A silent scope reduction
    that later reads as a completed pre-registration would be the failure mode here.


    Open item: my disk probe surfaced only the `/` mount and repeated that same row
    three times, so it did not see the full mount table. A separate disk check in
    the same session reported a much larger available store on the same machine. That
    contradiction is unresolved, so the capacity ceiling is not yet established; the
    Agent is verifying with `df -h` / `lsblk` / `/dev/shm`. If a large writable mount
    exists, the full-dataset path reopens at no cost and this reduction is unnecessary.'
  related_experiments: []
  depends_on:
