    optional appendices". Two pages violates nothing. Had I not checked, I would have
    dispatched a compression against a rule that does not exist. The CFP does state
    a real requirement in that area, and it is C5: "Anonymous URLs should be included
    in the paper''s Open Science Appendix"; artifacts must be shared "through anonymous
