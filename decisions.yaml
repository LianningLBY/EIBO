- id: D237
  date: 2026-09-25 01:32 UTC
  summary: 'Round 19 registration failure has a testable correlate (supplementary_paths:
    4 registrations without, 2 failures with) but the discriminating test is not worth
    running while the venue is undecided'
  rationale: 'Found a testable correlate of the Round 19 registration failure, and
    deliberately did NOT run the experiment that would settle it.


    THE PATTERN: every round that registered (15, 16, 17, 18) submitted a 416,639-byte
    PDF and passed NO supplementary path. The archive was built 2026-09-24 21:41,
    so round 18 (16:27) predates it and could not have passed one. Both Round 19 attempts
    (22:55 and 01:15) passed supplementary_paths=artifacts/supplementary.tar.gz and
    both failed to register — two distinct approval ids, no round created. So: 4 submissions
    without the field all registered; 2 with it both failed.


    TWO COMPETING HYPOTHESES, and the correlation does not distinguish them:

    (a) supplementary_paths breaks registration — the field is mishandled on the path
    that creates a round.

    (b) the review service degraded between 16:27 and 22:55 — a time-based failure,
    and the field is coincidental because it only became available after the archive
    existed.

    The single-variable test is a submission WITHOUT supplementary_paths: if it registers,
    (a); if it also fails, (b).


    I AM NOT RUNNING THAT TEST, for reasons that are not squeamishness. First, it
    would create a round whose submission OMITS the supplementary archive the paper
    explicitly names as its artifact locator — trading a real deficiency for diagnostic
    information. Second, the venue is undecided (D236): the PI may switch to PoPETs,
    in which case a new USENIX round is wasted work. The test is cheap in submissions
    but not free in either of those currencies, and both interact with decisions that
    are the PI''s, not mine. A third submission is also the thing D235 concluded not
    to do blindly — this one would not be blind, but it still spends a resource on
    a question whose answer only matters once the venue is settled.


    WHAT TO DO INSTEAD: the PI has both items (registration failure, venue). Once
    they confirm the venue, if USENIX stands, the controlled test becomes worth running
    and I will propose it explicitly with the trade-off stated. If they switch, it
    is moot.


    RECORDED SO IT IS NOT LOST: the 4-and-2 correlation, both hypotheses, the exact
    discriminating test, and the two costs that make it not-obviously-worth-running.
    Anyone picking this up should not rediscover the pattern and run the test without
    weighing those.'
