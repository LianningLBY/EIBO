- id: D124
  date: 2026-09-16 01:08 UTC
  summary: 'D124: constant FROZEN at the ledger value — neither constant publishes
    a false guarantee; status quo wins on guard + coherence + half-applied defect,
    not on safety'
  rationale: "The constant question reversed twice and I settled it on the arithmetic,
    freezing the outcome. Recording the full shape so it is not re-litigated.\n\nTHE
    TWO CONSTANTS, DERIVED: per-law one-sided tail q = exp(-C^2/2), so\n  2.9604 ->
    q = 0.0125 -> joint over two laws 0.975\n  2.7162 -> q = 0.0250 -> joint over
    two laws 0.950\nBOTH are >= 0.95, so the paper's stated 0.95 is TRUE under either
    constant - conservative under the ledger constant, exact under the proposed one.
    My D123 retraction over-corrected: I said adopting 2.7162 would \"weaken a 0.95
    guarantee to 0.90\" and reverted on safety grounds, but a 0.975 guarantee labelled
    0.95 UNDER-claims rather than over-claiming. The Reviewer's original critical
    (which claimed 0.90) was wrong, its retraction was right in conclusion, and its
    retraction's own derivation contained a slip (it said statcore at default alpha=0.05
    gives 2.9604; it gives 2.7162, because 2/0.05 = 40; the ledger's 2.9604 comes
    from feeding the PER-LAW 0.025 through the same 2/ form).\n\nDECISION: keep the
    LEDGER constant 2.9604 and the counts 340 upper / 336 joint. Not on the safety
    argument, which I have now corrected, but on three grounds: (1) test_under_split_guard
    requires the per-law alpha/2 convention and the guard is evidence; (2) the ledger,
    the cluster-bootstrap CIs (ci_main_table) and the X11 cross-corpus artifact were
    ALL built at 2.9604, so reverting costs zero recomputation while adopting requires
    three; (3) the half-applied state is itself a defect - the CIs [26.5%, 43.1%]
    and [26.9%, 43.4%] are currently attached to counts they were never computed on,
    which is the \"a field asserting a property its value lacks\" class we have removed
    six times this session. A half-applied number change is worse than either endpoint.\n\nALSO
    ADOPTED from the Reviewer's report: W5's scoping is a real dispatched item (discussion.tex:32
    says the cap \"can only shrink eps_lo\" while tab_boundary.tex row 35-49 shows
    full-n 0.042725 against capped 0.043732 - capping made eps_lo larger, so a universal
    claim is contradicted by a row in the adjacent table); and W6 is confirmed as
    quantiles-only, no new figure.\n\nTHE MOST VALUABLE POINT in the Reviewer's report,
    and the one I asked it to convert into a test: at alpha = 0.05 the two candidate
    constants coincide numerically, so this entire class of defect is invisible to
    any check that compares NUMBERS rather than PROVENANCE. The proposed remedy is
    an assertion tying a constant to its stated joint level mechanically, so a future
    change of this kind fails a test instead of needing a person to notice. Requested
    the exact assertion."
  related_experiments: []
