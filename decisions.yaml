  rationale: 'The Agent was blocked: four dispatch attempts for three mechanical code
    edits were all rejected by a worker-delegation guard that classified Python build-script
    maintenance as Paper-Agent-owned writing. It stopped and handed the work over
    rather than continuing to rephrase prompts to get past a delegation guard, which
    was the right call. I have direct filesystem access, so I made the three edits
    myself and verified each with a negative test.


    EDIT 1 — slug wrap. The Reviewer''s finding was correct and my direction was wrong.
    The figure generators spell the slug across Python string concatenation: PROJ
    = ("/efs/workspace/projects/" "epsilon-...-encrypted-traffic-" "recognition-certification-grade").
    The contiguous full slug therefore never occurs in two generator files, and the
    script''s slug pattern WAS the full slug — so the script undercounted. Measured:
    full-slug pattern 9 files, prefix pattern 11, delta exactly build_data.py and
    render_figs.py. Fix: added PROJECT_SLUG_PREFIX as its own census pattern with
    baseline 11, keeping the full-slug pattern at 9. Every one of the 11 is a genuine
    slug reference, so the prefix over-matches nothing.


    EDIT 2 — binary guard. Confirmed the reported defect by reading the code: binary_records
    was computed at line 739, printed at 741, and dropped; content_census_guard consumed
    only text patterns. A figure PDF carrying an author name was detected and accepted.
    Fix: added binary_content_guard() that fails on non-empty matched_tokens and on
    any PDF metadata value outside an allowlist (pdfTeX-, LaTeX with hyperref, Matplotlib),
    wired into main() as a fifth guard. Empty string is treated as ABSENT, since the
    project''s own main.pdf carries "" for Author/Title/Subject/Keywords and a naive
    presence check would fail every clean build. I extracted the actual metadata values
    from both main.pdf and a figure PDF before choosing the allowlist.


    EDIT 3 — render freshness. Added assert_render_not_older_than_sources(): fails
    if any shipped .tex/.bib/.sty is newer than main.pdf. This is the check that would
    have caught the stale-bib-beside-render case that let the fabricated bibliography
    reach a shipped archive while the hash assert passed on every run.


