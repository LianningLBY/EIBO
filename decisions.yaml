  summary: Discard the 0.083 MB/s figure and its 94-hour projection (observed aggregate
    is ~2.4 MB/s, so ~3.2 h); retract "Python not installed" and "detached launch
    blocked" as environment verdicts; let the XS fetch finish and reuse its method;
