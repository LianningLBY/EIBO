- id: D054
  date: 2026-09-14 06:11 UTC
  summary: 'L0 refutes my index-vs-label suspect AND my "below-chance" framing: the
    detectors agree with true labels at 48.6/13.5/58.1% against 1.9% chance, so a
    code reading of OSCR (narrow integral, unreachable (1,1)) now looks like the artifact;
    a standard per-class AUC comparison will settle it.'
  rationale: 'The L0 label-space check landed and REFUTED my index-vs-label prime
    suspect, and on the same numbers the "detector panel is at or below chance" framing
    (D051) no longer holds.


    MEASURED, three numbers as requested: (1) schema.service_labels_common_to_both_sides
    = [0,1,...,52], length 53, min 0, max 52, so max == len-1 is YES -- the class
    list IS contiguous 0..52, therefore detector indices and raw labels coincide and
    the mismatch I hypothesised does not exist. (2) Per-row agreement between predicted
    and true label over 1,493,995 rows: lightgbm 725,738 equal / 768,257 different
    = 48.6%; prototype 202,097 / 1,291,898 = 13.5%; ronetc 868,026 / 625,969 = 58.1%.
    Chance on 53 classes is ~1.9%. Prediction ranges occupy the same space (0-52,
    53 distinct for lightgbm and prototype; ronetc 29 distinct). (3) accepted_true
    ~= all rows for every detector, and lightgbm''s JSON accept flag is all_rows_accepted
    = true.


    CONSEQUENCE: the detectors predict FAR ABOVE CHANCE (48.6% / 13.5% / 58.1% against
    a 1.9% baseline). A broken pipeline does not do that. So both my index/label hypothesis
    AND the "three families failing identically from a shared-path defect" story are
    unsupported by the data, and the ≤RANDOM red line (D051) rested on an assumption
    about what OSCR measures.


    NEW HYPOTHESIS, FLAGGED AS A CODE READING RATHER THAN A SETTLED FACT: in oscr_and_fpr95
    the score is the argmax confidence and class_score is finite only where (pred
    == label) & accepted, so the scored set contains only rows the detector already
    assigned to that service. The threshold sweep therefore moves the curve from (0,0)
    to (FPR_end, recall) and can never reach (1,1) -- there is no per-class probability
    with which to sweep the negatives in. FPR_end is small precisely when the classifier
    is good, so trapz(TPR, FPR) is a NARROW area; for a perfect one-vs-rest classifier
    the curve is a vertical line at FPR = 0 and the integral is ZERO. Under this implementation,
    near-zero OSCR is consistent with GOOD discrimination rather than with "detectors
    accept almost nothing". The same mechanism explains FPR95 being null nearly everywhere:
    its precondition requires >=95% of positives correctly predicted AND accepted,
    a very high bar at 53 classes, so null is expected and carries no information
    about detector quality.


    DIAGNOSTIC DISPATCHED TO SETTLE IT: compute a standard one-vs-rest AUC from per-class
    probabilities swept over ALL rows (so the curve reaches (1,1)) and place it beside
    the current OSCR for the same services and holdouts. If standard AUC is high (~0.9+)
    while OSCR reads ~1e-3, the OSCR implementation is the artifact, the detectors
    are fine, and OSCR must not be reported as a performance number until fixed. If
    standard AUC is also ~0.5 or below, the detectors really are near-chance on the
    ranking measure and L0 continues. Either answer is to be reported as measured;
    my reading must not be assumed correct.


    CORRECTIONS ISSUED: (a) I RETRACT my D051 framing that the detector panel is at
    or below chance -- it depended on treating OSCR''s 0.5 as the chance line, which
    only holds if OSCR is a standard AUC; the registry entry must be replaced with
    the measured agreement percentages and an explicit UNDER DETERMINATION status.
    (b) The index-vs-label hypothesis is withdrawn. (c) ORDERING UNCHANGED: L0 must
    be RESOLVED (not merely re-framed), then Stage 2 completed, then k=5 on GPU --
    but the open question narrows from "is the pipeline broken?" to "is the metric
    broken?", which is far cheaper. (d) The containment statistic remains unimplemented,
    and the vacuity rule stands independently: a violation count computed on a vacuous
    detector state is reported as uninformative, never as a pass.'
