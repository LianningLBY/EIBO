- id: D074
  date: 2026-09-14 09:01 UTC
  summary: 'The D063 freeze guard works but its boolean output reports a refusal as
    a refutation: the three assessable levels are strictly monotone (0.651>0.625>0.614)
    while joint_tracks_thinning reads False because two levels could not be fitted.
    Sixth instance today of a check whose output cannot distinguish failure modes.
    Fix with a three-state field plus an explicit assessable-levels statistic, and
    write that statement into all four surfaces rather than flipping the boolean.'
  rationale: 'The D063 freeze guard landed and is CORRECT, but its summary output
    encodes a tooling outcome as a scientific refutation, and that encoding is now
    propagating.


    WHAT I VERIFIED from the new artifact (artifacts/X3/data/x3_control_occupancy_dose_response.json,
    310,141 B, sha 2ff2dd05...): decision.plain_arm_tracks_thinning = False, twin
    = True, joint = False; exponent_p_by_retained_fraction = [0.651, 0.625, 0.614,
    None, None]; refused_fit_retained_fractions = [0.1, 0.05]; sparse_context_stat_by_retained_fraction
    = [0.4156, 0.4493, 0.4841, 0.5317, 0.5694]; p_nonincreasing_with_thinning = False;
    sparse_context_stat_nondecreasing = True.


    THE ARITHMETIC: the three ASSESSABLE levels give [0.651, 0.625, 0.614] which IS
    strictly non-increasing. So the False flag does not come from a monotonicity violation;
    it comes from the two REFUSED levels shortening the emitted vector. The boolean
    collapses two distinct statements into one value: (a) "the trend is absent, sparsity
    does not drive p" (an evidenced negative) versus (b) "the two deepest levels are
    not assessable because the guard refused to fit a frozen tail" (a tooling outcome).
    The artifact asserts (a); what is true is (b). A reader would take this as a scientific
    reversal of the very result the guard exists to protect.


    THIS IS THE SIXTH INSTANCE TODAY OF A CHECK WHOSE OUTPUT CANNOT DISTINGUISH ITS
    FAILURE MODES -- after the original X3 known-truth control (fixed axis for a claim
    across that axis), the k=15 empty stratum (statistic on an empty set), the parametric
    route (affine by construction, control also affine), X6''s validity gate (bound
    clipped to 0 so 75/120 rows cannot violate), and the findings.md recovery (byte-comparison
    against the backup it had itself chosen, so the check was circular). The common
    form: a test or encoding whose PASS-shaped or FAIL-shaped output does not discriminate
    between the hypothesis being false and the test being unable to run.


    CORRECT STATEMENT, to replace the boolean in every surface: on the three assessable
    thinning levels the sparse-context statistic is non-decreasing and the fitted
    exponent is non-increasing (0.651 -> 0.625 -> 0.614); the two deepest levels are
    NOT ASSESSABLE because the guard refuses to fit a frozen tail. Mechanism remains
    NOT ESTABLISHED, consistent with D063, but the reason is precise: two levels refused,
    not "trend absent".


    PROPAGATION STATE, which is currently the worst of both: `joint_tracks_thinning
    = false` has ZERO hits in ROADMAP, decisions.yaml, registry.yaml and the plan,
    while registry.yaml (2 hits) and decisions.yaml (4 hits) still carry `true`. So
    the artifact now disagrees with every knowledge file, and the knowledge files
    assert a value the artifact no longer supports. The fix is NOT to flip true to
    false -- that propagates the same semantic error in the other direction -- but
    to write the three-state statement in all four surfaces.


    REQUIRED IMPLEMENTATION: replace the boolean with a three-state field (tracks_thinning:
    supported | refuted | not_assessable) at both arm and joint level; add tracks_thinning_on_assessable_levels
    computed over non-refused levels only (TRUE for this run, and a real measured
    result) alongside levels_refused; and rename or annotate p_nonincreasing_with_thinning
    so a False cannot be read as a violation when it is a short-vector artefact. Keep
    the per-level detail and the freeze_assertions block, which are correct and good.


    ALSO CONFIRMED CORRECT AND WORTH RECORDING: the freeze itself reproduces at 14/25
    exact-zero increments with the original control at 0/25; the mechanism is quantified
    (new retained contexts collapse 2464 -> 5 -> 0 across k = 13 -> 14 -> 16, retained
    total saturating at 8762); the non-frozen-window exponent is p = 1.093 (LINEAR),
    exactly reproducing the value I computed independently earlier; the superseded
    full-window p = 0.539 is no longer emitted; and the guard correctly leaves the
    un-frozen twin arm alone. Refusing to fit rather than silently fitting the degenerate
    window is the right choice; only the summary encoding is defective.'
