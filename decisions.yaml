- id: D022
  date: 2026-09-13 15:33 UTC
  summary: The h5 carries service labels and both environment axes while Parquet has
    no APP column, so Step 0, Q1's measurement, and Q2's object can all run on data
    already on disk; the months are needed only for scale and the pre-registered split.
  rationale: 'A schema audit of both data formats, verified directly against the artifact
    rather than accepted from the relay, inverts a placement decision the roadmap
    has carried for several rounds and materially shortens the critical path.


    The finding: **the h5 carries the service labels; the Parquet months do not.**
    `APP` is present and populated in all 10,000,000 h5 rows, and absent from the
    Parquet schemas entirely. Both formats carry `QUIC_CLIENT_VERSION`, `DST_COUNTRY`,
    `DST_ASN`, `QUIC_SNI`, `TIME_FIRST`, `PPI`, `PPI_LEN`, and the `PHIST_*` arrays.


    Three consequences:


    1. **Step 0 occupancy can run on the h5 now, at zero download cost.** It needs
    `APP` plus the two environment axes, all present across 10M flows. Two stale claims
    must not be revived: "the two Q2 environment axes are not computable from the
    XS h5" was already known false, and any framing that places the environment axes
    only in Parquet is now also false.


    2. **Q1''s single measurement and Q2''s object can both run on the h5 now** —
    `PPI`/`PPI_LEN` for the k-prefix channel, `PHIST_*` for the rectified object,
    `APP` for labels. The month archives are therefore needed for **scale and the
    pre-registered time-disjoint split**, not for the MVP''s core question of whether
    the bracket is computable and non-trivial on real wire data. That question is
    answerable from data already on disk.


    3. **Going Parquet-first would require a real, unbudgeted dependency**: a validated
    SNI→service mapping, since hostnames are not labels — every subdomain would be
    its own key and the ">= 15 of ~50 services" gate would be meaningless. CESNET
    built theirs from whitelists, Netify''s lookup, and manual review. h5-first avoids
    this entirely. An earlier Parquet occupancy pass that used raw SNI as service
    keys was correctly discarded by the audit and must not be cited.


    Measured `PPI_LEN` in both formats confirms the k cap directly rather than by
    inference: min 2, median 29-30, max 30, bimodal with 6.6% of flows at exactly
    2 packets, and only ~83-86% of flows reaching k>=15. So k <= 30 is measured, and
    the k=30 denominator is biased toward long flows — every per-k number must carry
    its usable-pair fraction.


    One provenance caveat recorded: the audit read the h5 at another project''s path
    on the same host. Contents match ours by hash, but any citation must use our own
    verified copy under the project data disk, per the existing dataset-provenance
    discipline.


    Also noted from the audit: `2024-07.zip` is a 4,973,604-byte partial that fails
    `zipfile` validation, and `2024-08.zip` is zero bytes — neither is usable, so
    the Parquet side currently has exactly one valid month (June, 11.85M rows across
    30 daily files). And the readout state pickle is 3.6 GB, which is fine on the
    507 GB data disk but must not be copied to anything small or treated as a deliverable.'
