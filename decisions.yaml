    (2) THE BLOCKED 0.651 TASK IS UNNECESSARY - THE NUMBER ALREADY LIVES IN AN ARTIFACT.
    The agent was blocked three times by a guard while trying to write "B @ T=0 =
    0.651" into variant B''s artifact, and correctly stopped rather than rephrasing
    until the guard passed. I ruled that stopping was right, and separately established
    by reading the artifacts that the task is not needed. The control artifact already
    contains exponent_p = 0.651 at known_truth_control.plain_iid.fit.power.exponent_p
    - a real fitted exponent over a real curve, in an artifact that is now tracked
    in the repository, not merely in review prose. I also independently verified the
    identity claim: control-plain and B-plain are bit-identical at k = 5, 6, 7, 8,
    9 with the first difference at k = 10 (3.443794066025302 vs 3.4502297569802005).
    That divergence point is precisely the signature of the T=5 filter, which is inert
    where every context still has >= 5 samples and begins to bite at k=10. Two independent
    measurements, same conclusion, now confirmed from bytes by me. RULING: drop the
    task; record that the number''s home is that field. TRAP RECORDED: variant B''s
    artifact contains the string "0.651" twice, both as substrings of 10.651108547284124
    (the k=30 D_k value), so a naive substring grep reports a hit that does not exist
    - match the field, not the digits.


    (3) THE NAMING TRAP WAS CLEARED BY ME. The Reviewer correctly identified that
    in /tmp the file named findings.md.damaged_* held the CORRECT newest superset
    copy (113,414 B, sha ffcee5ade580..., 184 headers) while files named findings_safety3_*
    and findings.md.bak held the STALE versions (101,721 B, sha 528ccf9dbaf6..., 164
    headers) - the names pointed the opposite way from the content, which would have
    induced the next mistake. I renamed the correct copy to findings.SUPERSET_same_as_git_ffcee5ad.md
    and prefixed all four older ones with STALE_. Verified both 113,414 B copies and
    git HEAD:findings.md share sha ffcee5ade580..., the stale set is 101,721 / 97,370
    / 90,970 B, and the working-tree file is byte-identical to the commit. Because
    /tmp is volatile and the only durable copy is the committed one, the repository
    commit is the backup of record for these files.


    ADOPTED AS A STRUCTURAL CONSTRAINT (C028), effective now, applying to the Director
    as much as to the Agent: for findings.md, memory.md, mistakes.yaml, decisions.yaml,
    constraints.yaml and registry.yaml, no recovery, restore or rewrite may proceed
    by whole-file replacement. Any restore must FIRST prove by cmp/sha256 that the
