- id: D059
  date: 2026-09-14 06:55 UTC
  summary: 'CORRECTED MY OWN BASELINE (D054/D051 used uniform 1/53): the label distribution
    is imbalanced, so the majority baseline is 14.73% train-side (24.89% held-out
    per the review), and prototype at 13.53% is BELOW it — my "far above chance" sentence
    over-claimed. Also: lightgbm''s accept flag is HARD-CODED all-True (line 486),
    so its 1.0 accepted_rate is structural, not measured, and its OSCR/FPR95 are computed
    in a never-reject state.'
  rationale: 'An independent review verified the X12 label-space check and, in doing
    so, corrected MY OWN baseline in D054. I confirm the correction and my own arithmetic
    adds a nuance.


    THE CORRECTION: D054 (and D051 before it, in the opposite direction) both reasoned
    against a UNIFORM chance baseline of 1/53 = 1.89%. That is the wrong baseline,
    because the true service-label distribution is strongly IMBALANCED. Any citation
    of the three agreement rates must carry the majority-class baseline alongside,
    or the numbers read stronger than they are. Reporting discipline, not a defect
    in the measurement.


    MY OWN ARITHMETIC, from the cached per-service flow counts in the heterogeneous
    arm (45 services, 5,058,007 flows): the largest service holds 745,293 flows =
    14.73% of the total; top-5 shares are 14.73 / 14.64 / 10.10 / 7.47 / 6.79%. So
    the TRAIN-SIDE majority-class baseline is 14.73%. The review reports 24.89% from
    the HELD-OUT test distribution. These are different populations (training-side
    cached counts versus the held-out split) and I record both rather than choosing
    one; what matters qualitatively is stable across them.


    QUALITATIVE OUTCOME, stable under either baseline: lightgbm (48.58%) and ronetc
    (58.10%) are ABOVE the majority baseline; PROTOTYPE (13.53%) is BELOW it (below
    14.73% and far below 24.89%). So my D054 phrasing that the detectors "predict
    FAR ABOVE CHANCE" was right in direction for two of the three and OVERSTATED for
    prototype, which does not beat a constant majority-class guess. D054''s core finding
    survives -- the index-vs-label hypothesis is still refuted and the "panel is at
    or below chance" framing is still correctly withdrawn -- but the supporting sentence
    over-claimed.


    ALSO CONFIRMED, and it needs labelling rather than fixing: `all_rows_accepted
    = true` for lightgbm is STRUCTURAL, not measured. Source line 486 hard-codes `"accepted":
    np.ones(len(pred), dtype=bool)`, so its accept flag is all-True independent of
    the data. The other two compute acceptance genuinely (prototype: `nearest_distance
    <= radius_array`; ronetc: `score >= threshold`). Consequence: lightgbm''s reported
    accepted_rate of 1.0 is a design residue, and an open-set detector that never
    rejects has NO rejection capability -- so lightgbm''s OSCR/FPR95 are computed
    in a degenerate never-reject state. This must be labelled STRUCTURAL in the artifact
    and caption; it is the same fact as accepted_rate = 1.0, expressed twice.


    D057 INDEPENDENTLY CONFIRMED BY THE REVIEW: it read marginal_and_entropy_curve,
    found the same single-fit-with-no-per-k-refit structure, and measured constant
    tail increments (0.187832 for the known second-order control; 0.04012438 for the
    real-data median curve, constant across the last 20 points). So the parametric
    route''s LINEAR is constructive and carries no information; D053''s narrowing
    of part (i) does not apply. My rejection stands and is now double-confirmed.


    D055 INDEPENDENTLY ACCEPTED BY THE REVIEW, which retracted its own 47x framing:
    it agrees the vote (which explanation wins) is the evidential vehicle for (ii)
