- id: D014
  date: 2026-09-13 13:29 UTC
  summary: 'Computed upper-side eligibility directly: M=1/M=2/M=4 hold a valid upper
    certificate at k=5 across the full latent-TV range at real scale, and r3/r4''s
    failure is compression-independent. Q1 therefore reduces to the measured eps_lo
    at M=4, not to "does any rung pass".'
  rationale: 'Continuing the correction from M012, I computed the upper-side eligibility
    myself rather than waiting on the blocked rerun, because the arithmetic needs
    no corpus and no scipy.


    Write eligibility as `comp x latent_tv + (radius_1 + radius_2) < 0.5`. The load-bearing
    insight is a sign: compression *lowers* channel TV, so coarsening *helps* the
    upper side. Solving per rung at real scales (k=5):


    | n | r0 (M=1) | r1 (M=2) | r2 (M=4) | r3 (M=8) | r4 (M=16) |

    |---|---|---|---|---|---|

    | 200,000 | all latent | all | all | never | never |

    | 1,000,000 | all latent | all | all | never | never |

    | 3,900,000 | all latent | all | all | never (ceil = -0.020) | never |


    So **three rungs — M=1, M=2, M=4 — hold a valid upper certificate at k=5 across
    the entire latent-TV range at real scale, not zero.** The design-stage "no rung
    passes" was an n=1e4 artifact, consistent with M012.


    Two further consequences:


    1. **r3/r4''s failure at k=5 is compression-independent.** Their radii exceed
    0.5 regardless of tv, purely from m >> n. So that half of the conclusion survives
    any choice of compression factor, and the upper-side verdict does not rest on
    the assumed factors at all. This is worth stating in the paper because it is an
    assumption-free statement about certification at this observation length.


    2. **Q1 reduces entirely to the lower side.** With the upper side available at
    three rungs, `eps_lo` is the sole binding constraint. And among the eligible rungs,
    M=4 is the optimum: it has the least TV collapse (compression is monotone in M)
    while still certifying, so it should carry the most discriminative signal. Q1
    therefore hinges on the measured `eps_lo` at M=4, with M=2 as fallback — a much
    sharper question than "does any rung pass". The measured lower side at M=4 is
    the number that decides Q1.


    Also settled this round: the rerun should run via local Bash on the server (where
    scipy exists) rather than through a blocked worker dispatch, since the upper side
    needs no scipy at all and only the Michel lower bound does. And ECH novelty boundary
    confirmed — the same group''s adjacent work reports classifier accuracy (hRFTC
    / hC4.5 F-scores), not a measured two-sided TV bracket, so it does not meet the
    category-4 definition; caveat carried that the paper itself was not fetched, so
    the verdict is metadata-level and the entry stays verified=false. One question
    from the blocked ECH spec that I could not fully answer: whether the paper''s
