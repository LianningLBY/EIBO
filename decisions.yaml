    part the paper leans on hardest and therefore the part where a fabricated or garbled
    entry would do the most damage.


    VERIFIED EXTERNALLY, all four exact:

    - han2015l1distribution: Han/Jiao/Weissman, "Minimax Estimation of Discrete Distributions
    Under l1 Loss", IEEE Trans. Inf. Theory 61(11):6343-6354, 2015, DOI 10.1109/TIT.2015.2478816.
    Matches field-for-field. (A precursor exists as "Minimax estimation of discrete
    distributions" submitted to IEEE TIT 2014, arXiv 1411.1467 — same paper, preprint
    form; our entry cites the journal version, correctly.)

    - michel2020high: Loris Michel, Jeffrey Naf, Nicolai Meinshausen, "High Probability
    Lower Bounds for the Total Variation Distance", arXiv 2005.06006, May 2020. Matches.
    This is the paper''s LOWER side, so its correctness is load-bearing for a core
    claim.

    - chan2013closeness: Chan/Diakonikolas/Paul Valiant/Gregory Valiant, "Optimal
    Algorithms for Testing Closeness of Discrete Distributions", SODA 2014, pp. 1193-1203.
    Matches, including the author ORDER (Zbl and Researchr use Paul-then-Gregory,
    which is what our entry has; some bibliographies reverse it, so ours follows the
    standard record).

    - diakonikolas2020highprob: Diakonikolas/Gouleakis/Kane/Peebles/Price, "Optimal
    Testing of Discrete Distributions with High Probability", arXiv 2009.06540, Sep
    2020. All five authors exact.


    ONE SUBSTANTIVE FINDING, recorded not acted on: diakonikolas2020highprob has a
    PUBLISHED refereed version — STOC ''21, Proceedings of the 53rd Annual ACM Symposium
    on Theory of Computing, pp. 542-555 — which our entry does not name; it carries
    only the arXiv preprint form. Citing the arXiv version of a paper that appeared
    at STOC is legal and common, but the published version is the better citation
    for a venue that checks provenance, and STOC ''21 is more authoritative than a
    preprint. This is a QUALITY improvement, not a defect: the entry is accurate as
    written. I am not editing it now for the same reason as the 2.96 half-clause —
    a bib edit invalidates the visual receipt, the archived PDF byte-identity, and
    forces a re-gate, which is disproportionate for a citation-preference change on
    a correct entry. It belongs in the next substantive edit pass, batched.


    RUNNING TOTAL: 12 of 69 entries now externally verified (5 added this cycle in
    D222, 3 highest-risk 2026-dated in D228, 4 statistical backbone here). All 12
    exact. 57 remain unverified; structural checks over all 69 are clean and no wrong-field
    has been found in any verified entry. The DeepSE-WF fabrication remains the only
    fabrication found, and it is fixed.'
