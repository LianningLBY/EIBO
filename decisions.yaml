  rationale: 'I read the build script directly rather than accepting the reported
    dispositions, and found that two of the three items did NOT land, plus a third
    problem.


    1. Case-insensitivity did NOT land. The script contains re.IGNORECASE at line
    131, but that is a different regex; the census does plain substring matching at
    line 512 (`if pattern in text:`), which is case-sensitive. The agent''s report
    stated the census was wired as a baseline but did not claim case-insensitivity,
    so this is an unclosed gap rather than a misreport.


    2. I measured the union myself: 40 case-insensitive (root 17, efs 12, home 1,
    usr 5, autodl 11, eibo 33 ci / 30 cs, slug 11). The agent reported 38. The difference
    is exactly the three uppercase-only files. Notably eibo is 33 case-insensitive,
    so the baseline constant eibo:30 is understated by 3 and would not fire on a fourth
    uppercase-only file.


