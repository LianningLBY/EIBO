  rationale: 'A critical finding, which I VERIFIED from the artifact, invalidates
    half a pillar of C3''s part (i): variant B''s plain known-truth curve is FROZEN
    over a third of its range, and the freeze -- not sparsity -- produces the monotone
    p-fall that the "61% excluded mass shows the failure is structural" argument rests
    on.


    VERIFIED MYSELF: variant B''s gate.plain_iid_known_truth.curve has D_k_median
    pinned at exactly 5.908567858844014 for every k from 16 to 30. Increments over
    k=5..30 are [0.33995, 0.34420, 0.34113, 0.35237, 0.37767, 0.38000, 0.37049, 0.39485,
    0.40327, 0.41803, 0.49169, 0, 0, ...] -- 14 exact zeros out of 25 increments.
    k=16..30 hold a single distinct value.


    NOT A DATA PROPERTY: the ORIGINAL X3 known-truth control''s plain curve, which
    uses the same construction but NO threshold filter, has ZERO zero-increments across
    k=5..30. So the freeze is introduced by variant B''s threshold-filtered path,
    not by the data.


    AND THE FREEZE PRODUCES THE SIGNAL: I refit B''s own curve with B''s own power-law
    form. Over the full window k<=30 the fit gives p = 0.539, exactly reproducing
    the artifact''s reported value. Truncated to k<=16 -- i.e. before the freeze --
    the same fit gives p = 1.093, which is LINEAR, not sublinear. So the reported
    sublinearity of the plain arm is an artifact of fitting a curve whose tail is
    a constant.


    CONSEQUENCE FOR THE ARGUMENT: D052''s finding 2, D055''s mechanism discussion,
    and registry D052_FINDING_2 all lean on "B''s plain arm p falls monotonically
    as the threshold tightens (0.539 / 0.420 / 0.372 / 0.260 / 0.210), and 61% of
    transition mass must be discarded, so the failure is structural". The reviewer''s
    further claim is that each threshold''s fall is explained by the freeze starting
    earlier at higher T (T=10 -> frozen at k<=14 giving p = 1.050; T=20 -> 1.041;
    T=50 -> 1.008; T=100 -> 1.002). I have verified the mechanism on T=5 directly
    (0.539 -> 1.093 when the frozen tail is removed); the per-threshold numbers in
    that list I have NOT independently reproduced, so I record the mechanism as established
    and the specific per-T values as reported-not-verified.


    ALSO: the freeze appears elsewhere on the same code path -- in the CORRECTED dose-response,
    the plain arm freezes at k=29 (retained=0.10) and k=27 (retained=0.05), while
    the twin arm does not freeze. So this is a property of the threshold/dilution
    filter path, not a one-off.


    WHY MY VERDICT ON THE MECHANISM DOES NOT CHANGE, ONLY ITS REASON: the mechanism
    was already NOT ESTABLISHED. That conclusion stands, and the reason is now SIMPLER
    AND STRONGER: one of the two controls used to argue about it has a curve that
    stops varying for 14 of 25 points, so it cannot testify about the shape of growth.
    It is no longer "two controls point in opposite directions" but "one of them is
    inert over a third of its range". This also dissolves the D052 tension I recorded:
    if both B''s threshold scan and the dose-response are largely reflecting their
    own filter/dilution-path freeze lengths, there is nothing for "sparsity" to reconcile.


    REQUIRED: (1) B''s plain-arm conclusion and the 0.608 excluded-mass figure must
    not be cited until the freeze is fixed -- the mass figure was computed on the
    frozen axis and needs recomputation; (2) the fix is to make the retained context
