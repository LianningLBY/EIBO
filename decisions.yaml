- id: D105
  date: 2026-09-15 07:04 UTC
  summary: 'D105: retract my "lower side is finite-sample" instruction (D030 was right
    — the constant is asymptotic, the level is nominal); M-ladder CIs are computable
    from an existing artifact'
  rationale: 'Two decisions from this round, one of which corrects my own instruction.


    (1) CORRECTION TO MY OWN FR-2 INSTRUCTION - D030 WAS RIGHT AND I WAS WRONG. I
    instructed the Paper Agent to describe the lower side as "finite-sample high-probability".
    Re-reading statcore.py, the code says otherwise: _michel_beta''s docstring calls
    it "Appendix B.1''s iterated-log confidence constant" and states that "for very
    small effective m the paper''s ASYMPTOTIC iterated-log expression is undefined";
    tv_lower_bound''s docstring says the "Appendix asymptotic constant is replaced
    by a conservative finite value"; and the diagnostics field self-labels "reported
    as a NOMINAL 1-alpha lower bound". So the confidence constant is asymptotically
    derived with a finite patch only in the degenerate small-m regime. D030 (which
    superseded D029) had already recorded exactly this and explicitly warned against
    calling the band "proven". My instruction would have overwritten a correct earlier
    decision with an over-claim in the opposite direction. The Paper Agent flagged
    the conflict rather than adopting my wording silently - that flag is what caught
    it.

    CORRECT CHARACTERIZATION (all three must hold): the lower side carries a stated
    confidence level and is not a bare point estimate (so the OLD "asymptotic, no
    level" framing was genuinely wrong - that was the real reviewer defect); that
    level is NOMINAL because the constant is asymptotic, not an exact finite-sample
    certificate; and "proven" / "unavailable at any sample size" are both deleted.
    Instructed the Paper Agent to rewrite FR-2 accordingly and to revise the candid
    Section 3.4 paragraph, which is now misleading because the earlier revision was
    closer to right on provenance than my instruction was.


    (2) THE M-LADDER CIs ARE COMPUTABLE, so the "not estimable" sentence I had instructed
    is WRONG and is being retracted before it is written. Verified directly in the
    local tree: artifacts/_project/data/q1_absolute_counts.json holds 4950 rows =
    990 pairs x 5 M values (M distribution 1/2/4/8/16 -> 990 each), each row carrying
    per-pair tv_k5_masked, n_a, n_b, service_a, service_b. The medians reproduce the
    published series EXACTLY: 0.5805 / 0.8833 / 0.9248 / 0.9462 / 0.9673. Verified
    each M slice is a complete graph on the SAME 45 services (degree distribution
    {44: 45} at every rung), so the service-cluster construction applies identically
    across the ladder. Cost is assembly, not recompute. The independent Reviewer found
    this file; I confirmed it independently rather than relaying.

    SCOPE PINNED: this covers k=5 across all M. For k=10/15/30 the per-pair rows were
    not persisted (X1''s new_compute_disclosure records that fresh masked HDF5 passes
    were required), so CIs there would be a genuine recompute. W10/W14 is scoped to
    the k=5 ladder, which is what the paper''s monotone series quotes. No rerun authorized.'
