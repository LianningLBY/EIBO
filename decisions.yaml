    THE DIAGNOSTIC: I re-issued the identical submission. `submit_paper_to_review`
    was documented to DEDUPLICATE against an active round ("a parallel submission
    to bypass a stalled round is not possible; returns deduplicated: true"). It did
    not deduplicate — it returned a SECOND, distinct approval id (apr_20260925T011505_9gg9,
    vs the first apr_20260924T225518_cl7h). Since deduplication is the documented
    behaviour whenever an active round exists, a fresh approval means no active round
    existed at that moment. Therefore the first submission produced no round at all,
    and the second has not registered either.


    CORROBORATION, all independent of the approval response:

    - get_formal_review_status reads round 18 / completed / report_exists true, across
    four checks spanning ~1h20m (the manifest''s updated_at moves to seconds after
    each submit — it is being touched — but the round counter never advances and report_exists
    never flips false)

    - No artifacts/review_round_19 directory exists; round dirs run 1..18

    - No new review state file appeared after either submission; the only state touched
    was pdf_visual_reviews.json (my own visual gate)

    - The round-18 precedent shows a successful submission DOES produce a round dir
    and flips the manifest''s phase, neither of which happened


    WHAT THIS IS NOT: it is not the round-15/16/17 failure mode (those registered
    a round, dispatched three reviewers, then failed with report_exists false). Here
    no round is created at all — the failure is one stage earlier, at registration.
    It is also not something a further retry will fix; two identical attempts produced
    two approvals and zero rounds, and a third would most likely do the same. And
    it is not a gate problem: the first re-submit was correctly REFUSED for an expired
    visual receipt, which I then satisfied (fresh 24/24 at 01:14:32), and the second
    was accepted — so the gate is working and the paper is submittable.


    STATE: the deliverable is complete and verified on my side — paper 04b7507f (24
    pp, body p.13, 0 ??, fresh 24/24 receipt on those exact bytes), archive 53c7c6bd
    (88 entries, three-way hash agreement, registered). The submission snapshot is
    unchanged from 22:55 and my move of the internal docs held (0 occurrences of camera_ready_plan/references.bib.prev).
    Render scratch cleaned after the gate, in the correct order this time. I also
    rewrote ROADMAP.md (was 256 lines over the 200 cap, with a stale header describing
    a draft awaiting a PI verdict and an open D203 archive gap that is long closed)
    down to 87 lines of current facts.


    CONCLUSION: this is blocked on the platform''s review-registration path, not on
    my work. A further blind retry is not warranted — two attempts is enough evidence,
    and continuing would be re-attempting a fix for a failure that is not mine. The
    user should be told the paper is ready and that the submission is failing to register
    on the platform side.'
