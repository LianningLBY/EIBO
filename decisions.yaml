- id: D015
  date: 2026-09-13 13:33 UTC
  summary: 'Closed Q1 to a single criterion: because T(n) is M-independent while the
    upper ceiling shrinks in M, each rung''s feasibility window is [T(n), 0.5-radius(M,n)],
    and M=1/2/4 have non-empty windows for n>=2e4 while M=8/16 have none. Q1 now needs
    one measured quantity — the real per-rung channel TV.'
  rationale: 'The blocked rerun (rejected three times by the dispatch screen) asked
    for joint fractions at n=2e5 and n=3.9e6 plus a compression-factor sensitivity
    band on the synthetic ensemble. I computed the answer analytically instead, which
    is both stronger and cheaper — the ensemble was never the right instrument, because
    the two conjuncts have opposite monotonicity in M and therefore collapse to a
    single interval criterion.


    The structure:


    - The **lower** requirement is `channel_tv > T(n)`, where `T(n)` is the minimum
    channel TV at which `eps_lo > 0.05` under the exact Clopper-Pearson two-cell test.
    **T(n) is independent of M** — it is a property of the channel object and the
    sample size, not the granularity. Computed (k=5): n=2e4 → 0.0659, n=2e5 → 0.0550,
    n=1e6 → 0.0522, n=3.9e6 → 0.0511. Computed locally without scipy, via a continued-fraction
    incomplete beta plus bisection.

    - The **upper** requirement is `channel_tv < 0.5 - radius(M,n)`, which shrinks
    fast in M since radius ∝ (2M)^(k/2).


    So each rung''s joint feasibility window is the interval `[T(n), 0.5 - radius(M,n)]`,
    non-empty exactly when the two ends do not cross:


    | n | M=1 | M=2 | M=4 | M=8 | M=16 |

    |---|---|---|---|---|---|

    | 20,000 | [0.066, 0.441] w=0.375 | [0.066, 0.255] w=0.189 | no upper cert | -
    | - |

    | 200,000 | [0.055, 0.481] w=0.426 | [0.055, 0.422] w=0.367 | [0.055, 0.089] w=0.034
    | no | - |

    | 1,000,000 | [0.052, 0.492] w=0.439 | [0.052, 0.465] w=0.413 | [0.052, 0.316]
    w=0.264 | no | - |

    | 3,900,000 | [0.051, 0.496] w=0.445 | [0.051, 0.482] w=0.431 | [0.051, 0.407]
    w=0.356 | no | - |


    Three consequences, none of which depends on any assumption:


    1. **Feasibility windows exist at M=1, 2, 4 for n >= 2e4.** They are not empty.
    The earlier "no rung passes" reading was purely the n=1e4 ensemble artifact, consistent
    with M012.

    2. **M=8 and M=16 have no upper certificate at any tv or n in this range** (radius
    exceeds 0.5) — compression-independent, extending D014.

    3. **The window endpoints are pure arithmetic; the compression factor only determines
    where a real pair lands relative to them.** So Q1 does not require inferring the
    compression factor at all — the windows are computable, and the single measured
    quantity that decides Q1 is the real per-rung channel TV.


    Q1 therefore has a complete three-way form, which is the paper''s clean shape:
    for each pre-registered rung M, a pair PASSes iff its measured channel TV lies
    inside `[T(n), 0.5 - radius(M,n)]`; it is *indistinguishable-on-channel* (lower
    side vacuous) if below `T(n)`; and its certificate is *lost* (upper side vacuous)
    if above. Reporting which regime each pair occupies at each rung is a complete
    and honest result set, invariant to the compression assumption.


    This also removes the dispatch blockage from the critical path: the analytic solution
    subsumes what the blocked rerun would have estimated, and is strictly stronger
    — exact windows rather than noisy sample fractions, and assumption-free rather
    than dependent on a guessed factor.


    One operational note worth keeping: `src/eibo/__init__.py` imports `divisibility`,
