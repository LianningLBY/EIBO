- id: D166
  date: 2026-09-18 16:57 UTC
  summary: Verified the reviewer's tighter m-free Hoeffding upper bound (2.91x tighter,
    headline 340->363); C2's stated alphabet-penalty mechanism is wrong and the horizon
    extends to k=15, with the true cause being tv_hat saturation
  rationale: 'An external reviewer (same source that produced two earlier objections,
    one of which we refuted, one of which we confirmed) proposed a different finite-sample
    upper bound on TV. I verified it myself and it is CORRECT and strictly tighter.
    THE BOUND: take the population-optimal distinguishing set A* = {x : P(x) > Q(x)}.
    A* depends only on the true P,Q, NOT on the sample, so one-sided Hoeffding applies
    directly to P(A*) and Q(A*) with no union over the 2^m subsets. Result: TV <=
    tv_hat + sqrt(ln(2/delta)/(2 n_a)) + sqrt(ln(2/delta)/(2 n_b)). THE m TERM VANISHES.
    By contrast the paper''s Eq (6) bounds the L1 norm, which requires a union over
    all subsets and therefore pays sqrt(m/n). VERIFICATION: (i) reproduced the reviewer''s
    three arithmetic figures exactly (0.08617 / 0.02960 / 0.04750 at m=32, n=10000,
    delta=0.025); (ii) simulated both bounds over 3000 draws at n=2791 — both cover
    at nominal, the Hoeffding radius is 2.91x tighter; (iii) recomputed from OUR OWN
    LEDGER (q1_lower_side_full_n.json, 990 pairs, per-law alpha/2=0.025): paper bound
    gives 340, reproducing exactly what the paper reports, so my convention reading
    is right. RECOMPUTATION FROM LOCAL PER-PAIR FILES (M=1 k-ladder fully local; M=1
    and M=2 at k=5 from the dense-counts file): M=1/k=5: paper 340 -> Hoeffding 363
    (610 pairs already fail by saturation). M=1/k=10: 28 -> 98. M=1/k=15: 0 -> 18.
    M=1/k=30: 0 -> 0, with 820/820 pairs already at tv_hat >= 0.5 (median 0.9979)
    — lost to SATURATION, not radius. M=2/k=5: 47 -> 127 (851 already saturated).
    Both M=1/k=5 (340) and M=2/k=5 (47) reproduce the paper''s recorded values exactly,
    confirming the convention. CONSEQUENCE — C2''s stated mechanism is wrong, but
    the horizon is LONGER than claimed and its true cause is more defensible: the
    paper attributes the short certificate horizon to the sqrt(m/n) radius growing
    with alphabet resolution. That attribution is false, because the radius need not
    depend on m at all. The real binding cause is the sparse upward bias of the empirical
    TV at high resolution (tv_hat saturates above the threshold long before the alphabet
    penalty bites). Net effect is FAVOURABLE to the paper: "the horizon is short because
    our bound is alphabet-priced" becomes "the horizon is set by the data''s own sparsity,
    and it extends to k=15 once the bound is not alphabet-priced" — the latter is
    a boundary of the object, not a defect of our construction. ALSO CONFIRMED against
    the same review: (a) the citation of [31] is mis-positioned — the source explicitly
    permits correlated, non-stationary sequences, so the blanket "single-letter, hence
    inapplicable to packet prefixes" claim must be withdrawn; (b) the Open Science
    appendix''s artifact-access statement does not satisfy the CFP requirement for
    anonymous links or an explanation of why they cannot be provided. STILL OPEN:
    the remaining (M,k) cells beyond M=1 and M=2/k=5 need either per-pair higher-M
    data (not local) or a corpus pass; the M=1 k-axis, which is what the horizon claim
    rests on, is complete. NOT YET DONE — deliberately: no manuscript edit has been
    made. This is a directional decision the user must take, because it changes the
    form of the C2 contribution and the emphasis of the abstract. MY RECOMMENDATION:
    revise, because the correction makes the paper stronger (longer horizon, truthful
    mechanism) rather than weaker, and because the sqrt(m/n) term is a checkable technical
    error a referee can find unaided.'
