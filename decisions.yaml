    stray file; census baseline fires when a pattern count grows (autodl 12 > 11);
    binary guard fires on both a leak token and an Author field; freshness fires with
    a source strictly newer than the render. One caveat I want recorded: my FIRST
    freshness test returned empty and I nearly logged it as a broken guard — the test
    was wrong, not the guard (a +120s offset still left the bib older than the PDF,
    which is 145s newer). Re-tested with the bib set strictly after the PDF and it
