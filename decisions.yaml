- id: D108
  date: 2026-09-15 13:35 UTC
  summary: 'D108: re-review attempted on owner instruction; platform de-duplicated
    it back onto the stalled round — no Director-side path to force a new round'
  rationale: 'The project owner instructed a re-review ("重新审吧") in response to my
    report that Round 2 is stalled. I attempted it fully rather than assuming it would
    fail.


    WHAT I DID: (1) re-checked status - Round 2 still active/cross_sharing, no report,
    phase stamp unmoved since 09:13; (2) re-rendered all 18 pages and re-inspected
    them, because the visual-review receipt has a 2-hour window and had lapsed; (3)
    re-confirmed the receipt against the unchanged bytes; (4) called submit_paper_to_review.


    OUTCOME: the platform returned status=active, round=2, deduplicated=true, mapping
    the submission back onto the EXISTING round rather than creating a new one. So
    no new round was created and the re-review did not start.


    WHAT THIS ESTABLISHES: the submission entry point de-duplicates by content, so
    while the manuscript bytes are unchanged there is NO Director-side path to force
    a fresh round. That is protective (it prevents round/record corruption) but it
    means the stall is not solvable from inside this project''s toolset. The unstick
    therefore requires either platform-side review-gateway recovery, or the owner
    initiating from a different entry point (e.g. a web-side resubmit/review control).
    I have given the owner those two options plus the option to wait, and offered
    to prepare a one-line handoff describing which round, where it stopped, how long,
    and the round id, plus the byte-verification state and the 23-item fix list, for
