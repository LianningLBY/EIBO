- id: D052
  date: 2026-09-14 05:36 UTC
  summary: 'D046''s C3 reframe is WEAKER than written: part (ii) is unsupported (the
    known-truth control is homogeneous within item while real data pools heterogeneous
    flows, so heterogeneity alone fakes first-order dependence), and part (i)''s "sparse
    occupancy is the measured mechanism" is CONTRADICTED by B''s own sweep (tightening
    the occupancy threshold makes the plain arm MORE sublinear). Two cheap discriminating
    controls dispatched; the core of (i) — the estimator deflates and cannot adjudicate
    — stands.'
  rationale: 'An independent critical review of the D046 C3 reframe found two load-bearing
    sub-claims weaker than as written. Both were verified against the artifacts/code
    before acting.


    FINDING 1 (CRITICAL) — part (ii) IS NOT SUPPORTED BY ITS CONTROL, due to a between-flow
    heterogeneity confound. Verified: x3_variant_c_nested_lr.py pools ALL flows of
    a service into ONE item in real_data_report (bits = direction_bits_from_codes(entry["codes"],
    entry["lens"]) over the whole service), whereas the known-truth control synthetic_iid_case
    draws probabilities = linspace(0.20, 0.80, CONTROL_ITEMS), i.e. ONE probability
    per item shared by all its flows -- the control is HOMOGENEOUS within item. Consequence:
    within a service, flows may be heterogeneous; if half the flows have p=0.30 and
    half p=0.70, the pooled transition counts show theta_0 ~ 0.42 and theta_1 ~ 0.58,
    i.e. strong apparent first-order dependence with ZERO true within-flow dependence.
    So C''s real-data result (Markov favoured 45/45 at every k) is consistent with
    genuine within-flow dependence AND fully consistent with mere service-level heterogeneity;
    the current control cannot discriminate. Therefore "the dependence is real and
    first-order" is NOT ESTABLISHED. This is the same class as the project''s recurring
    error: a plausible conclusion carried by a control that cannot exercise the alternative.


    FINDING 2 (WARNING, contradicts text I wrote) — the "mechanism is MEASURED (sparse
    occupancy)" sentence is CONTRADICTED by variant B''s own sweep. Verified from
    x3_variant_b_support_conditioning.json: the plain arm''s power exponent DECREASES
    monotonically as the occupancy threshold tightens -- T=5/10/20/50/100 gives p
    = 0.539/0.420/0.372/0.260/0.210, against a no-filter baseline of p=0.651; the
    twin moves the OTHER way (1.042/1.027/1.016/1.011/1.007 vs baseline 0.897, i.e.
    improving toward linear). If sparse contexts MANUFACTURED sublinearity, removing
    them should push the plain arm toward LINEAR (p -> 1). It pushes it further sublinear.
    So B supports "the deflation cannot be fixed by conditioning" but NOT "sparse
    occupancy is the cause"; the two arms moving in opposite directions is itself
    unexplained. The mechanism sentence must be DOWNGRADED from MEASURED to NOT ESTABLISHED
    (at most "correlated with occupancy"), pending an occupancy dose-response arm.


    WHAT SURVIVES part (i): the estimator DEFLATES large-k divergence -- measured
    directly on analytically-linear truth, est/true 1.0002 at k=5 falling to 0.6769
    at k=30 -- so it cannot adjudicate the growth question; and two independent repair
    attempts (A estimator-family via delete-one jackknife; B exposure conditioning)
    both FAILED their known-truth gates without touching real data. That core stands.
    What does not stand is the CAUSAL attribution to sparse occupancy.


    FINDING 3 (WARNING) — the gate''s two arms are systematically unequal: twin_services_used
    = [0, 1], i.e. only the two largest services (n ~ 1,375,270 / 359,864) versus
    plain''s 200,000 per side. The twin therefore has 1.8-6.9x more data per context
    and is EASIER; corroborated by B''s pattern (twin passed at ALL thresholds, plain
    failed at ALL). The gate consequently tests the well-occupied regime, while what
    breaks the estimator is the SPARSE regime (X3''s own diagnostic: at k=30, 90.5%
    of contexts have <5 samples). A variant could therefore pass the gate yet still
    return false SUBLINEAR on real sparse data. Fix: stratify the twin to include
    the smallest services (or all 45) so the gate is exercised at worst-case occupancy.


    FINDING 4 (novelty risk on (i)) — the sparse-regime plug-in KL/entropy bias is
    a classical result (Miller 1955; Grassberger 1988; Paninski 2003; Kraskov 2004).
    Part (i)''s "novel content" claim therefore needs explicit positioning against
    that literature, or it does not survive as novel. Recorded as a framing obligation,
    not yet resolved.


    PROCESS FINDINGS (verified): the three repair variants (A/B/C) have NO registry
    entries, so the numbers framing now cites lack registry traceability; the registry
    X3 entry carries D044''s INCONCLUSIVE adjudication (updated_at 03:40:31Z, before
    D046 at 04:33Z) but NOT the D046 reframe or the variant results; paper_provenance.yaml
    is absent; and experiment_plan.yaml describes variant A as "finite-support-corrected
    / k-NN-family" when A actually implements a two-sample delete-one JACKKNIFE correction
    -- my earlier correction of that line was OVERWRITTEN when the plan entry was
    rewritten, which is itself the lesson that a correction must be re-verified after
    any subsequent write to the same file.


    DISPOSITION: C3''s type stays a methods/limits finding (not a growth-rate result,
    not a falsification), but it is WEAKER than D046 as written and must be stated
    at the lower strength until the discriminating controls land. Two cheap controls
    dispatched: (a) a heterogeneous-i.i.d. arm -- within-item per-flow direction rates
    drawn from the empirical per-flow distribution, i.i.d. within flow -- which DECIDES
    whether (ii) survives (if it also returns Markov 45/45, heterogeneity fully explains
    C''s result); (b) an occupancy dose-response arm -- thin flows per context and
    check whether the deflation tracks sparsity -- which converts "sparse occupancy"
    from correlation to causation or kills it. Neither requires real-data judgement
    calls. Dropping C3 entirely (a two-claim paper) remains a legitimate option that
    I am holding in reserve for the user, and the parametric/model-internal divergence
    route suggested by the review (fit a low-order Markov, compute D_k under the FITTED
    model, test its growth) is the one route that would estimate the SAME growth question
    while bypassing occupancy collapse; it is a candidate fourth variant, not yet
    dispatched.'
