- id: D018
  date: 2026-09-13 14:09 UTC
  summary: Resolved a path ambiguity (data intact, worker was reading an empty same-named
    directory), authorized cancelling the runaway h5 worker, and opened the possibility
    of running Q1's single measurement on the complete XS subset now instead of waiting
    for the months.
  rationale: 'Two resolutions and one strategic opening.


    **Path ambiguity resolved, no data loss.** The executing team reported "the expected
    raw directory path currently shows no entries," which contradicted both my measurement
    (2.0 GB) and the recorded migration of the verified 2024-06.zip. I checked both
    candidate paths directly: `/root/eibo/data/raw` is empty (container root) while
    `/root/autodl-tmp/eibo/data/raw` holds 2.0 GB — the data is intact, and the worker
    was querying the wrong same-named directory. It was mid-way through "locating
    the month files," so if it had concluded "no data" from the empty path it might
    have re-downloaded a file we already have verified. The exact path was sent to
    it immediately. This is the third misjudgment this session caused by an ambiguous
    path (after the h5 read and the probe artifact), so a constraint now requires
    absolute paths in every task spec and report — a bare "data/raw" is not a location.


    **Authorized cancelling the runaway worker.** `worker_h5_early_occupancy_signal_and_coverage_check`
    had a 9.5 MB / ~1.18M-token log with `turn_count 0` and an empty last message
    — log runaway rather than progress — and it produces an early signal for something
    whose formal determination belongs on Parquet anyway. Cancelling it frees a slot.
    The schema-audit worker is genuinely working (recomputing PHIST support) so it
    continues, though its PHIST portion is the lowest priority and may be interrupted
    if a slot is needed.


    **A possible shortcut that could advance Q1 without waiting for the months.**
    We had sequenced the per-rung TV compression measurement behind the full month
    fetch. But the XS h5 is a complete, hash-verified, genuinely captured QUIC trace
    carrying `APP` and `PPI` — if the k-prefix object is usable there, the measurement
    can run on XS now and give an early reading rather than waiting on eleven months.
    Three things must be verified first: (i) that `PPI`/`PPI_LEN` is present and usable
    in the h5, which is the precondition for the k-prefix object at all; (ii) that
    `APP` carries enough flows per service (XS is a 10M-flow budget across ~50 services,
    so roughly 2e5 each on average); (iii) that XS''s sampling scheme does not bias
    the compression ratio — it is a flow-budget subsample rather than uniform 1:100,
    and the compression ratio is an internal quantity so subsampling should not change
    it, but that needs confirming rather than assuming.


    If all three hold, the reading must be labelled "early reading on the XS subset,
    not the formal determination," with the sampling scheme noted, and it may not
    be mixed with month-based results — the formal determination still uses the full
    months and the pre-registered split. So this does not replace anything; it just
    moves Q1''s answer earlier at no additional resource cost.'
