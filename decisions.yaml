    and :74, four lines apart). What is genuinely missing is narrower: the paragraph
    gives 0.197 < 0.304 and 0.197 < 0.375 but never states 0.375 > 0.304. One clause
    at most; no restructuring.


    3. C4 — premise false, instruction withdrawn entirely. I asserted a one-page cap
    on the Ethics/Open Science appendices. The CFP extract says the opposite: submissions
    may include "up to 13 pages of body text" with "no limit on the length of the
    bibliography and optional appendices", and camera-ready is "20 pages, including
