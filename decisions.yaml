- id: D101
  date: 2026-09-15 06:31 UTC
  summary: 'D101: Round 1 review verdict reject (resubmit-worthy) — correctness cluster;
    plan sent to Reviewer for independent check before dispatch'
  rationale: 'Round 1 formal review completed: 3 reviewers, verdict reject (resubmit-worthy),
    23 items (10 critical, 12 warning, 1 minor). Ran the holistic pass and drafted
    a per-item Action Matrix, then sent the whole plan to the independent Reviewer
    before dispatching (protocol step 3 - cannot be skipped).


    TWO LOAD-BEARING JUDGMENTS SENT FOR INDEPENDENT CHECK:

    (a) W2 ("the asymmetry is a method choice presented as necessity") is a WRITING
    defect, not an evidence gap. Verified in-repo: statcore.tv_lower_bound implements
    Michel''s adaptive sup-over-cutoff construction WITH a per-sample-size finite-sample
    confidence constant (_michel_beta), and PROJECT_BRIEF Step 5 calls the lower side
    "a certified, distribution-free LOWER bound" from "high-probability" bounds. So
    the paper contradicts its own code and brief by calling that object asymptotic
    and asserting "proven is unavailable for the lower side at any sample size."

    (b) W3 (no pairwise->open-set reduction) is fixable by REPOSITIONING: retitle
    the contribution as a pairwise indistinguishability certificate, state the open-set
    floor as the known per-pair Le Cam consequence it is, and state explicitly that
    the multi-class aggregation is not reduced. Repositioning is the honest fix rather
    than overclaiming.


    CORRECTNESS CLUSTER (the reason for the verdict): W1 (Eq.4 unproven, mis-attributed
    as DKW when it is an l1 bound closer to Han-Jiao-Weissman, i.i.d. assumption undeclared
    - three-way consensus, the dominant problem); W4 ("each side is a joint 0.95 statement"
    contradicts the paper''s own discipline); W5 ("binds on every rung / 100% of the
    ladder" - verified real, joint gate is M=1 only); W6 (detector panel unreproducible;
    X12''s floor_violation_test DOES exist and ran binomtest with p=0.9954, so the
    honest fix states the near-zero power rather than hiding it); W7 (internal workflow
    annotations in refs [2][30][32][38][44] - desk-reject-visible); W8 (no exp_id/sha256/URL/pre-registration
    in the submission); W9 (orphan Discussion blocks - verified X13 mass and whole-flow
    q1_absolute_* artifacts EXIST and can be promoted; verified the DST_ASN audit
    does NOT exist anywhere and its promise at related_work.tex:102 must be deleted).


    EMPIRICAL CHECK I RAN MYSELF on W1: the bound covers at 100% in the near-identical
    adversarial regime (m in {4,16,64,256}), but TV_hat is itself upward-biased there,
    so coverage alone cannot validate the bound - the derivation is what is owed.
    Recorded so the fix is a derivation, not a coverage claim.


    DISCLOSURE CLUSTER RECURRENCE: W11/W12 were also flagged in the pre-review audit,
    so a prose-only fix has now failed twice - switching to generated disclosure tables
    built from the artifacts rather than another hand-written pass.


    Routing: [paper] to the Paper Agent (reframing, W1 derivation, disclosure, reference
    and format fixes); [compute] to the Main Agent (bootstrap CIs for W13/W14 over
    existing artifacts). No new experiment is required by any item; two open questions
    sent to the Reviewer on whether W14/W16''s confound needs an occupancy-controlled
    ablation (which WOULD be an evidence fix).'
