  rationale: 'Checked the archive/file-hygiene report the Main Agent raised, which
    pulled the thread on two separate questions. One of its claims is REFUTED; the
    sweep it prompted surfaced a real, separately-tracked open item that is worth
    resolving now.


    1. REFUTED — the claim that `docs/paper/main.fls` would leak an absolute path
    into the submission. The Agent reasoned from ROADMAP:88 ("the platform snapshots
    docs/paper/ wholesale") to the conclusion that any file carrying an absolute path
    inside docs/paper lands in the submission. That premise is NOT what the snapshot
    does. Evidence, from the authoritative artifact rather than inference:

    - I extracted the actual `artifacts/submission.tar.gz`: its 47 entries are 10
    .tex, 6 .pdf, 29 .png, 1 .sty, 1 .bib. It contains ZERO LaTeX intermediates: no
    .fls, no .aux, no .log, no .out, no .bbl, no .blg, no .fdb_latexmk, no .synctex.

    - `main.fls` mtime is 2026-09-23 07:00; the snapshot is 2026-09-25 01:15 — so
    the file EXISTED when the snapshot was taken and was still excluded. Existence-at-snapshot-time
    plus exclusion proves an inclusion FILTER, not a coincidence.

    - A direct content scan of the extracted snapshot for `/efs/`, `/root/`, `/home/`,
    `autodl`, `seetacloud`, `connect.westb`, `LianningLBY` returns ZERO files. The
    snapshot is clean of the exact class the report was about.

    - So the snapshot takes a SOURCE SET (the .tex files + figures + main.pdf), not
    a directory copy. The D233 incident (24 scratch PNGs + notes swept) is consistent
    with this: those were swept because _pdf_images/ and the notes sat INSIDE the
    selected set at submit time, not because everything is copied.

    - Therefore the standing rule "the platform snapshots docs/paper/ wholesale" —
    which I have repeated in several documents — is WRONG as stated and must be corrected,
    or it will keep generating this class of false alarm and, worse, will not tell
    anyone WHICH files actually ship. The correct statement: the snapshot carries
    the .tex set, main.pdf, the figure assets, .sty and .bib; intermediates are excluded;
    anything in the selected set at submit time still ships.


    2. REAL, AND ALREADY TRACKED — `EIBO`, the public repository name (github.com/LianningLBY/EIBO.git),
    ships in the submission inside `docs/paper/main.tex` line 2, and inside several
    supplementary-archive members. This is NOT a new find: it is the open half of
    R18-C6b ("''EIBO'' (project repository name) printed in the Figure 1 caption…
    also in a non-printing source comment. Anonymity-adjacent."), status in_progress.
    I confirmed the tracker is accurate in both directions:

    - the CAPTION half IS fixed — zero EIBO occurrences in any .tex caption or prose,
    and zero in the rendered PDF text;

    - the COMMENT half is NOT — `main.tex:2` reads "% EIBO: Certification-Grade…",
    and main.tex is one of the 10 .tex files in the snapshot.

    - It also appears in shipped archive members: src/eibo/statcore.py:1, src/eibo/__init__.py:1,
    tests/test_statcore.py:1, figures/paper/_generators/render_fig1.py:2, and as internal
    artifact-name tokens in x9_dose_response_channels.json ("EIBO-X9-RKT-v1"/"EIBO-X9-RID-v1").
    The DIRECTORY name `src/eibo/` is itself a carrier at the path level.

