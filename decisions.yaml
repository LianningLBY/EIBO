  rationale: 'The finite-sample lower-bound probe has run to a conclusion, and the
    conclusion is (b), NOT (a) as both the probe memo and the addendum''s own verdict
    line state. Chain of evidence, all artifact-backed. (1) THE CONSTRUCTION. A held-out
    witness-event bound: pick an event A, bound TV(P,Q) >= Q(A) - P(A) using one-sided
    Clopper-Pearson limits on disjoint held-out Bernoulli counts. This is genuinely
    finite-sample and distribution-free — the asymptotic step is REMOVED, not replaced,
    because CP is exact. The probe''s core claim is therefore correct and valuable:
    an exact finite-sample lower endpoint of this form does exist. (2) THE NUMBER,
    SETTLED. The memo''s headline 0.1330 does NOT reproduce. Three independent derivations
    converge on 0.171: my replication 0.1711, the addendum''s reconstruction 0.1723,
    and the auditor''s from-scratch implementation 0.1716 (IQR 0.1656-0.1768). Agreed
    value is 0.1723 with construction spelled out: m=32, P uniform, Q=(1-0.20)P+0.20*e_0,
    true TV 0.193750, 70/30 split, singleton witness selected on train by largest
    empirical gap, evaluated on a DISJOINT held-out split, one-sided CP at alpha/2=0.025
    per law, 1000 replications. The memo''s figure is plausibly a Bonferroni-over-5-candidates
    variant (alpha/(2*5)), which TIGHTENS the CP budget and lowers the value — i.e.
    0.1330 is a weaker-confidence number, not a more efficient construction. The memo
    also reports its q-ladder rows over 8 replications elsewhere while attributing
    0.1330 to 50. 0.1330 IS NOT CITABLE. (3) COST, RECOSTED. The integration trade
    is materially worse than the auditor''s earlier review implied, and that review
    has now retracted it. The endpoint gap is 0.1723 vs Michel''s asymptotic 0.1198
    = +0.052 AT THE HEADLINE n, not +0.0132. The guarantee-class improvement (asymptotic
    -> exact finite-sample) is real, but it costs roughly 4x more endpoint than previously
    reported. (4) THE DECISIVE FINDING — (b), NOT (a). The addendum''s Task 3 measures
    concentration over the real 990 pairs: median top-4 share of L1 is 0.8605, median
    effective support 3.8556 of 32. I independently checked this with a BOUNDED corpus
    sample (40 of 360 tables, 26 services with >=2000 flows, using the existing packer
    via scripts/xs_compression_early_readout.py): median top-4 share 0.8218, median
    effective support 4.19/32. Direction confirmed — if the deviation were uniform
    the top-4 share would be 4/32 = 0.125, and 0.82 is far above it. BUT the two tables
    mean different things by ''concentrated'' and the artifact did not cross-read
    them. Task 3''s sense is ''most mass on a few symbols relative to 32'' (true).
    Task 1''s sense is ''tight enough for a one-witness bound'' (FALSE). Task 1''s
    own ratio table at fixed true TV 0.19375: k=1 -> 0.8894, k=2 -> 0.4051, k=4 ->
    0.1689, k=8 -> 0.0522, k=16 -> -0.0059 vacuous, k=32 -> 0.0367. Real pairs sit
    at an effective support of ~3.9, i.e. at the k~4 row, and because they carry only
    86% (not 100%) of the L1 on the top 4 they are slightly MORE spread than that
    row — so the real ratio sits between 0.1689 and 0.0522. I reproduced this directly:
    constructing distributions MATCHING the measured concentration (top-4 carrying
    86%, remainder spread over the other 28 symbols) gives ratios of 0.12-0.14, capturing
