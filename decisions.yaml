- id: D252
  date: 2026-09-25 11:18 UTC
  summary: 'Accepted the Agent''s forward obligation — the EIBO comment edit is a
    full-chain event (source edit to an in-register archive member ⇒ re-render + gate
    + archive rebuild + manifest re-pin), and its reading of my "no rebuild" note
    was right. But I measured the PDF delta and it is metadata-only: stripping the
    comment leaves all 24 pages'' text identical, differing solely in the embedded
    build timestamp (72 bytes). Also CORRECTED MY OWN D249 REASONING: I had claimed
    the four EIBO-carrying archive files fall under D216/D217 "because they carry
    internal hash/digest fields" — they carry ZERO such fields; the ruling stands
    on its own cost/benefit reasoning, not that property.'
  rationale: 'The Main Agent''s forward-obligation note is CORRECT and I have recorded
    it; while checking it I also found an error in my own D249 rationale and am correcting
    that here.


    1. ITS FINDING, ACCEPTED. Removing the EIBO token from `main.tex:2` is a SOURCE
    edit to a file that is an in-register member of the archive''s `latex/` set (build_supplementary_archive.py
    collects `.tex`). I verified the embedded `supplementary/latex/main.tex` is byte-identical
    to the tree copy, so any tree `.tex` edit necessarily makes the archive stale.
    Therefore the EIBO change carries the FULL chain: source edit -> receipt void
    -> re-render -> 24-page visual gate -> archive rebuild -> manifest re-pin (new
    PDF hash AND new archive hash), or the manifest description''s "embedded main.pdf
    and references.bib byte-match the tree" claim goes false again — exactly what
    D247 repaired. Its point that batching is right but the change is a full-chain
    event, not a quick one-liner, is accepted. Its reading of my own note is also
    correct: "no rebuild needed after the edit lands" meant "not needed NOW", never
    "not needed for future source edits".


    2. HOWEVER, I TESTED A SUB-CLAIM AND IT IS FALSE, and the test changes the cost
    picture in a useful direction. The Agent wrote that the change "voids the 24/24
    receipt -> requires re-render + visual gate". True, but I measured WHAT ACTUALLY
    CHANGES IN THE PDF: I copied the paper tree to scratch, stripped the EIBO comment
    from `main.tex`, recompiled twice, and compared. Result: **all 24 pages'' rendered
    TEXT are identical**; the only difference is 72 bytes at the very end of the file,
    and `pdfinfo` shows it is solely the embedded CreationDate/ModDate (10:43:13 vs
    11:12:37). So the comment is genuinely PDF-invisible. The receipt still MUST be
    retaken (the rule is byte-bound, and the bytes do differ), but the change is provably
    a metadata-only delta, not a content change. Worth knowing because it makes the
    batch cheap to justify: nothing about the rendering, pagination, or cross-references
    can move.


    3. MY OWN ERROR, CORRECTED — and it was an over-generalisation of an inherited
    ruling. In D249 I wrote that the archive''s EIBO-carrying code files fall under
    the D216/D217 ruling "because those files carry internal hash/digest fields".
    I checked: `statcore.py`, `__init__.py`, `test_statcore.py` and `render_fig1.py`
    each carry **ZERO** such fields. The R18-A1 ruling says "23 of the 39" leaking
    files carry internal hash/digest fields — I applied that property to four specific
    files without checking whether THEY were among the 23. That is the same error
    class I had just refuted in the Agent''s `.fls` argument (reasoning from a repeated
    generalisation instead of measuring the object), committed one turn later.

    CONSEQUENCE, stated carefully: this does NOT change the disposition. My D249 ACTION
    was right for `main.tex` (batch it with the next source edit; do not edit evidence
    to hide metadata). But for these four ARCHIVE members the honest reason is narrower
    than the one I gave: they are not hash-cited (verified — the hash-cited set is
    17 members, ALL under `supplementary/data/`, with zero under `code/`, `generators/`
    or `latex/`), and their EIBO strings are ordinary comments and identifier tokens
    rather than provenance records, so an edit would break no printed hash. The D216/D217
    "ship byte-identical + disclose in the README" ruling is a deliberate cost/benefit
    choice about not curating evidence to hide metadata — it stands on its own reasoning,
    not because these particular files are hash-bearing. I am restating the reason
    rather than changing the ruling.


    4. ALSO CONFIRMED: `render_fig1.py:16` carries a hardcoded absolute path (`OUT
    = "/efs/workspace/projects/.../figures/paper"`), the same class as the x3 runners
    kept out of the archive. That is already covered by the R18-A1 disclosure ruling
    and the README''s provenance caveat; no new action, and it reinforces that these
    archive tokens are documented rather than removed.


    NET: keep the EIBO edit batched as planned, now with the measured fact that it
    is a metadata-only PDF delta; correct the D249 rationale for the four archive
    members; no change to the disclosure ruling.'
