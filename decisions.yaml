  rationale: 'The A_k derivation — the blocking dependency since D005 — landed and
    the arithmetic was independently re-derived here on 14 spot-checked cells across
    M in {2,4,10}, n in {1e3..1e7}, tv in {0.1..0.4}: all match. The M_max inversion
    reproduces too.


    Two things in it change the project''s position rather than merely confirming
    it.


    **M_max is a structural ceiling, and should be presented as a result.** Solving
    for the largest M permitting any certificate at given (k, n, tv): `(2M)^k < n*B^2`
    with `B = 0.5 - tv_hat - sqrt(2*log(2/alpha)/n)`, i.e. `M < 0.5*(n*B^2)^(1/k)`.
    At the corpus-wide average per service (n = 3.9e6) and mid-range tv, M_max is
    about 4-5 at k=5 and about 2 at k=8 — **regardless of how the alphabet is derived**.
    So the coarse channel is not a discretionary modelling preference that a reviewer
    can ask us to relax: beyond M ≈ 2-4 no certificate exists at these k and n. This
    converts an apparent weakness into a finding about the limits of certification
    at this observation length, and answers "why not a finer alphabet?" with a number
    instead of a preference. The paper should state the M_max frontier as a result.


    **M=1 must appear in the ladder.** The derivation tabulated M in {2,3,4,5,10}
    but omitted direction-only (M=1, base 2). Computed here: at n=3.9e6, k_cert =
    17 at tv=0.30 and 19 at tv=0.10. Two reasons it is load-bearing. First, it is
    the rung whose certificate survives furthest — the strongest configuration — and
    under the old two-sided window it was the one marked FAIL, which is precisely
    the inversion D009 corrected; since the ladder is pre-registered and every rung
    must be reported, omitting M=1 would let the gate silently reject the best configuration.
    Second, M=1 is where the richness problem is most acute: direction-only merges
    all sizes, driving channel TV toward zero for most pairs, so eps_hi < 0.5 holds
    nearly everywhere and the certified floor pins at ~0.49. The trivial-pass failure
    mode is concentrated at exactly the rung that scores best on k_cert. Together
    these are the argument for `k_cert >= 5` plus richness conditions rather than
    a window alone.


    Also decided: stop the redundant XS h5 re-download. A complete copy with fingerprint
    3,544,625,537 bytes / SHA-256 6b323c4c53b7c9d0ec9011f895b3c5ba6b35247576e41ef19fe84ab8632810ab
