- id: D070
  date: 2026-09-14 08:12 UTC
  summary: 'CONFIRMED the root cause: register_artifact itself writes to artifacts/<EXPID>/,
    so my D061 "consolidate to one canonical directory" cannot hold and its manifest
    comment contradicts the tool. RESOLUTION: stop asserting a single canonical directory
    — make the MANIFEST authoritative for location, with the enforced invariant being
    exactly one live entry per artifact whose path resolves to bytes. Do not re-merge
    X3/. Let both layouts coexist.'
  rationale: 'The Agent found the ROOT CAUSE of the D061 layer fork, and it is confirmed
    on disk: `register_artifact(server=..., remote_path=...)` ITSELF writes to `artifacts/<EXPID>/data/`
    and `artifacts/<EXPID>/intermediate/`. I verified `artifacts/X3/` is back with
    exactly four files (x3_positionwise_iid_null.json, x3_positionwise_null.py, x3_parametric_growth.json,
    x3_parametric_growth.py) and that the manifest now carries four entries pointing
    into `artifacts/X3/`, while 31 entries still point into `artifacts/_project/data/`.
    So the two layouts are produced by two different call forms of the same tool,
    not by a stray worker.


    CONSEQUENCE I HAD WRONG: D061 treated `artifacts/<EXPID>/` as an accidental fork
    to be consolidated, and wrote a manifest-top convention asserting `_project/`
    is canonical and top-level `<EXPID>/` is "not a convention". BOTH HALVES OF THAT
    ARE NOW WRONG -- the tool creates that layout, so (a) the merge is undone by the
    next server-side registration, and (b) the comment contradicts deployed behaviour.
    A one-shot consolidation cannot hold against a tool that re-forks on every use.


    THE RESOLUTION I AM TAKING, and it is mine to take (process + resource decision,
    not a scientific claim): STOP ASSERTING A SINGLE CANONICAL DIRECTORY. The property
    that actually matters is not "all bytes live under one path" -- it is "every artifact
    has EXACTLY ONE LIVE MANIFEST ENTRY, and that entry''s path RESOLVES TO THE BYTES".
    I conflated those two in D061; only the second is a correctness property. The
    directory layout is the tool''s business and carries no meaning; the manifest
    is the authority for location.


    WHY THIS IS THE RIGHT CALL RATHER THAN ACCEPTING EITHER PROPOSAL: option (a) in
    the agent''s framing -- declare `<EXPID>/` the convention -- leaves two live locations
    with no rule to tell a reader which wins. Option (b) -- a post-registration consolidation
    step into `_project/` -- is a discipline that must be exercised on EVERY registration,
    and this project has already demonstrated (four whole-block registry overwrites
    today, three unregistered artifacts, multiple stale surfaces) that per-incident
    discipline is exactly what fails. Making the MANIFEST authoritative needs no ongoing
    step: register, then assert the invariants.


    SPECIFICATION, so the fix is checkable rather than aspirational: (1) rewrite the
    manifest-top comment to state that the manifest, not any directory, is the authority
    for artifact location, and that `_project/` and `<EXPID>/` are both tool-produced
    layouts with no canonical claim; (2) enforce the real invariant -- for every artifact
    id in the manifest, exactly ONE entry is live (no superseded twin still citable)
    and its `path` resolves to existing bytes; a broken resolver is a defect, a second
    live entry is a defect; (3) do NOT re-merge `artifacts/X3/` into `_project/` --
    that work is undone on the next registration and is not what correctness requires;
    (4) keep the retirement pattern already working (the `b9b161` -> `4d9b49` supersession
    was correct and is the model).


    ALSO RECORDED, from the same report: the Agent minted its own "D063" for the generator
    comparison, colliding with my D063 (the frozen variant-B curve). It disclosed
    the collision in the registry and mapped its `D063_*` keys to my D066/D067. Substantive
    content unaffected. The agent-side registry numbering and the Director decision
    log are separate namespaces, and a collision is a labelling issue to disclose,
    not a content error.


    AND: the Agent disclosed a genuine unmet surface -- x3_parametric_growth.json''s
    own conclusion text still says the limitation must narrow to "the plug-in estimator
    cannot adjudicate", which D057 withdrew. It registered that artifact with a name
    marked "(CONCLUSION WITHDRAWN -- must not be cited)". Annotating rather than deleting
    is correct: the run is legitimate evidence that the route was ATTEMPTED.


    PROCESS POINT WORTH KEEPING: the Agent found this by grepping the decision ID
    per the propagation rule, which is the second time that rule has paid off today.
    And it correctly declined to decide a policy question that affects the layer the
    Paper Agent reads -- escalating with the two options and their costs instead of
    picking.'
