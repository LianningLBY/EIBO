- id: D056
  date: 2026-09-14 06:31 UTC
  summary: CONFIRMED off-by-4 k-indexing defect in the occupancy dose-response control
    (dose(k) == orig(k-4) exactly, 22/22 at 1e-9), while the original control and
    variant B are correctly labelled. Its 'tracks thinning' verdict is withdrawn and
    the dose-response half of D055 is superseded; the heterogeneous-arm DEAD verdict
    and all of part (i) stand.
  rationale: 'FOUND A CONFIRMED INDEXING DEFECT IN THE OCCUPANCY DOSE-RESPONSE CONTROL,
    and it invalidates that control''s headline result -- which is half the basis
    of D055. This supersedes the dose-response portion of D055.


    THE EVIDENCE, verified by me arithmetically: the dose-response control''s plain_iid
    arm at retained_fraction = 1.0 (i.e. NO thinning -- the same nominal construction
    as the original known-truth control: 200,000 synthetic 30-bit flows at p=0.30
    / q=0.70) yields a D_k curve that is EXACTLY the original control''s curve shifted
    by +4 in k. Test: dose(k) == orig(k-4) matches at 22 of 22 comparable points to
    within 1e-9. Examples: dose(9)=1.694909 == orig(5)=1.694909; dose(14)=3.443794
    == orig(10)=3.443794; dose(19)=4.902188 == orig(15); dose(30)=6.357235 == orig(26).
    Exact to 1e-9 at every point.


    THE BUG IS IN THE DOSE-RESPONSE LABELLING, NOT IN THE SHARED ESTIMATOR. The original
    control''s curve matches analytic truth AT ITS LABELLED k: est/true = 1.0002 at
    k=5 (D_k 1.6949 vs truth k*0.3389191441548814 = 1.6946), 1.0007 at k=6, 1.0161
    at k=10. Variant B''s plain curve likewise matches truth at its labelled k (k=5:
    1.6949 vs 1.6946). So both of those artifacts have a correct k axis. Only the
    dose-response is offset: its label k carries the divergence accumulated over k-4
    positions -- at label k=5 it holds 0.3415, which is ONE position''s worth (the
    per-position constant 0.33892), and at label k=9 it holds 1.6949, which is five
    positions'' worth. The shared functions it names (x3_controls.py:fit_growth, d_chain_fast)
    are therefore NOT implicated, since the original control uses the same functions
    and is not offset. The defect is in how the dose-response script builds/labels
    its own k axis -- most plausibly its accumulation loop starts at position 5 while
    its label counts from 1, or vice versa.


    WHY THIS MATTERS, and why the "tracks thinning" verdict is not trustworthy: the
    fitted exponent p depends on the (k, D_k) PAIRING. A constant shift of the k axis
    flattens a sublinear curve, which is exactly what is observed -- the dose-response
    baseline at retained=1.0 reports p = 1.001 (i.e. LINEAR), while the SAME nominal
    construction reports p = 0.651 in the original control and 0.539 in variant B.
    So the anomalous baseline is the signature of the mislabelled axis, not a property
    of the data. Consequently the dose-response''s headline "joint_tracks_thinning
    = true" (p nonincreasing and sparse-fraction nondecreasing as retained_fraction
    falls) is computed on a defective axis and CANNOT be used. The apparent monotone
    decay of p from 1.001 to 0.891 is a decay measured against shifted k.


    WHAT STANDS AND WHAT FALLS. FALLS: the dose-response''s claim that the deflation
    tracks thinning in both arms, and therefore D055''s assertion that the dose-response
    and variant B "point in opposite directions". That opposition may be an artifact
    of this bug. STANDS: (a) D055''s other half -- the heterogeneous-i.i.d. arm''s
    verdict DEAD (45/45 Markov at k>=8, 98.2% overall) -- because that arm is a VOTE-based
    comparison using fit_nested_models with no D_k accumulation, so the k-shift class
    does not apply to it; (b) the original known-truth control''s FAIL_NOT_LINEAR
    and the D044 downgrade to INCONCLUSIVE, since its axis is verified correct at
    every point; (c) variant B''s gate failure, same reason; (d) the ~58x magnitude
    gap between the heterogeneous arm''s dBIC and the real data''s, which is a separate
    measurement. So part (i) of C3 is untouched, and the "vote is not evidence" finding
    is untouched; only the mechanism-side claim about dose-response is withdrawn.


    CORRECTIVE ACTION: the dose-response script''s k indexing must be found and fixed,
    the control re-run, and the corrected curve verified against the analytic truth
    AT ITS OWN LABELS before any verdict from it is used again. A free decisive acceptance
    test follows from this episode and must be applied: a control whose entire point
    is a ZERO-intervention baseline (retained_fraction = 1.0) MUST reproduce the un-thinned
    reference exactly -- bit-identical if the code path is shared, and matching analytic
    truth at its labelled k in any case. That test would have caught this immediately.


    PROCESS NOTE: the Agent flagged the anomalous baseline (1.001 vs 0.651 for the
    same nominal construction) and asked me to adjudicate. I registered it as a "tension
    to resolve" rather than as a blocking validity failure of the artifact that produced
    it. That was the wrong disposition, and D055 was written before the discrepancy
    was resolved. Rule adopted: when two artifacts report the same nominal quantity
    at the same nominal setting and disagree, that is a BLOCKER on both artifacts''
    validity, not a tension to note in passing.'
