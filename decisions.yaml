- id: D025
  date: 2026-09-13 17:23 UTC
  summary: Pre-register 2,000 flows/service as the single eligibility rule for both
    Q1 and Q2 (needs no code change; the 53-service variant is superseded), with a
    mandatory structural-infeasibility caveat separating coverage from non-triviality.
  rationale: 'Two artifacts on the same h5 file used different service-eligibility
    rules: the k-prefix compression readout used 45 services / 990 pairs at a 2,000-flow
    threshold, while the Q2 PHIST run used 53 services / 1,378 pairs with a minimum
    of 617 flows. Q2''s PASS condition is "a non-empty two-sided certified bracket",
    so the eligible-pair count directly determines the verdict — two selection rules
    on one file make the artifacts mutually non-citable, which is exactly the cross-question
    comparison the framing wants.


    Decision: pre-register 2,000 flows per service as the single rule for both questions.
    This needs no code change — both local readout scripts already default to SERVICE_THRESHOLD
    = 2000 — and it means the two chains can cite each other. The 53-service variant
    is marked SUPERSEDED.


    Attached caveat, because the two things must not be conflated: at m=32 and n=617
    the concentration radius alone is ~0.347, so such a pair can only certify if its
    tv_hat is below ~0.153. Those pairs are STRUCTURALLY infeasible rather than empirically
    non-trivial, and including them inflates the "fraction with eps_hi < 0.5" figure.
    That fraction is therefore a COVERAGE statistic, and any report must state separately
    how many pairs are structurally infeasible.


    Also verified in the same pass, rather than accepting the relayed claims: memory.md
    contains both PRE-REGISTRATION sections, the denominator note, and the absolute-gate
    heading, plus its own entry recording that a full-file rewrite dropped those sections
    twice — so the agent''s recovery was correct and its new self-check is in place.
    experiment_plan.yaml''s E2 carries the third-channel declaration. And the claim
    that a wrong field description required a worker to fix is wrong in scope: the
    wrong text exists only in an older artifact, while the current local source (xs_compression_early_readout.py:499)
    already reads "M=16 direction x fixed size-bin prefix at denominator k" consistently
    with its known_limitations at line 714. So the remediation is a re-run with the
    current script, not a patch, and no worker or Director edit is required.


    Separately recorded for the record: the apparent "compression ratio ≈ 0.92 at
    high rungs" is TV SATURATION, not a physical retention figure. At M=16, k=30 the
    alphabet is 32^30 against a largest service of ~1.9M flows, so nearly every flow
    occupies a unique symbol and the empirical TV pins at its ceiling near 1.0 where
    no perturbation can register. Any TV comparison must therefore report the fraction
    of pairs with tv >= 0.99 first, and a rung above that mark is marked SATURATED
    and not interpreted.'
