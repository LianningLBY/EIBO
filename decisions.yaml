  rationale: 'The PI directed a venue switch ("转一下吧") and I began converting the paper
    to PoPETs 2027. Recording the state, the fact-check corrections, and the open
    question.


    WHAT THE PI SAID AND HOW I INTERPRETED IT. The message was "转一下吧，然后是不是要继续评审？"
    — no target named, but the immediately preceding exchange had offered exactly
    two options (PETS, or IMC as the alternate). I took the contextually strongest
    reading: PoPETs. Flagged the ambiguity back to the PI because a wrong reading
    wastes a conversion; also reported that the template work is largely portable
    between the two (both ACM format).


    CONVERSION RESULT — VERIFIED BY ME, NOT RELAYED. The Paper Agent swapped the template
    (acmart + popets.sty + the six PoPETs metadata macros, bibliography style plainnat
    -> ACM-Reference-Format, abstract reordered before \maketitle as acmart requires,
    AI Use Statement added) and compiled. I independently confirmed: **body''s last
    page = p.12 of 24**, found by per-page whitespace-normalised search for the conclusion''s
    final sentence (a naive whole-document grep MISSES it because the sentence wraps
    across a line). Body p.1-12, then Ethical Considerations p.13, Open Science p.14,
    AI Use p.15, References p.20 — all outside the body, which is what PoPETs'' rules
    require. 0 undefined refs / 0 multiply-defined / 0 missing citations / 0 `??`.
    Template compliance checked: required macros present, no `\subtitle{}`, no `\usepackage{times}`,
    no CCS tags, no usenix.sty reference.

    **NO CONTENT WAS CUT** — the body fits PoPETs'' 12-page submission limit naturally.
    It sits exactly AT the limit, so any future body addition overflows, same as under
    USENIX''s 13.


