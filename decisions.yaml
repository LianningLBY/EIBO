- id: D003
  date: 2026-09-13 11:46 UTC
  summary: 'Withdraw D002 and restore the full 12-month scope — the capacity blocker
    was an artifact of reading the container OS disk. Separately: PPI caps k at 30,
    which retires the large-k framing; Step 0 must run on Parquet (the h5 lacks both
    environment axes); and PHIST is a candidate second certified object at the whole-flow
    level, not a k-prefix substitute.'
  rationale: 'D002 rested on a false premise and is withdrawn. The bound server has
    a ~550 GB data disk with ~517 GB free, plus a ~20 TiB shared store — the full
    12-month QUICEXT-25 record (28.2 GB compressed) fits with room to spare. The 30
    GB figure I acted on is the container OS disk. Reinstating the full pre-registered
    split (train 2024-06..2025-01, test 2025-02..2025-05, flow-disjoint and time-disjoint)
    costs nothing that D002 was trying to save, so the reduction had no remaining
    justification.


    Concurrently, three dataset facts emerged that reshape the MVP more than the capacity
    question did:


    1. **PPI is capped at 30 packets** in both the h5 and the Parquet months (ipfixprobe
    PSTATS default). k > 30 is unrepresentable in this dataset. This is a framing-level
    constraint, not bookkeeping: the bracket curve terminates at k = 30, so the project
    can never exhibit two-sided brackets at "k in the hundreds". Any framing leaning
    on a large-k regime — including the sentence "at larger k only the assumption-free
    lower bracket survives" — describes a region this data cannot reach and must be
    dropped or retired. The pre-registration is restated honestly and, because it
    is now data-determined rather than discretionary, more defensibly: k in [5,15],
    taken from the feasible [1,30], where 5 is the minimum k at which two-sided brackets
    exist and 15 leaves margin before the cap.


    2. **The two Q2 environment axes are not computable from the XS h5.** `QUIC_CLIENT_VERSION`,
    `DST_COUNTRY`, `DST_ASN` and `QUIC_SNI` exist only in the per-month Parquet files.
    So Step 0 cannot run on the h5 at all — not the full crossing and not the two-axis
    fallback — and only the `month` axis is available there. The "cheap Step 0 on
    the h5" plan is void, and Step 0 is therefore coupled to the download decision
    rather than independent of it. Step 0 now runs on the Parquet months. Separately,
    the h5 does carry an explicit `APP` column, so if the Parquet months carry one
    too, the service label needs no SNI derivation and no QUIC22 minimum-flow convention.


    3. **PHIST offers a genuinely low-cardinality alphabet** (whole-flow, 8 size bins
    x 8 IPT bins x 2 directions), which is where the finite-alphabet discrete plug-in
    upper bound is actually valid — the certified certificate and the alphabet control
    stop fighting. Adopted as a candidate second certified object, subject to verification
    of a distinction that must not be elided: PHIST is a whole-flow summary statistic,
    NOT a k-prefix law, so a PHIST bracket certifies a different observable than the
    chain-rule/multi-letter theory addresses. By data processing, TV(PHIST_1, PHIST_2)
    <= TV(flow_1, flow_2), so a certified PHIST floor does lower-bound whole-flow
    distinguishability — but it does not transfer to the k-prefix object, because
    PHIST is not a function of the k-prefix. The honest structure is two certified
    objects coexisting: (a) a two-sided certified bracket on the low-cardinality PHIST
    alphabet, stated at the whole-flow level; (b) a k-prefix bracket for k <= 30,
    where the upper side is certifiable only at small k and the divisibility route
    supplies a genuine lower bound. Requires verification before the paper leans on
    it.'
