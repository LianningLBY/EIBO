- id: D170
  date: 2026-09-19 20:40 UTC
  summary: 'Track 5b: direct measurement refutes both the 8x denominator claim and
    the centring hypothesis — Arms B and C recover the true tv_hat SD (ratios 1.0007,
    1.0000), and their coverage is statistically indistinguishable from nominal'
  rationale: 'Track 5b measured the between-block vs within-block variance structure
    directly instead of arguing from algebra, and it refutes BOTH candidate explanations
    for why Arms B and C produced radii below the i.i.d. reference while still under-covering.


    MEASURED (n=60000, B=64, K=938, conc 0.1, true TV 0.4; 200 outer replicates, 32
    within-block redraws):

    - Empirical SD of tv_hat = 0.0169715358. Arm B implied SD = 0.0169826453 (ratio
    1.0007); Arm C implied SD = 0.016971999 (ratio 1.0000). Observed factor 0.9997
    vs the predicted 8x.

    - The 8x wrong-denominator hypothesis is EMPIRICALLY REFUTED. The analytical argument
    I originally offered for it is ALSO RETRACTED and must not be reinstated: I claimed
    the /N divisor cancels inside the squared deviation, which is false — var(alpha*c)
    = alpha^2*var(c), so a constant factors out rather than cancelling ([1,2,3] ->
    3, [2,4,6] -> 12, [10,20,30] -> 300). The 8x figure is refuted instead by being
    incompatible with the observed 0.943x ratio. Whether the /N normalisation is wrong
    at all depends on the scale cluster_a is meant to be on, which is unestablished.

    - The centring hypothesis is ALSO refuted: B and C recover the true SD to three
    decimals, so they do not omit a between-block component. Mean between-block variance
    0.0264282997 vs mean within-block 7.74215125e-05 shows the block spread is enormous,
    but B and C already capture the part that matters.

    - The i.i.d. reference is a CONFIDENCE RADIUS, not an SD: 0.0351798518 vs the
    empirical SD 0.0169715358, factor 0.4824. Its implied SE (radius/z = 0.017949)
    is actually 1.058x LARGER than the true SD.


    REINTERPRETATION OF TRACK 5: B and C are not broken — they are approximately CORRECT,
    and their coverage is statistically indistinguishable from nominal (978/1000 vs
    0.975, binomial p=0.61). Only Arm A''s over-coverage is a real deviation (994/1000,
    p<0.0001). So Track 5''s headline should not be "one arm works, two fail" but
    "the two arms that recovered the true SD land at nominal coverage, while the bootstrap
    overshoots". This strengthens rather than weakens the result.


    Arm D was correctly NOT run: the diagnosis gate held, and the runner confirmed
    no armD artifact exists.


    Unit caution for re-use: mean_between/mean_within are on the c_k (/B) scale and
    are NOT comparable to total_var/empirical_sd, which are on the tv_hat scale. My
    initial reading that between-block variance was 9175% of total was a unit error
    on my part, not a finding.'
