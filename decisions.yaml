  rationale: 'Two worker reports arrived contradicting each other on data-fetch capability,
    and the pessimistic one had already been written into the plan. I verified independently
    and the optimistic report is correct.


    The pessimistic report (`move_and_fetch_report`) concluded that foreground curl
    is the only permitted method, measured at 82,894 B/s, implying ~94 hours for the
    remaining 11 months. I observed directly that `/root/autodl-tmp/eibo/data/CESNET-QUICEXT-25-XS.chunks`
    has reached 3.0 GB and the data disk''s used space rose from 36 G to 38 G — roughly
    2.76 GB accumulated in ~19 minutes, an aggregate of about 2.4 MB/s, some 29x the
    reported figure, on the same upstream. So the single 60-second foreground call
    was dominated by connection setup and the Zenodo 504s; the worker sampled one
    bad window and generalized it into a host capability. The 94-hour projection is
    discarded: the full record is roughly 3.2 hours at the observed aggregate rate,
    and that number must not enter any plan or ETA.


    Two further environment verdicts in that report are wrong and have propagated
    into memory. First, "Python is not installed" — the running fetcher IS `/root/miniconda3/bin/python`,
    and `/root/miniconda3/bin/python3` exists (symlinked to 3.12). The correct statement
    is that Python lives at an absolute path outside the default PATH; the bare `python3`
    failure was real but the conclusion drawn from it was not. Second, "detached launch
    is policy-blocked" is a method-level refusal presented as a capability verdict.
    The refusal text is real but its content is "starting or terminating GPU processes
    through Worker SSH is blocked — use managed GPU job tools", and the sibling worker''s
    fetcher has been running detached for ~19 minutes via the managed tool path. This
    is the same inference error class as the earlier `df -h /` capacity misread: one
    failed probe generalized into an environment limit.


    I also reversed my own prior instruction. Last round I told the team to stop the
    redundant XS re-download. New evidence changes that: the fetch is at 3.0/3.54
    GB and completes in minutes at the observed rate, and completing it yields a copy
    fetched from the official endpoint carrying our own digest — the strongest provenance,
    better than either the other project''s copy or a fresh download. More importantly
    it has demonstrated the working fetch method. So let it finish, then apply that
    method to the months rather than competing for the same network path; the two
    are not in contention because the XS fetch exits within minutes.


    The PHIST adversarial verification also landed and refuted a figure I had written
    into the roadmap. Three corrections: (a) the exporter emits **separate** size
    and IPT marginal histograms, not joint counts — 8 size buckets x 2 directions
    plus 8 IPT buckets x 2 directions = **32 coordinates**, so m = 32, and m = 128
    is wrong unless a true joint statistic is implemented and documented; (b) fixed
    bin edges fix the *dimension*, not automatically a finite *support* — a PHIST
    record is a vector of integer counts, so without a flow-length cap or normalization
    its possible values are not limited to 32 (or 128) categories, which means the
    certified object must be named explicitly (pooled packet-cell mass, a bounded
    normalized per-flow object, or the raw count-vector law) and only the first two
    have finite support; (c) there is **no DPI order in either direction between PHIST
    and k-prefix** — both are full-flow functions and neither generally factors through
    the other, so a large PHIST TV does imply large full-flow TV (a valid lower-style
    distinguishability certificate) but a small PHIST TV says nothing about k-prefix
    TV, and no reverse inequality exists, with a clean counterexample (two disjoint
    full-flow point masses mapping to the same PHIST value give TV_PHIST = 0 while
    the original object''s TV is 1). Q2''s PASS must therefore name the object it
    certifies and may never report PHIST indistinguishability as k-prefix indistinguishability.


    Constructive consequence, and it changes the strategic weighting: at m = 32 the
    single-sample radius is 0.5*sqrt(32/1e6) = 0.0028 plus 0.5*sqrt(2*ln(80)/1e6)
    = 0.0021, so ~0.005 at n = 1e6 and ~0.002 at n = 1e7 — meaning if the family-relative
    PHIST law has TV ≤ 0.1, the certificate is non-vacuous with radius ~0.083 at n
    = 1e6 and ~0.058 at n = 1e7, close to the single-letter regime. The sample-size
    rule is n > m/eps^2, giving ~3.2k per service for m=32, eps=0.1 (rough) or ~7.4k
    for a joint 95% union bound. **Q2 is therefore very likely easier than Q1.**'
