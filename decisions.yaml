    service -- maximum TPR on the curve and the test accepted rate; (2) TRAIN-SIDE
    control -- detection performance on the TRAINING data itself, since a pipeline
    that cannot detect on its own training data is broken by construction; (3) a POSITIVE
    CONTROL on a task where detection is guaranteed; (4) index-vs-label alignment
    audit, since `pred` is an index into np.unique(y_train) while `y` holds raw service
