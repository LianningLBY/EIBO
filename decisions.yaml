    p approx 1.0). ALL NINE CELLS reject_null = false.


    THE TEST IS THE PRE-REGISTERED ONE: a one-sided binomial test (scipy.stats.binomtest,
    alpha 0.05 UNSplit, alternative ''greater'') of whether per-pair detector error
    breaches the theoretical floor (1 - eps_hi)/2 more often than the null rate 0.05.
    floor_violation_test.status = computed, previously_deferred = true. The pre-registered
    falsification condition was that an EXCESS of floor violations would falsify either
