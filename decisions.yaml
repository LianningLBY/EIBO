    THE RESULT: over 45 services, the position-wise i.i.d. null (independent across
    positions, one free marginal rate PER position) beats first-order Markov at almost
    every k. At k=2 it wins 45/45; k=5 42/45; k=8..29 it wins 43-44 of 45; k=30 41/45;
    zero ties. Median dBIC (positionwise minus markov) is strongly negative throughout
    (-10.69 at k=2, -9346 at k=5, roughly -35k to -39k in the middle, -27,267 at k=30).


    THE PRE-REGISTERED RULE, written before measurement: "first-order" is licensed
    ONLY if position-wise i.i.d. is defeated by first-order Markov at k=30 and at
    every k=2..30; if position-wise wins or ties at any k, it is NOT licensed. Artifact
    records first_order_licensed: false.


    CONSEQUENCE -- AND THIS IS STRONGER THAN THE "NARROWING" I HAD PREVIOUSLY DIRECTED:
    this does not merely fail to support "first-order", it shows that PER-POSITION
    MARGINAL STRUCTURE explains the data BETTER than any transition structure. So
    what variant C detected is not evidence of first-order dependence at all; it is
    consistent with, and better explained by, position-wise marginal drift. Note this
    REVERSES the direction of my earlier reasoning: in D053 I said "any position-wise
    marginal drift would also make Markov win" (i.e. the null was too weak). MEASURED,
    the position-wise model does not merely also win -- it WINS OUTRIGHT. My D053
    statement of the mechanism was directionally right but understated the outcome.


    CRITICAL SCOPING, and it must not be overstated in the other direction: this result
    concerns C''s NESTED-MODEL VOTE ONLY. It does not bear on part (i), which rests
    on the original estimator''s DEFLATION measured on analytically-linear truth (est/true
    1.0002 -> 0.6769), an independent instrument. Nor does it touch C1/C2.


    REQUIRED WORDING CHANGE: (ii) must move from "the direction sequence is far from
    globally i.i.d." to something like "dependence is present, but a first-order structure
    is NOT supported by this test -- per-position marginal structure alone explains
    the observed votes better than any transition structure." That is cleaner for
    the paper because it separates "dependence exists" from "first-order dependence",
    and the latter was never something C''s design could establish.


    ALSO REQUIRED: register the artifact and pull it locally (the tree is stale);
