    ALSO DISPATCHED: the full paper revert (constant to 2.9604; counts to 340/336
    in both senses; the mechanism sentence reworded to "the 2 is the two-sided deviation
    factor with the per-law level alpha/2 = 0.025"; delete the one-sided t = sqrt(2
