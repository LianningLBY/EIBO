  summary: 'Refuted the claim that docs/paper/main.fls leaks a path into the submission
    — the snapshot provably excludes LaTeX intermediates (main.fls predates it and
    is absent; zero /efs/, /root/, /home/ anywhere in it), so the "wholesale directory
    snapshot" rule I had been repeating is wrong. The sweep did surface the real open
    item: EIBO (the public repo name) ships in main.tex:2 and several archive members
