- id: D019
  date: 2026-09-13 14:14 UTC
  summary: 'Adopt structural constraints over repeated notification (the team''s hard-coded-path
    fix), and correct the XS readout''s denominator: k=30 coverage is a biased long-flow
    subsample, so the compression ratio must be reported with explicit k and coverage,
    computed at two k values.'
  rationale: 'Two items: an operational decision correctly made by the executing team
    that I am adopting as a general practice, and a methodological correction I added
    to the XS early-readout before it runs.


    **Structural constraint beats repeated notification.** I had told the team to
    put absolute paths in the spec. It went further: it found that the worker was
    uploading a downloader script to the container root (`/root/eibo/tools/`), and
    that a downloader run from there would plausibly land the month archives on the
    30 GB container disk. So it cancelled and re-dispatched with both the output path
    and the script location hard-coded to the data disk, making that class of error
    structurally impossible rather than merely discouraged. That is a stronger form
    than informing, and the right one for a failure that has now recurred three times
    tonight (the h5 read, the probe artifact, and this one). Adopted as general practice:
    when a class of error repeats, prefer a structural constraint — hard-coding, fixed
    location, path validation — over repeated notice, because notice depends on correct
    execution by the recipient while structure removes the error''s expression.


    **Methodological correction to the XS readout — the denominator is k=30, which
    most flows never reach.** The dispatched task asks for the per-pair compression
    ratio as the ratio of a k=5 rung''s channel TV to the "full-prefix" TV at k=30.
    But the k=30 prefix distribution is only estimable on the subset of flows that
    actually have 30 packets. If that subset is small, the denominator is computed
    on a biased subpopulation — and long flows correlate systematically with service
    type (bulk transfers versus short requests), so the denominator is not the pair''s
    full-prefix TV but that quantity confounded with a long-flow selection effect.
    That biases the compression ratio, and the direction of the bias varies by service
    pair, which is the least acceptable kind of error here because the compression
    ratio is the single quantity Q1 turns on.


    Required additions before the reading is usable: (1) report the `PPI_LEN` distribution
    — quantiles and histogram, not just the max of 30; (2) report, at each of k=5,
    10, 15, 30, what fraction of pairs or flows have both sides covering at least
    k packets, i.e. the usable-pair fraction at each k; (3) make the denominator''s
    k explicit in every reported number — write "prefix TV at k=K, coverage p", never
    "full-prefix TV" — and if k=30''s coverage is low, use a better-covered k (e.g.
    k=10) as the denominator, report p, and compute the ratio at two values of k to
    check stability. This applies to the month chain as well, since the PPI cap of
    30 is an exporter behaviour rather than a subset property, so both chains must
    not be built on an under-covered denominator.


    Also confirmed: the team''s addition requiring each rung''s measured `comp(M)`
    to be compared against `T(n)` (≈0.0550 at n=2e5, ≈0.0511 at n=3.9e6) is exactly
    the lower-side feasibility condition and should state per rung whether comp(M)
    is above or below T(n), not merely give numbers. And on sequencing: if the XS
    gate passes, Q1''s answer may arrive before the months, which would change the
    critical-path ordering — but if the gate fails, it must be reported as failing
    rather than relaxed to preserve the shortcut.'
