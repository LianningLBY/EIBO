- id: D227
  date: 2026-09-24 21:27 UTC
  summary: Fixed the crashing --mirror-to off-switch and added a built-vs-manifest
    hash assert; three-way agreement now verified end to end
  rationale: 'Two findings from independent review, both confirmed by execution, both
    fixed. The first was a bug in code I wrote an hour earlier.


    BUG 1 — the documented off-switch crashed. The help text for --mirror-to says
    "Pass an empty value to skip", but type=Path turns "" into PosixPath(''.''), and
    Path("") == Path(".") is True, so the `registered is None` guard never fired and
    the code attempted shutil.copyfile(built, ''.'') — IsADirectoryError. I reproduced
    it exactly. It matters because the natural way to test a build without touching
    the deliverable is the one that throws. Fixed by treating an empty/dot target
    as a skip and adding an explicit is_dir() check so any directory target errors
    with a named message rather than a traceback. Tested: '''' skips, ''.'' skips,
    None skips, a directory errors cleanly, a real file still copies and verifies.


    BUG 2 — the residual gap the mirror did not close, which the reviewer correctly
    identified as one level up. Nothing compared the built archive against the manifest''s
    own recorded content_sha256. The mirror asserts built == registered, so it catches
    a stale cited copy; it cannot catch a rebuild that produces different bytes, because
    then both paths agree with each other while the recorded hash silently goes stale
    and every other assert stays green. Added assert_matches_registered_hash(), called
    after the write and before the mirror, failing with both values named and telling
    the reader to re-pin if the change is intended (re-pinning on a legitimate archive
    change is the correct behaviour — that is precisely when the record needs updating).
    Tested against a matching hash (passes), a wrong hash (fires with both values),
    and an unregistered id (no-op). Also added REGISTERED_ARTIFACT_ID and verified
    load_manifest returns an id-keyed dict so the lookup shape is right.


    VERIFIED END TO END: real build exits 0, and tree copy, routed copy, and manifest-recorded
    hash all now read 53c7c6bdaa4e64bbd22749f2b58e1ba2206960dac8a095ec47a79bad0bd3820e
    — three-way agreement, which is stronger than the two-way agreement before.


    SEQUENCE NOTE: this is the third consecutive round in which the reviewer found
    something real in code I had just written (print-not-fail binary census, then
    the path divergence, now the empty-string crash and the manifest-hash gap). The
    pattern is that my own fixes are under-verified at the edges — the main path works
    and the documented/configurable paths are untested. The remedy I should apply
    before dispatching: test the off-switch and the failure path, not just the happy
    path.'
