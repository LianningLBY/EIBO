- id: D024
  date: 2026-09-13 15:55 UTC
  summary: 'Tested Zenodo directly: root, metadata, and file endpoints all return
    504 while other hosts load, so the failure is domain-wide at the endpoint rather
    than caused by project concurrency; the mirror route is already refuted, and the
    MVP does not depend on this fetch because the h5 carries labels and axes.'
  rationale: 'I ran the discriminating test myself rather than dispatching it, and
    it changes the diagnosis again.


    **Test and result**: from my own vantage point, at this time, `zenodo.org` returns
    HTTP 504 for three different URLs — the **root domain**, the **record metadata
    API**, and the **file content endpoint**. Meanwhile `cesnet.github.io` loads normally,
    so my egress is working. The failure is therefore **domain-wide at Zenodo, not
    specific to the file path or to range requests**.


    **What this rules out.** The project''s own concurrency cannot explain a 504 on
    `zenodo.org/` itself. Three independent observation sets now converge on an endpoint-side
    failure: (a) the fetcher''s 1764 attempts from the server, all 504; (b) my single
    request from a different vantage point, also 504; (c) the failure spanning root,
    metadata, and content paths rather than only the ranged file download. A per-IP
    connection-count cap would not produce (b) or (c).


    **What it weakens — including one of my own instructions.** Reducing concurrency
    from 24-way to 2 remains cheap and worth doing, but it is now a much weaker lever:
    a single request from a separate vantage point fails identically. And "the endpoint
    is intermittently failing under our load" is no longer the best reading — the
    better reading is that **Zenodo was serving this record earlier today (~11:45
    UTC, when 2024-06.zip succeeded) and is now in a failing state affecting the whole
    domain.**


    **What is ruled out entirely.** The mirror switch is dead: I tested DataZoo directly
    and it serves only size-based h5 subsets — "File or bucket does not exists" for
    both 2024-07.zip and 2024-06.zip, the latter despite our already holding that
    file.


    **Consequence for the plan.** The remaining honest options are: retry on a schedule
    while the endpoint recovers, and consider whether a genuinely different mirror
    exists — but any such mirror requires its own direct proof that it serves the
    monthly ZIPs, since both candidate claims have now been refuted empirically. Local
    tuning cannot fix a domain-wide 504.


    **And the crucial reframing**: this does not block the MVP. Per D022, the h5 already
    on disk carries the service labels and both environment axes, so Q1''s single
    measurement, Q2''s object, and the Step 0 occupancy table can all proceed on local
    data. The month archives matter for scale and the pre-registered time-disjoint
    split — a post-MVP requirement — not for the core question of whether the bracket
    is computable and non-trivial on real wire data. So the effort currently going
    into this fetch is effort spent on the wrong critical path.


    **Provenance note for later**: when the endpoint recovers and the months do land,
    verify each against the authoritative Zenodo Content-Length, and record that they
    came from the Zenodo record rather than any mirror.'
