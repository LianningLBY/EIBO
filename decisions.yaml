    "The per-pair upper side is computed at the simultaneous budget α_pair = 0.05/990".
    I coded the Eq (6) radius form (r_i = 0.5√(m/n_i) + 0.5√(2 ln(2/α)/n_i)) and tested
    against the ledger columns: canonical_eps_hi (Eq 6) matches at α_law = 0.025 in
    199/200 rows and 0/200 at α_pair; eps_hi_mfree (Eq 9) matches at α_pair in 990/990.
    So Eq (6) runs at the per-law level 0.025 while the m-free column and the aggregation
    run at α_pair. Counts diverge: at (M=1,k=5) Eq(6)@0.025 = 340 (Table 3''s number),
    Eq(6)@α_pair = 329, m-free@α_pair = 355, m-free@0.025 = 363. §3.3 already assigns
    α_law = α/2 = 0.025 to the upper side''s union, so as it stands §3.1 and §3.3
    assert two different α for the same side. Fix is one disambiguating clause naming
    the gate/detection level (0.025, no multiplicity) versus the aggregation level
    (α_pair over 990 pairs) — no number moves, and the α_pair sentence must NOT be
    deleted because the 0.197''s ≥0.95 depends on it. Significance: this is the same
    two-generation confusion C1/C8 existed to remove, relocated rather than resolved.


    2. RoNeTC Monte-Carlo passes: paper says 64, every record says 8. Verified all
    three layers — script default `--ronetc-mc-samples default=8` (x12_detector_validation.py:1006),
    the detector artifact''s `detectors.ronetc.uncertainty.mc_samples = 8`, and results.tex:246-247
    printing "(64 passes)". No 64 exists for this field. This is C13''s missing-hyperparameter
    half in better disguise: the value was supplied and is wrong, under an appendix
    claim that the panel is reproducible.


    3. Abstract''s 2.9× clause still has a dangling object ("and it is larger still
    at the coarser rungs") following a sentence about the radius, reading as if the
    radius grows. Name the object.


