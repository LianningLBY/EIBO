- id: D184
  date: 2026-09-22 13:22 UTC
  summary: 'Two Reviewer points on the D181 revision CONFIRMED by independent re-derivation,
    both info-level and deferred: (1) measurement_design.tex:54-55''s 0.012 excess
    is computed at per-pair alpha 0.025 while the ledger operates at 0.05/990 = 5.05e-5,
    making it conservative by 495x (true excess 2.42e-5) - safe, no number moves,
    but misleading as written; (2) measurement_design.tex:45-48 pairs a Bonferroni
    simultaneous claim with an ''in expectation'' hedge and reads as self-contradictory.
    Both need one-clause alpha/scope attribution. DEFERRED deliberately: applying
    them voids the SHA-bound visual receipt and mutates the bytes the PI is mid-review
    on.'
  rationale: 'Independent verification (not acceptance) of two Reviewer points, both
    CONFIRMED, both info-level, both one-clause edits with no numeric change. POINT
    1: measurement_design.tex:54-55 states each term ''fails with probability at most
    0.025 ... at most 24.75 units of excess ... overstated by at most 0.012''. That
    arithmetic is internally correct under per-pair alpha 0.025, but the ledger does
    NOT compute at 0.025: d181_joint_coverage_reaggregation.py:218 sets alpha_pair
    = OVERALL_ALPHA/EXPECTED_PAIR_COUNT = 0.05/990 = 5.05e-5 (line 303 states it explicitly),
    and the artifact''s own parameters block records alpha_pair = 5.0505050505050505e-05.
    I reproduced S_known = 407.75 under BOTH normalisations (floor_M46 0.19698057
    x 2070 = 407.75; floor_M45 0.20593421 x 1980 = 407.75), which confirms the ledger''s
    alpha rather than 0.025. At the operative alpha the expected failing pairs = 990
    x 5.05e-5 = 0.05 units, giving an expected overstatement of 0.05/2070 = 2.415e-5
    rather than 0.012 - a factor of exactly 495. So 0.012 is CONSERVATIVE, not wrong,
    and no number moves; but the text reads as though 0.012 is the operative uncertainty
    on 0.197, and a reader may ask which alpha the paragraph describes. POINT 2: measurement_design.tex:45-46
    asserts the floor ''at the simultaneous level 0.95 (Bonferroni over the 990 pairs)''
    while line 48 says the aggregate ''is stated in expectation rather than as a joint
    high-probability claim''. Both are true (the first quantifies over the pair-level
    events; the second hedges the aggregate''s excess accounting), but adjacent they
    read as self-contradiction - the precise defect class (PI finding 1) this revision
    was built to fix. DEFERRAL: both fixes require source edits, which would void
    the SHA-bound 24/24 visual-gate receipt on the delivered bytes (5f08a9fb..., 414,613
