- id: D155
  date: 2026-09-17 18:40 UTC
  summary: 'Withdraw the coverage-breach mechanism: the breach is lower-tail widening,
    not centroid bias; the median estimate stays at truth while coverage falls and
    then saturates'
  rationale: 'MECHANISM CLAIM WITHDRAWN AND REPLACED. An earlier reading (D154) held
    that the coverage breach is driven by block dependence INFLATING the estimate
    while n shrinks the radius, so the breach appears where inflation exceeds radius.
    The ladder refutes this on its own data: at fixed B=64 the excess-bias-to-radius
    ratio FALLS by 50x as n grows (0.407 at n=20k -> 0.008 at n=107k) while coverage
    gets WORSE (1.0000 -> 0.9825). If bias-over-radius drove the breach, coverage
    would RECOVER at large n; it does not. Reproduced independently from the JSON,
    not taken on report. The reviewer proposed this mechanism and withdrew it itself;
    I had already broadcast it to the user and retracted it there too. GEOMETRIC CONFIRMATION
    of the replacement: the generator''s true TV is exactly 0.400 (recomputed 0.5*sum|P-Q|
    = 0.39999999999999997) and each cell''s failure condition is tv_hat < tv - radius
    = 0.339-0.374, i.e. 6-15% BELOW the truth, while every median tv_hat sits at or
    ABOVE 0.400 (median is 6.6-20.2% above threshold). So the centre never approaches
    failure and the crossing mass is in the LOWER TAIL. REPLACEMENT SENTENCE (adopted):
    under block dependence, coverage falls as n grows at fixed B=64 while the median
    estimate stays at the truth, so the breach is driven by widening of the estimate''s
    lower tail rather than a shift in its centre. This is the better result because
    it identifies the failure DIRECTION as tail over-reach, which is exactly what
    the Sec 3.3 i.i.d.-conditional clause asserts. ADDITIONAL LICENSED RESULT: coverage
    is 0.9825 (393/400) at n = 60k, 80k AND 107k across radii 0.0352/0.0305/0.0263,
    so past n=60k further radius shrinkage buys no coverage - the signature of a FIXED
    TAIL MASS rather than a crossing phenomenon. Honest phrasing is ''threshold reached
    and stable'', not ''sharp transition''. Continued, the threshold n=60000 itself
    stands (that is data, not interpretation). FOURTH SAME-CLASS DEFECT IN ONE THREAD:
    (1) the floor/blend 0.68, (2) cap-vs-widening on the Bonferroni recomputation,
    (3) ''exceeds 1.0'' instead of ''reaches 1.0'' for the truncation claim, (4) point
    estimate instead of CP lower endpoint for the ladder threshold. All four are ''the
    check verified the neighbouring statistic, so the clean result was an artifact''.
    Added to the standing constraint set so it is checked by default. Artifact corrected
    with the refuting table and the sentence ''If bias drove the breach, coverage
    would recover at large n. It does not.'' so the withdrawn reading cannot be revived.'
