  rationale: "The Reviewer falsified my D253 conclusion and was right on every point.
    I verified all four cells myself before acting rather than accepting or dismissing
    it.\n\nWHAT I GOT WRONG IN D253 — direction-reversed, not merely imprecise. D253
    claimed \"a fresh checkout would have shown a kuhlewind ghost flag\". The opposite
    is true. The ghost flag requires the RFC DOI to be present in the .bib, and it
    was NOT at HEAD, so a fresh checkout simply reads kuhlewind2022rfc as UNVERIFIABLE
    (not checked) rather than as a false MISMATCH. Measured table (parsed=69 in every
    cell):\n  old script f4badc6 x HEAD bib      -> MISMATCH=1, unverifiable=4\n  old
    script f4badc6 x worktree bib  -> MISMATCH=2, unverifiable=2\n  new script 3aef387
    x HEAD bib      -> MISMATCH=1, unverifiable=4\n  new script 3aef387 x worktree
    bib  -> MISMATCH=1, unverifiable=2\nRow 1 IS the fresh checkout (both from HEAD),
    and it reads 1. So D253's durability test paired the NEW script with the WORKTREE
    bib — HEAD's script against worktree data — which is not what a checkout produces.
    The commit message I wrote asserts the same reversed claim and is preserved in
    history; the correction lives here.\n\nBLAST RADIUS OF THE VERIFIER FIX, correctly
    stated: it is a genuine improvement but it is confined to the worktree. Against
    HEAD's own .bib the old and new scripts agree exactly (both MISMATCH=1), because
    the fix's target entry does not exist at HEAD. The fix's normalisation blast radius
    is 1 of 69 entries.\n\nTHE ACTUAL DEFECT, which the Reviewer identified and I
    had not: D250's two added DOIs were never committed. `git log -S` for both returns
    empty, with a positive control confirming the grep works (a known-committed DOI
    returns f4badc6). Consequences, both confirmed: (a) a fresh checkout could not
    reproduce the verified bibliography state (unverifiable=4 vs 2); (b) more seriously,
    `10.1109/CSF57540` is VISIBLE in the delivered PDF (1 occurrence in the reference
