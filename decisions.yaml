  date: 2026-09-24 18:41 UTC
  summary: Archive shipped a pack-worker build report at its root leaking 13 absolute
    paths + the project slug; exclusion and a path/slug scan dispatched
  rationale: 'The archive''s pack worker left its own build report inside the artifact:
    ./data_validation.json, 4,975 B, sitting at the archive root outside supplementary/.
    I extracted and identified it — it is a record of files the worker added, each
    with an id, a source path, and a sha256. It has no manifest entry because nothing
    registered it.


    It must not ship, and the reason is stronger than "unmanifested". It carries 13
    absolute paths of the form /efs/workspace/projects/epsilon-indistinguishability-.../artifacts/...
    and repeats the project slug, which contains the project''s own name. The USENIX
    CFP is explicit that authors are "solely responsible for ensuring no identifying
    information is exposed (e.g., usernames, organization names, commit history)".
    A build report at a submission archive''s root naming internal filesystem paths
    is exactly that class — and is a strictly worse instance of the same defect as
    the "EIBO" caption leak already being fixed in the paper. So the paper gets de-anonymised
    on page 17 by a caption, and the archive gets de-anonymised at its root by a build
    byproduct; both are the same failure to treat internal identifiers as leaking.


    Distinguish this from the transport-side rule: the paths here are project-internal
    working paths, not Apex control-plane locators. The concern is double-blind anonymity
    and internal-path disclosure, not runtime confidentiality.


    Dispatched: exclude the file from the archive (keep the build record outside the
    artifact), assert that every archive entry starts with ./supplementary/, and extend
    the forbidden-content scan from retired-artifact patterns to absolute paths (/efs/,
    /home/) and the project slug. That last check is what would have caught this automatically.


    Also found while reading the restored README: it narrates its own build history
    ("after README restoration", "before restoring this README, the archive contained
    88 files, including the top-level data_validation.json", plus a Generated: timestamp).
    Same defect class as "relocated here from the Introduction" and "D181" — an artifact
    narrating its editing history — and it keeps a textual trace of the removed stray
    file even after the file is gone. Dispatched a rewrite to one neutral statement
    of fact. Noted a count error to avoid: the README claims 89 files, but 1 + 54
    + 6 + 4 + 23 = 88, and the tar''s 89 entries include the stray root file; after
    removal the correct figure is 88, so the number must be re-derived rather than
