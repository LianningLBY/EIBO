- id: D123
  date: 2026-09-16 00:57 UTC
  summary: 'D123: RETRACT D118/D120/D122 — my constant "fix" would have weakened a
    published guarantee while keeping the stronger label; reverted, headline stays
    340/336'
  rationale: 'RETRACTION OF MY OWN W4 ANALYSIS. D118, D120 and D122 are withdrawn.
    The independent Reviewer falsified my reasoning, I verified the falsification
    myself, and I have reverted the change before it propagated.


    WHAT I GOT WRONG. I concluded that the radius constant sqrt(2 ln(2/alpha_law))
    = 2.9604 certifies 0.975 rather than the stated 0.95, and that switching to sqrt(2
    ln(1/alpha_law)) = 2.7162 would make 0.95 exact - which would have raised the
    headline to 342 upper / 338 joint. The decisive identity, which I verified: ln(1/0.025)
    = ln(2/0.05) = 3.688879, identical. So the "corrected" constant IS the original
    formula evaluated at the UNSplit per-law level 0.05. Adopting it would have removed
    the union correction while the paper continued to claim 0.95 - attaching a 0.95
    label to a 0.90 guarantee. My error was in which part of the formula carries the
    union: I read the "2" in ln(2/alpha) as the tail-shape factor and concluded the
    current constant over-delivers; the repository''s own convention, and the guard
    written to enforce it, treat the per-law level as alpha/2 = 0.025 with the factor
    of 2 as the two-sided deviation factor.


    THE GUARD IS DECISIVE AND I SHOULD HAVE CHECKED IT FIRST. tests/test_q1_thresholds.py::test_under_split_guard
    asserts the upper radius must use per-law alpha/2 and asserts the unsplit form
    is "rejected, not silently accepted". My instruction would have had the team use
    exactly the value that guard exists to catch - and I had earlier read this test
    file in the session without connecting it to my own derivation.


    THE ASYMMETRY ARGUMENT DECIDES IT EVEN IF DIRECTIONALITY WERE ARGUABLE. Under
    the status quo the stated 0.95 is exact or conservative; under my change it is
    exact or optimistic. A possible 0.975 published as 0.95 costs nothing. A possible
    0.90 published as 0.95 is a false guarantee. So the number does not move: 340
    upper / 336 joint, unchanged.


    ACTIONS: instructed a full revert (constant back to 2.9604 in Eq. 4, the lemma
    and the code path; delete my rewritten mechanism sentence, which is what licensed
    the wrong constant; restore every count to 340/336). Flagged art_20260916_afbae4
    and scripts/x12_k5_containment_corrected_342.py as NOT CITABLE for the headline
    while preserving them for the reproduction gate they contain, which is genuinely
    valuable. Confirmed the guard must pass again after the revert. Asked the Reviewer
    for the correct wording of the mechanism sentence (the original "the 2 is a union
    bound" is also wrong; the right statement is that the 2 is the two-sided deviation
    factor with per-law level alpha/2) and whether to strengthen the guard with an
    assertion tying the constant to its stated joint level, since that would have
    caught my error mechanically.


    ALSO STANDS: the reproduction gate result remains valid evidence about the machinery
    - the re-aggregation reproduced all nine cells exactly - so the detector table''s
    construction is sound; only the parameter was at issue. The unaffected Round 3
    items (appendix move, A.2b rewrite, section 6.3 addition, RT-W6, RT-W7, RT-W9,
    RT-W11, the missing manifest hash on the per-pair CSV) proceed.


    THIS IS MY SECOND ERROR OF CONFIDENCE TODAY with the wrong object - the earlier
    ones concerned my own tooling, this one my own algebra. Logging it as a mistake.
    The lesson is specific and repeatable: when a derivation contradicts an existing
    guard test, the guard is evidence and must be consulted before the derivation
    is propagated.'
