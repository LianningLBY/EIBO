- id: D147
  date: 2026-09-17 12:07 UTC
  summary: 'Refute D146: the lower-side selection gap is already closed by Michel
    et al. and already implemented in our own code; no new mechanism available there'
  rationale: 'D146 hypothesised that the lower side''s ''nominal'' confidence wording
    concealed an unaddressed post-selection (data-dependent classifier) gap, and dispatched
    a feasibility check on closing it as a new mechanism. That hypothesis is REFUTED
    by a direct literature+code check this turn. (1) LITERATURE: the exact construction
    is Michel, Naef & Meinshausen, ''High Probability Lower Bounds for the Total Variation
    Distance'' (arXiv:2005.06006) - it is precisely about classifier-based TV lower
    bounds under data-dependent selection. It prescribes sample splitting (rho fit
    on train, bound computed on an independent test set) and its ''adapt'' estimator
    handles data-dependent CUTOFF selection by grid-searching while controlling split-wise
    errors at alpha/3 each via binomial/hypergeometric tail bounds, which conserves
    the level. So the problem is solved, and by the very authors our code cites. (2)
    OUR CODE ALREADY IMPLEMENTS IT: src/eibo/statcore.py tv_lower_bound documents
    ''The classifier is trained and evaluated on disjoint data'', defaults test_size=0.3,
    and implements the adaptive sup-over-cutoff construction (Eq. 17 trimming + Appendix
    B.1 constant) reported as method ''michel_adaptive_sup_cutoff''. (3) I checked
    for an unaccounted upstream selection over classifier CONFIGURATIONS (looping
    over configs and keeping the best eps_lo): none exists. CONCLUSION: the selection
    channel is already controlled; there is no new mechanism to win here. STOP the
    line per D146''s own stop condition. The residue is not a hole but a documented
    scope caveat - the bound is asymptotic and the small-effective-m constant uses
    a conservative finite stabilisation, which is what ''nominal'' honestly flags;
    x11_full_bracket.py already says ''the Michel lower side is an asymptotic HPLB
    estimate, not an exact...''. That is a stated limitation, correctly worded, not
    an unfixed defect. Also note: the blocked Worker dispatch is now moot - the question
    is answered without it, so neither routing nor guard-clearing is needed. Net effect
    on strategy: the only identified route to a stronger methodological contribution
    is closed, so the paper reverts to the user''s A/B/C decision on the weak-accept
    version with the floor as an added measurement.'
