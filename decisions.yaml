- id: D118
  date: 2026-09-15 23:18 UTC
  summary: 'D118: W4 settled analytically — the current radius certifies 0.975 not
    0.95, the preferred fix makes 0.95 exact and moves the headline to 342/338'
  rationale: "I settled RT-W4 (the 0.95-vs-0.975 radius arithmetic) myself rather
    than continuing to wait on the independent Reviewer, because it is an algebra
    question with a definite answer and it is the one Round 3 item that can move published
    numbers as a result.\n\nTHE ALGEBRA, COMPUTED. The fluctuation term comes from
    McDiarmid on the L1 statistic with c_i = 2/n, so sum c_i^2 = 4/n and the one-sided
    tail is exp(-n t^2 / 2). Solving for a per-law one-sided tail q gives t = sqrt(2
    ln(1/q)/n). The repo carries two constants, and I evaluated what each actually
    certifies:\n  - current C = sqrt(2 ln(2/0.025)) = 2.9604  -> per-law one-sided
    tail 0.01250 -> joint over two laws 0.9750\n  - proposed C = sqrt(2 ln(1/0.025))
    = 2.7162 -> per-law one-sided tail 0.02500 -> joint over two laws 0.9500\n\nSO
    THE REPORT IS RIGHT AND THE PAPER'S STATED MECHANISM IS WRONG, IN A SPECIFIC WAY.
    measurement_design.tex:140-142 explains the 2 inside the logarithm as \"the per-law
    level is halved: each of the two laws must hold simultaneously, and the union
    bound over them contributes the factor of 2.\" That is not what the factor of
    2 does. The factor of 2 is the two-sided/tail-shape factor inside the McDiarmid
    bound; the union over the two laws is what alpha_law = 0.025 already encodes.
    With the current constant the construction in fact certifies 0.975, not 0.95,
    so the label 0.95 is a CONSERVATIVE UNDERSTATEMENT of the guarantee - the guarantee
    is true, the sentence explaining it is not. That is the honest reading and it
    matters more than the number itself, because the sentence is a mechanism claim.\n\nTHE
    EFFECT ON PUBLISHED COUNTS, COMPUTED NOT ASSERTED. I recomputed both criteria
    per pair from the 990-row ledger under each constant: upper side (eps_hi < 0.5)
    goes 340 -> 342, and the joint gate goes 336 -> 338. So the preferred fix moves
    the headline UP by 2 in each count and changes no verdict in the other direction
    - it can only admit more pairs, as the report said.\n\nDECISION: take the preferred
    fix (C = sqrt(2 ln(1/alpha_law)) = 2.7162), which makes the stated 0.95 exactly
    correct and raises the headline to 342/338, and rewrite the mechanism sentence
    to say what the factor 2 actually is rather than the union-bound explanation.
    Rejected the alternative (relabel to 0.975) because it would force the section
    4.4 null from 5% to 2.5% and worsen an already near-powerless test, with no benefit.\n\nCONSEQUENCE
    FOR THE HELD SET: this unblocks one of the four judgment items without the Reviewer,
    and it is the one with the highest stakes. The other three (RT-W6, RT-W7, RT-W9)
    remain genuinely judgment calls and stay held. I will report the arithmetic and
    the recomputed counts to the owner, since a published number is changing in the
    authors' favour and the report's own recommendation is what drives it."
