  rationale: 'Audited the commit that carried the bibliography fixes, found the manuscript
    half correct and the tooling half broken, and repaired the reproducibility gap.


    WHAT I VERIFIED AS CORRECT. HEAD f4badc6 contains the four bibliography fixes
    and item E, checked by reading the COMMITTED revision rather than trusting the
    report: 2994807 present / 2999953 gone, popets-2021-0017 present / 2021-0018 gone,
    Xiaolin present, ISCC58397 present, 3406325 present, 69 entries; main.tex:632
    reads "understate the requirement by $\sqrt{C} \approx 2.96\times$". HEAD and
    the worktree are identical for both docs/paper/references.bib and docs/paper/main.tex,
    so the manuscript edits are fully committed.


    THE DEFECT — the committed builder is an older revision. scripts/build_supplementary_archive.py
    at HEAD was 558 lines against 957 in the worktree (406 insertions, 7 deletions
    apart), and the committed copy is missing precisely the machinery this session''s
    rebuild depends on: assert_matches_registered_hash (0 occurrences at HEAD), mirror_to_registered_path
    (0), REGISTERED_ARTIFACT_ID (0), CONTENT_CENSUS_PATTERNS (0), and no --mirror-to
    argument at all. Its default EXPECTED_MAIN_PDF_SHA256 was still the older de5e4b63.
    So a future session checking out HEAD could not reproduce the shipped archive
    ed01a6dc, and could not perform the mirror step at all — recreating the stale-routed-copy
    failure that this session existed to fix. The guard suite tests/test_build_supplementary_archive.py
    was also untracked (git ls-files showed only the four older test files), so the
    mechanism protecting the builder was absent from the repository too.


    CAUSE (M183): a plain `git commit` commits the entire index. The builder had been
    left pre-staged (`AM`) at a stale revision by an earlier action in the session;
    the writer''s `git add <files>` was correct, but the following plain commit swept
    the pre-staged file in. The writer flagged this unprompted and accurately. I contributed:
    I put the commit instruction in the same message as a Patch task and never named
    the in-scope files, and I had treated "the script is committed" as satisfied without
    diffing the committed revision against the worktree.


    FIX: commit 5fd92c2, staged with an explicit pathspec covering exactly two files
    (the corrected builder and the guard suite), confirmed by `git diff --cached --name-only`
    showing only those two before committing, and no broad `git add`. Verified after:
    HEAD and worktree identical for both files; the committed builder now contains
    all four guard/mirror symbols and exposes both --expected-main-pdf-sha256 and
    --mirror-to. Local only, not pushed — pushing remains a user decision, and I did
    not re-run the build, since doing so would rewrite already-verified shipped bytes.


    GENERALISED RULE: the revision of a build script that produced a shipped artifact
    must be committed alongside that artifact, or the artifact is not regenerable
    from the repository. And a tool can be present at HEAD while being the WRONG VERSION,
    which a file-list check will not reveal — diff the committed revision against
    the worktree for every tool the artifacts depend on.'
