- id: D230
  date: 2026-09-24 22:02 UTC
  summary: Built the guard/argument mechanism as introspection-driven tests, mutation-verified
    against all three original defects (one initially escaped, test strengthened)
  rationale: 'Built and mutation-verified the mechanism behind the three build-script
    defects, as the user asked.


    THE MECHANISM: tests/test_build_supplementary_archive.py, written as introspection-driven
    checks rather than cases, so a newly added argument or guard is covered automatically
    instead of silently exempt:


    1. test_each_path_argument_rejects_a_directory — parses the script''s own argparse
    surface for Path-typed options and, for each, runs the script with that option
    pointed at a directory, asserting exit 1, no traceback, and a named error. This
    is the check that would have caught the --output crash without anyone noticing
    the flag by hand; it enumerates the option set from the AST.

    2. test_every_guard_is_called_and_its_result_tested_in_main — walks main() and
    requires each guard''s error list to reach a conditional whose body returns non-zero.
    Crucially it checks for the non-zero return, not merely an `if`: the original
    binary_content_census defect was detected-and-printed with the branch falling
    through, and my first version of this test passed on that exact mutant. Strengthened
    after the mutation run exposed it.

    3. test_guard_registry_covers_every_guard_in_the_script — a registry keyed by
    guard name; fails if the script gains a guard with no registered bad-input case,
    and also if the registry names a function that is no longer a guard. A DATA_PRODUCERS
    set (unique_ids, data_ids, extract_cited_ids_from_tex) explicitly excludes non-guards
    that happen to be list[str]-shaped, so the distinction is visible rather than
    implied.

    4. TestGoodInputIsSilent — each guard paired with a pass case, since a guard that
    fires on correct input is worse than none.


    THE BUILDING OF IT VALIDATED THE MECHANISM: the first run failed 6 of 9, and every
    failure was a real imprecision in my own heuristics — comparing function names
    to variable names, and over-including data producers as guards. Fixing them was
    the discipline the mechanism exists to force, so the failures were the feature.


    MUTATION TEST, which is the part that makes this evidence rather than assertion:
    I copied the script three times, reintroduced each of the three original defects,
    and ran the suite against each via a BSA_SCRIPT override.

    - MUTATION 1 (--output directory guard removed) → FAILED (caught)

    - MUTATION 2 (binary guard unwired: print, no return) → initially OK — NOT caught.
    That is the original defect exactly, so the test was insufficient; I traced it,
    found I checked "reaches an if" rather than "the branch fails", strengthened _names_tested_in_main
    to require a non-zero return or a raise in the branch body, and re-ran.

    - MUTATION 3 (empty-string mirror skip removed) → FAILED (caught)

    After strengthening: real script OK, all three mutations FAILED. So the suite
    demonstrably catches the class it was written for.


    NO REGRESSION, NO DISTURBANCE: the new suite passes (9 tests), and test_statcore,
    test_q1_thresholds (18 tests), and test_divisibility all pass. The test file is
    NOT inside the archive (membership is explicit, not directory-swept — verified),
    and the deliverables are untouched: paper 04b7507f, archive 53c7c6bd at both paths,
    manifest hash 53c7c6bd — three-way agreement intact.


    Scope note: this is a test added to tests/, which does not ship. It protects future
    builds of the archive. The paper remains frozen and submittable.'
