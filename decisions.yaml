- id: D100
  date: 2026-09-15 06:09 UTC
  summary: 'D100: Round 1 review action matrix — two systemic findings (scope over-claim
    in the abstract; under-reported experiment), no claim invalidated, no pivot'
  rationale: 'Formal review Round 1 returned 12 issues: 4 critical (R1-W1/W2/W3/W4),
    8 warning. Ran the holistic pass (written into ROADMAP "Review retrospection")
    and clustered them into two systemic findings plus a secondary uncertainty cluster.


    SYSTEMIC 1 (R1-W1/W2/W5): the abstract over-states relative to the body''s measured
    scope. Verified the reviewer is right: introduction.tex:67 says the upper side
    "binds on every rung" and results.tex:33 says "binding constraint on 100% of the
    ladder", but the joint gate exists only at M=1 (no per-rung lower side for M>=2),
    so "binding" — which means the upper side fails relative to the lower — is undefined
    there. Same defect in miniature: abstract says the certifiable set falls from
    340 pairs, mixing the upper-only count (340) with the joint gate (336). Root cause:
    the abstract was written to read well rather than to state the measured scope
    — the same class as the figure defects fixed earlier today.


    SYSTEMIC 2 (R1-W3/W6/W7/W8): the experiment is under-reported for a measurement
    paper. Primary corpus never named, flow threshold that yields 990 never stated,
    detector panel has no architecture/features/training/citations, no compute disclosure,
    and the promised appendix ledgers are prose only. W3 adds that the claim compares
    a pair-level macro-average closed-set error rather than the open-set floor, which
    the paper''s own text concedes.


    Secondary (R1-W9/W10): absent uncertainty on the cross-corpus numbers and the
    median-tv series. Computable over existing artifacts, so these are computations
    rather than new experiments.


    R1-W4 decided: promote the two Discussion blocks that have artifacts (X13 missing-service
    mass; whole-flow rectified object via q1_absolute_*) into the contribution list
    + Results carrying X13''s deployment-site scoping, and DELETE the DST_ASN promise
    at related_work.tex:102 — I verified no such audit exists in any artifact.


    Assessment: NO claim is invalidated and NO framing pivot is required, so the red-section
    trigger (core claim does not hold) does not fire. W1/W2/W5 are wording cuts to
    the measured scope; W3/W6/W7/W8 are disclosure from existing artifacts; W9/W10
    are bootstrap computations; W4 is structural-editorial. Dispatched: Paper Agent
    for the ten editorial items, Main Agent for the two uncertainty computations.
    Tracker synced to in_progress (12/12).'
  related_experiments:
  - exp_id: X11
    result: cross-corpus uncertainty to be computed
    role: affected
  - exp_id: X13
    result: orphan block promoted into contributions with its deployment-site scoping
    role: affected
