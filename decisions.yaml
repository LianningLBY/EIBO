decisions:
- id: D001
  date: 2026-09-13 11:37 UTC
  summary: Redefine the MVP gate around k_cert and add the divisibility lower bound;
    correct the brief's theoretical basis for eps^lo from ref 5 to ref 4.
  rationale: 'A boot design audit of the MVP specification (pre-execution, zero compute
    spent) returned three critical findings on the definition of the MVP itself, all
    resolvable without extra budget:


    1. The gate as first written could pass circularly. The informative-pair stratum
    is defined by eps_hat_k^hi < 0.5, but the gate never required the upper bound
    to be *certified* at any k; "at some k in [5,15]" let k=14/15 supply non-emptiness;
    and the `eps_lo <= eps_hi` criterion holds identically under plug-in monotonicity,
    so it carried no evidence. Redefined: the plug-in UCB (not the point estimate)
    is the first-class output, and PASS requires the certified region to be non-empty,
    recorded as k_cert. `eps_lo <= eps_hi` demoted to sanity check.


    2. The scale gap was structural and unexposed. The paper''s claim lives at k in
    the hundreds; the pre-registered MVP window is [5,15]. Worth noting the direction
    of the tension: two k-prefix laws are equal only if every conditional matches,
    so eps_k stays near 1 until k exceeds the longest protocol-determined prefix —
    plausibly beyond what [5,15] covers. In that regime the honest result is "we can
    certify distinguishability at k, not a floor at k". Forced a per-k table (k=1..15:
    cells, |A_k|, plug-in point est, certified eps^hi or "certificate lost", N) so
    the MVP can distinguish "bracket non-trivial" from "estimator biased toward 1".


    3. Step 5 listed three estimators, all of which are blocked or weakened at large
    k: a whole lower-bound family was missing — the rejection-generic/divisibility
    route (TV <= eps iff the pair is divisible by a test using only P1,P2), which
    needs no alphabet bound and is therefore the one genuine lower bound in exactly
    the large-k regime where finding 2 bites. Added as a fourth triangulation point
    with an empirical tightness check at k=5,10,15, because the sentence "only the
    one-sided lower bracket survives at large k" was asserted in the framing, not
    shown.


    Also corrected a factual error in the brief: the basis for the assumption-free
    eps^lo was attributed to ref 5 (arXiv 2405.15337, which is about TV estimation
    via second-type error decay — neither train/test generative samples nor a lower
    bound); the correct basis is ref 4. And the i.i.d. single-letterization result
    sits at §4.1, not §5.1.


    A planned branch was pre-registered rather than left as a surprise: if k_cert
    < 8, MVP non-triviality is a small-k phenomenon and the paper''s large-k claim
    is restructured around the assumption-free lower side plus a model-conditional
    upper side.


    Rationale for acting without consulting the user: this is a pre-execution correction
    to the MVP specification that costs no additional budget, and the audit''s recommended
    additions run inside the same single run. The possibility that the paper''s headline
    claim needs restructuring is a genuine research-direction matter, so it is reported
    to the user rather than absorbed silently. Venue and goal are unchanged.'
