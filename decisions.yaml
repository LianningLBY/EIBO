- id: D043
  date: 2026-09-14 02:51 UTC
  summary: 'Revise D003''s pre-registered split: adjacent corpus months share TIME_FIRST
    boundary values (local-time buckets compared as raw UTC), so the strict time-disjoint
    guard cannot be satisfied by the D003 split train 2024-06..2025-01 / test 2025-02..2025-05.
    Replaced with train=202406..202411, buffer month 202412 unused, test=202501..202505
    - a stricter, structurally-ordered split that leaves the guard untouched.'
  rationale: 'D003 reinstated the full pre-registered split (train 2024-06..2025-01,
    test 2025-02..2025-05, flow-disjoint and time-disjoint) as a registered commitment,
    so this is a REVISION of D003, not a new registration. The revision is forced
    by a measured corpus property: the HDF5 month buckets are LOCAL-time (UTC+3) buckets
    spanning 2024-05-31T21:00:00Z to 2025-05-31T21:00:00Z, so ADJACENT MONTHS SHARE
    TIME_FIRST BOUNDARY VALUES. The guard enforces a strict raw-timestamp inequality,
    max(train TIME_FIRST) < min(test TIME_FIRST), which no clean adjacent-month split
    can satisfy - which is why both the auto-derived default AND the explicitly-supplied
    D003 split raised RuntimeError: time-disjoint invariant failed. The unit of the
    split (local-calendar month buckets) and the unit of the guard (raw UTC timestamps)
    are different objects, and this corpus collapses them. The remedy is to leave
    one unused buffer month so the strict ordering holds structurally: train=202406..202411,
    buffer=202412 (unused), test=202501..202505. This is a CORRECTION, not a weakening:
    the split becomes strictly time-ordered where before it was only bucket-disjoint,
    and the guard is preserved untouched (no <= relaxation, no --no-check, no try/except).
    The cost is that training shrinks from 8 months to 6, which must be reported with
    both sides'' flow counts so the corpus reduction is visible rather than silent.
    The generic lesson belongs in the paper''s hygiene section: adjacent local-time
    month buckets cannot produce a strictly ordered split from raw UTC timestamps.'
