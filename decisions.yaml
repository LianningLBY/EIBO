- id: D053
  date: 2026-09-14 05:47 UTC
  summary: 'CORRECTION of D052: heterogeneity does NOT explain variant C (penalty
    2.4e-4 of dBIC; heterogeneous-null ~47x short), so (ii) is not dead — but it must
    be narrowed to ''far from globally i.i.d.'' because the i.i.d. null is a single
    global p; the parametric route is upgraded to a REQUIRED control for (i)''s wording;
    C3 retained as a methods/limits finding rather than cut.'
  rationale: 'CORRECTION OF MY OWN D052, on the strength of an independent review
    that ran the decisive simulation rather than arguing from construction.


    (A) D052 FINDING 1 IS REVERSED — the heterogeneity confound does NOT explain variant
    C, and my "part (ii) is unsupported" was wrong. The review decomposed dBIC at
    k=30 exactly (dBIC = 2*dLL - 2*log N): median 2*log N = 26.80, median dBIC = 110,091.1,
    so the BIC penalty contributes 2.43e-04 of dBIC (median). I verified this arithmetic
    myself. The review then MEASURED per-flow direction rates on real data (service
    0, 740,731 flows): mean 0.4752, sd 0.1187, 1-99 pct 0.167-0.700 -- substantial
    between-flow heterogeneity -- and simulated the pure heterogeneous-i.i.d. NULL
    (each flow its own rate, i.i.d. WITHIN each flow, zero within-flow dependence),
    running C''s exact same fitting code. That null gives dBIC_sim = 68,632 and 2*dLL/N
    = 3.09e-03 nats/obs, whereas the observed service-0 value is 1.44e-01 nats/obs
    -- about 47x the heterogeneous-null prediction. I verified the ratio arithmetic.
    So heterogeneity accounts for roughly 2% of the observed likelihood advantage:
    C''s advantage exceeds the heterogeneity null by a wide margin, and genuine within-flow
    sequential dependence beyond between-flow mixing is real. My D052 finding 1 is
    WITHDRAWN. The review also withdrew its own earlier critical on the same point.


    (B) BUT part (ii) MUST STILL BE WEAKENED, for a different and correct reason.
    Verified in code: fit_nested_models uses an i.i.d. NULL WITH A SINGLE GLOBAL p
    (iid_ones/n_observations over all positions), while the Markov model carries a
    position-1 initial parameter plus one shared transition matrix. A one-parameter
    global null is maximally weak: ANY position-wise marginal-rate drift (position
    1 vs position 25 differing) makes first-order Markov win. So C''s 45/45 establishes
    only "the direction sequence is far from GLOBALLY i.i.d.", which is close to the
    weakest dependence statement available. It does NOT single out a first-order transition
    structure. The claim "the dependence is real and FIRST-ORDER" must be narrowed
    to "the direction sequence is far from globally i.i.d."; to support "first-order"
    specifically the null must be position-wise i.i.d. (independent across positions,
    marginal rate free per position) or a variable-order Markov selection must be
    used.


    (C) D052 FINDINGS 2 AND 3 STAND (the review did not dispute them, and I verified
    them): B''s plain-arm power exponent DECREASES monotonically as the occupancy
    threshold tightens (0.539/0.420/0.372/0.260/0.210 vs 0.651 no-filter) while the
    twin moves the opposite way, so the causal attribution to sparse occupancy remains
    NOT ESTABLISHED; and the gate''s twin uses only the two largest services (twin_services_used
    = [0,1]), making the arms systematically unequal.


    (D) PART (i) STANDS AND IS STRENGTHENED, with one narrowing. The review endorses
    "structural, not a tuning problem" on a stronger basis than "two failures": the
    excluded-mass curve (0.000/0.003/0.217/0.412/0.530/0.608 across k) shows that
    making contexts "well-occupied" at k=30 would require discarding 61% of transition
    mass, and the plain arm STILL fails after that. However "cannot adjudicate the
    question" is worded more strongly than the evidence: what is established is that
    the plug-in chain-rule estimator cannot adjudicate at this k window and this n
    on this occupancy-collapse curve. It does NOT exclude the parametric/model-internal
    route.


    DECISION: (1) C3 is retained as a methods/limits finding, NOT cut -- the review''s
    advice, which I accept: the growth-rate claim is correctly gone, but "this question
    is not adjudicable on this data by the standard plug-in" is a real, useful negative
    for a security audience. (2) Narrow (ii) to "far from globally i.i.d.". (3) DISPATCH
    THE PARAMETRIC ROUTE as a MUST-DO: fit a low-order Markov (or select order by
    BIC) and compute the chain-rule D_k UNDER THE FITTED MODEL, testing its growth.
    It estimates the SAME growth question but its conditional distributions have adequate
    samples BY CONSTRUCTION, completely bypassing occupancy collapse, and it is cheap
    (cache exists). This is the missing control that decides the wording of (i): if
    it ALSO fails, "cannot adjudicate" may stand; if it returns LINEAR, then the question
    IS adjudicable and only the plug-in route fails, so (i) must be narrowed to "the
    plug-in estimator cannot". This was already flagged as candidate route 4; it is
    now upgraded from candidate to required. (4) Keep the heterogeneous-i.i.d. arm,
    but RE-PURPOSE it: its role is no longer to decide (ii)''s survival (the review''s
    simulation already shows it survives) but to be INCLUDED IN THE ARTIFACT as a
    published null, so that C''s conclusion is self-sufficient and a reader need not
    re-derive the falsification check. (5) Add a position-wise i.i.d. null (independent
    across positions, free marginal per position) so that "first-order" can actually
    be tested rather than assumed.'
  related_experiments:
