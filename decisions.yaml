  date: 2026-09-19 20:15 UTC
  summary: 'Track 5: no dependence-aware radius is a clean fix — bootstrap over-covers,
    sandwich and LOBO under-cover with radii BELOW the i.i.d. reference'
  rationale: 'Track 4 established that coverage under block dependence cannot be restored
    by more data, so the remedy had to be an estimator change. Three arms were run
    at n=60000, B=64, conc=0.1, true TV=0.4, 1000 replicates per arm (800 required
    for 95% power; 400 was only 72% powered, which is why the original ladder was
    under-resolved).


    RESULT: none of the three is a clean fix.

    - Arm A block bootstrap: coverage 0.9940, CP95 [0.9870, 0.9978], radius 0.041097
    = 1.168x the i.i.d. reference. Clears nominal but by OVER-covering: the interval
    excludes 0.975 from above. A conservative radius is not a calibrated one.

    - Arm B cluster-robust sandwich: coverage 0.9780, CP95 [0.9669, 0.9862], radius
    0.033172 = 0.943x. Falsifier fired.

    - Arm C LOBO Studentized: coverage 0.9780, CP95 [0.9669, 0.9862], radius 0.033117
    = 0.941x. Falsifier fired.


    B and C both shrink the radius BELOW the i.i.d. one while still under-covering,
    which is the diagnostic signature: they are pulling the radius in the wrong direction
    for this dependence structure and coincidentally land nearer nominal.


    The i.i.d. reference is r1+r2 = 0.035179852 from statcore.tv_upper_bound at m=32,
    alpha=0.025, n=60000 (verified: 0.017589926 per law, doubled).


    Per the adopted hard constraint, none of this may be described as coverage holding
    on real traffic: the arms test dependence-aware radii under the MODELLED block
    law only.'
