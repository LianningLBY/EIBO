    rather than spend more dispatches). RESULT: THE ROUTE IS CLOSED - and closed more
    thoroughly than my proposal. STEP 0 first, as required: arXiv:2602.14055 RESOLVES
    and matches (title ''The Inevitability of Side-Channel Leakage in Encrypted Traffic'',
    Liu/Chen/Liu, 15 Feb 2026, 28pp, cs.CR/cs.IT). Note an author-transliteration
    discrepancy between arXiv metadata and the published Acta Electronica Sinica version,
    which the arXiv page itself asks be cited instead. THE DECISIVE FINDING: the same
    group''s companion paper arXiv:2607.17889, ''Rate-Distortion Function for Encrypted
    Traffic Side-Channel Defense'' (Liu, Cheng, Liu, Wang, 20 Jul 2026), does EXACTLY
    the join I proposed and does it fully - it defines R^sc(D) = min over Q_x with
    sum p_X(x) W1(Q_x,P_x) <= D of I(X;Y), proves it monotone/convex/continuous with
    exact endpoints, derives the optimal defense in exponential-tilting (Boltzmann)
    form under KKT conditions, and states (D, R^sc(D)) is the EXACT achievable Pareto
    frontier within the stationary memoryless class. Critically it gives the binary
    equal-prior critical cost D_max = (1/2) W1(P0,P1) via Kantorovich-Rubinstein duality,
    tying the zero-leakage threshold directly to statistical separability - i.e. the
    efficiency-vs-distinguishability join exists, is characterised, and has a computable
    bound. It also already benchmarks real defenses against the curve (Front 0.028
    bits, WTF-PAD 0.034, TrafficSliver 0.124). So my ''only candidate for mechanism-level
    novelty'' is not available. RESIDUAL GAPS worth recording but NOT sufficient to
    carry a paper: the analysis is confined to the stationary memoryless class and
    may miss correlations in complex defenses; empirical validation covers only a
    subset of WF defenses; and the paper does not use QUIC specifically. Those are
    incremental extensions to an existing framework, not a new mechanism. CONCLUSION:
    no mechanism-level route found within or adjacent to this project''s object; the
    paper''s ceiling is measurement/rigour, as stated to the user. Reported honestly
    to the user, including that this is a CLOSED answer rather than the ''unmeasured''
