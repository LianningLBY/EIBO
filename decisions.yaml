    before accepting any of them. All three refutations are correct.


    1. C8 — I compared the WRONG PAIR. I reported that §A.8''s stated factor (M−1)/(K−1)
    = 45/44 could not connect its numbers because 0.197/0.1858 = 1.060. But the LP-constrained
    uniform point is S/[(K−1)·M] = 407.7497/(44·46) = 0.20145738, and 0.20145738/0.19698055
    = 1.022727 = 45/44 EXACTLY. The factor closes against 0.197; the sentence simply
    names the wrong base. Fix is one digit: main.tex:729, 0.1858 → 0.197, with no
    rewording and no claim impact. My "6.0%" compared the two statistical generations
    with each other, which is a real fact but not the pair that sentence relates.


    2. C9 — premise false. I claimed the LP floor (0.375) and the no-data bound (0.304)
