    work on the happy path") was slightly too broad. The common shape across the census-that-printed-without-failing,
    the path divergence, and the off-switch crash is narrower — an unexercised argument,
    flag, or consumer that the fix itself introduced. The census added a scan with
    no consumer; the mirror added a copy with no test of its off-switch; the hash
    assert compared the build against nothing until wired. In each case the new line
