- id: D023
  date: 2026-09-13 15:50 UTC
  summary: 'Tested the DataZoo URL directly: it serves h5 subsets by size but returns
    "File or bucket does not exists" for both 2024-07.zip and 2024-06.zip, so the
    bucket cannot supply the months. The only untested fix lever is concurrency; backoff
    is already implemented.'
  rationale: 'Three separate claims have been made that the CESNET DataZoo bucket
    can serve the monthly ZIP archives — first by me in an unverified instruction,
    then by me in a retraction that relied on documentation search alone, and finally
    by a review that presented a three-source table treating the XS h5, a model checkpoint,
    and a month ZIP as sharing a serving path. Rather than assert a fourth time, I
    tested it directly with the same URL form across four files, which removes URL-form
    correctness as a confound:


    | `&file=` target | result |

    |---|---|

    | `CESNET-QUICEXT-25-XS.h5` | 302 → CESNET S3 bucket (works) |

    | `CESNET-QUICEXT-25-S.h5` | 302 → same S3 bucket (works) |

    | `2024-07.zip` | "File or bucket does not exists" |

    | `2024-06.zip` | "File or bucket does not exists" — despite our already holding
    that file |


    So the bucket serves **h5 subsets by size only**; the monthly ZIPs are not there.
    The URL form is fine — two h5 sizes redirect — the files simply are not present.
    This refutes both my earlier instruction and the review''s recommendation, and
    it refutes the inference pattern behind them: **a successful 302 on one artifact
    is not evidence that the same URL form serves a different artifact.** That is
    the same cross-artifact extrapolation already logged twice (M010 throughput across
    endpoints, M023 endpoint capability), now settled empirically rather than by argument.


    **What remains genuinely untested.** The one lever not yet excluded is concurrency:
    the failed run used 24-way (`--workers 8 --file-workers 3`). Exponential backoff
    is already implemented (sleeps of 1/2/4/8/16 s per part across all 356 parts),
    so "add backoff" is not a remedy and the aggregate 2.0-second mean interval was
    a concurrency artefact rather than a tight loop. The cheapest discriminating test
    remains proving a single 16 MB range returns `206` with `Content-Range` before
    launching the batch — that one probe would have prevented 1764 failed retries.


    **Corrected characterisation.** The log supports only "persistent failure within
    this run" (1764/1764, zero successes). It cannot adjudicate endpoint-level intermittent-versus-permanent,
    because the single successful month fetch (11:45 UTC) preceded this job (14:34
    UTC) by hours and therefore belongs to a different run. So I am withdrawing my
    earlier "intermittent failure under load" framing as unsupported by this evidence
    — it was an inference from a success that predates the measurement window.


    **Process state.** The fetcher (PID 512584) is alive, sleeping in `futex_wait_queue_me`,
    and cannot be terminated by either route: raw SSH is blocked by policy, and the
    managed kill refused because attribution is by cwd, with this process launched
    at `cwd=/root` while the project scope is `/root/eibo`. The process most needing
    replacement is the one the platform cannot identify as ours. Recorded as constraint
    C011: long-running jobs must be launched with cwd inside the project scope. The
    fence itself was correctly not relaxed — an assertion cannot override a cwd-based
    check, and this host genuinely runs other projects.


    **Restraint worth preserving**: the agent did not launch a second concurrent fetcher
    and did not delete the 0-byte `2024-08.zip` while the old process lived. Given
