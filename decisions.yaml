- id: D250
  date: 2026-09-25 10:48 UTC
  summary: 'Refuted the "supplementary_paths needs an absolute path" hypothesis for
    the Round 19 registration failure (relative paths register fine for sibling fields)
    while recording the narrower untested cell, and added decisive new evidence that
    the pipeline RAN on the failing attempt (submission.tar.gz rewritten to the exact
    second) so the failure is downstream of packaging. Separately found and fixed
    a false positive in my own verifier: it flagged the RFC-prefixed title as a mismatch
    once the DOI was added; fixed with a document-identifier-prefix rule plus self-test
    cases, verified on positive and negative controls, now MISMATCH=1 / unverifiable=2'
  rationale: 'Two things closed this turn: a third variable proposed for the Round
    19 registration failure, and a false positive my own verifier produced.


    1. ROUND 19 REGISTRATION — the proposed third hypothesis is partly refuted and
    partly sharpened.

    The Main Agent read the project config, saw `review_paper_path` and `review_paper_pdf_path`
    are absolute while `review_supplementary_paths` is empty, and proposed that `supplementary_paths`
    may require an ABSOLUTE path — noting that all 4 registering rounds passed the
    field absent while both failing attempts passed a RELATIVE one, so "presence"
    and "relative form" are collinear in the sample.

    I extracted all 34 `submit_paper_to_review` calls from the session archives. REFUTED
    in part: relative paths register fine for the sibling fields — five submits passed
    a relative `paper_path` (`docs/paper/main.tex` or `projects/<slug>/docs/paper/main.tex`)
    and every one landed. So "the service needs an absolute path" does not hold generally.

    The confound is nonetheless real in a narrower form: no attempt in our history
    ever passed an absolute `supplementary_paths`, so that cell is empty — the relative
    form is UNTESTED, not causal. Recorded that way.

    NEW EVIDENCE the hypothesis did not have, pointing away from a path-resolution
    failure: `artifacts/submission.tar.gz` mtime is 2026-09-25 01:15:05.444 — the
    same second as the second submit call (logged 01:15:05.744). So the pipeline RAN
    and rebuilt the snapshot on the failing attempt, then stopped short of creating
    the round: attempt 2 modified exactly one file (that snapshot) and no round-19
    directory exists anywhere, while round 18''s artifacts (`submissions/<slug>-round-18/paper.pdf`,
    `artifacts/review_round_18/`) did materialise. A failure to resolve the archive
    path would most plausibly abort at or before snapshotting, not after it.

    REMAINING UNRESOLVED: "this field breaks registration" stays live exactly as D237
    recorded, now constrained — the failure is downstream of packaging, not a simple
    path abort. The clean discriminator remains what D237 refused (submit once without
    the field, trading the archive for diagnostic information) and is the PI''s call.
    I searched the accessible logs and found no error surfaced for either attempt,
    but I cannot see the control plane, so absence there proves nothing. No further
    action taken; told the Main Agent not to re-triage.


    2. MY OWN VERIFIER PRODUCED A FALSE POSITIVE — found and fixed.

    Adding the RFC DOI (D249 follow-up) turned `kuhlewind2022rfc` into a MISMATCH:
    our title is `{RFC 9312}: Manageability of the {QUIC} Transport Protocol` while
    Crossref returns `Manageability of the QUIC Transport Protocol`. The entry is
    CORRECT; the leading document identifier is a citation convention, not part of
    the title, and my comparison treated it as a title difference. This is the same
    class the whole tool exists to prevent — an instrument manufacturing a defect
    — and it appeared the first time the tool met an RFC-style entry, because the
    earlier 63 entries happened to carry no identifier-prefixed titles.

    FIX: added `strip_doc_id_prefix`, which removes a leading `RFC nnnn:` / `arXiv:xxxx:`
    / `DOI:10.x/...` / `IETF-draft` marker, and — critically — only strips when something
    substantive FOLLOWS, so an identifier-only title is not emptied into a vacuous
    match. Added two self-test cases (the RFC-prefix comparison, and the identifier-only
    guard).

    VERIFIED on both controls per the standing rule: self-test passes including the
    new cases; the negative fixture still reports MISMATCH=3 with exit 1, so the fix
    did not blunt real detection.

    RESULT on the real bibliography: parsed=69 checked=67 ok=66 MISMATCH=1 ERROR=0
    unverifiable=2 — exactly the intended state. `unverifiable` fell 4 → 2 as designed
    (wright2009traffic and fano1961transmission remain, correctly: neither has a resolvable
    identifier), and the single MISMATCH is the deliberately held `liu2026inevitability`.'
