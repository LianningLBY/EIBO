    right.


    3. THE GENUINELY USEFUL FIND — A TOOLCHAIN FIX THAT MAY RECOVER THE PAGE WITH
    NO CONTENT CUT. The writer explained that the build disables microtype character
    EXPANSION via `\PassOptionsToPackage{expansion=false}{microtype}` because the
    install errors with `auto expansion is only possible with scalable fonts`. Expansion
    active packs lines slightly tighter; across a ~69,000-char body that can plausibly
    shift pagination by a page. If it does, the venue switch no longer costs a 5.6%
    body cut.

    I verified the environment claims myself rather than taking them: **`cm-super`
