- id: D020
  date: 2026-09-13 14:39 UTC
  summary: Retract "M=8/16 never certify" as an absolute (n-dependent, crossover only
    ~8% above corpus mean), label T(n) calibration-dependent rather than assumption-free,
    and restate Q1's gate over the per-pair fraction rather than a scalar; plus the
    month fetch is not running despite the roadmap saying it was.
  rationale: 'Four corrections in this round, three of them mine.


    **1. "M=8/16 never certify" is false as an absolute (M020).** I had written it
    into the roadmap''s citable-results block. The certification condition depends
    on n, so M=8 is infeasible only at a given sample size: at k=5, r(M=8) = 0.5199
    at n=3.9e6 (infeasible) but 0.4951 at n=4.3e6 (feasible), 0.4592 at 5e6, 0.3247
    at 1e7 — crossover at n ≈ 4.22e6, only ~8% above the corpus mean per-service count.
    Per-service counts span orders of magnitude, so the largest services plausibly
    exceed it and a reviewer checking M_max on a large service would find M=8 feasible,
    making the claim read as overstatement. Rewritten as the function it is: "at n
    = 3.9e6 (corpus mean), k = 5, M >= 8 does not certify", with M_max reported as
    M_max(k, n, tv). Notably I had already computed M_max as a function earlier and
    compressed it into an absolute during consolidation, for readability — losing
    the parameter it depends on — while consolidating specifically to remove over-strong
    claims.


    **2. `T(n)` is calibration-dependent, not assumption-free.** The `0.05` term is
    exact (it *is* the lower-side threshold), but `c(n)` in [2.239, 2.259] came from
    numerically bisecting the Clopper-Pearson two-cell test across n, not from the
    lower-bound construction. So the roadmap''s summary line claiming "the two computed
    thresholds are assumption-free" contradicted a correction I had made minutes earlier
    in the same file. Rescoped: only the radius is fully assumption-free; `T(n)` is
    calibration-dependent through `c` until `c` is derived (Michel''s asymptotic rate
    under the alpha/3 split is the natural source) or explicitly documented as numerical
    calibration. This does not change the verdict form, only how strongly it may be
    labelled.


    **3. Q1''s criterion must be stated over the per-pair fraction, not a scalar.**
    The design-time `comp` values are per-rung constants multiplying a latent TV,
    which is what makes Q1 look like a single number. Real compression is pair-specific
    and nonlinear in latent TV, since two pairs with the same latent TV compress differently
    depending on where their mass sits relative to the bin edges. A scalar `comp(M)`
    could clear `T(n)` while most pairs do not, so a scalar gate would pass on an
    average that describes no actual pair. The gate now requires `f(M)` — the fraction
    of pairs whose measured channel TV lies inside `[T(n), 0.5 − radius(M,n)]` — above
    a stated floor, reported alongside `k_cert`, J, and L.


    **4. The month fetch is not running, while the roadmap said it was.** A review
    found no month-fetch process on the host and `2024-07.zip` unchanged at 4,973,604
    B for ~2 hours with an empty `.parts/` directory — the third silent transfer death
    on this host and the second time the roadmap recorded one as in progress. My own
    check found something the review''s snapshot did not: a **newly appeared** `.2024-09.zip.parts`
    directory, which means something has attempted to advance to a later month, though
    my 0.1 GB-resolution instrument cannot distinguish "just started" from "stalled".
    Byte-level evidence requested — exact sizes, mtimes, and PIDs — with instruction
    to start the proven concurrent-range fetch immediately if no process exists.


    Also fixed: my consolidation left two "Last updated" headers (the roadmap tool
    inserts its own, and I supplied one in the content), which is the same superseded-content-left-in-place
    pattern (C007) I have been enforcing on others.'
