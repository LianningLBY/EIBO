- id: D102
  date: 2026-09-15 06:41 UTC
  summary: 'D102: bootstrap must resample services, not pairs — the 990 pairs are
    the complete graph on 45 services (correction to a published interval)'
  rationale: "The W10 bootstrap CI (pair-resampling) was found structurally defective
    by independent verification, and I confirmed the defect myself before acting on
    it.\n\nDEFECT: the 990 pairs are NOT 990 independent units. Verified directly
    from q1_lower_side_full_n.json: exactly 45 distinct services, 990 distinct unordered
    pairs, per-service degree distribution {44: 45} - i.e. the pair set is the COMPLETE
    graph C(45,2), every service in exactly 44 pairs. A bootstrap that resamples pairs
    as i.i.d. treats correlated units as independent (any two pairs sharing a service
    are correlated through that service's sampling noise), so the interval is anti-conservative.\n\nMY
    INDEPENDENT REPLICATION (own script, seed 20260915, 2000 replicates):\n  joint
    gate 33.94%: pair [0.3101,0.3677] w=5.8pt | cluster [0.2635,0.4365] w=17.3pt |
    ratio 3.00x\n  upper 34.34%:      pair [0.3152,0.3727]         | cluster [0.2678,0.4409]
    \        | ratio 3.01x\n  lower 99.60%:      pair [0.9919,0.9990]         | cluster
    [0.9915,1.0000]         | ratio 1.21x\n  median tv 0.5805:  pair [0.5600,0.6042]
    \        | cluster [0.5158,0.6459]         | ratio 2.94x\nMy pair-bootstrap endpoints
    reproduce the reported [0.3091,0.3677] to the fourth decimal, so the difference
    is method-driven, not Monte-Carlo noise.\n\nCORRECTED HEADLINE NUMBER: joint gate
    336/990 = 33.9%, 95% CI [26.4%, 43.7%] (cluster bootstrap over services). Still
    non-degenerate (excludes 0 and 1), so the number remains reportable - but only
    with the wider interval. I had reported +/-2.9 points; the correct figure is roughly
    +/-8.6 points. This is a correction to a user-facing number I already published.\n\nAlso
    confirmed correct: the estimability finding that per-M median-TV intervals are
    NOT computable for M in {2,4,8,16} (only k=5/M=1 has per-pair rows; X1 stores
    aggregates). Future-me must NOT present M>=2 series intervals without first re-running
    those cells with per-pair output persisted - that is separate compute, and I have
    asked for a cost estimate before authorizing it. The M=16 entry was also missing
    from the estimability list and has been requested.\n\nDISPOSITION: cluster bootstrap
    over services dispatched, to be reported SIDE BY SIDE with the pair bootstrap
    and their width ratio (the comparison is itself the evidence answering W10). Same
    dependency check requested for X11's 3,321 cross-corpus pairs."
  related_experiments: []
  depends_on: []
- id: D103
  date: 2026-09-15 06:46 UTC
  summary: 'D103: cross-corpus gap is non-monotone (correct the "narrows to 9.7" claim);
    my M=16 premise was a truncated read'
  rationale: 'Two corrections this round, one against my own instruction to the Paper
    Agent.


    (1) MY M=16 CLAIM WAS WRONG. I told the Main Agent the CI artifact''s estimability
    list omitted M=16. I re-read it without truncation: ci_main_table.json carries
    8 estimability entries covering M=1,2,4,8,16 plus the three k=5/M=1 quantities,
    and M=16 IS present (estimable=false). My earlier read truncated at 4 entries.
    This is my own instance of the project''s recurring defect - a check that inspected
    a truncated view and reported a gap that did not exist.


    (2) THE CROSS-CORPUS GAP IS NOT MONOTONE, and the paper''s claim was threshold-shopping.
    Verified from ci_cross_corpus_75134b.json: the gap series (QUIC22 minus primary,
    eps_hi<0.5) runs -0.1826, -0.1547, -0.0932, -0.1305, -0.1544 across thresholds
    all / >=13049 / >=20000 / >=40000 / >=80000 - it minimises at >=20000 then WIDENS
    again. The paper (discussion.tex:24-28, :139) said the gap "narrows to 9.7 percentage
    points once pairs are matched, against 18.2 points unmatched", presenting the
    single smallest stratum as "the matched value". That is the same defect class
    as the 340/336 conflation and the "binds on every rung" over-claim: selecting
    the number that reads best rather than describing what was measured. I traced
    this framing to my own instruction, so the correction is addressed to both the
    paper text and my own framing.


    The honest replacement: the gap is largest unmatched (18.3), minimises at moderate
    evidence (9.3 at >=20000), and grows again at stricter floors (13.0 at >=40000,
    15.4 at >=80000); no stratum eliminates it. All five PAIR-bootstrap intervals
    exclude zero, so non-reproduction is robust across strata - a stronger claim than
    the narrowing story.


    CAVEAT RECORDED: these are pair-bootstrap intervals, anti-conservative for the
    same reason as W10 (the pair sets are complete graphs over services: C(45,2) for
    primary, C(82,2) for QUIC22, each service in exactly 44 resp. 81 pairs). The >=20000
    stratum has the thinnest margin to zero (half-width ~0.066 versus margin ~0.026),
    so a ~1.26x widening flips it to include zero. Per the standard the project applies
    elsewhere, a claim turns on an interval that a corrected method might flip, so
    the paper must NOT depend on that stratum until the cluster bootstrap lands. Cluster
    versions of both W9 and W10 are dispatched.'
