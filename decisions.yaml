- id: D164
  date: 2026-09-18 05:37 UTC
  summary: 'External review actioned (option A): refute the two-sides-different-object
    objection from our own generator, fix the covariance error, and disclose that
    a combinatorial 1-m/C bound exceeds the certified 0.186 floor'
  rationale: 'An external adversarial review (target-venue Cycle 2, lean reject) raised
    three substantive objections. I verified each against source and artifacts rather
    than accepting or dismissing the report. (1) OBJECT MISMATCH — REFUTED, and it
    was OUR OWN ERROR that invited it. The report claimed the upper side bounds the
    quantized symbol law while the lower side uses classifier features, so they cannot
    compose into one TV interval. I read the generator: `x11_full_bracket.py` lines
    313-328 pass `packed_code` to `tv_upper_bound` and `one_hot(packed_code)` to `tv_lower_bound`
    — the SAME packed 32-symbol channel. A one-hot of a fixed code is a bijection
    on the support, so it carries identical information; I confirmed numerically that
    the TV computed on codes and on their one-hot is bit-identical (0.013200 both
    ways). The two sides therefore DO share the object. The genuine asymmetry is the
    SAMPLE: the lower side draws a per-service reservoir cap of 20,000 flows (the
    adaptive construction is quadratic), the upper side uses full n. The paper''s
    own §3.4 sentence said the lower side "operates on the classifier''s features
    rather than the packed symbol alphabet", which is false and was the source of
    the reviewer''s objection — the paper was UNDER-claiming on its central defence.
    §3.4 has been rewritten to state the shared object and the real sample asymmetry.
    (2) COVARIANCE ERROR — CONFIRMED and fixed. §4.5 claimed a heterogeneous arm has
    "zero within-flow dependence by construction". If each flow draws its own rate
    theta and then emits symbols at that rate, two draws from one flow share theta,
    so Cov = Var(theta) > 0. I verified numerically (Var ≈ 0.030 for a uniform 32-symbol
    indicator). The arm is homogeneous within a flow but not across flows; it is an
    alternative dependence mechanism, not a null that excludes dependence. The sentence
    was literally wrong and is corrected. (3) TRIVIAL BOUND DOMINATES — CONFIRMED,
    and this one genuinely weakens the paper. At the headline rung k=5, M=1 the declared
    alphabet has m=32 symbols while the problem has C=46 classes (45 known + unknown).
    Whenever m < C, max(0, 1 - m/C) is a valid multi-class error lower bound requiring
    no certificate, giving 0.289 (C=45) and 0.304 (C=46) — both ABOVE the 0.186 certified
    floor. I recomputed both exactly (1-32/45 = 0.2889, 1-32/46 = 0.3043). Our own
    LP construction reaches 0.363 on the same input, so the headline was never our
    tightest number. The report is right that at this rung the combinatorial argument
    beats the certified floor. DECISION: rather than soften or relocate this, I added
    an explicit §3.3 paragraph stating the dominance, the two values, and that we
    keep the uniform form for its per-pair confidence semantics and open-set discarded-term
    property, NOT for its tightness. Per the project''s own rule, an evidence-class
    shortfall must not be covered by rewriting. CONSEQUENCE: the three edits cost
    one page; the body now overruns to p.14 against the 13-page limit, so I dispatched
    a float relocation (never a figure shrink, never a prose cut of the new disclosures)
    to restore the body to p.13. Report items NOT upheld: the claim that the abstract
    and conclusion state 336/990 and 0.186 unqualified — the paper qualifies the subset
    as provisional in §4.1 and §5.5, and the abstract qualifier was added at D163;
