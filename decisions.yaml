- id: D089
  date: 2026-09-14 20:10 UTC
  summary: 'D089: X13 bootstrap interval is invalid — multinomial bootstrap resamples
    the observed set, not the unseen mass'
  rationale: 'Reviewer found a critical defect in X13''s confidence interval, and
    I verified it directly. The point estimate missing_mass = 0.002024 (f1/n = 10198/5039616)
    is correct. But the bootstrap interval [0.000938, 0.000981] (center 0.000960)
    does not contain the point estimate and is 2.1x smaller — the hard signature of
    measuring the wrong quantity. The runner used rng.multinomial(n, observed_counts/n),
    which resamples from the OBSERVED species set and therefore treats it as complete:
    unseen species (exactly what missing mass estimates) do not exist in the resample.
    The expected singleton rate under that bootstrap is Σ p_i(1-p_i)^(n-1) ≈ 0.0009,
    matching the reported mean. So the interval estimates "singleton rate of future
    samples from the observed distribution", not "probability mass of unseen species".
    Plan required Eriksson-type; runner substituted naive multinomial bootstrap because
    "no implementation available" — honest annotation does not rescue a wrong-quantity
    estimator.'
  related_experiments:
  - exp_id: X13
    result: point estimate correct; bootstrap interval measures wrong quantity
    role: subject
  depends_on: []
