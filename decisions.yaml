- id: D046
  date: 2026-09-14 04:33 UTC
  summary: 'C3 REFRAMED from a sublinear-growth-RATE claim to a methods/limits finding:
    the plug-in chain-rule estimator cannot adjudicate the growth question (A and
    B both fail the known-truth gate), while the dependence itself is real (C: Markov
    over i.i.d. 45/45 at every k).'
  rationale: 'D044 downgraded C3 to INCONCLUSIVE because the chain-rule estimator
    deflates large-k divergence (est/true 1.0002 at k=5 -> 0.6769 at k=30) and therefore
    returns SUBLINEAR on analytically LINEAR truth. Three gated repair variants were
    dispatched under C027; each had to FIRST recover LINEAR on the known-truth control
    AND on the real-occupancy twin before touching real data.


    OUTCOMES:

    - A (estimator-family: two-sample delete-one JACKKNIFE bias correction on Laplace
    alpha=1-smoothed conditional KLs, directed terms projected to the nonnegative
    half-line): gate FAILED on BOTH arms. Real-data branch did not run. A bias-corrected
    estimator family does not fix the sparse-context bias.

    - B (support-conditioning: exposure restricted to contexts with n_P >= T and n_Q
    >= T): gate FAILED. The plain-IID arm never passed at ANY threshold in T = {5,10,20,50,100};
    the twin passed at all. The excluded mass required to make contexts well-occupied
    grows to 0.608 mean (plain) at k=30, i.e. the sparse contexts cannot be dropped
    without discarding most of the data.

    - C (test-route: nested first-order-Markov vs i.i.d., BIC): its OWN control is
    USABLE and discriminating (synthetic IID case -> IID favoured 12/12, median dBIC
    -21.77; synthetic dependent case -> Markov favoured 12/12, median dBIC 86689.85).
    On real data at k=30 across 45 services: Markov favoured 45/45, IID 0/45, ties
    0, median dBIC 110091.14; and Markov was favoured 45/45 at EVERY prefix length
    k=2..30.


    INTERPRETATION. Two estimator-repair routes failed outright; the growth-rate verdict
    cannot be recovered by fixing the estimator. But C answers a DIFFERENT question
    and answers it decisively: the dependence the framing posits is REAL -- an earlier
    heterogeneity confound was withdrawn on measurement (a pure heterogeneous-i.i.d.
    null falls about 47x short of the observed effect, so heterogeneity explains roughly
    2 percent) -- though this test establishes only that the sequence is FAR FROM
    GLOBALLY i.i.d., NOT that the dependence is first-order, because its i.i.d. null
    uses a single global p and therefore any position-wise marginal drift would suffice,
    so C3''s question is well-posed rather than vacuous. C is a corroboration, NOT
    a proof of the growth-rate claim, and must not be substituted for it.


    DECISION. Reframe C3 from a growth-RATE claim to a methods/limits finding with
    an existence corroboration: (i) the standard plug-in chain-rule divergence estimator
    cannot adjudicate the dependent-prefix growth question at these k and n, because
    its k-dependent sparse-context bias manufactures sublinearity — demonstrated on
    analytic-linear truth and its real-occupancy twin, and robust to two independent
    repair attempts (A, B); (ii) independently, the prefix is genuinely dependent
    (C: first-order Markov beats i.i.d. 45/45 services at every k=2..30 under a discriminating
    control), so the question the estimator fails to adjudicate is non-vacuous. CAVEAT
    to state: a first-order Markov law beating i.i.d. by BIC on real packet data is
    expected, so (ii) is a sanity corroboration and NOT itself the novel finding;
    the novel content is (i).


    This is a contribution-TYPE change (from a claimed empirical result to a methods/limits
    finding) and is reported to the user, not applied silently. It does not require
    the two-claim fallback: C3 remains a contribution, at reduced strength. The protected
    artifact x3_chain_rule_divergence.json is byte-unchanged (c19d7392...) across
    all three variants.'
  related_experiments:
  - exp_id: X3
    result: 'three gated repair variants: A and B failed their known-truth gates;
      C cleared its own control and found first-order dependence 45/45'
    role: subject
  depends_on:
