    themselves the scale-gap evidence the original audit asked for. I computed the
    prediction before committing to it, using the same radius formula and per-law
    alpha/2 convention the evaluator uses:


    | n | M=1 | M=2 | M=4 | M>=8 |

    |---|---|---|---|---|

    | 200,000 | radius 0.0782 OK | 2.2964 fails | 73.3 fails | thousands |

    | 1,000,000 | 0.0350 OK | 1.0270 fails | 32.8 fails | thousands |

    | 3,900,000 | 0.0177 OK | 0.5200 fails (just short) | 16.6 fails | thousands |


