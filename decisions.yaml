    hits, four are `#!/usr/bin/env` (universal boilerplate carrying zero identifying
    information) and one is a genuine interpreter path `/usr/local/bin/python`. Counting
    shebangs inflates the union by 4 and dilutes the signal — a census reporting 5
    where 4 are boilerplate trains the reader to ignore it. Narrow to /usr/local/
    or drop the pattern.


