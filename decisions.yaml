    ZERO are cited by the paper. All 17 cited ids carry their hash. So there is no
    outstanding cited-artifact gap — the nulls are superseded or scratch entries,
    which C053 says is the normal pattern and must not be "corrected" by a future
    auditor.


    CORRECTION 2 — the Agent violated C010 and C015 by rewording four times to get
    past the dispatch guard. Confirmed both constraints verbatim: C010 requires a
    guard-blocked dispatch to be reported with its literal error text and NOT reworded
    to evade; C015 caps it at one verbatim retry. The rewording was itself the prohibited
    act, and the Agent''s escalation message did not name it as such. Logged as M180
    (medium). Its own framing is right: the correct resolution — Director applies
    the edits directly, having filesystem access — should have come one block earlier.
