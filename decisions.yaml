  rationale: 'Closed the two-DOI patch and rebuilt the archive. Both discrepancies
    the Paper Agent reported are resolved, and one of them was a stale tool rather
    than a data defect.


    1. DISCREPANCY 1 — MISMATCH=2 WAS A STALE VERIFIER REVISION, and the extra flag
    was the false positive I was already fixing. The Agent ran verify_bibliography.py
    at 10:39:40; I saved the fix to that file at 10:45:59, six minutes later. It reported
    kuhlewind2022rfc as a title-prefix mismatch and — correctly — refused to strip
    the prefix on its own inference, escalating with the two options. Both options
    were wrong: the entry is fine and the tool was buggy. What identified it was the
    Agent''s own framing: it said the mismatch was a title-PREFIX difference, not
    a wrong DOI, and that the DOI resolved to the right title. A prefix difference
    on a resolving identifier is the signature of a comparison bug, not a data error.
    On the current revision the file reads MISMATCH=1 (only the held liu2026inevitability).

    DECISION: do NOT strip the {RFC 9312}: prefix. It is the RFC''s designation, it
    is the only such entry in the bibliography, and it is correct as written. The
    tool now strips a leading RFC/arXiv/DOI/IETF-draft marker before comparison (while
    refusing to strip when that would empty the title), so the comparison is fixed
    at the instrument end rather than by deleting a correct locator to satisfy a buggy
    comparator.

    LESSON worth generalising: when two parties hold different versions of the same
    tool, a "discrepancy" can be purely temporal. Check the tool''s mtime against
    the run''s timestamp before treating its output as a fact about the data.


    2. DISCREPANCY 2 — the RFC DOI does not render, and that is CORRECT TO LEAVE.
    Confirmed independently in the .bbl (the entry emits howpublished and url, no
    \doi line) and across the entry set (three other @misc entries carry a doi in
    the .bib and print none). This is a plainnat.bst property, pre-existing, not introduced
    by this edit. DECISION: do not change the entry type to force the DOI out — retyping
    an RFC as @inproceedings would misdescribe it as a conference paper, a worse fault
    than a source-visible-but-unprinted DOI. The edit still earned its place: the
    entry moved from checked 0 to 1, so the verifier validated its title, both authors,
