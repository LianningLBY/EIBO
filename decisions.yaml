- id: D136
  date: 2026-09-16 16:17 UTC
  summary: 'Proved the reviewers'' requested pairwise->open-set reduction cannot exist:
    the natural Le Cam generalisation is refuted by a separation counterexample (all
    pairwise tv ~ 0.9, achievable error 0), and no function of pairwise tv alone can
    lower-bound K-class error. The paper''s no-aggregation scope is therefore correct
    and can be strengthened into a proof, plus a conditional corollary under a stated
    separation assumption.'
  rationale: 'Round 6 names two clear-accept requirements: a substantive methodological
    addition and the Sec 3.3 coverage calibration. The named addition is a pairwise->open-set
    reduction. I evaluated that reduction and found it impossible, not merely unattempted.
    The natural generalisation of Le Cam (err_i + err_j >= 1 - tv_ij for every pair,
    summed) gives E[err] >= (1/(2K(K-1))) sum (1-tv_ij), which is correct for K=2
    but refuted for K>2 by direct test (100 violations in 400 randomised cases). Minimal
    counterexample: K=6 classes on a 32-symbol alphabet, each with 0.9125 mass on
    a private symbol; every pairwise tv ~ 0.9 while the Bayes-optimal error is exactly
    0, against a formula prediction of 0.05. The summation step fails because the
    pairwise bound is conditional on the pair-restricted problem, whereas a K-class
    estimator has strictly more information. The impossibility generalises: any function
    of pairwise tv alone is falsified by near-separable class sets, where all pairwise
    tv approach 1 but the achievable error approaches 0. Adding the unknown class
    does not rescue it - Le Cam then bounds only the unknown class against its single
    nearest known service, and converting that to a K-class floor requires a covering/separation
    assumption the paper does not state and X13 (missing MASS) cannot supply. Consequence:
    the paper''s current ''no aggregation'' scope is correct and can be STRENGTHENED
    into a proof that no aggregation of this object alone yields a positive open-set
    floor - a stronger reply to the reviewer than the reduction they requested. Recommended
    actions: add the impossibility with its counterexample to the paper, and add a
    conditional corollary under an explicitly stated separation assumption plus a
    measurement of how many corpus pairs satisfy it. This pairs with the finite-sample
    lower-bound tightening (D134/D135) to give one round two substantive increments.'
