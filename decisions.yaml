- id: D058
  date: 2026-09-14 06:50 UTC
  summary: 'Corrected my own ordering: the containment statistic uses only per-pair
    error and eps_hat_k_hi (never OSCR/FPR95), so the metric question does not block
    containment evidence. k=5 no longer waits on the AUC diagnostic; that diagnostic
    runs in parallel, and the run must persist per-class score material so one run
    serves both purposes.'
  rationale: 'CORRECTION OF MY OWN ORDERING. After D054 I ruled that "X12''s metric
    diagnosis precedes k=5". Reading the source shows that was over-broad.


    WHAT THE CONTAINMENT STATISTIC ACTUALLY CONSUMES, verified in code: deferred_floor_test()
    and the pre-registration declare the primary statistic as the number of floor
    violations among informative pairs (eps_hi < 0.5) against a one-sided binomial
    at nominal coverage 0.95, alpha unsplit. Its inputs are (a) eps_hat_k_hi, sourced
    per pair from the rebuilt X1 artifact, and (b) the per-flow detector error already
    present in the per-pair CSV as pred_label != true_label. It references OSCR and
    FPR95 NOWHERE -- grep for those terms hits only the metric function itself, never
    the containment path.


    CONSEQUENCE: the OSCR/FPR95 metric question does NOT affect containment evidence.
    The metric affects the REPORTED detector-performance numbers; containment depends
    on per-pair error versus the certified floor. These are separable. So a k=5 containment
    result would be valid regardless of how the AUC diagnostic resolves, and holding
    the run behind that diagnostic was my error.


    REVISED ORDERING (D057 does not change this; it is orthogonal): Stage 2 must still
    complete first (the statistic is still a stub), the panel must still be rebuilt
    because features are k-dependent, and the run keeps its declared configuration
    (k=5, no --cpu-only, --label-field APP, D043 months, guard untouched, new output
    names, submit_on_allocated). But the AUC diagnostic runs IN PARALLEL rather than
    in front, because it decides only the honesty of the reported performance numbers,
    not the validity of the containment evidence.


    ADDITIONAL REQUIREMENT so one run serves both purposes: before submitting, make
    the metric RECOMPUTABLE from what the run persists -- i.e. save the per-class
    score material a standard one-vs-rest AUC needs, not merely the argmax confidence
    the current CSV carries. If that material cannot be saved within disk limits,
    the required size must be stated rather than discovered after the run. If it can
    be saved, a single k=5 run yields both containment evidence and honest performance
    numbers, and the metric fix becomes post-hoc arithmetic instead of another run.


    UNCHANGED AND STILL BINDING: the vacuity rule -- a violation count computed on
    a vacuous detector state is reported as UNINFORMATIVE, never as a pass -- which
    is exactly the safeguard if the detectors turn out to sit far above the floor
    (the test would simply have no power, and that gets reported rather than a clean
    zero).'
