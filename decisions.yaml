- id: D004
  date: 2026-09-13 11:51 UTC
  summary: 'Commit to guarantee-strength-honest certification wording: the lower side
    is asymptotic (Michel et al., inlined + unit-tested), the small-k upper side is
    finite-sample. Correct the QUIC22 sampling claim — dynamic per-service, not uniform
    1:100.'
  rationale: 'The independent literature pass pinned the classifier-based TV lower
    bound (Michel/Näf/Meinshausen, arXiv 2005.06006, 2020) to its exact form — population
    objective sup_t [A0(t)+A1(t)]-1, fixed-cutoff HPLB with q_{1-alpha}*sigma_hat,
    adaptive variant splitting the error budget at alpha/3 with hypergeometric bands
    — and established that its guarantee is **asymptotic, not exact finite-sample**.
    Its public implementation (lorismichel/HPLB) was archived from CRAN on 2026-05-14,
    so the logic is inlined rather than depended upon.


    This makes the project''s two bracket sides epistemically asymmetric, which the
    "certification-grade" framing had not acknowledged: the small-k upper side (discrete
    plug-in UCB plus finite-alphabet concentration) is a genuine finite-sample certificate,
    while the lower side is asymptotic. Commitment taken: wording strength tracks
    guarantee strength. No asymptotic result is presented as a finite-sample certificate,
    and every reported number carries which kind it is. The inlined implementation
    must have unit tests binding the paper''s formulas to the code, and the alpha/3
    budget split and hypergeometric bands need a self-sufficient derivation in the
    paper — a reader must not have to chase an archived package.


    Related: the earlier claim that QUIC22 uses uniform 1:100 sampling was wrong and
    is corrected — that is QUICEXT-25''s rule, while QUIC22 samples dynamically per
    service (top 5% at 1:15, bottom 60% unsampled, middle 35% at 1:2-1:9, refreshed
    every 5 minutes). The correction strengthens the sampling recommendation rather
    than weakening it: uniform 1:100 makes tail-class services thinner than QUIC22''s
    dynamic scheme does, so service-stratified sampling with a per-service minimum
    flow count is mandatory. And because QUIC22''s SNI-to-service map publishes no
    minimum-flow threshold, our threshold must be self-defined and labelled as such
    — never presented as inheriting a CESNET convention.


    Deferred at the executing team''s request: the E6 realizability guarantee choice
    (VC-style uniform convergence vs Cohn-Tesoriero divisibility), to be decided once
    tightness numbers land. Constraint attached to that decision: if only an asymptotic
    guarantee is available, the large-k lower-bound sentence is written as asymptotic
    only; and if the two routes differ by an order of magnitude in tightness, measure
    both and decide from data rather than preference.'
  related_experiments: []
  depends_on:
  - D003
- id: D005
  date: 2026-09-13 12:13 UTC
  summary: 'Promote the RFC-derived A_k to a blocking dependency and restate the MVP
    gate on the a-priori reachable alphabet: at the library''s default base-64 alphabet
    k_cert is ~2-3 versus a [5,15] window, so the gate is decided by the alphabet
    choice, not the estimator or N.'
  rationale: 'The statistical core was audited against the paper''s own appendix,
    and the estimator is faithful — the Michel adaptive construction (the beta_{alpha/3,m}
    iterated-log band, the Eq.17 binomial trimming, the alpha/3 error split) is implemented
    as written. But the audit surfaced the number that decides the MVP, and it is
    bad.


    With the library''s default alphabet (log scheme, base 64 = 32 log bins x 2 directions)
    and the correct criterion, k_cert is approximately 2-3 at the full dataset''s
    average flows per service (194.3M/50 = 3.9e6). The gate window is [5,15]. The
    gate cannot pass at that alphabet, and not narrowly — it is off by the width of
    the window.


    The cause is that m in the concentration bound is set to grid_cardinality^k, the
    full product grid. The realized support shows how large that overcount is: at
    k=4, 2243 distinct symbols observed against 64^4 = 1.68e7 cells (a 7.5e3x overcount);
    at k=5, 2486 against 1.07e9 (4.3e5x); at k=6, 2500 against 6.9e10 (2.8e7x). Each
    power of 64 is paid for an alphabet almost nothing occupies. Recomputing with
    a smaller per-packet base brings k_cert into range (base 4 gives 8-9 at the full
    N; base 2 gives 17-19), but those figures must be re-derived under the corrected
    criterion before being quoted.


    The consequence is structural: **the gate outcome is decided by the alphabet choice,
    not by the estimator and not by the sample size.** Step 1''s RFC-derived A_k was
    scoped as a parallel verification task; it is promoted to a **blocking dependency**
    that must land before the first real bracket run. The quantitative argument for
    why a small proven |R_k| should exist: the first-k observable datagram alphabet
    is heavily constrained — the client Initial is padded to at least 1200 bytes,
    coalescing quotients the size distribution, and header protection hides framing
    — so a provable a-priori reachable set should grow far slower than 64^k. That
    is a hypothesis to prove, not an assumption to lean on.


    Two hard positions taken with this decision:


    1. **Validity is not negotiable to pass the gate (C005).** The realized support
    must never be substituted for m. It would make k_cert look good immediately, but
    m becomes a random quantity, the concentration inequality fails, and the certificate
    stops being distribution-free. That is a validity failure, not a tightness tradeoff.
    If a sufficiently small |R_k| cannot be proven, the gate fails honestly.


    2. **A gate failure at an unchosen alphabet must never be reported as a scientific
    finding.** At base 64 the honest answer is "no certified region exists" — but
    that would read as a failed MVP when it is actually an unmade decision. The distinction
    between "failed because we have not yet derived A_k" (our problem; return and
    derive it) and "failed with a properly derived |R_k|" (a genuine finding; a legitimate
    FAIL branch) must be explicit in every report.


    Also recorded: the plugin_upper_bound_assessment criterion `radius < 0.5` is necessary
    but not sufficient, since eps_hi = tv_hat + radius_1 + radius_2 implies the budget
    is radius < 0.5 - tv_hat, and tighter still if the two radii are equal. This is
    the same "criterion doesn''t certify what it claims" failure mode as the original
    gate, one level down, and must be fixed before any of its numbers are cited.


    Minor: interval_sanity.informative_fraction is a single boolean over one synthetic
    pair, not a fraction; and tv_lower_bound(method="classical") selects and evaluates
    its cutoff on the same held-out set, so it is upward-biased and is not a high-probability
    lower bound — it must be dropped from the reporting path or labelled a non-certified
    diagnostic that may never appear as eps_lo.'
  related_experiments: []
  depends_on:
  - D001
  - D003
- id: D006
  date: 2026-09-13 12:20 UTC
  summary: 'The spec does not force a small alphabet: the legitimate bound is (2M)^k
    with M a pre-registered design choice. M=2 with the RFC 9000 §14.1 1200-byte cut
    is the defensible candidate. Also: brief defect #4 (coalescing claim), and the
    novelty verdict — the measured bracket itself is the primary gap.'
  rationale: 'The RFC-derived alphabet study returned and it refutes the optimistic
    premise behind D005. The specification does NOT force a small support: "QUIC provides
    early lower-bound and structural constraints but no specification-level small-support
    bound as k grows," and the report explicitly warns that even M=10 yields 20^10
    possible prefixes, so an unrestricted plug-in upper bound is at high risk of becoming
    vacuous beyond small k. My earlier assumption — that the client Initial padding
    floor, coalescing quotient, and header protection together force the reachable
    set to grow far slower than 64^k — is not supported.


    The legitimate upper bound is (2M)^k where M is the number of size bins in a fixed
    a-priori grid with overflow. The load-bearing point is that **M is our design
    choice, not a spec constant and not a data-derived quantity**. So the path is
    not "the spec hands us a small alphabet" but "we pre-register a deliberately coarse-grained
    channel with small M." That is legitimate provided it is labelled as a design
    choice rather than presented as protocol-forced.


    The most defensible M=2 split is normative rather than data-driven: RFC 9000 §14.1
    requires client Initial datagrams to carry at least 1200 UDP-payload bytes, so
    the cut {<=1200, >1200} is well-defined a priori with a spec citation and requires
    no data inspection. Whether k_cert lands in [5,15] at 4^k under the corrected
    criterion is a measurement question now assigned.


    Two hard positions restated with this decision: (1) realized support must never
    be substituted for m (C005) — at k=4 only 2243 symbols are observed against 64^4
    cells, which is tempting but makes m random and voids the certificate; (2) if
    a bracket is only attainable at a small M, the paper must state that the bracket
    is for a deliberately coarse-grained channel, not for the full QUIC wire image.
    That sentence is the honesty floor.


    Also recorded: the brief contains a fourth factual defect. It claims coalescing
    reveals only the sum of packet lengths, which RFC 9000 §12.2 and RFC 9312 §2.2
    contradict — long-header Length fields do separate coalesced packets. The correct
    description is that size-only processing is a *deliberate coarsening*, not a protocol-forced
    loss of all boundaries.


    And the novelty check concluded. No category-4 precedent was found: no study measuring
    a per-service two-sided TV bracket on real encrypted traces with separately stated
    lower- and upper-side certification. The strongest counter-case, Self-Defense
    (Athanasiou et al., IEEE CSF 2025, arXiv 2411.10059), crawls real news sites and
    works with L1 distances (= 2*TV in the discrete setting) between page-size distributions
    — but it observes a single encrypted response size rather than a joint k-prefix
    law, and reports leakage, capacity and attack accuracy rather than a certified
    per-pair interval. It must be cited with the boundary stated explicitly. Positioning
    consequence: the *measured certification-graded bracket itself* is the primary
    gap, and the i.i.d. critique is demoted to supporting positioning — because single-letterization
    for a marginal observable follows from data processing for any joint law, while
    i.i.d./stationary-memoryless assumptions serve achievability and defense statements
    (mutual-information additivity, tensorization, exponential error decay).'
  related_experiments: []
  depends_on:
  - D005
- id: D007
  date: 2026-09-13 12:26 UTC
  summary: 'Restructure the MVP into two questions and pre-register a channel-granularity
    ladder: neither alphabet-control mechanism the brief offered survives scrutiny,
    so k_cert ∈ [5,15] is reachable only by a chosen coarsening that must be pre-registered
    and reported in full.'
  rationale: 'Two review passes plus the RFC and divisibility artifacts together force
    a restructure.


    The alphabet finding, now complete: the brief offered exactly two mechanisms for
    keeping the k-prefix alphabet small. (i) the spec-forced coalescing quotient —
    refuted, because RFC 9000 §12.2 and RFC 9312 §2.2 state that long-header Length
    fields *are used to separate* coalesced packets, so a parser recovers those boundaries;
    size-only processing is an analysis-defined equivalence, a deliberate coarsening.
    (ii) the RFC-derived admissible alphabet — refuted as a source of alphabet control,
    because the spec gives "no specification-level small-support bound as k grows"
    (even M=10 yields 20^10 prefixes). So `k_cert` ∈ [5,15] is reachable **only**
    by a chosen coarse quantization. That is a legitimate paper, but a different one
    from "the RFC forces this quotient and here is what it costs."


    One clarification materially reduces the pressure and is recorded as a correction
    to my own earlier framing: `m = (2M)^k` over a fixed a-priori grid **is itself
    a valid prior superset** of the reachable set, so a certificate computed with
    it is sound — merely loose. Refining to a proven `|R_k|` buys a *larger* `k_cert`;
    it does not buy validity. Therefore the MVP does not need the reachable-set refinement
    to produce an honest result.


    Decision: rather than pick whatever M happens to clear the gate — which would
    reproduce the original circular-gate failure in a new form — **pre-register a
    channel-granularity ladder and report every rung** (direction-only M=1 → direction
    x 2 size classes → direction x finer size bins). Because all rungs are pre-registered
    and all are reported, the gate "exists some pre-registered rung with k_cert in
    [5,15]" is not selection. The headline takes the form "k_cert = X at granularity
    Y", and the paper must state, for each bracket, which granularity it is for and
    what fine-grained observability the coarsening traded away.


    MVP restructure: the "riskiest assumption" becomes two separately-reported questions
    — Q1 (coarse-grained-channel k-prefix bracket, k_cert) and Q2 (PHIST two-sided
    certification) — with an explicit prohibition on either borrowing the other''s
    strength. They have genuinely different strengths: the PHIST object certifies
    a family-relative upper bound over a whole-flow summary (with a lower bound that
    lifts to absolute by data processing), while the k-prefix object has a finite-sample
    upper side at small k and an assumption-laden lower side at large k.


    Two wording corrections under C003, which exists precisely to prevent this drift:

    - The divisibility route was described as supplying "the assumption-free lower
    side." Its own artifact reports `is_distribution_free: false` and lists realizability
    among its assumptions. Accurate statement: it needs **no alphabet bound** (true)
    but **requires realizability**, so it is assumption-laden like the classifier-based
    eps_lo.

    - "protocol-quotiented observable alphabet" is replaced by "deliberately coarse-grained
    channel" everywhere.


    Also adopted: the novelty verdict (MEASURED_BRACKET_IS_NOVEL) is promoted from
    a pending task into the roadmap — the measured certification-graded bracket is
    the primary gap and the i.i.d. critique is supporting positioning, since single-letterization
    follows from data processing for any joint law while i.i.d./stationary-memoryless
    assumptions buy achievability and defense statements (tensorization, mutual-information
    additivity, exponential error decay). Two caveats stay stated: focused search
    rather than systematic review, and the ECH paper was not successfully fetched.


    Diagnosed and recorded: the disk-misread root cause. `/dev/md0` mounts at both
    `/init` and `/root/autodl-tmp` with XFS prjquota, and `df` deduplicates by device,
    printing only the 150M `/init` quota view — so even a full plain `df -h` omits
    the data disk. My prior remediation instruction ("close the capacity question
    with raw `df -h` numbers") would have reproduced the identical error a fourth
    time; the task now requires `mount` or an explicit-path `df`. Related: a mount-probe
    worker scored `failed` had in fact written a complete valid `probe.json` — a worker''s
    status flag does not determine its artifact''s validity.'
  related_experiments: []
  depends_on:
  - D005
  - D006
- id: D008
  date: 2026-09-13 12:32 UTC
  summary: 'Add a trivial-pass guard to the MVP gate: coarsening buys k_cert by driving
    measured channel TV toward 0, so informative-stratum membership alone passes automatically.
    PASS now also requires eps_lo bounded away from 0 on a stated fraction of pairs,
    reported with a number.'
  rationale: 'D006 asked whether k_cert lands in [5,15] at 4^k under the corrected
    criterion. Measured (alpha=0.05): at n=3.9e6 (the full dataset''s average flows
    per service) k_cert is 9 at tv_hat=0.05-0.20, 8 at tv_hat=0.30, and 7 at tv_hat=0.40.
    At n=1e7 it reaches 10. So M=2 clears the gate with margin at every realistic
    tv_hat — a measured answer rather than an open question.


    But the measurement exposes a claim-validity problem that would have survived
    into the paper. **k_cert is bought by coarsening.** At M=2 the channel is (direction,
    <=1200 vs >1200) — one bit of size information per datagram. Coarsening drives
    the measured channel TV toward zero, and the certified floor is (1-eps_hi)/2,
    so a small true channel TV yields a large floor: true TV 0.02 -> floor ~0.49;
    0.10 -> ~0.45; 0.60 -> ~0.20. Nearly every pair therefore satisfies eps_hi < 0.5
    automatically, which is exactly the gate''s PASS condition. **The restated gate
    would pass without testing the hypothesis — the same circularity as the original
    gate, relocated.**


    Decision: the gate requires BOTH halves — an informative stratum (eps_hi < 0.5
    reaching k_cert in [5,15]) AND discriminative evidence (eps_lo bounded away from
    0 on a stated fraction of pairs), reporting the fraction satisfying both. Where
    a non-negligible fraction of pairs has near-zero channel TV at the chosen M, the
    honest reading is "this channel cannot separate them," not "certified floor 0.49."


    M''s cost is now recorded so the trade is explicit (tv_hat=0.30, k_cert>=5): per-service
    n required is ~33k at M=2, ~868k at M=4, ~27.7M at M=8, ~886M at M=16. M=2 is
    cheap but informationally thin. This is not a reason to abandon the direction
    — a two-sided bracket at a coarse, spec-anchored channel with richness stated
    openly is a defensible paper — but the bracket may not be presented as applying
    to the full wire image, and D006''s caveat sentence is upgraded from a caveat
    to a requirement carrying a reported number.


    Also retracted: M004''s clause declaring the "~517 GB" data-disk figure unverified.
    It is now independently verified — `df -h /root/autodl-tmp` gives 550G/36G used/515G
    avail, and `stat -f /root/autodl-tmp` gives ~552 GB free; two tools, both by explicit
    path, agreeing. The data migration also completed: 2024-06.zip now sits on the
    data disk and the container-root copy is gone.'
  related_experiments: []
  depends_on:
  - D006
  - D007
- id: D009
  date: 2026-09-13 12:43 UTC
  summary: 'Fix a gate that selected against the better rungs: replace k_cert in [5,15]
    with k_cert >= 5 (no cap), and add an eps_hi floor-spread conjunct alongside eps_lo,
    since the certified stratum is TV < ~0.5 by construction and a coarse channel
    can satisfy the gate with every pair pinned at the maximum floor.'
  rationale: 'Two defects in the gate as written in D008, both caught before any real
    bracket table exists.


    First, the `k_cert` in [5,15] window selects against the better rungs. Measured
    at n=3.9e6, tv_hat=0.30: M=1 (direction only, base 2) reaches k_cert = 17, M=2
    reaches 8, M=4 reaches 5, M=8 reaches 4, M=32 (library default) reaches 2. A larger
    k_cert means the certificate survives to a larger k, which is strictly better;
    the upper endpoint of 15 was introduced when the concern was a k-in-the-hundreds
    claim outrunning the evidence, and it was never meant to reject the coarse rung
    that performs best. As written the gate marks the best rung FAIL and pushes the
    workflow toward a finer rung that certifies less. Corrected to `k_cert >= 5`,
    no upper cap, over the feasible range [1,30].


    Second, and more consequential: `eps_hi < 0.5` requires `tv_hat + radius_1 + radius_2
    < 0.5`, and the radii are strictly positive, so **no pair with channel TV >= ~0.48
    is certifiable at any k or any rung** (verified: at tv_hat = 0.50, k_cert = 0
    for every base). The certified stratum is therefore TV < ~0.5 by construction.
    That is the honest shape of the bound rather than a defect — but it means that
    on a coarse channel, where TV between pairs is driven toward zero because both
    laws concentrate on the same few symbols, nearly every pair satisfies `eps_hi
    < 0.5` automatically and the measured floor reads ~0.49 for all of them. That
    is the maximum possible floor and it conveys nothing about differences between
    services, which is the paper''s actual subject. Examples: M=1, k=5, channel TV
    0.001 -> floor 0.4974; M=2, k=5, same TV -> floor 0.4907; M=2, k=15 -> eps_hi
    16.6, certificate lost, floor 0.


    So the operative question is not "does k_cert exist" but "how wide is the eps_hi
    spread across pairs at the chosen rung". Q1 PASS now requires three conjuncts:
    k_cert >= 5; the eps_lo distribution bounded away from 0 on a stated fraction
    of pairs (the channel still separates something); and the eps_hi / certified-floor
    spread showing a stated fraction not sitting at the maximum floor (the upper side
    is not uniformly vacuous). Reporting only the first conjunct would be the third
    occurrence of the same "criterion does not certify what it claims" failure class
    this project has already caught twice.


    Also decided: (a) the channel-granularity ladder folds into the A_k worker''s
    deliverable, since it already computes most of the (2M)^k table, saving a dispatch;
    (b) the `div_n` question is closed — the artifact''s own `criterion` field reads
    "smallest n in SAMPLE_GRID whose median over 3 replications is positive" broken
    out by true TV, a different quantity from the tightness table''s fixed n=800 and
    not an inconsistency; (c) reusable operational fact recorded — the Zenodo REST
    metadata endpoint intermittently returns 504 while the direct file endpoint `/api/records/<id>/files/<name>/content`
    reliably returns authoritative Content-Lengths, so the direct endpoint is the
    primary path and the REST metadata call should be skipped. This explains the earlier
    stalled download attempts.


    Separately, on process: the team had begun rephrasing prompts to avoid literal
    `论文` / `paper` strings in order to get past a dispatch guard. That is precisely
    the "work around an obstacle" pattern that was ruled out earlier — an obstacle
    must be reported with its literal error text so routing can be fixed at the source,
    not evaded by rewording. Rephrasing was stopped and literal evidence requested.'
