- id: D017
  date: 2026-09-13 13:52 UTC
  summary: Stop the redundant XS re-download that displaced the critical path while
    the Parquet months stalled over an hour; adopt a headline format carrying eps_lo;
    and separate the assumption-free coarse-rung floor-persistence finding, which
    is citable unlike the rest of the ladder.
  rationale: 'Three items from this round, one of which is an operational blocker
    rather than a research finding.


    1. **Critical path displaced.** Measured directly on the data disk: `data/CESNET-QUICEXT-25-XS.chunks`
    = 6.0 GB (data total 11.0 GB) while `data/raw` = 2.0 GB with `raw/.2024-07.zip.parts`
    ≈ 0. So the 3.5 GB XS file has been fetched a third time (distinct inode, fresh)
    while the Parquet months — the sole input for both Q1 and Q2 — have not advanced
    for over an hour. Effort went into a redundant copy of an artifact we already
    had, on a path that is not the critical one. Directive: stop all XS chunk repair/resume,
    point the proven concurrent-range fetcher at the remaining 11 archives, resume
    2024-07 from its offset, delete-and-refetch the 0-byte 2024-08, keep the stall
    watchdog, and report a >5-minute aggregate throughput with endpoint and mechanism.
    For XS: retain the hash-verified existing copy, remove the redundant download
    only after confirming it is not the sole copy, and record provenance that the
    retained copy matches the official endpoint''s size and digest.


    2. **Headline format corrected.** `"at granularity Y, k_cert = X"` is maximized
    by making the channel useless, since a coarser channel always yields a longer
    certified region. Adopted: `"at granularity Y, k_cert = X with joint fraction
    J and eps_lo median L"`.


    3. **An assumption-free structural finding, now separable from the ensemble.**
    r0/k=5 floor medians rise with sample size: 0.4556 (n=1e4) → 0.4881 (2e5) → 0.4954
    (3.9e6). The floor approaches 0.5 as the certificate tightens, because it is `(1-eps_hi)/2`
    and eps_hi is radius-dominated for pairs whose true channel TV is near zero. Hence
    the rung with the longest certified region (r0, k_cert = 17-19) has a certified
    floor that is near-constant at ~0.495 and carries the least information about
    service differences — and more sample size does not fix this, it moves the number
    toward 1/2 while leaving it uninformative. This depends only on `eps_hi = tv_hat
    + radius_1 + radius_2` and near-zero coarse-grained channel TV, so it needs no
    compression-factor assumption and is citable, unlike the rest of the ladder. Also
    noted: my earlier statement that the ~0.455 level vanishes at larger n was directionally
    right but I mis-stated the direction of the change — it rises toward 0.5, which
    strengthens the finding rather than weakening it.


    Also recorded: the rerun gives the first positive Q1 evidence — r2 (M=4) at n=3.9e6
    has joint fraction 0.6 at k=5, the only rung that both certifies a floor and stays
    discriminative at k=5 — but it is narrow and rests on an assumed compression factor,
    so it does not settle Q1. And `k <= 30` is now measured (`ppi_len.max = 30`, `max_representable_k
    = 30`) rather than assumed from the ipfixprobe default, closing that task and
    giving the pre-registered k ∈ [5,15] ⊂ [1,30] framing measured backing.'
