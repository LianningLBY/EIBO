- id: D248
  date: 2026-09-25 08:06 UTC
  summary: 'Audited commit f4badc6: the manuscript half is correct and fully committed,
    but HEAD carried an OLDER builder (558 vs 957 lines) missing --mirror-to, the
    registered-hash assert, and the census guards — so the shipped archive was not
