- id: D036
  date: 2026-09-13 19:50 UTC
  summary: Q2's upper-bound multiplier of 31 is loose by 2x; the sharp valid constant
    is 16r, which makes Q2's informative fraction 0.3455 and ties Q1, reversing "Q1
    is the stronger certified object"
  rationale: 'Q2 v3''s upper bound multiplies its per-coordinate radius by 31 (eps_hi
    = tv_hat + 31*r_a + 31*r_b). That factor is loose by 2x. For delta = P_hat - P
    on the simplex, sum(delta) = 0, and |delta_c| <= r per coordinate by Hoeffding
    with a union over the 31 free coordinates. The reviewer''s derivation L1 = 2*max_S
    sum_{i in S} f_i <= 2*31*r implicitly bounds the positive part by 31r, but the
    sum-zero constraint forces the positive and negative parts to be EQUAL, which
    caps the positive part at 16r (k positives and 32-k negatives with equal magnitude
    sums implies min(k, 32-k) <= 16). Hence max_S sum_S f_i <= 16r, L1 <= 32r, and
    TV <= 16r -- a sharp bound requiring NO new assumptions. Verified by exhaustive
    search over the sign patterns for m = 2,4,8,16,32: the maximum L1 is exactly m*r
    in every case, i.e. TV <= m*r/2 = 16r at m=32. Adopting the sharp constant changes
    Q2''s informative fraction from 152/990 = 0.1535 to 342/990 = 0.3455, which is
    essentially TIED with Q1''s 340/990 = 0.3434 (ratio 1.006). This REVERSES the
    recorded conclusion that Q1 is the stronger certified object: that comparison
    set Q1''s tight reference radius against Q2''s loose one, so it measured bound
    conservatism rather than object strength -- precisely the error the reviewer warned
    about, now quantified. I explicitly did NOT adopt the Weissman categorical form
    (935/990 = 0.9444): it is valid for independent one-hot categorical observations,
    whereas Q2''s estimator is a mean of correlated simplex vectors, and the correlated-coordinate
    L1 concentration needs its own proof. Var(f_i(c)) <= P(c)(1-P(c)) does hold since
    f in [0,1] implies E[f^2] <= E[f], but that is not by itself that proof.'
