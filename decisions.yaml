- id: D004
  date: 2026-09-13 11:51 UTC
  summary: 'Commit to guarantee-strength-honest certification wording: the lower side
    is asymptotic (Michel et al., inlined + unit-tested), the small-k upper side is
    finite-sample. Correct the QUIC22 sampling claim — dynamic per-service, not uniform
    1:100.'
  rationale: 'The independent literature pass pinned the classifier-based TV lower
    bound (Michel/Näf/Meinshausen, arXiv 2005.06006, 2020) to its exact form — population
    objective sup_t [A0(t)+A1(t)]-1, fixed-cutoff HPLB with q_{1-alpha}*sigma_hat,
    adaptive variant splitting the error budget at alpha/3 with hypergeometric bands
    — and established that its guarantee is **asymptotic, not exact finite-sample**.
    Its public implementation (lorismichel/HPLB) was archived from CRAN on 2026-05-14,
    so the logic is inlined rather than depended upon.


    This makes the project''s two bracket sides epistemically asymmetric, which the
    "certification-grade" framing had not acknowledged: the small-k upper side (discrete
    plug-in UCB plus finite-alphabet concentration) is a genuine finite-sample certificate,
    while the lower side is asymptotic. Commitment taken: wording strength tracks
    guarantee strength. No asymptotic result is presented as a finite-sample certificate,
    and every reported number carries which kind it is. The inlined implementation
    must have unit tests binding the paper''s formulas to the code, and the alpha/3
    budget split and hypergeometric bands need a self-sufficient derivation in the
    paper — a reader must not have to chase an archived package.


    Related: the earlier claim that QUIC22 uses uniform 1:100 sampling was wrong and
    is corrected — that is QUICEXT-25''s rule, while QUIC22 samples dynamically per
    service (top 5% at 1:15, bottom 60% unsampled, middle 35% at 1:2-1:9, refreshed
    every 5 minutes). The correction strengthens the sampling recommendation rather
    than weakening it: uniform 1:100 makes tail-class services thinner than QUIC22''s
    dynamic scheme does, so service-stratified sampling with a per-service minimum
    flow count is mandatory. And because QUIC22''s SNI-to-service map publishes no
    minimum-flow threshold, our threshold must be self-defined and labelled as such
    — never presented as inheriting a CESNET convention.


    Deferred at the executing team''s request: the E6 realizability guarantee choice
    (VC-style uniform convergence vs Cohn-Tesoriero divisibility), to be decided once
    tightness numbers land. Constraint attached to that decision: if only an asymptotic
    guarantee is available, the large-k lower-bound sentence is written as asymptotic
    only; and if the two routes differ by an order of magnitude in tightness, measure
    both and decide from data rather than preference.'
