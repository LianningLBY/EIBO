    at or below the random baseline admits no scientific interpretation whatsoever
    and is an extremely strong signal of an L0 data/implementation defect. The red
    line is therefore TRIPPED, and interpretation is stopped.


    ADOPTED THE AGENT''S OBSERVATION: three INDEPENDENT detector families (gradient-boosted
    trees, prototype-radius rejector, uncertainty-quantified rejector) failing IDENTICALLY
    is far more likely a shared-path defect than three independent failures. This
    is testable from the OSCR code: the curve is built by lowering the threshold over
    `class_score`, which is finite only where `(pred == label) & accepted`, so the
    curve''s maximum TPR equals (positive & pred==label & accepted)/n_positive. If
    OSCR is approximately 0 then that quantity is essentially empty, which localizes
    the fault to exactly two candidates: the ACCEPT GATE (if accepted rate is approximately
    0) or the PREDICTION/LABEL ALIGNMENT (if accepted is healthy but pred==label fails
    for positives).


