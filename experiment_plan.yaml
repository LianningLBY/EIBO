    BOTH arms, including a twin control built on the REAL occupancy profile; its est/true
    ratio FALLS with k (1.0002 at k=5 down to 0.6769 at k=30; twin 0.9987 down to
    0.8824), i.e. it DEFLATES large-k divergence. THE CAUSAL MECHANISM IS ***NOT***
    ESTABLISHED, AND NOW FOR TWO REASONS. (a) The earlier text asserted sparse occupancy
    as THE measured mechanism, and that is CONTRADICTED BY VARIANT B OWN SCAN -- tightening
    the occupancy threshold makes the PLAIN arm MORE sublinear (power exponent 0.539
    / 0.420 / 0.372 / 0.260 / 0.210 at T = 5 / 10 / 20 / 50 / 100), while the TWIN
    arm moves the OPPOSITE way (1.042 / 1.027 / 1.016 / 1.011 / 1.007). If sparse
    contexts manufactured sublinearity, REMOVING them should push the plain arm toward
    LINEAR; it does not. *** THE ATTRIBUTION OF THESE VALUES WAS CORRECTED UNDER D062:
    THIS TEXT ONCE SAID the plain arm ran "vs a no-filter baseline of 0.651" and the
    twin "vs baseline 0.897" -- BOTH MISATTRIBUTED. 0.651 AND 0.897 ARE THE ORIGINAL
    KNOWN-TRUTH CONTROL VALUES, NOT VARIANT B VALUES; VARIANT B HAS NO no-filter FIELD
    IN ITS ARTIFACT AT ALL. *** The occupancy CORRELATION is real and unchallenged
    (frac_lt_5 0.0154 to 0.9055; effective n per context 64966 to 8.1), but the CAUSAL
    word may not be used. *** D056/D062: THE DOSE-RESPONSE CONTROL HAS BEEN REPAIRED
    AND ITS VERDICT IS NOW A CLEAN POSITIVE ON A VALIDATED AXIS -- BUT THE MECHANISM
    STILL DOES NOT FOLLOW. *** The off-by-4 k-indexing defect is FOUND AND FIXED (labels
    only, lines 179-181; est/true = 1.0001850 at k=5; the zero-intervention curve
    is now BIT-IDENTICAL to the original control at every labelled k=5..30, guarded
    by the permanent assertion assert_plain_unthinned_reference). On the corrected
    axis plain p falls monotonically 0.651 -> 0.625 -> 0.614 -> 0.603 -> 0.557 as
    sparsity rises 0.4156 -> 0.4493 -> 0.4841 -> 0.5317 -> 0.5694; twin 0.891 -> 0.821.
    *** BUT THE CAUSAL SENTENCE MAY NOT BE RESTORED, FOR THREE REASONS: (1) the control
    is SYNTHETIC, so it characterises the ESTIMATOR, not the CORPUS; (2) its own zero-thinning
    baseline is ALREADY SUBLINEAR (p = 0.651 on data whose analytic truth is EXACTLY
    LINEAR), so tracks_thinning means THE ESTIMATOR BIAS GROWS WITH SPARSITY, not
    that real-data sublinearity is corpus-driven; (3) the real-data p = 0.844 versus
    synthetic 0.651 comparison is NOT same-convention (200k synthetic i.i.d. flows
    vs 820 real pairs) and is a READING, NOT A FINDING. TWO CAVEATS WHEN CITING IT:
    it rests on ONE seed (20260914) while the approved control protocol asked for
    >= 3; and it is a SHALLOW response (about 14 percent relative). *** *** THE BASELINE
    BLOCKER STANDS (D062) AND BLOCKS BOTH VALUES: the original control and the corrected
    dose-response AGREE at p = 0.651, but VARIANT B READS 0.539 for nominally the
    same construction (200,000 synthetic 30-bit flows at p=0.30/q=0.70). PER THE STANDING
    RULE -- two artifacts reporting the same nominal quantity at the same nominal
    setting with different values is a BLOCKER ON BOTH, not a tension to note -- NOTHING
    MAY CITE EITHER BASELINE UNTIL RESOLVED, AND THE AGREEING PAIR SIDES AGAINST VARIANT
    B SO VARIANT B IS THE SUSPECT. The resolution is a COMPARISON OF VARIANT B SYNTHETIC-ARM
    GENERATOR against the one the other two use; that work is dispatched and its RESULT,
    not an inference, is what closes this. NOTE THE COINCIDENCE THAT CAUSED A FALSE
    CLAIM: the string 0.651 DOES occur inside the variant B artifact, but it is a
    COINCIDENTAL D_k median (10.651108547284124 at k=30), NOT a baseline field --
    a substring match on a number is not a field match. *** *** D057: THE PARAMETRIC
    ROUTE IS STRUCTURALLY NON-DIAGNOSTIC AND DOES NOT NARROW PART (i). *** It fits
    a Markov model of order 0/1/2 by BIC ONCE PER SERVICE and computes the curve UNDER
    THAT ALREADY-FITTED MODEL with NO PER-k REFIT, so for ANY stationary chain D_k
    is AFFINE in k (the order-0 branch returns D_k identically to 0). THE ONLY REACHABLE
    OUTCOMES ARE D_k = 0 OR AFFINE; SUBLINEAR IS UNREACHABLE, so LINEAR IS FORCED
    AND CARRIES NO INFORMATION ABOUT THE DATA. Numerically verified, not argued: a
    first-order chain [[0.8,0.2],[0.3,0.7]] has CONSTANT increments +0.128424 for
    every k=2..30, and an order-2 chain is constant at +0.187831748 for every k at
    least 4 (spread 3.6e-15). Its "decisively passed" control checks that the exact
    and fitted curves get the SAME verdict -- and BOTH ARE AFFINE BY CONSTRUCTION,
    so the control CANNOT FAIL and IS NOT A CONTROL. DO NOT CITE THAT PASS AS EVIDENCE.
    Consequently part (i) KEEPS ITS SCOPE -- the standard PLUG-IN estimator cannot
    adjudicate the growth question at this k window, n and occupancy-collapse curve
    -- and the honest strengthening is that NO ROUTE TRIED SO FAR CAN ADJUDICATE IT.
    The parametric route is ATTEMPTED AND VACUOUS, NOT a counterexample; it must NOT
    be repaired or re-run without a new approved design. *** THE EXISTENCE CORROBORATION
    (ii) IS NOT EVIDENCE (D055). *** The heterogeneous-i.i.d. arm, which by construction
    has ZERO within-flow dependence (each flow its own rate from the measured per-flow
    distribution, then 30 i.i.d. bits), returns Markov 45/45 at k at least 8 and 98.2%
