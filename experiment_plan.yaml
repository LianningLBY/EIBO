    check and the test can be passed by saying nothing. TEST STATISTIC: the NUMBER
    OF FLOOR VIOLATIONS among informative pairs against a one-sided binomial test
    at the nominal coverage level -- any excess falsifies either the estimate or the
    channel model and MUST be reported. ***THE CONTAINMENT STATISTIC IS NOT YET IMPLEMENTED***:
    `floor_violation_test` is a stub that unconditionally returns DEFERRED and the
    per-pair CSV carries the literal string in its columns; Stage 2 implementation
    is in progress. ***AND THE VACUITY RULE STANDS -- AN EMPTY SET IS NOT A PASS,
    AND A VACUOUS COUNT IS NOT EVIDENCE.*** IF THE INFORMATIVE STRATUM IS EMPTY at
    some k, that k contributes NO validation evidence and this is stated, not papered
    over; likewise a detector whose true-positive rate is near zero yields zero violations
    FOR A VACUOUS REASON and must be reported as UNINFORMATIVE, never as a pass. ***K
    IS PINNED AT 5 -- MANDATORY, AND NOW STRUCTURALLY ENFORCED*** (the default was
    deleted and omission now refuses with an actionable message): k=5 is the ONLY
    k whose informative stratum is POPULATED -- at M=1 the certified upper-side count
    is 340/990 at k=5 and 28/990 at k=10, but 0/946 at k=15 and 0/820 at k=30. ***A
    SILENT EMPTY SET IS MORE DANGEROUS THAN A LOUD REFUSAL***: a run at k=15 reaches
    DONE while evaluating its primary statistic on the empty set. ***L0 -- THE DETECTOR
    PANEL IS UNDER DETERMINATION, NOT CONDEMNED.*** OSCR reads about 1e-3 and FPR95
    is undefined nearly everywhere, BUT the SAME run''s row-level agreement with the
    true label is 48.6% / 13.5% / 58.1% against a ***MAJORITY-CLASS*** baseline of
    14.73% (train-side, 745,293 of 5,058,007) / 24.89% (held-out test-side) -- NOT
    against the superseded uniform 1/53 = 1.89%, which is WRONG because the true service-label
