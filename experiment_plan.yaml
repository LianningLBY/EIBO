    DIAGNOSTIC. The magnitude is nevertheless about 58x larger than that null (arm
    k=30 median dBIC about 1,896 vs real about 110,091), so heterogeneity does not
    explain the size either -- and neither the vote nor the magnitude establishes
    "first-order", because the i.i.d. null uses a SINGLE GLOBAL p, so any position-wise
    marginal drift would suffice. A POSITION-WISE i.i.d. null (or variable-order Markov
    selection) is REQUIRED before "first-order" may be asserted at all, AND IS THE
    ONLY LISTED ROUTE NOT YET SHOWN TO BE VACUOUS. *** PRE-REGISTERED WINDOW, CORRECTED
    -- the first version was unfalsifiable by construction. *** It confined adjudication
    to the set of k where two-sided brackets exist -- which per X1 is {5,10}, i.e.
    TWO points, one resting on 11 pairs (1.1%). A growth-RATE claim needs at least
    3 points to have leverage, so any concave curve would have fit; worse, the window
    was defined by the object that dies first, making "inconclusive" the PRE-DETERMINED
    outcome. THE DESIGN THAT WORKS computes D_k over ALL 990 pairs across the FULL
    k range (5 through 30), and uses the certified subset ONLY to validate the estimator.
    This separates the growth claim from the certification claim -- many k-points
    for the rate, while C1 is untouched; D_k is defined on the k-prefix law, so this
    is its natural domain. ***k beyond the largest certifiable rung is EXPLORATORY
    ONLY and must be labelled so*** (at large k only the one-sided lower bound survives,
    and growth evidence there is structurally weakest). DISCIPLINE -- the window and
    the null are fixed before the measurement. REPORT the estimate, the confidence
    treatment, and the window used; and if the estimator cannot separate sublinear
    from linear over the FULL k range, report the test as inconclusive rather than
    a direction. ***DISPOSITION (D057): C3 IS RETAINED AS A THREE-CLAIM PAPER AND
    IS WRITTEN AS A METHODS/LIMITS FINDING -- NOT CUT, AND NOT NARROWED. A TWO-CLAIM
    PAPER IS NOT AN OPEN QUESTION.*** *** GENERAL RULE, THIRD INSTANCE IN ONE DAY:
    BEFORE treating any control or test as evidence, ASK what would this have to output
    for the hypothesis to be FALSE? If the answer is nothing it could output -- as
    here, where both the test and its control are affine by construction -- IT IS
    NOT A TEST. Same family as (a) the original known-truth control that could not
    exercise the mechanism, and (b) the empty informative stratum at k=15, a statistic
    defined on an empty set. ***'
