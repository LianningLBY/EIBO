  - round: 3
    reviewers:
    - 1
    - 2
    - 3
    note: 'All three render-confirm. RESOLVED SPLIT: the radius is correctly calibrated to 0.975 so the 0.95 label is a conservative understatement (R2''s reading stands); BUT R1 and R3 agree the preferred fix - radius -> ln(1/alpha_law) - would shrink the radius, lower eps_hi, and RAISE 340/336, i.e. Table 1 must be RECOMPUTED, not merely relabelled. R3 adds: the alternative (relabel to 0.975) would force Sec 4.4''s null from 5% to 2.5%, worsening the already low-power detector test.'
