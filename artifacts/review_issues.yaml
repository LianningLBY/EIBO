- id: L13-W3
  summary: 'NEW must-fix from the R2-requested / R1-executed cross-check: the appendix''s LP row-sum identity is printed as an EQUALITY where only an INEQUALITY holds. Printed constraint: r_i = sum_{j!=i}(w_ij + w_ji) = 1 for the K known classes and 0 for the unknown class. Then sum_{i!=j} w_ij(err_i+err_j) = sum_{i in known} err_i, whereas M E[err] = sum_{i in all} err_i = sum_{known} + err_U. The printed ''...= M E[err]'' therefore holds only if err_U = 0, which is false in general — and is exactly what Eq (3)''s discarded unknown-class term acknowledges. Correct relation: sum_{known} err_i <= M E[err]; the a-fortiori argument runs unchanged in that direction, so the LP''s validity and the 0.363 value are unaffected — only the printed justification word is wrong. R1 notes this is the SAME defect family as the R9 ''no smaller / no larger'' item, and was in fact INTRODUCED by the R12 fix that made the U-class row-sum explicit (the older, vaguer text did not expose the equality).'
  category: method
  severity: warning
  status: resolved
  first_raised_round: 13
