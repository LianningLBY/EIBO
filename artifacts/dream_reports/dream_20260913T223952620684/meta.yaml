tier_definitions:
  shared_research_constraints:
  - 'Object set is fixed: the k-prefix chain-rule symbol law (X1) and the whole-flow
    rectified PHIST lattice law (X2) remain two coexisting certified objects. Neither
    is ranked against, substituted for, or summed with the other in any tier.'
  - 'Declared channel is fixed: (direction, size) only. The exporter''s row-0 inter-packet-timing
    channel stays deliberately excluded; no SNI, UA, TLS-extension, or CID data is
    consumed in the declared channel. X9 reports the SNI-inclusive price as a measured
    delta, never as a redefinition of the channel.'
  - 'Evaluation identities are fixed: CESNET-QUICEXT-25 XS subset, 45 services at
    the 2000-flow threshold, 990 service pairs, coverage 990 (k=5) / 990 (k=10) /
    946 (k=15) / 820 (k=30). Pair set and service set do not change between tiers.
    Replication target is fixed as CESNET-QUIC22 (one month, 102 labels), same protocol,
    same channel, same split policy.'
  - 'Split policy is fixed: flow- and time-disjoint splits; packet-level splitting
    prohibited; month-level split for the corpus closure; the 69-flow 2024-05 fragment
    is excluded unconditionally.'
  - Rung ladder is fixed at M in {1,2,4,8,16}; k grid fixed at {5,10,15,30}. No tier
    may add or drop a rung or a k point to rescue a claim.
  - 'Alpha convention is fixed: per-law alpha/2 = 0.025 on each side, union bound
    over the two laws, joint 0.95 per side. Unstated splits are not citable in any
    tier.'
  - 'Gate definition is fixed: (eps_lo > 0.05) AND (eps_hi < 0.5) on ONE named object
    per cell, upper side finite-sample strict, lower side asymptotic. No tier may
    relabel the lower side as proven or as a certificate.'
  - 'Baseline set for X12 is fixed: LightGBM on k-packet features, SepSpace-style
    prototype-radius rejector, RoNeTC-style uncertainty-quantified rejector, frozen
    Pcap-Encoder probe; metrics OSCR and FPR95 per held-out service at 5/10/20 percent
    label holdout.'
  - 'Venue and goal are fixed: USENIX Security 2027 C2 retained in every tier. ''Not
    met'' is a PI discussion, not a unilateral fallback; the worst tier is a reframe,
    not a rescope of the venue.'
  - 'Uncertainty recorded rather than resolved: the reference-radius values in the
    X1 record are a per-row recomputation that is still pending confirmation by a
    run that itself emits the reference radius. Every tier inherits this as an open
    dependency, and no tier may quote the 2x-loose columns.'
  - 'Uncertainty recorded rather than resolved: Step-0 occupancy PASS is provisional
    on the XS subset with unknown month coverage; DST_ASN remains an audited confound
    (32/53 services single-ASN), not an environment axis.'
  - 'Uncertainty recorded rather than resolved: registry entry E7 is DONE/failed with
    no metrics recorded; its scope is treated as a confound to be re-run, never as
    a negative result.'
  scientific_invariants:
  - TV = 0.5 * L1, therefore any TV radius carries two 0.5 factors. The single reference
    is src/eibo/statcore.py::tv_upper_bound (radius_i = 0.5*sqrt(m/n_i) + 0.5*sqrt(2*ln(2/alpha_law)/n_i));
    the formula is never restated in a spec, in any tier.
  - 'Per-row coherence: eps_lo <= eps_hi on every pair. A violation is a BUG to report,
    not an anomaly to explain. X1 measured 0/990; X2 measured 0/990 against its own
    radius and must be re-confirmed after the radius work.'
  - 'Per-item data-processing inequality: TV(vector)_i >= TV(marginal)_i must hold
    990/990 (X8). A failure means the two sides were not computed on the same flow
    set, and is a BUG.'
  - 'Monotonicity facts measured on the XS subset are preserved, not treated as outcomes:
    tv medians at k=5 rise with M (0.5805 / 0.8833 / 0.9248 / 0.9462 / 0.9673); saturation
    (tv >= 0.99) rises with M (0.0 / 0.105 / 0.239 / 0.336 / 0.391); the certifiable
    fraction falls with M.'
  - M=1 has the HIGHEST k_cert (17/8/5/4/3 at n=3.9e6, tv=0.30), not the lowest. This
    is why M=1 is the only rung retaining a certificate at k=10 (11/990). The retracted
    'smallest alphabet, lowest k_cert' parenthetical must not reappear.
  - 'The mechanism direction is fixed: a finer alphabet RESOLVES MORE (higher channel
    TV) and it is CERTIFIABILITY, not resolution, that fails, because eps_hi = tv
    + radius > 0.5 kills the certificate for high-tv pairs. The inverted story would
    be caught by any reviewer plotting tv against M.'
  - The two certified objects must never be described as corroborating. Their own-radii
    fractions (340/990 and 342/990) agree only under each object's own radius convention;
    the 2x2 decomposition (common-radii 340 vs 935 and 81 vs 342; statistics differ
    2.7x, constants 7.34x, opposite directions, cancelling) must travel with the fractions
    in every tier.
  - 'Superseded and prohibited artifacts: the 2x inlined radius columns, the 31r PHIST
    form, the Weissman categorical form (935/990, unproven for a correlated-simplex-vector
    estimator), and the retracted 984/990 arithmetic and 0.0002-margin fragility statement
    must not be quoted in any tier.'
  - 'Control-flow invariants: two masking arms must use DIFFERENT flow sets (requiring
    min(PPI_LEN,k) == k on both sides makes the comparison structurally null, which
    is what the recorded same_flow_set_both_arms = true run does); ''no change at
    this k'' is a statement about that k only.'
  - The M_max frontier is always reported as a closed-form FUNCTION pinned at tv (M_max
    = 0.5*(n*B^2)^(1/k)), never as an unpinned absolute. The M=8 crossover in n (~4.2186e6
    at k=5, only ~8 percent above the corpus mean) forbids any absolute 'M>=8 impossible'
    claim.
  - D_k is defined on the k-prefix law and is estimated over ALL 990 pairs across
    the full k range 5..30, with the certified subset used only to validate the estimator.
    Null (linear) and predicted direction (sublinear) are fixed before measurement,
    and 'inconclusive' is a permitted outcome.
  tier_varying_factors:
  - Whether the pending reference-radius confirmation reproduces the headline and
    which side of the convention gap the confirmed radius lands on.
  - Realized certifiable fraction at each rung, and whether the k=10 rung survives
    at all.
  - Whether the chain-rule divergence exponent is measurably sublinear, indistinguishable
    from linear, or linear (assumption truth value for C3).
  - Informative fraction of the PHIST object under the tight-form L1 radius, versus
    the 14.2x-looser 31r form actually run.
  - Whether the lower side validates on real channels at full n (X5's stated limitation),
    i.e. realized lower-side pass fraction.
  - X12 floor-violation counts in the informative stratum, and how many of the four
    detector families the containment holds for.
  - X11 QUIC22 replication fidelity and X10 full-corpus month-level certifiability.
  - Whether the assumption-laden divisibility bound (X6) is valid and non-vacuous
    at large k.
  - Measured SNI/ECH price and the outcome of a correctly-designed (disjoint-flow-set)
    masking re-run.
