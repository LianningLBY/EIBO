      term is switched on. Because that shift is small relative to the X12 comparison,
      the floor-violation count is 0 with and without the term, so switching the unknown-class
      term on changes no verdict. The with/without pair is reported side by side per
      block, which is precisely what a reader needs to see how much of the open-set
      gap the unknown class accounts for: it accounts for a bounded, measurable slice,
      not the whole gap and not an unbounded residue. The mandatory 1:100 sensitivity
      is the discriminating step: under a nested 1:100 sub-sample of the export (effective
