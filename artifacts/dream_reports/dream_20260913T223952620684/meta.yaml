    result_rationale: 'This tier is defined by the original framing holding end to
      end with every pillar resolving in the framed direction, and RC7 is one of the
      pillars: the unknown-class mass must be a quantified, deployment-scoped, benign
      term rather than a hole in the open-set story. The site''s destination-host
      popularity law is heavy-tailed with a large singleton mass (f1 = 31,204 of 62,318
      distinct hosts), which is exactly the regime Good-Toulmin is built for, so the
      forward new-class estimate is finite and the Eriksson interval is tight enough
      to be informative rather than vacuous. Because the two halves are time-adjacent
      at one vantage, the realized new-class mass is below but close to the predicted
      central value, so the interval covers the held-out observation in all four blocks
      (coverage 1.0) — the estimator is validated on real held-out channels, not merely
      on a synthetic ensemble. The resulting pooled missing-service mass, 2.12% of
      flow mass (95% PI [1.58%, 2.79%]), is small enough that the open-set containment
      bound moves by 2.1 points when the term is switched on, and since that shift
      is far below the X12 comparison threshold the floor-violation count stays at
      0 in BOTH arms — the with/without pair therefore reads as benign accounting
      rather than as a rescope. The 1:100 sensitivity is the only place the best tier
      can be threatened: at an effective 1:10^4 the singletons collapse and the naive
      estimate falls to 0.68%, but the thinning correction recovers 2.03% and the
      bound shifts by only 0.0009, so the conclusion is a property of the estimator,
      not of the sampling rate. Under these outcomes no claim sentence needs editing:
      the gate is 336/990, the two certified objects are untouched and unranked, and
      the k grid is untouched because the FoF is k-independent bookkeeping.'
