      rung retaining a certificate at k=10 (20/990). The new k=15 slice retains 5
      pairs; k=30 retains none because k_cert(M=1) = 17 < 30 — not because of any
      unpinned absolute. The frontier is therefore reported as the closed-form function
      pinned at tv (M_max = 6 at tv=0.30, k=5, n=3.9e6, inside the pre-registered
