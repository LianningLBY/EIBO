      in. Invariants. eps_lo <= eps_hi holds 990/990 (0 violations), and TV(vector)
      >= TV(marginal) holds 990/990 — the two sides are on the same flow set per pair,
      and the pair check is a self-failing mismatch detector rather than a claim.
      Margins. The nearest in-gate lower margin is +0.0181, the nearest upper pass
      margin +0.0063 and the nearest upper failure margin +0.0069; the single joint-gate
      exit sits at a lower margin of 0.0062. No fragility statement is made about
      any of these, and no near-zero margin is quoted.'
