      coverage, so every pillar lands in the framed direction. The confirming run
      emits the reference radius natively, reproduces the upper-side count (340/990),
      and — because the lower side is now measured at full n with no assumed pairs
      — lifts the joint gate to 339/990: exactly one pair passes the upper side and
      exits on the lower side, versus four in the earlier record. The certifiable
      fraction falls monotonically in M (0.3424 / 0.0667 / 0.0071 / 0 / 0) while saturation
      and tv medians rise monotonically, so the mechanism is the framed one: finer
      M resolves MORE (higher tv), and it is CERTIFIABILITY that fails because eps_hi
      crosses 0.5. Because the reference radius is the tighter convex-consistent form,
      M=1 keeps a certificate at k=10 (20/990) and the new k=15 slice retains 5 pairs,
      while k=30 retains none — exactly matching the fixed k_cert ordering with M=1
      highest (17/8/5/4/3). Zero per-row coherence violations and 990/990 per-item
      data-processing mean the two sides sit on one flow set per pair. No claim sentence
      needs editing.'
