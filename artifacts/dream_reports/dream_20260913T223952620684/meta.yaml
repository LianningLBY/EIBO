      after X10: the corpus the paper already characterises remains the foundation,
      and this entry is the second-corpus defence, not a replacement for it.'
  - name: X12
    plan_id: X12
    description: 'Detector-validation containment test, pre-registered as a one-sided
      coverage test on the mandatory informative stratum. Only pairs with eps_hat_k_hi
      < 0.5 (predicted floor above 0.25) enter the primary statistic; 0.5 <= eps_hi
      < 0.9 is a secondary stratum reported but not primary; eps_hi >= 0.9 is reported
      and excluded. Test statistic: the number of floor violations (observed per-pair
      detector error below the predicted floor (1 - eps_hi)/2 outside its confidence
      interval) among informative pairs, against a one-sided binomial test at the
      nominal coverage level; any excess falsifies either the estimate or the channel
      model and is reported. Four detector families are evaluated: LightGBM on k-packet
      features, a SepSpace-style prototype-radius rejector, a RoNeTC-style uncertainty-quantified
      rejector, and a frozen Pcap-Encoder probe, with OSCR and FPR95 per held-out
      service at 5/10/20 percent label holdout. Address-field randomization (DST_IP/SUBNET/ASN/COUNTRY)
      is applied at test time for any baseline consuming those fields, with before/after
      deltas reported; our bound uses only the declared (direction, size) channel
      and must be exactly invariant. If the informative stratum is empty at some k,
      that k contributes no validation evidence and this is stated. The test is single-sided
      by pre-registration: it can falsify the containment, never confirm the lower
      side as proven.'
    expected_results:
      x12_floor_violations_informative_stratum: 0
      informative_pairs_k5_M1: 340
      secondary_pairs_k5_M1: 356
      excluded_pairs_k5_M1: 294
      informative_pairs_k10_M1: 11
      informative_pairs_k15_M1: 0
      detector_families_containment_holds_for: 4
      violations_by_family:
      - 0
      - 0
      - 0
      - 0
      combined_informative_pair_tests: 1360
      combined_violations: 0
      one_sided_binomial_p_excess: 1
      predicted_floor_min_informative_stratum: 0.25
      our_bound_delta_under_DST_randomization: 0
      lower_side_relabelled_as_proven: false
      empty_stratum_contributes_validation_evidence: false
    result_rationale: 'The best tier assumes the brackets predict real detector behaviour
      on the informative stratum, so the pre-registered one-sided test should return
      no excess violations for any of the four families. Zero violations is the natural
      outcome because the containment is a floor on distinguishable error: pairs with
      eps_hi < 0.5 are close on the declared channel, and no detector can operate
      below the floor without extra information, which the declared channel excludes
      by construction. The tier also assumes the corrected masking comparison shows
      no service-dependent contamination and that the SNI/ECH price is small, so the
      address-randomization check should show our bound exactly invariant while only
      the baselines that consume address fields move. The 340 informative pairs at
      k=5, thinning to 11 at k=10 and to zero at k >= 15, is a direct consequence
      of the frozen gate definition and the upper-side counts; an empty stratum there
      yields no evidence and is stated rather than papered over. A violation count
      of 0 rather than 1 is chosen because the containment is assumed to hold for
      all four families in this tier; the allowed range admits a single violation,
      but any violation would downgrade the containment to partial and is not the
      best-tier realisation.'
