    analysis: 'The frontier is a function, not a number: M_max(k, n, tv) is the algebraic
      inversion of the certificate condition, and every value in the table is reported
      with tv_hat pinned. At n = 3.9e6 the k=5 frontier is 7/7/6/5/4/3/2 across tv_hat
      = 0.00/0.10/0.20/0.30/0.40/0.45/0.48, and it reproduces the integer rungs with
      zero error; nothing is fitted to the data. The two required additions are present.
      First, the M=8 crossover at k=5 is carried as a curve in n: on the tv_hat =
      0.00 row it needs n = 4.2186e6, only about 8 percent above the corpus mean,
      so no absolute impossibility statement is written - a single larger service
      would refute it. At tv_hat = 0.30 the same crossover needs n = 2.66e7, which
      is reported as the same closed form evaluated elsewhere, not as a different
      claim. Second, the k=8 frontier falls to 2 at low tv and 1 above tv_hat = 0.40,
      and the k=10 frontier is 1 everywhere, so the certificate provably does not
      exist at these k and n; that is the reason a finer alphabet cannot help, and
      it is a statement about existence, not about resolution. The inverse view agrees
      with the frozen ladder: k_cert = 17/8/5/4/3 across M = 1/2/4/8/16 at tv = 0.30,
      which is why M=1 is the only rung retaining a certificate at k=10 and why the
      coarsest rung is the only viable one. Above tv_hat = 0.4985 no rung certifies
      at any M. The cross-check against the measured monotonicity closes in direction:
      saturation rises (0/0.105/0.239/0.336/0.391) and median channel tv rises (0.5805/0.8833/0.9248/0.9462/0.9673)
      exactly as the frontier falls, so the closed form and the empirical ladder agree
      without either being fitted to the other. The certifiable fraction falls monotonically
      (0.3394/0.0475/0.0030/0/0). The reference radius is confirmed as recomputed,
      so the slack term carries a single convention throughout; the radius expression
      is not restated and no 2x-loose column is quoted.'
