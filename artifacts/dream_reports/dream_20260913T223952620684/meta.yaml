    analysis: 'X12 is the entry that turns the bracket from an internal object into
      a falsifiable claim about detectors, and in the best tier it comes back clean.
      The primary statistic is the floor-violation count on the mandatory informative
      stratum (eps_hi < 0.5, predicted floor above 0.25), which at k=5 contains 340
      pairs; the secondary stratum (0.5 <= eps_hi < 0.9) and the excluded stratum
      (eps_hi >= 0.9) are reported so the check cannot be passed by diluting it with
      trivially covered well-separated pairs. Across the four named families the combined
      1360 informative pair-tests return zero violations, so the one-sided binomial
      test finds no excess and the containment is not falsified. The observed per-pair
      errors sit at 0.31 to 0.44, comfortably above the 0.25 floor minimum, with the
      frozen Pcap-Encoder probe closest to the boundary, which is the expected ordering
      because it is the least tuned family. OSCR and FPR95 degrade smoothly as label
      holdout grows from 5 to 20 percent, and no family crosses the floor at any holdout.
      The address-field randomization check separates two things that are easy to
      conflate: baselines consuming DST_IP/SUBNET/ASN/COUNTRY move by up to -0.046
      OSCR, while our predicted bound is exactly invariant (delta 0.000), because
      the declared channel consumes (direction, size) only and never sees those fields;
      the invariance is itself evidence that the implementation did not leak address
      information into the bound. The stratum thins with k (11 pairs at k=10, none
      at k >= 15), and the entry states that those k contribute no validation evidence
      rather than reporting them as confirmations. The test is single-sided by pre-registration
      and can only falsify the containment; the lower side is never called proven
      or a certificate, so the guarantee asymmetry is preserved exactly as C1 states
      it. No ranking, substitution, or summation between the k-prefix and PHIST objects
      is introduced here, and the results support RC3 and RC6 without strengthening
      any claim sentence.'
  - name: X13
    plan_id: X13
    description: 'Good-Toulmin missing-service mass, scoped as a DEPLOYMENT-SITE quantity
      and never as a universal unknown prior. The frequency-of-frequencies is taken
      over fine-grained anonymised destination-host identifiers on the 1:100 flow
      export of the CESNET-QUICEXT-25 XS capture (10M rows scanned; 1,000,000 sampled
      flows, 62,318 distinct destination hosts in the pooled reference frame). The
      identifiers are used ONLY as aggregate bookkeeping for this deployment-scoping
      term: they are never consumed by the declared (direction, size) channel, never
      enter the detector, and never enter either certified object''s bracket. The
      Good-Toulmin estimator is fit on a reference half-window and predicts the number
      of destination-host classes unseen in that half but present in a flow- and time-disjoint
      evaluation half-window, with Eriksson-type 95% prediction intervals; the design
      is repeated over four disjoint time blocks (2024-05 excluded unconditionally
      per the fixed split policy). A MANDATORY 1:100-sampling sensitivity analysis
      re-estimates the mass on a nested 1:100 sub-sample of the export (effective
      1:10^4) both naively and with an explicit thinning correction. All quantities
      are reported WITH and WITHOUT the unknown-class term, separately, so the reader
      can read off how much of the open-set gap the unknown class accounts for.'
