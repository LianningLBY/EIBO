      restricted to PPI_LEN >= k, min(PPI_LEN,k)==k makes the prefixes identical and
      the signed difference identically 0.0, so it could not have detected a padding
      effect no matter how large one was. The corrected best-tier run separates the
      arms'' flow sets and recovers a real but small effect: median signed differences
      of +0.00042 / +0.00113 / +0.00201 / +0.00347 at k=5/10/15/30, positive at every
      k because zero-padding loads the lowest size bin and the loading grows with
      k as more flows fall below the prefix. The effect is bounded and flow-length-driven
      rather than service-driven (1.7 percent service-identity variance share, permutation
      p=0.34), so it does not contaminate cross-service comparisons, does not flip
      a single k=5 gate verdict, and leaves the frozen k=5 tv medians and saturation
      fractions exactly in place. RC5 therefore closes as a precondition with the
      k=30 number explicitly labelled a long-flow-subset quantity and the reading
      rule honored: these are per-k statements, not a global clean bill.'
  - name: X8
    plan_id: X8
    description: 'Vector-level distinguishability as a one-sided result. We compute
      TV of the per-flow normalised 32-vector law over all 990 service pairs and validate
      it with the per-item data-processing inequality TV(vector)_i >= TV(marginal)_i,
      asserted on every pair as a self-failing object-mismatch detector: it must hold
      990/990, and a failure is a BUG meaning the two sides were not computed on the
      same flow set. New artifact; nothing is overwritten. This is a stronger distinguishability
      statement than the one-hot marginal, but it is NOT a certified object and is
      never presented as a better bound on X1''s symbol law or X2''s packet-cell law,
      never ranked against them, and never summed with them.'
