  - name: X6
    plan_id: X6
    description: 'Rejection-generic / divisibility lower bound: TV(P1,P2) <= eps iff
      the pair is eps-divisible, i.e. a test using only P1 and P2 exists with error
      <= eps; under full realizability the bound is 1 - 2*(optimistic error). It requires
      NO alphabet bound, so it reaches the large-k region where the plug-in certificate
      is gone. Assumption-laden (VC / Cohn-Tesoriero-type realizability), stated explicitly
      and never presented as distribution-free. Deliverable: make ''at large k only
      the one-sided lower bound survives'' a MEASURED result with numbers. Validity:
      over replications the bound must not exceed the true TV more often than the
      declared alpha allows, with the split stated up front; a no-split run is reported
      as the contrast that shows the assumption is doing the work.'
