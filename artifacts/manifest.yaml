- id: art_20260922_91028b
  name: d181_same_channel_classifier
  type: data
  description: 'D181 Exp2: Same-channel classifier validation — LogisticRegression
    on the 32-symbol one-hot representation (packed k=5 prefix, direction+size bits)
    matching the certificate''s object. 990 pairs, 70/30 train/test split (stratified,
    random_state=0), Clopper-Pearson 95% upper bound on test error. FALSIFIER FIRED:
    73/990 pairs (7.4%) have error_ub > eps_lo. However, the comparison error_ub vs
    eps_lo MIXES SCALES — error rate is a [0, 0.5] quantity while eps_lo is a TV lower
    bound in [0, 1]. The meaningful comparison is error_ub vs (1-eps_hi)/2 (the certified
    error floor), not vs eps_lo. The 73 violations need re-interpretation before concluding
    whether the certificate is confirmed or not. Corpus sha 6b323c4c verified. Ran
    on the platform-local container (sklearn 1.9.1), NOT server 111 (1.9.0) — the
    generation caveat applies (593/990 rows differ between versions, C052). Runtime
    736s, well within 4h budget.'
