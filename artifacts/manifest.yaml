- id: art_20260918_b5a5cd
  name: eth_T2_T3_results (v2, corrected constant statement) — threshold sensitivity
    + planning tool
  type: data
  description: 'UPDATED BYTES (v2) of the T2/T3 combined results artifact. Supersedes
    the earlier registration art_20260918_c962b4, which held the pre-correction prose.
    T2 (threshold-sensitivity, ledger q1_lower_side_full_n.json rows filtered M=1,k=5,
    n=990): reported under BOTH eps_lo conventions. The 335-vs-336 gap is a CONVENTION
    LABEL, not a discrepancy - 336 is the full-n eps_lo convention (the paper''s headline)
    and 335 is capped; the one-pair difference is the boundary pair (21,23), capped
    0.0498 fails the 0.05 gate while full-n 0.0588 passes. Upper-threshold sweep (eps_hi
    < t, lower > 0.05) capped/full-n: 112/113, 220/221, 335/336, 453/454, 579/580,
    747/748. Lower-threshold sweep (eps_lo > t, upper < 0.5) capped/full-n: 340/340,
    338/339, 335/336, 312/320, 229/239, 125/140, 20/35. Segments at the real gate:
    335 capped / 336 full-n joint, 650 fail-upper. FINDING: gate counts are driven
    almost entirely by the UPPER threshold; the lower threshold is nearly inert over
    0.01-0.10. CONVENTION MUST BE STATED in any published table. T3 (flow-count planning
    tool, m-free route, per-side, gate 0.5, equal-n approximation) values UNCHANGED:
    k=5/M=1 380/990 feasible; k=10/M=1 114/990; k=15/M=1 20/946; k=30/M=1 0/820. CORRECTED
    FORMULA STATEMENT (the only substantive change in v2): route is eps_hi = tv_hat
    + sqrt(2*ln(2/alpha)/n); solving at eps_hi < gate gives n > C/(gate - tv_hat)^2
    with C = 2*ln(2/alpha) = 8.764053. The earlier prose wrote H0 = 2.9604 (which
    is sqrt(C), the constant INSIDE the radius) as though it divided the squared slack,
    which understates n by exactly sqrt(C) ~ 2.96x. The NUMBERS were always correct
    and are unchanged - the algebraic identity (sqrt(C)/slack)^2 = C/slack^2 confirms
    the implementation used the right constant. Caution carried forward: medians are
    CONDITIONAL ON FEASIBILITY and the distribution is bimodal (k=5/M=1 spans 42 to
    2.09e9), so a median without its feasible fraction misleads. HASH VERIFIED: content_sha256
    below was re-derived from these bytes by the Director on 2026-09-19 and matches
    the registered copy exactly. NOTE ON A MISLABEL THE REGISTERING AGENT CAUGHT:
    an earlier Director instruction attached a138eb6e... to art_20260918_c962b4; that
    was WRONG. a138eb6e... belongs to THIS entry (b5a5cd, the corrected bytes); the
    superseded entry c962b4 holds 275aa73e... The agent verified the difference in
    the copies themselves (b5a5cd carries the constant_definition block, c962b4 does
    not) and declined to apply either hash. Do not tag c962b4 with the v2 hash.'
  content_sha256: cee50b40b7913279144c537cc632610a28c352606c0994bda5b2e62d72bc2d17
