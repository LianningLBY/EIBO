- id: art_20260920_f18204
  name: track5_radius_form_coverage
  type: data
  description: 'Coverage consequence of the radius-form convention at the Track-5
    reference setting (n=60000, B=64, conc=0.1, true TV=0.400, 1000 paired replicates,
    seed 20260919). Five arms share ONE draws stream and ONE fixed SE (the bare cluster-robust
    sandwich SE, = reference_runner.sandwich_radius / z_0.975) so that ONLY the radius
    form varies: sym_pooled 0.989, one_sided_pooled 0.984, uncentred_pooled 0.982,
    normal_theory_per_rep 0.978, sym_bootstrap_per_rep 0.994. PRE-REGISTERED FALSIFIER
    FIRED (falsifier_fired=false means it did NOT fire): the falsifier was ''coverage
    identical across conventions within CI => convention is cosmetic'', and every
    computable-vs-computable paired difference CI EXCLUDES zero, so the convention
    is NOT cosmetic for coverage. Coverage tracks the radius monotonically (largest
    radius sym_bootstrap 0.041097 -> highest coverage 0.994; smallest normal_theory
    0.033172 -> lowest 0.978). CRITICAL READING CAVEAT: the three ''pooled'' arms
    are ORACLE (they use the realised D_rep distribution and hence TRUE_TV), so their
    coverage is near-target by construction and is NOT an achievable result; only
    normal_theory_per_rep and sym_bootstrap_per_rep are computable per-replicate coverage.
    ALSO NOTE normal_theory_per_rep''s radius equals the existing Arm B radius exactly
    because it is the same SE times the same z - it is form-invariant by construction,
    unlike the quantile forms. PAIRING RECONCILIATION: on these 1000 replicates NO
    pairing tested reproduces the recorded ~11.39%; the closest is sym_vs_uncentred_endpoint
    at 12.65%, sym_vs_centred_one_sided is 8.73%, and the oracle gaps run larger than
    recorded. The paper''s qualitative claim (the two forms differ and are not interchangeable)
    is confirmed and, if anything, understated; the specific 11% number is not reproduced
    here. Controls: statcore known-control MATCH, tv_hat reconciled every replicate,
    empirical SE 0.0166407 agrees with the recorded n=60000 value 0.0169715 to ~2%,
    tv_hat mean 0.4021600 above true 0.400 as expected under block dependence.'
