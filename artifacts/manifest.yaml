  name: x3_variant_b_support_conditioning.json (D063 freeze-fixed, refusal implemented)
  type: data
  description: 'Variant B (exposure-conditioning repair) after the D063 freeze fix.
    THE FREEZE IS CONFIRMED FROM THE ARTIFACT: the plain known-truth curve prior to
    the fix was PINNED at 5.908567858844014 for every k=16..30 with 14/25 increments
    EXACTLY ZERO, while the ORIGINAL unfiltered control has 0/25. Cause verified in
    the code path (np_ctx >= threshold & nq_ctx >= threshold, lines ~155-180): with
    fixed-length 200000-flow samples the context space grows while per-context counts
    collapse -- new distinct contexts 4096/8192/16381/32400/59608/183870/395041 at
    k=13/14/15/16/17/20/30 but new RETAINED 2464/2162/400/5/0/0/0, so the retained
    total saturates at 8762 from k=16. The retained set CANNOT grow further without
    changing the estimator''s conditioning definition, so the CONSTRUCTION WAS NOT
    ALTERED and the runners now REFUSE instead. RESULT: B plain status REFUSED_CONSTANT_TAIL,
    freeze onset k=16, non-frozen fit window k=5..16, CORRECTED POWER EXPONENT p =
    1.093 -- LINEAR, NOT SUBLINEAR. The former full-window p=0.539 is no longer emitted.
    EXCLUDED MASS: non-frozen-axis value at k=16 is 0.26544640625; the previous k=30
    figure was 0.6082380833333334. The mass calculation does not use the fitted curve,
    so the freeze did not algebraically create the mass VALUE -- but k=30 IS post-freeze,
    so a non-frozen-axis reading is the k=16 value.'
