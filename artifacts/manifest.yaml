- id: art_20260920_0e4cdb
  name: track5_skewness_n5000
  type: data
  description: 'Track 5 signed-deviation skewness at n=5000, the well-powered measurement
    that closes the Track 5 line. MEASURED (n=5000 outer replicates, seed 20260919,
    n=60000, B=64, concentration 0.1, true TV 0.4): sd_D 0.016078662416248272, mean_D
    0.0024295366666666437, skewness_D -0.00889332930149822 (g1 = m3/m2**1.5, 1/n central
    moments), se_skewness 0.0346306299062346, CI95 [-0.07676936391771803, 0.05898270531472159]
    CONTAINING ZERO, bootstrap CI95 [-0.07163561421837167, 0.05398868734350119] also
    containing zero, z -0.25680529997801577, falsifier_fired true. RESULT: the proposition
    that D = tv_hat - TRUE_TV is negatively skewed is NOT supported; the signed distribution
    is essentially symmetric at this power, so a symmetric and a one-sided radius
    coincide and the two-sided form was never the binding issue. The one-sided radius
    arm is therefore pointless and the line closes on a well-powered negative. CONTROL
    CORRECTION (recorded in the artifact): sd_control_ok was initially false because
    the pre-registered band [0.0168,0.0171] was mis-specified - the defect is that
    it did NOT SCALE with n, not that it was narrow. SE(sd)=sd/sqrt(2(n-1)) makes
    the identical numbers a different test at every replicate count (~0.35 SE wide
    at n=5000 but ~0.09 SE at n=200). Correct band [0.015275, 0.018669]; the observed
    value is inside; the superseded band is retained as sd_control_band_as_briefed.
    The one real discriminating success of the control is EXCLUDING the known-wrong
    no-inner-draws stream value 0.0151017711, which falls below 0.015275 - so it is
    ''excludes the known-wrong stream'', not a tight validation. STREAM CONFIRMED
    by an independent 5000-replicate reproduction of the same loop and seed agreeing
    on sd, mean and skewness to every printed digit; no fork exists. TRAJECTORY (recorded,
    non-monotone): sd 0.0169715358 (n=200) -> 0.0167711400 (500) -> 0.0162722914 (1000)
    -> 0.0161860482 (2000) -> 0.0159308502 (3000) -> 0.0160786624 (5000), dipping
    at n=3000 - so NO single window is a checkpoint at any n, which is the primary
    reason to anchor a control to a convergent estimate with an n-scaled band rather
    than to a prefix. Skew sequence -0.139556 -> -0.103819 -> 0.055349 -> 0.036285
    -> 0.025623 -> -0.008893 CROSSES ZERO TWICE, making the sign non-resolvable concrete
    as a sequence. canonical_sd_D 0.0160787 (well-powered) with the n=200 value 0.0169715
    recorded alongside, 1.03 SE high. lengths_construction_all_identical: all three
    producers use [64]*937 + [32]; an earlier agent claim of a differing construction
    is retracted. CLAIM BOUNDARY: modelled block law at this design only, never real
    traffic.'
  content_sha256: 6558da3814befb13c9d86105b973b2f5e528d9c921fd125fdd800492db329ee9
