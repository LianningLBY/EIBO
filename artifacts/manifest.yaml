- id: art_20260919_fa717f
  name: t1c_lower_side_M1_uncapped
  type: data
  description: 'T1c: the UNCAPPED M=1 lower side at k=5, computed from the stored
    rung histogram (no corpus read; width 32 needs only ~0.72 GB). This is the artifact
    D168 rests on - it establishes that the paper''s own UNCAPPED convention (full
    per-service flow counts, no sample cap) is reproduced by our lower-side pipeline.
    CONVENTION: UNCAPPED, sample_cap_per_service null, cap_is_none true. 990 pairs.
    RESULTS: median eps_lo 0.5554959462078262; 987/990 pairs clearing the 0.05 lower
    gate; m-free upper; joint gate 360; invariant violations 0. AGREEMENT WITH THE
    PUBLISHED UNCAPPED M=1 COLUMN: published median 0.55480 and gate 986; this run
    gives 0.55550 and 987; n_a identical in 990/990 pairs; median per-pair difference
    0.004. The relationship is AGREES WITHIN RESAMPLING NOISE - NOT a bit-identical
    reproduction, and it must not be described as one. Carries a `falsifiers` field.
    SIGNIFICANCE: this is the M=1 anchor for the T1 ladder, and it is the uncapped
    counterpart of the capped symbol-map control (art_20260919_177723, median 0.53677),
    which was 0.5368 capped vs 0.5555 uncapped - so the convention choice raises the
    M=1 median, and uncapped can only RAISE lower values, which is why the T1 conclusion
    (joint == upper-only, 127 at M=2, 98 at k=10) is convention-invariant in substance.'
  content_sha256: be60d3d189d67ac66d16674bb9d89e7d901c50f3309ee4f6d7fd317d7c418498
