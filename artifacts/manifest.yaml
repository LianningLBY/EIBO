- id: art_20260922_764458
  name: d181_balanced_accuracy_risk_interval
  type: data
  description: 'D181 Exp2 follow-up: balanced-accuracy risk interval. Re-fit the same
    LogisticRegression on the same 32-symbol one-hot representation with identical
    splits (reconciliation passed at 1e-15 tolerance on all 990 pairs). FALSIFIER
    DID NOT FIRE: 0/990 violations. Every pair''s balanced_error >= certified_error_floor
    = (1 - eps_hi_mfree)/2. The certificate is validated on its own object with an
    independent classifier test. Summary: median balanced_error 0.366, median certified_error_floor
    0.198, smallest margin 0.0024 (no pair comes close to violating). Median tv_implied
    = 0.267 vs median eps_lo = 0.535 — the classifier recovers less TV than the certificate''s
    lower bound, which is expected because the one-hot logistic regression is suboptimal.
    612/990 pairs have tv_implied < eps_lo (classifier weaker than the certified TV
    bound) and 378/990 have tv_implied >= eps_lo. 0/990 have tv_implied > eps_hi_mfree.
    Ran on platform-local container (sklearn 1.9.1). Runtime well within 30 min budget.'
