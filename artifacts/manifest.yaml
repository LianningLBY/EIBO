- id: art_20260918_d34a40
  content_sha256: f6572257c33aecf700a4ac8ca34d9b7cb60af926f3f6ad1542d4b5ac9bb8ad34
  name: 'alphabet_penalty_scout.md — alphabet-penalty feasibility scout (verdict (c):
    horizon inherent to method class)'
  type: report
  description: 'Alphabet-penalty feasibility scout (research line, CPU-only, non-experimental):
    can the sqrt(m/n) alphabet penalty in the finite-sample TV upper certificate be
    beaten under a DECLARED (a-priori) alphabet, per C005? VERDICT: (c) — polynomial
    declared-alphabet dependence in the finite-sample TV/L1 bound is unavoidable up
    to logarithmic improvements, so the short certificate horizon is INHERENT TO THE
    ASSUMPTION-FREE METHOD CLASS, not a defect of our implementation. DECIDING BASIS:
    Jiao-Han-Weissman 2018 (IEEE TIT, "Minimax Estimation of the L1 Distance") Thms
    3-6 — minimax squared error S/(n log n) in the stated large-alphabet regime —
    with the matching Omega(sqrt(S/n)) lower bound from han2015l1distribution Thm
    2 (arbitrary S-symbol laws). CAVEAT THAT MUST TRAVEL WITH IT: "Do not claim that
    the exact sqrt(m/n) exponent is unimprovable" — the honest claim is inherent polynomial
    dependence, not optimality of our exponent. ONE LIVE THREAD FOUND AND NOT CLOSED:
    the bounded-entropy route (Han-Jiao-Weissman 2015 Thms 3-4), finite-sample risk
    controlled by H/log n, requires an APRIORI ENTROPY CLASS rather than realized
    support (so it satisfies C005) — but H is not established for our corpus and it
    is a risk bound, not a certificate. ADAPTIVE-PARTITION ROUTE CLOSED HONESTLY:
    sample splitting can make a selected partition conditionally fixed, but it then
    certifies the COARSENED partition''s TV; no complexity/approximation correction
    with logarithmic dependence in the full declared alphabet was verified. Also records
    that the scout EXCLUDED OUR OWN DKW CITATIONS (wei2011dkwtwo, reeve2024dkwmassart)
    ON OBJECT-MISMATCH GROUNDS — they bound the ordered-CDF sup-norm, not the full
    subset supremum that categorical TV requires; first time those citations were
    explicitly ruled out of scope rather than assumed applicable. FULL VERSION WORTH
    BUILDING: no (2-4 weeks estimated). BLOCKERS: none. Theorem statements were checked
    in the cited papers'' full text, not abstracts (D001 discipline). No .tex opened
    or modified. Registering as a new entry; the existing similar-named entries are
    not merged or repointed.'
