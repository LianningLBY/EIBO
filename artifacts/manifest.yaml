- id: art_20260914_b4d6db
  name: 'X3 controls (both artifacts) — verdict DOWNGRADED to INCONCLUSIVE: known-truth
    control fails, smoothing shape unstable'
  type: data
  description: 'X3 controls, BOTH artifacts. THE VERDICT DOWNGRADED: X3''s SUBLINEAR
    adjudication is NOT CONFIRMED and is now INCONCLUSIVE, decided by the pre-committed
    rule. (QUESTION 1) The fitted SHAPE is NOT STABLE across smoothing settings: smoothing=0.0
    -> INCONCLUSIVE (p=1.25, sqrt_AIC_adv=9.03, ratio=5.018); smoothing=0.5 -> SUBLINEAR
    (p=0.838, adv=88.84, ratio=1.556); smoothing=1.0 -> SUBLINEAR (p=0.766, adv=60.63,
    ratio=2.071). The adjudication is therefore not robust to an estimator choice.
    NOTE p=1.25 is impossible as a fraction and indicates the unsmoothed fit lies
    outside the admissible region -- it must NOT be quoted as a probability. (QUESTION
    2) The fixed-population recompute SURVIVES: with the pair denominator pinned at
    820, verdict stays SUBLINEAR (p=0.844, adv=74.15, ratio=1.503), so COMPOSITION
    is not the explanation. (THE DECISIVE FAILURE) The known-truth control FAILS.
    On synthetic data whose analytic truth is LINEAR BY CONSTRUCTION (p=0.30, q=0.70,
    per-position truth 0.3389191441548814, so D_k = k*0.3389191441548814), the estimator
    returned SUBLINEAR in BOTH arms -- plain_iid (p=0.651) and the real-occupancy
    twin (p=0.897). So the estimator CAN MANUFACTURE a sublinear verdict on linear
    truth, which means X3''s own SUBLINEAR result cannot be attributed to the dependence
    structure rather than to the estimator. THE OCCUPANCY DIAGNOSTIC EXPLAINS WHY:
    contexts explode with k (712 at k=5 to 18,692,427 at k=30) while effective n per
    context collapses (64,965 to 8.12), with 90.5% of k=30 contexts holding fewer
    than 5 samples -- exactly the sparse-context regime the known-truth control was
    built to emulate. ESTIMATOR REPRODUCTION PASSED at 1e-9 (k=5/10/20/30 recomputed
    to diff 2.2e-16/4.4e-16/1.8e-15/1.4e-14 against the published medians), so the
    reimplementation is admissible. WHAT THIS DOES NOT SAY: it does NOT say D_k grows
    linearly. It says the pre-committed test could NOT distinguish sublinear from
    linear on this data. The dependent-prefix framing is neither confirmed nor refuted
    by X3. Reading discipline: D_k rising 1.38 -> 8.52 is an ABSOLUTE increase; ''sublinear''
    concerns the GROWTH RATE, and the verdict rests on the fitted SHAPE -- which is
    what proved unstable. No rescue attempted. The pre-existing x3_chain_rule_divergence.json
    was NOT modified; the auditable runner is left at /root/eibo/x3_controls.py.'
