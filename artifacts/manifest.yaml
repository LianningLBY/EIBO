- id: art_20260920_69abb9
  name: sklearn_solver_probe_111
  type: data
  description: 'Read-only environment probe on the host that produced the canonical
    lower-side ledgers (server 111, interpreter /root/miniconda3/bin/python3). Records
    sklearn 1.9.0 / numpy 2.3.2 / scipy 1.18.1 and the classifier''s solver (lbfgs)
    and l1_ratio (0.0). NOTE: the file records penalty as the sentinel string ''deprecated''
    - a sentinel is not a regularisation type. The EFFECTIVE penalty was established
    BY MEASUREMENT, not inference: fitting the bare sentinel and fitting an explicit
    penalty=''l2'' on the same data gives BIT-IDENTICAL coefficients (max abs diff
    0.0), so with l1_ratio=0.0 the effective penalty is l2. The estimator ATTRIBUTE
    retains the sentinel after fit because fit() assigns the resolution to a local
    variable and never writes it back to self.penalty (zero `self.penalty =` assignments
    in fit()), so reading the attribute - before or after fitting - cannot answer
    this question. Pre-fit and post-fit attributes agree; no deprecation warning was
    emitted on this host (a bare sentinel emits none; writing penalty=''l2'' explicitly
    is what warns). All resolution paths point under /root/miniconda3/lib/python3.12/site-packages,
    confirming the miniconda install answered rather than either venv on that host.
    Evidence for constraint C052''s wording correction and for the finding that sklearn
    1.9.0 and 1.9.1 resolve the classifier identically (no solver/penalty mechanism
    explains the ledger generation split; cause unexplained). The coefficients used
    here were measured on the local container (sklearn 1.9.1), where the same sentinel->l2
    resolution applies.'
