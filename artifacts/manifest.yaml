    = 2,714,067,131 bytes, servicemap 9,415 bytes; official Zenodo ZIP = 20,952,008,298
    bytes; documented uncompressed size UNVERIFIED. Data disk before = 507G free,
    after = 498G free. FIELD MAPPING CONFIRMED PRESENT: PPI row 1 = direction, row
    2 = size, PPI_LEN = packet-sequence length (uint16), APP = service label, CATEGORY
    = category label; PPI row 0 = IPT timing, present but EXCLUDED. Library metadata
