    0.99970 at n=32 and 0.41532 at n=2048 for truth 0.300), so it could not have failed
    — read it as "no contradiction observed", never as "verified"; check_3 rows_checked=120
    violation_count=0 for eps_lo <= eps_hi; check_4 weak classifier never beats strong
    (weak 0.000 in all rows, strong 0.076905333-0.169629102, strict_improvement_count=20/20);
    check_5 identical distributions give tv_hat near 0 with the bound shrinking in
    n (0.16578 -> 0.08320 -> 0.03905 -> 0.02134). ALPHA PROVENANCE read from the RETURNED
    objects, not typed as constants: upper result.alpha=[0.025] (per-law); lower canonical
    requested 0.025 / returned [0.025]; lower ORIGINAL requested 0.05 / returned [0.05]
    RETAINED beside it as evidence the non-crossing result was not fragile. The corrected
    lower-bound means move in the direction theory requires (a smaller alpha means
    a larger Michel penalty, hence a smaller eps_lo): check_3 shifted_four_symbol
    n=256 0.025819471 -> 0.010686205, n=1024 0.129470649 -> 0.112211300; check_4 strong
    range 0.094568448-0.186992519 -> 0.076905333-0.169629102; identical_four_symbol
