- id: art_20260914_023753
  name: X3 controls (fixed population + occupancy) — composition control survives;
    occupancy collapses at high k
  type: data
  description: 'X3 controls, second artifact: fixed-population recompute and the occupancy
    diagnostic. FIXED-POPULATION RESULT: pinning the pair set to the flows eligible
    at k=30 (denominator 820 at EVERY k) leaves the verdict SUBLINEAR (p=0.844, sqrt_AIC_adv=74.15,
    ratio=1.503) versus the original variable-population fit (p=0.838, adv=88.84,
    ratio=1.556). Endpoints: original k=5 n=990 median 1.3813736271298078 -> k=30
    n=820 median 8.52179151609541; fixed k=5 n=820 median 1.2429739095119168 -> k=30
    n=820 median 8.521791516095425. So the sublinearity SURVIVES the composition control
    -- the shrinking flow set (990 -> 946 -> 903 -> 861 -> 820) is NOT what produced
    it. OCCUPANCY DIAGNOSTIC (the part that explains the known-truth failure): k=5
    contexts=712, frac_lt_5=0.0154, effective_n_per_context=64965.6; k=10 contexts=18873,
    frac_lt_5=0.1925, effective_n=4722.3; k=20 contexts=2532150, frac_lt_5=0.7248,
    effective_n=58.0; k=30 contexts=18692427, frac_lt_5=0.9055, effective_n=8.12.
    Contexts explode while per-context mass collapses -- at k=30, 90.5% of contexts
    have fewer than 5 samples and effective n per context is 8.1. This is the sparse-context
    regime in which a per-position smoothing bias can accumulate with k and fake sublinearity;
    it is exactly the regime the known-truth control was constructed to emulate, and
    there the estimator indeed returned SUBLINEAR on linear truth. Also records the
    runner/cache inventory: the ORIGINAL X3 runner was deleted from the repo, so this
    controls pass had to RE-DERIVE the estimator and PROVE IDENTITY by reproducing
    the published per-k medians at 1e-9 -- which it did. The auditable runner is left
