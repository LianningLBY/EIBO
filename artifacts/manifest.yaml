- id: art_20260922_a6078a
  name: d181_tv_saturation_simulation
  type: data
  description: 'D181 Exp3: TV saturation cause verification. Known-truth iid simulation,
    4 true TVs x 4 alphabet sizes x 2 sample sizes x 1000 replicates (seed 20260922).
    FALSIFIER: LARGE_UPWARD_BIAS_AT_LARGE_M confirmed — the saturation language is
    correct but needs a bias qualifier. At m=32 (the paper''s reference), bias is
    negligible (relative bias < 2.3% at n=2791, < 0.09% at n=20000). At m=1024 (M=2):
    bias 34% relative at true TV=0.4, n=2791. At m=32768 (M=4): bias 138% at TV=0.4,
    n=2791. At m=1048576 (M=8): tv_hat saturates near 1.0 regardless of true TV —
    all four true TVs produce median tv_hat > 0.997 at n=2791. Even at n=20000 the
    bias is barely reduced for large m (392% relative at m=1M, TV=0.2). The mechanism
    is unambiguous: when m >> n, most categories have zero or one observation and
    the plug-in TV approaches 1.0 mechanistically. Eq(6) caps at 1.0 for every m >=
    1024 cell; Eq(9) m-free certifies at m=32 and m=1024 (small n) but not at larger
    m. The paper''s ''saturation sets the frontier'' is the correct interpretation:
    the estimator inflates, not the true TV. But the paper must state this is ESTIMATOR
    BIAS, not the intrinsic TV. Runtime 7.8 min, well within 1h budget.'
