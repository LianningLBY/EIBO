  content_sha256: db7cd183dcf47cf959078760d4109f2cf93330409a6d9caa24ca6c52dfc61bce
  name: finite_sample_lower_bound_addendum.md — spread-structure grid, 0.1330/0.1723
    reconciliation, real-pair concentration
  type: report
  description: 'Addendum to the finite-sample TV lower-bound probe (research line,
    CPU-only, non-experimental). Answers three tasks. TASK 3 (decisive, real pairs):
    over the 990 real service pairs (M=1, k=5) from q1_absolute_dense_counts_m1_m2.json,
    with a dense-count cross-check agreeing to 2.22e-16 — per-pair concentration of
    the L1 distance: top-1 share median 0.4009, top-2 0.6472, top-4 0.8605, top-8
    0.9677; median effective support 3.8556 of 32 symbols. Its verdict line says CONCENTRATED
    with implication (a). TASK 1 (structure grid at fixed true TV 0.19375, ratio =
    bound/trueTV): k=1 -> 0.8894; k=2 -> 0.4051; k=4 -> 0.1689; k=8 -> 0.0522; k=16
    -> -0.0059 (vacuous); k=32 -> 0.0367. Its k=1 control does NOT agree with the
    probe memo (0.1723 vs 0.1330). TASK 2 (reconciled): agreed value 0.1723, construction
    spelled out (m=32, P uniform, Q=(1-0.20)P+0.20*e_0, true TV 0.193750, 70/30 split,
    singleton witness selected on train by largest empirical gap, evaluated on a DISJOINT
    held-out split, one-sided CP alpha/2=0.025 per law, 1000 replications); 0.1330
    does not reproduce across variants. Same-data selection hole visible: invalid-rate
    0.001 at n=2791, and 0.000/0.007/0.015 at n=100/1000/10000, rising with n. Worker
    status is failed (transport-only, stream disconnect ~07:51) but the deliverable
    is complete and sound; it stands on its own. NOTE: the addendum''s Task 3 statistic
    (effective support 3.86/32) places real pairs at its own k~4 row, whose ratio
    is 0.1689, so its two tables cross-read as (b), not the (a) its conclusion line
    states — per D165. Preserved unchanged as the Producer''s conclusion.'
