  content_sha256: 440fd68817a0d6fb0d8a29a61703d367bc97460144a55f69a3205095e3c1fef9
  name: 'finite_sample_lower_bound_probe.md — finite-sample TV lower-bound probe (D165:
    joint verdict (b))'
  type: report
  description: 'Decision memo for the finite-sample TV lower-bound probe (research
    line, CPU-only, non-experimental). Concludes that an assumption-free finite-sample
    lower endpoint DOES exist and is valid: a held-out witness-event bound, TV(P,Q)
    >= Q(A) - P(A) using one-sided Clopper-Pearson limits on a disjoint held-out split,
    with the asymptotic step REMOVED rather than replaced since CP is exact. Its headline
    grid, however, tests only the single-point-mass deviation shape (P uniform, Q=(1-delta)P+delta*e_0)
    — the best case for a one-witness bound — and the memo''s own verdict line states
    (a). Per D165 the JOINT VERDICT IS (b), not (a): at the real, spread deviation
    structure the bound captures only ~5-17% of true TV, so the paper''s admitted
    asymmetry is not removable at this rung. The memo''s headline value 0.1330 DOES
    NOT REPRODUCE (three independent derivations give 0.171/0.1723/0.1716) and MUST
    NOT be recorded as a result; the adopted value is 0.1723 with its construction
    spelled out. Preserved unchanged as the Producer''s own conclusion, including
    its (a) verdict line, so the D165 discrepancy remains visible rather than being
    rewritten.'
