- id: art_20260917_ostight
  name: 'Open-set floor tightened: 0.186, correcting 0.118'
  type: report
  description: 'Two tightenings of the assumption-free open-set floor, one of which corrects the earlier number. (a) The earlier computation filtered S to pairs with eps_hi <= 0.5, which is the certification gate and not a requirement of the bound; every pair contributes a valid 1 - eps_hi term at any eps_hi value, so dropping 650 of 990 pairs discarded real mass. Corrected: S = 384.6 over the full graph, giving 0.1858 at M=K+1 (0.1942 at M=K), versus the 0.1176 reported earlier. Validity of the unfiltered form checked on 1200 randomised configurations with zero violations. (b) A subset refinement was tested and gives no gain, returning exactly the full-set value, so that axis is closed. Also records that recovering the unknown-class mass under an anchoring assumption moves the floor by at most +0.023, leaving it robust.'
  path: projects/epsilon-indistinguishability-brackets-for-open-set-encrypted-traffic-recognition-certification-grade/artifacts/openset_floor_tightened.md
  content_sha256: fdb2c15d3e33a773e10bcc5e182c9d00b6411b2032c651e23798f2a52ec99e86
