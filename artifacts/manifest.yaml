    min 0.10531548567491701, q5 0.4959739903592185, q25 0.7383670417083631, median
    0.8673875578391307, q75 0.9578527666076553, q95 0.9858218464175719, max 0.9963109497130209;
    mean 0.8226024312313195. full-n pairs 990, assumed 0, cap_is_none true, 9,992,060
    valid normalised vectors, 0 zero-sum rows. The DPI sentence formerly here (''By
    DPI TV(vector) >= TV(marginal)'') is RETRACTED (M055): that inequality is NOT
    a theorem for those two objects -- the vector law and the k-prefix symbol law
    consume different aspects of the flow and have NO data-processing order in either
    direction, and the per-pair comparison INVERTS on 78 of 990 pairs (largest gap
    0.3415 at pair (29,38)). The valid theorem is TV(vector law) >= TV(POOLED CELL
    law) (deterministic pooling, same flows and channel). The vector figure must not
    be presented as a better bound on the k-prefix symbol law or the packet-cell law.
    CURRENT BYTES: sha256 b9c27c0ceefc8b1c372c409904ddc420fa09ef866f73857af0a0505b6e368df5,
    8134 bytes; this is the corrected file, and the earlier 119b1221/7296-byte pre-correction
