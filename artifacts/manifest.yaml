- id: art_20260918_a73525
  name: eth_full_mk_grid — full 20-cell (M,k) upper-bound grid, Eq(6) vs m-free side
    by side
  type: data
  description: 'Full 20-cell (M,k) grid recompute of the finite-sample TV upper certificate,
    comparing the L1/Eq(6) route against the m-free Hoeffding route. CPU-only, local
    ledgers (artifacts/_project/data/q1_absolute_counts{,_k10,_k15,_k30}.json), zero
    corpus access. Grid M in {1,2,4,8,16} x k in {5,10,15,30}. Convention verified:
    all ten D166 published cells reproduce exactly (340/363 at k5 M1, 28/98 at k10
    M1, 0/18 at k15 M1, 0/0 at k30 M1, 47/127 at k5 M2). m=(2M)^k recomputed per M;
    rows filtered per M before computing. Pair counts per k: 990 (k=5,10), 946 (k=15),
    820 (k=30) by construction. KEY FINDING: the m-free advantage is CONCENTRATED
    AT M=1 and collapses by M=8. k=15 clears Eq(6)/m-free = 0/18, 0/4, 0/1, 0/0, 0/0
    across M=1,2,4,8,16; k=30 gives 0/0 at every M. Saturation fraction (tv_hat>=0.99)
    at k=15 runs 4%->58%->70%->75%->81%; at k=30 73%->85%->92%->96%->97%. So at M>=8
    both routes give zero and the frontier is set by plug-in saturation identically
    for both routes; the extended k=15 reach is an M=1 phenomenon, not a general property
    of the route. FRAMING CONSEQUENCE: the paper must NOT imply the horizon is dissolved;
    D166''s win is real but narrower than ''the alphabet price was the only barrier''
    - the barrier is a function of position on the M ladder. HASH: content_sha256
    was re-derived from these bytes by the Director on 2026-09-18 and is identical
    for the original and this registered copy (cmp reports byte-identical; both hash
    to the value below). Convention: per-side radius L1 = 0.5*sqrt(m/n) + 0.5*H0/sqrt(n);
    m-free = 0.5*H0/sqrt(n); H0 = sqrt(2*ln(2/0.025)) = 2.9604. Verified against the
    paper''s published radii at n=2791 (0.081557 L1, 0.028018 m-free).'
  content_sha256: 522e25ff05b7ef84fe49bdc69ea6a2bd8fc50e56a7d26c7952c3f726adb89d7f
