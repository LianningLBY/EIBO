- id: art_20260917_osfloor
  name: An assumption-free open-set error floor from pairwise certificates
  type: report
  description: 'Corrects a claim made and retracted on 2026-09-16. A positive open-set
    error floor follows from the pairwise certificates with NO assumption on the unknown
    class, because the discarded unknown-class terms enter the sum with positive sign:
    E[err] >= S_known/(M(M-1)) with M = K+1. Verified on constructed cases and under
    1500 randomised configurations including adversarial placements of U; zero violations.
    On the corpus this gives ~0.118 for 44 classes. Notes the limits: standard Le
    Cam applied carefully rather than new mechanism, uniform prior required, loose
    by construction, rare-class behaviour not captured.'
