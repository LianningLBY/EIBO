- id: art_20260922_f7853e
  name: d181_joint_coverage_reaggregation
  type: data
  description: 'D181 Exp1: Joint-coverage reaggregation using Eq(9) m-free Hoeffding
    bound with Bonferroni union bound over 990 pairs (alpha_pair = 0.05/990). FALSIFIER
    PASSED: the high-probability floor is strictly positive. Key results: uniform
    open-set floor 0.197 (vs expectation-form 0.186, ratio 1.059), LP open-set floor
    0.375 (vs expectation-form 0.363, ratio 1.032). 984/990 pairs have eps_hi_mfree
    < 1.0 (non-vacuous), 355/990 have eps_hi_mfree < 0.5 (positive error floor). Only
    6 pairs are vacuous (eps_hi >= 1.0). Zero eps_lo > eps_hi violations. The new
    values are HIGHER than the expectation-form values, not lower as initially expected
    — because the m-free Eq(9) radius is TIGHTER than the Eq(6) alphabet-dependent
    radius for this sample size and alphabet. The certification-grade statement is:
    with probability >= 0.95, the open-set error floor is >= 0.197 (uniform) or >=
    0.375 (LP). Controls: canonical LP reproduces 0.36307 to 5 decimal places. Input
    file hashes recorded.'
