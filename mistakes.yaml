- id: M068
  date: '2026-09-14'
  category: communication
  severity: high
  summary: My unconditional 'you dispatch the rebuild' authorisation created a second
    X1 rebuild worker alongside one already in flight, making two concurrent writers
    on the P0 headline artifact; caught before either wrote.
  root_cause: I authorised the rebuild without checking whether a rebuild was already
    in flight, and without conditioning the authorisation on that. The Agent's own
    00:55 worker was already running and my 00:58 message did not supersede it - it
    simply added another writer. Each message was reasonable in isolation; the joint
    effect was a double-writer on the P0 headline artifact.
  prevention: 'A grant of authority to dispatch (''you dispatch it'') must be conditional
    on the work not already being in flight: say ''unless one is already running''
    or check the queue/work-target first. The deeper rule: an authorisation to act
    is not a statement about the current state, so pairing it with an action request
    creates a race whenever the recipient has already acted. Before authorising ANY
    dispatch that writes an artifact, check the queue for an in-flight writer on that
    target - and note that my own earlier dispatches could themselves have spawned
    it. Two independent messages each internally reasonable can jointly produce a
    double-writer; only a target-level check catches it.'
  status: active
