    satisfy the strict time-order guard; the worker's buffer-month derivation is both
    correct and the real registration.
  root_cause: I supplied a split from working memory and labelled it 'pre-registered'
    without checking any durable artifact, and the split I supplied happened to be
    unsatisfiable under a guard I had myself insisted on. The worker diagnosed the
    real cause - a corpus property, not a script defect - and proposed a structurally
    safe derivation.
  prevention: 'Two rules. (1) Do not call something ''pre-registered'' unless it is
    written into a durable artifact - a specification that exists only in a dispatch
    message is a plan, not a registration, and describing it as registered creates
    the false impression that a commitment constrains later choices. If a split (or
    any parameter) matters, get it recorded BEFORE the run and cite the artifact,
    not the message. (2) When a guard and a data property appear to conflict, first
    determine whether the guard is wrong or the input is - here the guard was right
    and the natural split was structurally incapable of satisfying it, because the
    split''s unit (local-calendar month buckets) and the guard''s unit (raw UTC timestamps)
    are different objects. Resolve at the level of the input derivation, not by relaxing
    the guard. Symmetrically: state flow counts whenever a split changes size, so
    a corpus reduction is never silent.'
  status: active
  context: 'I instructed the X12 fix to ''use the pre-registered split (train 2024-06...2025-01,
    test 2025-02...2025-05)'' and framed the worker''s buffer-month amendment as needing
