- id: M022
  date: '2026-09-13'
  category: experiment_design
  severity: high
  summary: Asserted an unsupported bias direction for a misdefined ratio, then contradicted
    myself by using that same ratio to compute windows in the same turn; the clean
    resolution is to test the gate on the absolute TV the artifact already reports.
  root_cause: I was trying to rebut a conclusion I believed was based on a misread
    quantity (correct), and reached for a directional characterisation to make the
    rebuttal concrete (unsupported). The rebuttal impulse crowded out the step of
    writing both effects down and checking whether the sign was determined. Then,
    having asserted the ratio was unusable, I reused it while exploring consequences,
    because each of the two steps felt locally reasonable and I did not re-read my
    own output as a whole.
  prevention: 'When rejecting a derived statistic as not being the quantity of interest,
    do not substitute a directional claim about its bias unless the sign is actually
    determined — enumerate the opposing effects and only assert a direction when one
    dominates. Two further rules from this turn. (1) After declaring a quantity unusable,
    grep the rest of the same response for uses of it: I declared the ratio unusable
    and then computed windows from it in the same turn, which is self-contradiction
    that a single re-read would have caught. (2) Prefer to evaluate a gate on the
    primitive quantity it is stated over rather than on any derived ratio, since derived
    quantities inherit the confounds of both terms; here the artifact already published
    the absolute TV that the constraint is actually about.'
  status: active
  context: 'A review reported that the first XS-subset compression readout gives M=1
    retention 0.571 against an assumed 0.02 — a 28x gap that would refute the roadmap''s
    citable "M=1 is INFEASIBLE" claim and possibly invert the whole rung ordering.
    I checked the artifact''s definition rather than accepting the table and found
    the ratio mixes two things: its numerator is fixed at k=5 while its denominator
    uses a different chosen k (≈10), and its denominator is a prefix TV whereas my
    comp(M) was defined against the full-flow latent TV.


    That much was a genuine catch. But I then made two errors on top of it.


    First, I asserted the ratio "cannot be substituted" and characterised the discrepancy
    as a direction — calling the measured values a lower bound on the true comp. That
    direction is not established by the facts I had. Two effects oppose: k-truncation
    inflates the denominator (so the ratio is deflated, since TV is non-decreasing
    in k), while prefix-vs-full makes the denominator smaller than mine (so the ratio
    is inflated). Counting only the truncation effect, I asserted a sign the evidence
    did not support.


    Second, and worse, I then contradicted myself within the same turn: I used that
    very ratio to compute feasible windows under "measured" compression (obtaining
    M=1 window [0.090, 0.868]), which presupposes the ratio *is* comparable to comp
    — the thing I had just declared it was not.


    The clean resolution I reached only afterwards: the gate''s lower condition is
    on an absolute quantity, `channel_tv > T(n)`, which the artifact already reports
    directly as `M={m}_tv_hat_k5`. Comparing that against T(n) needs no ratio at all,
    so every confound above vanishes. Working that out also showed the padding hazard
    runs *conservative* on the operative quantity (padding deflates the absolute TV,
    so the lower side looks worse), inverting my earlier framing that it was anti-conservative
    for our claim.'
  fix: 'Rewrote the roadmap block to drop the unsupported directional claim, state
    the bias direction as undetermined with both effects named, and specify the clean
    resolution: compare the artifact''s absolute `M={m}_tv_hat_k5` per-pair against
    T(n) and report the fraction clearing it, with no ratio involved. Recorded the
    padding direction as conservative on the absolute quantity. Sent the same correction
    to the executing team so the measurement task is not asked for a derived ratio.'
