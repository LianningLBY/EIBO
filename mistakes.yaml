- id: M122
  date: '2026-09-14'
  category: communication
  severity: medium
  summary: My task book sent the parametric re-run worker hunting a file that exists
    only locally, telling it to look on the server. It burned its whole budget searching,
    produced nothing, and reported "completed" - the re-run never started. Second
    instance of completed-with-no-output, and this one was mine.
  root_cause: I named a server path for a file that only exists locally, and presented
    a repository artifact as though it were a runtime prerequisite. The executor could
    not find it, consumed its budget searching, and stopped - reporting completed
    with no output. The status field did not distinguish this from success.
  prevention: 'Every path named in a task book must state WHICH TREE it lives in (local
    repository, server tree, or registration snapshot) and must be verified to exist
    in that tree BEFORE the task is dispatched. A wrong or missing path does not fail
    fast - it consumes the executor''s whole budget on the search, which is why it
    presents as "completed with no output" rather than as an error. Concretely: before
    writing a dispatch that references a file, confirm the file exists at that path
    in the tree I claim; and when a path is a repository artifact rather than a runtime
    input, do not present it as a prerequisite for execution. The general form, and
    this is the third time this session: check that the thing I am asserting about
    the environment is true of the environment, rather than true of my mental model
    of it.'
  status: active
  context: 'I dispatched a parametric re-run task whose brief told the worker to check
    for an intermediate copy at /root/eibo/artifacts/X3/intermediate/x3_parametric_growth.py
    on the server. That path does not exist there: the intermediate copy is a LOCAL
    tracked repository artifact (artifacts/X3/intermediate/x3_parametric_growth.py,
    14,233 B), and it has nothing to do with executing the run - the runner writes
    only to its own ARTIFACT_PATH. The worker spent its whole budget hunting the missing
    file and stopped mid-investigation, then reported status "completed" with no output:
    the re-run never started, and the local parametric artifact is still the pre-fix
    version (215,476 B, mtime 08:09, withdrawn wording, no d057_caution).


    This is the second instance of "completed with no output" (the first was the max_tpr
    attempt). Both are the inverse of the session''s earlier false-failed pattern,
    and both reinforce that neither status value is evidence about the work.


    This one is my fault in a specific and preventable way: I named a path without
    stating which tree it lives in, and the executor could not find it. A task book
    that sends an executor hunting for a file burns its entire budget on the hunt
    and produces nothing.


    Verified alongside: the axis pull in the SAME round did succeed, and I confirmed
    it by reading the bytes rather than the status - local went from 122,617 B / 9f7578be
    to 123,295 B / 4061258e, matching the server, with a backup taken first and JSON
    OK reported. So the pure-transport wording works; the distinction is that its
    task book named paths it could actually reach.'
  fix: 'Accepted the fault explicitly in the dispatch rather than framing it as a
    worker failure, and issued a corrected task book that names the correct tree for
    each path: sync the fixed LOCAL working-tree runner to the server root, run it,
    confirm the D057 wording and d057_caution land in the top-level artifact, then
    re-register and pull. Also separated X6, which was never in that worker''s scope
