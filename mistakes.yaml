  - D069
- id: M109
  date: '2026-09-14'
  category: experiment_design
  severity: high
  summary: 'Class-level recurrence: a check that cannot exercise its own failure mode
    can produce PASS-shaped output without testing the hypothesis.'
  root_cause: 'The controls and audits were designed to confirm a desired conclusion
    without first specifying a reachable output that would falsify it. Four separate
    checks therefore accepted non-testable or self-certifying configurations: a fixed
    axis, an empty population, an affine-by-construction comparison, and a bound clipped
    to a boundary that cannot exceed a non-negative truth. Two independent audits
    also treated self-certifying anomalies in their own printed output as normal data.
    The common defect is structural: the check cannot produce the failure that its
    PASS is supposed to rule out.'
  prevention: 'Rule A: before treating any control or test as evidence, ask: WHAT
    WOULD THIS HAVE TO OUTPUT FOR THE HYPOTHESIS TO BE FALSE? If the answer is "nothing
    it could output", it is not a test. Rule B: audit scope is set by anomaly signals,
    not by the task description alone. Every audit must scan the values it prints
    for constant, repeated and boundary values, constant tails, exact-zero increments
    and non-monotone jumps; every such run must be explained rather than merely listed.
    Report testable and non-testable rows separately, and keep a consistency guard
    distinct from the falsifiable verdict.'
  status: active
  context: 'Four instances occurred in this project on 2026-09-14. (1) The original
    X3 known-truth control was a control construction that could not exercise the
    mechanism it was meant to probe. (2) The k=15 informative stratum was empty, so
    the statistic was defined on an empty set and could not report anything. (3) The
    parametric route and its control were affine by construction for any stationary
    chain, so SUBLINEAR was unreachable and the control could not fail. (4) X6 used
    `violation = bound > truth + 1e-12`; at the validity sample size the bound clipped
    to 0, and a 0 bound could never exceed a non-negative truth. About 75 of 120 rows
    were non-testable, so the reported 0/120 violations conflated rows that could
    not fail with rows that could. Two audits missed self-certifying anomalies in
    their own printed output: the D063 audit printed k=20 and k=30 with identical
    values and passed them as normal data; the X6 audit printed twelve representative
    comparison rows that were all `bound 0.0`, the exact signature of a non-falsifiable
    control, and passed them. Two independent audits therefore missed a self-certifying
    anomaly sitting in their own printed output.'
  fix: 'Recorded this as a failure class rather than as another isolated incident.
    Adopted Rule A: every control or test must show a reachable falsifying output
    before its result is used as evidence. Adopted Rule B: every audit must scan its
    printed values for constant, repeated and boundary values, constant tails, exact-zero
    increments and non-monotone jumps, and explain every such run. Require non-testable
    row counts beside violation counts, and never present a count such as 0/120 as
    evidence when its denominator includes rows that cannot fail.'
  related_decisions:
  - D056
  - D057
  - D063
  - D071
- id: M110
  date: '2026-09-14'
  category: resource_misuse
  severity: high
  summary: Concurrent registry writers clobbered registry.yaml into a strictly worse
    state (X12_k5 RUNNING+pid lost, X3.metrics 34 to 6, X6 DONE to PREPARING, X11
    entry gone) while the k=5 process kept running - producing the "ran it but recorded
    it as never run" defect, and a false GPU-idle signal that would have caused a
    collision. Restored as single writer with C028 proof; added C029 one-writer constraint.
  root_cause: Multiple workers concurrently performed read-modify-whole-file-write
    on registry.yaml, with at least one writing from a stale snapshot. No write was
    individually wrong; the destruction came from concurrency, which makes "read the
    current bytes" a false premise. Compounding it, the GPU-idle probe derives its
    answer from that same clobbered registry, so it reported the card idle while k=5
    was running and recommended filling it.
  prevention: 'Where a file has one logical owner, ENFORCE ownership rather than assuming
    it: serialize all writers, and require each write to begin from a fresh read whose
    timestamp is reported, aborting if the file changed since that read. Never let
    a worker write a shared file from a snapshot it read earlier in its own run. And
    critically: never derive a resource-state decision (is the GPU idle? is a job
    running?) from a shared mutable record that other processes are concurrently writing
    - query the authoritative live source instead. The idle probe recommending "fill
    the idle card" would have caused a real collision, because the card was busy and
    only the record said otherwise. The general form, and the eighth instance of this
    family: a check whose input can be clobbered by a concurrent writer will confidently
    report the wrong answer, and the more authoritative it looks the more damage its
    recommendation does.'
  status: active
  context: 'registry.yaml was found at 09:38:58 in a state strictly worse than the
    state verified minutes earlier: entries 18 to 17, X3.metrics 34 (a union I had
    just restored) to 6, X6 DONE to PREPARING, the X11 entry disappeared entirely,
    and X12_k5 RUNNING with pid 683446 reverted to PREPARING with no pid. The k=5
    job itself was unaffected and still running: a GPU probe showed PID 683452, /root/miniconda3/bin/python3,
    cwd /root/eibo, 654 MB on cuda:0 (683446 is the tmux parent, 683452 the python
    child). So the record said "never started" while the process was alive - the project''s
    recurring "ran it but recorded it as never run" defect, this time produced by
    a concurrent write rather than a missing update.


    Root cause: several workers were live in the same minutes, each performing read-modify-whole-file-write
    on registry.yaml, and at least one operated from a snapshot taken before the other
    updates landed. Evidence that this is concurrency rather than a single bad write:
    the recovery worker dispatched to repair the X3.metrics damage restored FROM a
    source already worse than the live file, and its own pre-write "damaged" backup
    has the same regressed shape (17 entries / 6 keys / X6=PREPARING / no X11), which
    means the file was already degraded before that worker touched it. The X6 status
    update and the X12_k5 update both landed and were then lost. Every individual
    writer was locally reasonable; the destruction came purely from concurrency and
    from accepting whatever bytes were on disk as the base.


    The GPU-idle probe also reported the card idle during this window, which was wrong
    for the same reason - it reads registry state, and registry state had been clobbered.
    The probe''s recommendation ("dispatch a candidate experiment to fill the idle
    card") would have been actively harmful, since the card was not idle and k=5 was
    already using it.


    I restored the file myself as a single writer: verified no writer was active (no
    worker log modified in the preceding 90s, registry mtime stable since 09:38:58,
    and the D070 worker touched only manifest.yaml - 100 hits on manifest.yaml, 0
    on registry.yaml), restored from the richest source, and applied C028''s containment
    proof (every current entry preserved, every current key AND value preserved, nothing
    removed) before placing. Read-back confirmed entries 18, X3.metrics 34, X6 DONE,
    X11 present, X12_k5 RUNNING pid 683446.'
  fix: 'Restored registry.yaml as a single writer with a C028 containment proof, from
    the anchored text-splice copy rather than any serializer output. Added hard constraint
