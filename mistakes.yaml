- id: M059
  date: '2026-09-14'
  category: experiment_design
  severity: high
  summary: X3's estimator validation holds k fixed (separately at k=5 and k=10) while
    the SUBLINEAR claim is precisely about how behaviour changes ACROSS k; the validation
    is therefore orthogonal to the claim it is presented beside, and the estimator's
    k-dependent bias profile remains uncharacterised.
  root_cause: The validation was designed to establish that the estimator is correct
    in general, and correlation with an independent TV estimate at two fixed k values
    does that. It was then presented beside a claim whose truth depends on a different
    axis entirely. The mismatch is between the claim's axis of variation (k) and the
    validation's axis of variation (pairs, at fixed k) — a category error in what
    the evidence supports, not a numerical error in the evidence.
  prevention: 'Before accepting a validation as support for a claim, ask WHICH AXIS
    the validation varies and which axis the CLAIM varies. If the validation holds
    the claim''s axis fixed, it is not evidence for the claim — however many pairs,
    however high the correlation, however zero the violations. Generalises: a control
    that cannot exercise the mechanism under test is not a control, exactly as a check
    that cannot fail is not a check. Concretely, a claim of the form ''X changes/grows/decays
    as k varies'' requires a control that also varies k.'
  status: active
  context: 'X3''s artifact presents `estimator_validated_on_certifiable_subset` as
    supporting evidence beside its `SUBLINEAR` verdict. The validation compares the
    chain-rule estimator against independently produced same-pair empirical TV quantities
    SEPARATELY at k=5 (990/990 pairs, Pearson 0.882, Spearman 0.944, Pinsker violations
    0) and k=10 (990/990 pairs, Pearson 0.879, Spearman 0.955, Pinsker violations
    0). That genuinely establishes the estimator tracks TV WITHIN a k-slice. But the
    adjudicated claim — SUBLINEAR — rests entirely on how the estimator''s BIAS behaves
    as k GROWS from 5 to 30. A comparison performed at a fixed level of the very variable
    whose effect is claimed cannot speak to that. Every candidate mechanism for manufacturing
    the observed curve acts ALONG k: Jeffreys add-0.5 smoothing on prefix contexts
    that grow sparse with k, and the `PPI_LEN >= k` sampling rule that changes the
    flow population at each k (denominator 990->946->903->861->820). The artifact
    carries no occupancy diagnostic and no known-truth control, so the estimator''s
    k-dependent bias profile is uncharacterised.'
  fix: Recorded in memory.md entry 305. The known-truth linear control and the fixed-population
    recompute were dispatched as the decisive checks; the SUBLINEAR verdict is held
    provisional pending them, with downgrade to INCONCLUSIVE pre-committed if either
    fails.
