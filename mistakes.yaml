- id: M112
  date: '2026-09-14'
  category: code_bug
  severity: high
  summary: Broke artifacts/manifest.yaml three times in one turn by line-index insertion
    into multi-line YAML scalars, then committed the broken version without re-parsing
    so HEAD itself became unparseable. Recovered by testing each recent commit for
    parseability and restoring from bf542ce.
  root_cause: I located the insertion point by line arithmetic in a file containing
    multi-line folded scalars, whose boundaries that arithmetic cannot see, so the
    new line landed outside the scalar. I then committed without re-parsing the file,
    converting a working-copy breakage into a history breakage. The root cause is
    not the indent slip -- it is that I treated the edit tool's success return as
    evidence of a valid file, in a session whose governing lesson is precisely that
    a success return is not evidence about the artifact.
  prevention: 'Two rules. FIRST: after ANY text edit to a structured file (YAML, JSON,
    TOML), parse that exact file BEFORE committing or relying on it -- a successful
    edit call is not evidence the file is valid, and committing an invalid file makes
    the breakage part of history, which is strictly worse than an invalid working
    copy. Do this in the same step as the edit, never at the next use. SECOND: do
    not locate insertion points in a structured file by line-index arithmetic. A multi-line
    folded or block scalar has boundaries that index arithmetic does not see, which
    is why the same edit failed three times in one turn in three different ways. Use
    the Edit tool with a matched anchor string instead, or insert relative to a line
    whose full text has been read. When a scalar''s end is genuinely ambiguous, the
    safe move is to append to the KEY''s own line only if the key''s value is a single
    quoted string -- checking that condition first, rather than assuming it. The general
    form, matching this session''s recurring lesson: "the command succeeded" is not
    the property I care about; the property is "the artifact is valid", and those
    are different facts that must be checked separately.'
  status: active
  context: 'While adding a note to a manifest entry''s folded description scalar,
    I inserted the new line AFTER the closing quote of the scalar rather than inside
    it, producing a bare four-space-indented line at mapping depth. The file stopped
    parsing. Critically, I then committed it without re-parsing: the commit succeeded
    and HEAD held a manifest that could not be load, so the breakage was one commit
    deep before I noticed. I caught it only because my next edit''s own validation
    step failed.


    This happened in the same turn in which I had twice already broken the same file
    the same way (an inserted line inheriting the wrong indent, and a colon-space
    inside a folded scalar being read as a mapping key) and fixed both. The pattern
    is consistent: I edited a structured text file by line-index arithmetic, where
    the boundary of a multi-line scalar is not visible to the arithmetic, and I treated
    the edit as done because the edit call returned success.


    Recovery: I tested each of the last four commits for parseability rather than
    assuming the previous one was good -- HEAD a3521d4 BROKEN, HEAD~1 bf542ce OK with
