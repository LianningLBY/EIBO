- id: M114
  date: '2026-09-14'
  category: agent_behavior
  severity: high
  summary: 'Told the Agent to use X9 (a CPU bound-comparison) to fill an idle GPU
    - inferring the compute class from the resource state rather than the plan entry,
    which had no such field. Then broke experiment_plan.yaml twice while adding that
    field: a serializer round-trip (C028 violation, repeat of M107) and an unquoted
    colon in an inserted value.'
  root_cause: 'I inferred X9''s compute class from the fact that a GPU was idle, because
    the plan lacked a compute_class field and the idle card created pressure to fill
    it. Then, fixing the missing field, I twice broke the file: once with a serializer
    round-trip (C028 violation, repeat of M107) and once by inserting a value containing
    a colon into YAML unquoted. Both are instances of asserting or emitting something
    without measuring what it actually does.'
  prevention: 'TWO rules. (1) NEVER infer a resource class, cost, or requirement from
    the state of the resource. Read it from the entry, plan, or spec that determines
    it. A free GPU is not evidence that the next experiment uses a GPU; an idle card
    creates pressure to fill it, and that pressure is exactly what makes the inference
    feel safe. If a field needed to make the decision is absent, add the field, do
    not guess the value. (2) For a structured file, insert by rewriting lines with
    values that are SAFE AS YAML - quote any value containing a colon, hash, or leading
    special character - and never locate an insertion point by matching a key name
    that could also appear inside a multi-line scalar. And never write a structured
    file back through a serializer: parse to find, edit text to write, then re-parse
    before committing. Both failures share one shape, the same shape as M107, M112
    and the whole session''s recurring lesson: I acted on a value I had inferred rather
    than measured, and the tool returning success told me nothing about whether the
    artifact was correct.'
  status: active
  context: 'Two related failures in one turn, both mine.


    (1) I dispatched X9 with the instruction to use it to "fill the GPU", on the reasoning
    that a card was allocated, idle, and must not sit idle. X9 is a bound-comparison
    measurement - it computes the TV bracket delta between an SNI-inclusive and SNI-excluded
    channel - which is CPU work over the H5 corpus, like every X-experiment except
    X12. The experiment_plan.yaml entry carried no compute_class field, so I inferred
    the class from the outside fact that a card was free rather than from the entry
    that determines it. I caught it myself before the Agent could act, and sent a
    correction: dispatch X9 as CPU work, and do not force a CPU task onto the card
    to justify the allocation.


    (2) While adding the missing compute_class field, I used yaml.safe_dump to write
    the file back, which collapsed experiment_plan.yaml from 601 lines to 193 - the
    exact whole-file serializer round-trip that C028 forbids and that I had already
    recorded as M107 when I did the same thing to registry.yaml. I caught it immediately
    via the line-count check. My second attempt inserted lines by regex on the ''priority:''
    line, but one of my inserted values contained a colon followed by a space, which
    YAML read as a mapping key, breaking the file at line 464. Third attempt: inserted
    the same lines but single-quoted every value so any colon is inert, which parsed
    and changed exactly 13 lines with nothing else touched.


    The substantive finding from (1) is worth keeping: X12 is the only GPU-eligible
    entry in this project, because it is the only one that trains, and RoNeTC is the
    sole CUDA consumer. Running X12 at another k would not fill the card usefully,
    because k=5 is the only level with a populated informative stratum (340 pairs;
    28 at k=10, 0 at k=15/30), so any other k reproduces the empty-population pattern
    this project has recorded four times. So the honest statement is that there is
    currently no GPU-eligible experiment on the plan - which is a fact to report,
    not something to paper over by placing CPU work on the card.'
  fix: Sent the compute-class correction to the Agent immediately, instructing that
    X9 be dispatched as CPU work and that no GPU experiment be invented to justify
    the allocation, and stating plainly that no GPU-eligible experiment remains on
    the plan. Added the missing compute_class field to all 13 plan entries via a line-by-line
    text insertion with single-quoted values, verified by parsing before committing,
    with the diff showing exactly 13 insertions and nothing else changed. Committed
    with the finding that X12 is the only GPU-eligible entry and why another k would
    not help.
