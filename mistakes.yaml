- id: M074
  date: '2026-09-14'
  category: agent_behavior
  severity: medium
  summary: I claimed two memory.md rules were missing based on a zero grep for my
    own paraphrased wording; all four patterns were present, and the Agent was right
    - the third proxy-for-question substitution in one hour, committed while I was
    warning about the previous one.
  root_cause: I searched for a paraphrase of the rule rather than the rule's own wording,
