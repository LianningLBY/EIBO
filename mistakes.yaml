- id: M041
  date: '2026-09-13'
  category: experiment_design
  severity: medium
  summary: Reviewer called the Q1/Q2 340-vs-342 agreement a genuine cross-check; a
    2x2 decomposition shows it is offsetting differences (tv_hat medians differ 2.7x,
    radius constants 7.34x), so it carries no corroborative weight.
  root_cause: The reviewer compared only the two headline fractions, each computed
    under its own object-specific radius convention, and inferred corroboration from
    their near-equality. It did not hold the convention fixed, which would have exposed
    that the two objects' underlying statistics differ by 2.7x and that the fractions
    are equalized by a 7.34x constant difference pointing the other way.
  prevention: Before calling agreement between two quantities a cross-check, test
    whether it SURVIVES holding the differing convention fixed. Compute the 2x2 table
    (each object under each convention); if the agreement exists only on the diagonal
    — where each side uses its own convention — it is an artifact of offsetting differences,
    not convergence. Genuine corroboration requires agreement on the underlying statistic,
    or on the verdict when the convention is held common. A coincidence between two
    products of large opposite-signed differences is the single most likely way to
    manufacture false corroboration.
  status: active
  context: 'Reviewer Finding 3 called the Q1-vs-Q2 agreement (340/990 vs 342/990,
    "1.2 pairs apart") a genuine cross-check, since they are different objects on
    different channels computed by different scripts, and recommended recording it
    as evidence stronger than either alone. Verified false by a 2x2 decomposition
    on the 990 common pairs. Using each object''s OWN radius: Q1 340, Q2 342 (difference
    2). Using a COMMON radius (Q1''s): Q1 340, Q2 935 (difference 595). Using a COMMON
    radius (Q2''s): Q1 81, Q2 342 (difference 261). The underlying tv_hat distributions
    differ enormously: Q1 median 0.5805, Q2 median 0.2157 (2.7x). So the near-equality
    of the headline fractions comes from two large differences in OPPOSITE directions
    cancelling: Q2''s point estimates are ~2.7x smaller, while Q2''s radius constant
    is 7.34x larger. The agreement is numerical coincidence, not convergence.'
  fix: Rejected the cross-check framing and recorded the decomposition. The correct
    statement is that the two objects' informative fractions are numerically similar
    for offsetting reasons, so the similarity carries no corroborative weight.
