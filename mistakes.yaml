    have only ever reached me through the worker''s result text — the relay channel
    — which has distorted repeatedly tonight.'
  fix: 'Sent a corrected mechanism to the agent: visibility depends on execution location,
    not target directory. The operative rule is to state the path and verify rather
    than assume either way. The readout''s numbers stay labelled RELAYED, and the
    actionable fix is for the producing worker to read the JSON from the server and
    write it into the shared tree, so the artifact can be read directly instead of
