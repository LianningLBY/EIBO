- id: M027
  date: '2026-09-13'
  category: code_bug
  severity: high
  summary: Published T(n) values that were wrong by an alpha-split slip (alpha/4 per
    law instead of alpha/2); caught by writing an independent evaluator, which also
    corrected the calibrated constant from ~2.24 to ~1.958.
  root_cause: My ad-hoc computation passed alpha/2 into a helper that already applied
    a two-sided halving, producing an alpha/4-per-law split without my noticing. Because
    the resulting numbers were then reproduced faithfully by the executing team and
    matched my closed form, nothing in the workflow was positioned to catch it — the
    only thing that could was deriving the computation again from the specification,
    which I did not do until I needed an evaluator for a different reason.
  prevention: 'When a quantity is produced by a computation, validate it against an
    independent implementation derived from the specification, not by re-running or
    re-deriving the same code — agreement between two runs of one implementation bounds
    nothing. In particular, when a helper takes an alpha and internally halves it,
    check the call site''s alpha against the intended joint level: an alpha/2-per-law
    requirement passed into a function that divides by two again silently yields alpha/4.
    And when reporting a calibrated constant alongside a closed form, state which
    confidence level the calibration assumes, since the constant is only meaningful
    at a stated split.'
  status: active
  context: 'I published a table of T(n) — the minimum channel TV at which the lower
    side clears its threshold — as 0.0659 / 0.0550 / 0.0522 / 0.0511 at n = 2e4 /
    2e5 / 1e6 / 3.9e6, with a calibrated constant c in [2.239, 2.259]. Those numbers
    went into the roadmap, into messages to the executing team, into memory, and into
    the closed form I reported to the user. They are wrong.


    Writing an independent evaluator for the Q1 gate surfaced the discrepancy: my
    new implementation gives T(2e4) = 0.0639, not 0.0659. Diagnosing it showed the
    cause is an alpha split in the earlier ad-hoc computation. The level of the two-cell
    test is 1 - e0 - e1 with both error rates estimated, so a joint 1 - alpha statement
    needs alpha/2 per law (union bound over two laws). The earlier code called a helper
    that itself halved alpha, so it applied alpha/4 per law — a joint 1 - alpha/2
    statement, twice as conservative as intended. Corrected values are about 3.1%
    lower at n=2e4, 1.1% at 2e5, 0.2% at 3.9e6, and the constant drops from ~2.24
    to ~1.958.


    Notably the executing team reproduced my published numbers independently and reported
    agreement — which is expected, since it replicated the same alpha split. Independent
    reproduction of a wrong computation is not verification. What caught it was building
    a second implementation from the specification rather than re-deriving the first
    one''s arithmetic.


    Impact: the verdict form is unaffected (still an absolute comparison against a
    computed threshold), and the shift is small at the sample sizes we actually use,
    so no conclusion flips. But the published table was wrong on a number I had described
    as "validated out of sample across five orders of magnitude" — I had validated
    the closed form against the same mis-specified computation, so that validation
    confirmed internal consistency, not correctness.'
  fix: 'Written an independent evaluator (scripts/evaluate_q1_absolute.py) that recomputes
    both thresholds from the specification: the radius term reproduces the earlier
    values exactly, and T(n) is computed by bisecting the exact Clopper-Pearson two-cell
    test with the correct alpha/2-per-law split. Roadmap corrected to the new values
    and constant, with the superseded table explicitly marked as wrong and the direction
    of the shift stated (the corrected threshold is slightly easier to clear, so it
    does not flatter the design-time story).'
- id: M028
  date: '2026-09-13'
  category: code_bug
  severity: medium
  summary: The gate's upper side used a per-law alpha while the lower side used alpha/2,
    so one criterion claimed joint 0.90 on one side and 0.95 on the other; shift is
    ~1e-4 and flips no verdict, but the stated level was wrong.
  root_cause: I derived the concentration radius with alpha treated as a single per-law
    level while deriving the lower bound with a union bound over two laws, so the
    two sides of one criterion were built from different conventions. The inconsistency
    survived because the resulting values differ by only ~1e-4 and no verdict changes,
    so nothing in the numbers drew attention to it.
  prevention: 'When two sides of a single criterion each require a confidence level,
    compute them from ONE declared convention and check they match — an asymmetry
    here is invisible in the results because the numeric shift is tiny, but it makes
    the criterion internally inconsistent. Concretely: any constant of the form sqrt(2*ln(2/x))
    has a per-law interpretation, so state which level x denotes and derive it from
    the intended joint level via the same union bound used elsewhere. Also: when a
    mistake of a given class is found in one place, sweep the sibling computations
    for the same class immediately — here the lower side''s split error predicted
    an upper-side check that found a second instance.'
  status: active
  context: 'Investigating the alpha-split error already logged (M027, lower side),
    the executing agent looked at the upper side and found the same class of mistake
    there: the concentration radius constant sqrt(2*ln(2/alpha)) had bare alpha =
    0.05 substituted, which is a PER-LAW level, giving a joint level of 1 - 2(0.05)
    = 0.90 rather than 0.95. The correct per-law value is alpha/2 = 0.025, giving
    constant 2.9604 instead of 2.7162. I verified the arithmetic and confirmed it:
    corrected radii at n=3.9e6 are 0.0044 / 0.0177 / 0.0932 / 0.5200 / 2.9347 for
    M = 1/2/4/8/16 (previously 0.0042 / 0.0176 / 0.0930 / 0.5199 / 2.9346).


    The substantive problem is not the magnitude but the asymmetry: the LOWER side
    already applied a union bound over the two laws (per-law alpha/2), while the UPPER
    side did not. So a single gate would have claimed joint 0.95 on one side and joint
    0.90 on the other — two different confidence levels inside one statement. That
    is exactly the kind of internal inconsistency a reviewer unwinds, and it is invisible
    in the final numbers because the shift is only ~1e-4.


    Impact is nil on verdicts: M>=8 still fails to certify at n=3.9e6, and the M=8
    crossover moves from 4,216,585 to 4,218,591. But the stated confidence level was
    wrong and is now corrected, the evaluator takes alpha_per_law explicitly so the
    two sides cannot diverge again, and a regression test pins that the default convention
    is alpha/2 rather than alpha.


    Also carried forward an unresolved question the agent raised: whether the exact
    0.05 constant term in T(n) depends on alpha at all, or only coincides with the
    lower-side threshold at this level. Flagged rather than assumed.'
  fix: Corrected the radius convention to per-law alpha/2 so both sides of the gate
    claim joint 1-alpha; parameterised radius_sum with alpha_per_law; added a regression
    test asserting the default matches the lower side's convention and that per-law-alpha
    would be tighter; updated the roadmap's radius values and crossover, and recorded
    the rule that every deliverable must declare its alpha and split convention.
