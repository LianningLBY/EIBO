- id: M086
  date: '2026-09-14'
  category: resource_misuse
  severity: medium
  summary: The registry cannot enforce status/conclusion coherence (validator is not
    project code, update_registry takes no custom rules), so three incoherent pairs
    occurred - X1 QUEUED+success, X12 ANALYZING+failed, X5 PREPARING+success - each
    from writing conclusion before the terminal status; mitigation is procedural only.
  root_cause: 'The registry''s validation is per-field, so no constraint relates status
    to conclusion, and the layer cannot be extended in this deployment. The proximate
    cause of each instance was write ordering: conclusion was set before the terminal
    status, leaving a window in which a non-terminal status coexisted with a terminal
    conclusion.'
  prevention: 'A status and a conclusion are two claims about the same object and
    must be coherent with each other, not merely valid in isolation - per-field vocabulary
    validation cannot catch an impossible pair, so any state machine needs a cross-field
    check and, where the validator cannot be extended, an explicit procedural substitute
    recorded as such. The ordering rule is the stronger of the two mitigations: write
    the terminal status before the conclusion, because conclusion-first guarantees
    an observable window of incoherence. And when a role reports that it cannot write
    or cannot add a control, that report should be taken as accurate and the gap recorded
    by whoever can - a missing safeguard that is claimed to be present is worse than
    one that is known to be absent.'
  status: active
  context: 'The registry enforces per-field vocabularies but no cross-field coherence,
    so an impossible PAIR of individually-valid values can be written. Two instances
    occurred in this project: X1 was registered status=QUEUED with conclusion=success
    (QUEUED is non-terminal, so a completed experiment was eligible to be picked up
    by the allocation flow and re-run), and X12 was registered status=ANALYZING with
    conclusion=failed (a non-terminal-ish status carrying a terminal conclusion).
    Separately the executing role caused a third: it wrote conclusion=success while
    the entry was still PREPARING, and discovered the state machine rejects PREPARING
    -> DONE directly (Allowed: [''PENDING'',''QUEUED'']), so the reverse order - conclusion
    before status - NECESSARILY creates an incoherent observation window. The structural
    fix (a cross-field validator) CANNOT be added in this deployment: the registry
    validation layer is not project code, and update_registry accepts no custom rules.
    I asked the executing role twice to record this as a mistake entry and it correctly
    refused, reporting that save_project_file''s whitelist is memory.md / writing_plan.yaml
    / paper_framing.md / experiment_plan.yaml / findings.md and does not include mistakes.yaml,
    and that log_mistake is not in its tool set - so it declined rather than pretending.
    This entry records the hole on its behalf.'
  fix: 'Recorded here because the executing role has no write access to this file.
    The available mitigation is procedural rather than structural: (a) verify status/conclusion
    coherence immediately after every submit_on_allocated - which is how the X1 and
    X12 instances were actually caught; (b) always push the terminal status FIRST
    and write conclusion second, since the reverse order necessarily creates the incoherent
    window; (c) treat any non-terminal status with no pid/server as ambiguous and
    add a driver_worker / compute_class field so a later reader can distinguish ''worker
    computing'' from ''allocated, awaiting process''.'
