- id: M117
  date: '2026-09-14'
  category: agent_behavior
  severity: high
  summary: A stale [EXPERIMENT ALLOCATED] notice for an already-completed X12_k5 would
    have triggered a re-run overwriting the registered artifact. The Agent verified
    against the registry and declined; I confirmed the notice's allocation_id appears
    zero times in the registry, so it referred to a dead allocation.
  root_cause: A scheduler notice was delivered late or replayed, carrying an allocation
    id that no longer appeared in the registry. Nothing in the delivery path marks
    such a notice as stale, so its literal execution would have re-run a completed
    experiment and overwritten its registered artifact. The Agent's verification-before-action
    is what prevented it; there is no mechanism that would have prevented a less careful
    actor.
  prevention: 'Treat any externally-generated control signal - a scheduler notice,
    an allocation event, a queued directive, a replayed callback - as a CLAIM ABOUT
    STATE that must be verified against the authoritative store before it is executed.
    It is not an instruction that outranks the store. Concretely: if such a notice
    names an identifier (an allocation id, a run id, a job id), check that identifier
    against the record before acting; if it is absent, the notice is stale by definition
    and the correct action is usually NONE. The general form: when a signal and a
    store disagree, the store is the source of truth about state, and the safe default
    is to report the disagreement rather than to reconcile it by performing the action.
    The strongest version of this rule, which the Agent applied: never take an action
    that is destructive to existing evidence in order to satisfy a control message.'
  status: active
  context: 'A scheduler notice [EXPERIMENT ALLOCATED] for X12_k5 was delivered to
    the Agent. Acting on it literally would have called submit_on_allocated for an
    experiment that had already completed - a re-run that would overwrite the registered
    artifact art_20260914_082a7f. The Agent verified the registry first, found X12_k5
    already DONE with conclusion and completed_at present, confirmed the process PID
    683446 was gone, and declined to submit, reporting the conflict instead of acting
    on it.


    I then verified independently and found two things: the state had advanced further
    than the Agent''s report (DONE, not ANALYZING), and the allocation_id from that
    notice (4cfe2d7b...) appears ZERO times in the registry. So the notice referred
    to an allocation that is not recorded as live - it was a replayed or delayed delivery
    of the allocation I had made hours earlier for the run that has since finished.


    This is a new failure class in this session, distinct from the eight partial-write
    instances and the naming/field defects: an authority signal (a scheduler notice)
    arrived with stale content, and its literal execution would have been destructive.
    The Agent''s correct behaviour was to treat it as a claim to be checked against
    the authoritative store rather than as an instruction that outranks it.


    Note the asymmetry that made this safe: the notice was a message, the registry
    is state. The Agent checked the state and reported the discrepancy instead of
    reconciling it by force.'
  fix: Ruled Option 1 and confirmed no submission, no re-run and no re-save. Verified
    from the registry that X12_k5 is DONE with conclusion and completed_at, and that
    the notice's allocation_id appears zero times in the registry, so the notice refers
    to an allocation not recorded as live. Explicitly credited the Agent's refusal
    rather than merely noting it, and gave the push an exact terminal answer (blocked
