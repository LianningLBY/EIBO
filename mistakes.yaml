- id: M016
  date: '2026-09-13'
  category: agent_behavior
  severity: high
  summary: A task spec's opening step ("resume the XS h5 first") hijacked an unrelated
    measurement task for 40+ minutes, blocking the critical path while a redundant
    download grew; my own earlier reversal of XS guidance fed that stale step.
  root_cause: The executing team's task specification for the TV-compression measurement
    carried a leading step ("resume the XS h5 first, ~116 MB remain") that legitimately
    belonged to a different, earlier objective. A worker executing its spec faithfully
    therefore did XS resume work under a task named for compression measurement. The
    stale step existed because I had reversed my own XS guidance after the spec was
    drafted, and neither of us re-scanned the drafted specs for embedded superseded
    guidance when the reversal was issued. The task name and status flag then reported
    healthy progress on the wrong activity.
  prevention: 'A task specification''s opening step is load-bearing: if it describes
    work belonging to a different task, a correct worker will execute it and the task
    will silently become that other task. Before dispatching, read the spec''s first
    action and ask whether it belongs to THIS task''s objective. Specifically: never
    carry a "first finish the previous transfer" step into an unrelated task — hand
    it to a dedicated task or drop it, because the name of the task will keep reporting
    success while the wrong work runs. Two further rules from this episode: when reversing
    guidance, actively hunt for task specs that embedded the old guidance rather than
    only issuing the new instruction; and keep the dispatch queue short, since corrections
    buried behind dozens of stale entries are corrections that do not arrive.'
  status: active
  context: 'The critical path (fetching the 11 remaining Parquet months) stalled for
    over an hour while a redundant XS subset was instead re-downloaded to a third
    copy (XS chunks grew to ~6 GB; the data directory held 11 GB total while `raw/`
    stayed at 2 GB throughout).


    Root cause was inside a task specification, not in a worker misbehaving. The `Measure_real_per-rung_TV_compression`
    task dispatched at 13:16 opened with "Resume it using parallel byte-range requests...
    About 116 MB remain" — i.e. its first step was to finish the XS h5 download. The
    worker therefore spent 40+ minutes doing XS resume work and never began the measurement
    it was named for. A stale instruction embedded as a task''s opening step silently
    hijacked the task, and the task''s own name made the situation look correct in
    status reports.


    Contributing cause, and part of this is mine: I had earlier told the team to let
    the XS transfer finish ("it will complete within minutes"), then later reversed
    to "stop the XS re-download". The task spec was written in between, so it embedded
    the earlier guidance. My own reversal created the stale step. The team also reported
    "the TV-compression worker is running" — true of its status flag, false about
    its behaviour — shortly after the verify-before-report emphasis.


    Compounding factor: the queue had accumulated ~31 stale messages (old completion
    notices, superseded instructions), so the correction was buried and delayed.'
  fix: Both workers cancelled (the XS-resumer and a second one that was inspecting
    the XS process — two workers on the same files would race), and a single clean
    month-only worker dispatched with an explicit "never touch XS" guard, resume-from-offset,
