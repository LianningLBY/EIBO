- id: M119
  date: '2026-09-14'
  category: agent_behavior
  severity: medium
  summary: A max_tpr worker reported "completed" while stopped mid-task with no output
    produced and the source unpatched - the inverse of the 21 false-failed cases.
    Neither status value is evidence about the work; only the artifact is.
  root_cause: The worker's terminal status was set to "completed" by a process that
    had stopped mid-task, most likely on budget exhaustion. Nothing in the reporting
    path checks whether the task's output exists, so a partial run and a finished
    run produce the same label. This is the mirror image of the false-failed cases,
    where a completed run was labelled failed.
  prevention: 'Treat a terminal worker status as a claim about the work, never as
    evidence of it. Before acting on any worker report, read the artifact the task
    was supposed to produce: for a recomputation, the output file; for a patch, the
    diff. A status field is generated by the same process that may have run out of
    budget, so it cannot be authoritative about whether the work was done. Two concrete
    consequences: (1) when a worker''s last message is mid-sentence or describes an
    action in progress rather than a result, treat the task as unfinished regardless
    of the status; (2) scope work so that the step most likely to consume budget is
    front-loaded with its inputs pinned exactly, and split large tasks rather than
    assuming they will fit. The general form, now demonstrated in both directions:
    the session has seen work-without-the-label and a label-without-the-work, and
    only reading the artifact distinguishes them.'
  status: active
  context: 'The worker dispatched to fix max_tpr reported status "completed" while
    standing mid-task. Its log contains three agent messages, and the last one reads:
    "The source confirms two stored max_tpr return sites at lines 645 and 675, while
    the sweep builds tprs at lines 650-655. The first payload glob I used exposed
    a filename-prefix mismatch and returned no arrays; I''m correcting that inspection
    to the actual x12_detector_validation_k5__per_class_scores__*.npz files and extracting
    only the old metric cells needed for the comparison." Then the log ends. I verified
    there was no output: no *max_tpr*recomputed* file anywhere, no new JSON written,
    nothing changed in the working tree from this task, and the source was never patched
    - lines 645/675 still store the wrong expression.


    This is the INVERSE of the 21 false "failed" flags seen earlier in the session.
    Those were cases where the work happened and the label said otherwise, and the
    standing rule became "a failed label is uninformative until the artifact says
    otherwise". This instance is the opposite: the label says the work happened and
    it did not. So neither status value is evidence about the work.


    Likely cause, and it is benign rather than a judgement error: the worker appears
    to have exhausted its turn or context budget mid-investigation. Its reasoning
    in message 3 was correct and it was fixing a legitimate glob mismatch. The defect
    is in reporting completion for an unfinished task, not in the investigation.


    Verified alongside: a SEPARATE worker (worker_Trace_maximum_pair_tpr) reported
    "done" at 10:32:53 and DID produce its content - five agent messages, the final
    one quoting the defect at lines 632-635 and 645/675 and identifying that the correct
    threshold-loop expression at line 654 is not what gets stored. So the two tasks
    differ and only the later one is hollow.'
  fix: 'Recorded the failure mode and its inverse relationship to the false-failed
    pattern: neither "completed" nor "failed" is evidence about the work; the artifact
    is. Re-dispatched the item with a tighter scope that front-loads what killed the
    previous attempt - the exact payload path stated up front so there is no glob
    ambiguity, and a one-line stop-and-report instruction if a path or schema is wrong
    rather than iterating on globs. Also recommended splitting the reproduction-and-recompute
    from the source patch into two tasks, given the demonstrated budget risk.'
