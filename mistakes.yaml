- id: M098
  date: '2026-09-14'
  category: agent_behavior
  severity: high
  summary: D053's correction reached the decision log, ROADMAP and memory but NOT
    the registry or framing, leaving a retracted conclusion on the two layers nearest
    the paper.
  root_cause: I treated "propagate the correction" as satisfied by updating the surfaces
    I happened to be writing in (decision log, ROADMAP, memory.md) and did not enumerate
    the remaining surfaces. paper_framing.md and registry.yaml were left carrying
    the retracted conclusion, and because both are read by the Paper Agent, the retracted
    version was the one most likely to propagate into the manuscript. Compounding
    it, my verification habit was to grep for the NEW phrasing, which by construction
    only matches where the correction already landed and cannot reveal where it did
    not.
  prevention: 'A decision that changes a claim has a FAN-OUT that must be enumerated
    explicitly rather than remembered: decision log, ROADMAP, registry, paper_framing,
    experiment_plan (including its claims block), and memory.md are SEVEN distinct
    surfaces, and ownership is split (the ROADMAP and framing are the Director''s;
    the registry is the Agent''s). Before considering a correction done, enumerate
    the surfaces and assign each one an owner, then verify by grep on the RETRACTED
    PHRASE specifically -- not on the new phrase. Checking for the new wording confirms
    it landed where it was written; checking for the OLD wording is what catches the
    places it did not reach. Direction matters too: the danger is asymmetric, because
    the layer closest to the paper (registry, then framing) is often the last to be
    updated and the most trusted downstream.'
  status: active
  context: 'D053 withdrew a conclusion I had published in D052 (the between-flow heterogeneity
    confound does not explain variant C; the BIC penalty is 2.43e-04 of dBIC and a
    heterogeneous-i.i.d. null falls ~47x short). I propagated the withdrawal into
    the decision log, ROADMAP, and memory.md. But I did NOT propagate it into registry.yaml
    or paper_framing.md, and neither did anyone else. Verified afterwards: registry.yaml
    had ZERO occurrences of D053 and still carried a block titled D052_FINDING_1_KILLS_PART_ii_AS_WRITTEN
    with terminal phrasing ("the corroboration is DEAD"); X3_C''s hypothesis field
    carried the same un-retracted text; paper_framing.md line 98 still read "the dependence
    the framing posits is REAL and FIRST-ORDER". Meanwhile the ROADMAP correctly carried
    D053 (7 mentions). So for a window the project simultaneously held two contradictory
    versions of the same claim, with the RETRACTED version sitting on the two layers
    closest to the paper -- registry and framing -- which are exactly the layers the
    Paper Agent reads.'
  fix: 'Corrected paper_framing.md and experiment_plan.yaml myself (the surfaces I
    own): the framing now states "FAR FROM GLOBALLY i.i.d." with an explicit DO-NOT-WRITE
    block, the refuted-heterogeneity numbers, and the position-wise-null requirement;
    the plan''s C3 claims line lost "provably cannot adjudicate" and now marks the
    mechanism NOT ESTABLISHED with the parametric route as a REQUIRED control. Both
    re-parsed. Dispatched the registry corrections (D053 block replacing D052_FINDING_1
    in X3 and X3_C; X3_A/B/C set from PREPARING to DONE with their real conclusions)
    to the Agent, which owns that surface -- and told it explicitly not to re-do my
    two fixes, only verify them.'
