- id: M014
  date: '2026-09-13'
  category: experiment_design
  severity: high
  summary: Treated coarsening's compression as helping only the upper side; it also
    lowers channel TV below the discriminability threshold, so M=1's feasibility window
    is EMPTY, not widest. Also mislabelled an M=4 table cell "ALL" where the computed
    ceiling is 0.255.
  root_cause: I reasoned about compression as a single-axis benefit ("lower TV helps
    the upper certificate") and did not check the lower side, because the intuition
    felt complete. The transcription error compounded it by making the coarse rungs
    look uniformly better. Both errors pointed the same direction — toward M=1 looking
    best — which is why the paired check (does the lower side survive this compression?)
    is the specific safeguard that was missing.
  prevention: 'When a coarsening is claimed to help a two-sided analysis, trace its
    effect on BOTH sides before concluding. A contraction reduces the measured distance,
    which helps any upper bound and hurts any lower bound — the sign is not uniform,
    and reasoning about one side is exactly how a wrong optimality conclusion survives.
    Concretely: for every monotone transformation applied to a quantity that appears
    on both sides of a threshold pair, write out both inequalities separately rather
    than reasoning about a single crossed interval. Separately, on transcription:
    when a table''s cell is a derived number, copy it from the computation rather
    than restating it, and never write a qualitative label ("all", "none") over a
    quantitative value — the label is where the error hides, since the number underneath
    is right.'
  status: active
  context: 'Two errors compound here. First, a transcription error: I wrote "ALL latent"
    for M=4 at n=200,000 in the upper-side eligibility table when the computed value
    is 0.255, and likewise mislabelled n=1e6 (0.904, also not "all"). The executing
    team recomputed and challenged the cell, correctly. I had the number in my own
    output and wrote the wrong label over it — the same family as M009 (the PHIST
    radius off by a factor of 10 from misread rows).


    Second and more substantive, which I found only when verifying the challenge:
    I had treated compression as helping the upper side only. Compression lowers the
    channel TV, which does help the upper side — but it *simultaneously* lowers the
    channel TV below the discriminability threshold T(n), which kills the LOWER side.
    If comp(M) < T(n), then even a maximally separable pair (latent TV = 1) has channel
    TV = comp(M) < T(n), so eps_lo stays 0 no matter how distinguishable the services
    are. The two constraints are decoupled: (U) radius(M,n) < 0.5, pure arithmetic
    and compression-independent; (L) comp(M) > T(n), also pure arithmetic and M-independent.


    Consequence: **M=1 is not viable.** Its compression (0.02) is below T(n) ≈ 0.055
    at every realistic n, so its feasibility window is empty — not the widest, as
    I had asserted. Under the assumed factors the viable set is M=2 (robust, window
    [0.51,1.0] at corpus scale) and M=4 (wider at corpus scale, [0.146,1.0], but narrow
    at XS scale, [0.157,0.255]); M=8/16 never certify. So "M=4 is optimal" needed
    the qualifier "at corpus scale" — at XS scale M=2 is the steadier carrier. The
    executing team''s specific concern ("M=4 shrinks at XS scale") was directionally
    right, though the mechanism was one layer deeper than the ceiling they flagged.


    Also: my first attempt at the write_report.py repair added only an explanatory
    comment above the unchanged criterion, leaving the defective test executing while
    the comment asserted it was addressed. I caught that and replaced the criterion
    itself.'
  fix: ROADMAP rewritten (D016) with the decoupled two-constraint form, the corrected
    per-rung table (M=1 window empty, M=2 robust, M=4 corpus-wide), and the rule that
    "ALL" may only be written when the ceiling is >= 1 since TV <= 1. The rerun is
    retained explicitly as a numerical cross-check that would falsify the analytic
    result if it reports a positive joint fraction at M=1.
