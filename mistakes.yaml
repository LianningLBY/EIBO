mistakes:
- id: M001
  date: '2026-09-13'
  category: resource_misuse
  severity: high
  summary: Reduced the MVP dataset scope on a disk-capacity premise derived from a
    disk probe that saw only the container OS disk; the machine has a ~517 GB free
    data disk and the full dataset fits.
  root_cause: 'I treated a degenerate probe result (single mount repeated three times)
    as a measured capacity ceiling, when the correct reading was that the probe had
    not seen the full mount table. The conclusion was then load-bearing for a scope-changing
    decision, so the error propagated into the plan rather than staying a bookkeeping
    discrepancy. Contributing factor: a prior evidence channel in the same session
    had reported a much larger store on the same machine; instead of resolving that
    contradiction I recorded it as an open item and proceeded with the reduction anyway.'
  prevention: Never draw a capacity conclusion from a disk probe that surfaces a single
    mount, and never treat a repeated identical row as corroboration. Before any decision
    that changes the experiment scope on resource grounds, obtain the full mount table
    (`df -h` plus `lsblk`) and reconcile it against any contradicting evidence already
    in hand. When two evidence channels disagree about a resource ceiling, resolving
    the disagreement IS the task — an unresolved contradiction is not grounds for
    the more conservative plan, because the conservative plan can itself be the wrong
    one. A scope reduction justified by an unverified resource limit is as costly
    as a scope expansion justified by an unverified opportunity.
  status: active
  context: 'At 11:55 UTC the executing team reported a capacity blocker: the bound
    server''s visible disk was ~30 GB total / 28 GB free, while CESNET-QUICEXT-25
    is 28.2 GB compressed across 12 monthly ZIPs, and the pre-registered flow-disjoint
    + time-disjoint split needs 13 month-files. I accepted that premise and issued
    decision D002 — reduce the MVP to 2 month-files, explicitly labelling the reduction.
    The re-review then measured the machine directly: /root/autodl-tmp is a data disk
    of ~550 GB with ~517 GB free and is actively in use, /autodl-pub/data holds ~20
    TiB shared, and /dev/shm is 45 GB. The entire 12-month dataset fits with ~489
    GB to spare. My own disk probe had surfaced only the 30 GB `overlay /` container
    OS disk, and repeated that same row three times without exposing other mounts
    — I could see the probe was degenerate but still drew a scope-changing conclusion
    from it. A parallel evidence channel in the same session had also flagged a much
    larger store on the same machine; I noted the contradiction in D002''s text and
    still proceeded with the reduction rather than resolving it first.'
  fix: 'D002 reversed by D003: full 12-month plan reinstated, download target set
    to the data disk, /dev/shm for Parquet staging. Reduction instructions withdrawn
    before any dataset download completed, so no compute was wasted; the cost was
    the roadmap churn and the interim user report, which was corrected in the same
    day.'
- id: M002
  date: '2026-09-13'
  category: agent_behavior
  severity: medium
  summary: Forwarded an unverified schema claim (that the XS h5 lacks the environment-axis
    fields) as fact and attached a plan consequence to it; a direct grep showed all
    the fields present.
  root_cause: I relayed a schema claim to the executing team without verifying it
    against the file, because it arrived from a source that had been reliable on other
    points and because it was convenient — it supported a plan adjustment (decoupling
    Step 0 from the download decision) that I had already been inclined toward. Convenience
    and source-trust substituted for a direct read of a 3.5 GB file that would have
    taken minutes to grep.
  prevention: 'Treat any statement about a data file''s schema as unverified until
    the file itself has been read or grepped. A column list from another project,
    a frozen extractor, a vendor description, or a prior report is evidence about
    *that artifact''s* usage, never about the file''s contents. The same rule applies
    to resource measurements: read the authoritative, complete source (full mount
    table, actual file), not a single-slice probe that happens to be convenient. When
    such a claim is load-bearing for a plan change, go read the artifact before forwarding
    it — the cost of a direct grep is minutes, and the cost of retracting a propagated
    claim is a plan revision plus credibility.'
  status: active
  context: 'A schema claim reached me: that the QUICEXT-25 XS h5 lacks QUIC_CLIENT_VERSION,
    DST_COUNTRY, DST_ASN and QUIC_SNI, and therefore Step 0 could not run on the h5.
    I forwarded it to the executing team as established fact with the execution consequence
    attached ("Step 0 and the download decision are coupled, not independent"), and
    it went into the plan. The claim had been inferred from a *different* study''s
    frozen column list — which records what that study chose to read, not what the
    file contains. A direct grep of the h5 byte stream then showed every one of those
    fields present, along with an explicit APP column.


    Same error class surfaced three times in one session from three different sources:
    (1) the schema claim above; (2) a literature worker''s note that listed APP among
    canonical fields while asserting in the same breath that it does not exist; (3)
    my own disk-capacity error (M001), where a probe showing only the container OS
    disk was read as a capacity measurement. All three replace a direct read of the
    artifact with an inference from an adjacent artifact.'
  fix: 'Withdrawal sent to the executing team in the same turn, with the corrected
    consequence: Step 0 can run on the h5, and the earlier "Step 0 is coupled to the
    download decision" claim is void. Also required: verify the h5''s month coverage
    before treating an h5-based Step-0 as representative, and align memory.md / findings.md
    to the current spec since they still quote the superseded gate.'
- id: M003
  date: '2026-09-13'
  category: code_bug
  severity: high
  summary: The plug-in upper-bound assessment tested `radius < 0.5` when certification
    requires `tv_hat + radius_1 + radius_2 < 0.5` — a necessary-but-not-sufficient
    criterion, the same failure mode as the original MVP gate.
  root_cause: A necessary condition was implemented where a sufficient one was needed.
    The author reasoned "the radius must be small relative to 0.5", which is true
    but not the operative constraint; the operative constraint is the total bound
    including the point estimate. The error survived because the surrounding prose
    (the report's own known_limitations) stated the real limitation correctly, while
    the numeric summary used the weaker test — so casual reading of the artifact looked
    consistent.
  prevention: 'For every pass/fail criterion, test sufficiency explicitly: does the
    checked condition IMPLY the desired property, or merely correlate with it? Write
    the implication out as a formula before implementing — here, `checked: radius
    < 0.5` against `required: tv_hat + radius_1 + radius_2 < 0.5`, and the mismatch
    is visible in one line. This compounds when the criterion sits inside a metric''s
    own implementation, because the resulting numbers are then cited as evidence without
    re-derivation. Reviewers of the criterion should ask "what does this number claim,
    and is the test strong enough to support that claim" rather than "is this number
    plausible".'
  status: active
  context: 'The statistical core''s `plugin_upper_bound_assessment` tests `radius
    < 0.5` as the condition for a certified floor. But eps_hi = tv_hat + radius_1
    + radius_2, so eps_hi < 0.5 actually requires radius < 0.5 - tv_hat, and tighter
    still if the two radii are equal. Since tv_hat > 0 for any two distinct services,
    the tested condition is systematically over-optimistic: it asserts certification
    in cases where the resulting eps_hi exceeds 0.5 and no floor is certified at all.
    This is the same failure mode as the project''s original MVP gate, which defined
    its informative stratum by eps_hat^hi < 0.5 while never requiring the upper bound
    to be certified — a criterion that does not certify what it claims, one level
    down in the stack.


    Also found in the same artifact: `interval_sanity.informative_fraction` computes
    `float(upper.eps_hi < 0.5)` on one synthetic 4-symbol pair and reports it under
    a name that reads as "fraction of pairs that were informative"; and `tv_lower_bound(method="classical")`
    selects its cutoff and evaluates it on the same held-out set, making it upward-biased
    and not a high-probability lower bound, while memory.md recorded it as a drop-in
    fallback.'
  fix: Fix `write_report.py` to test the sufficient condition before any of its numbers
    are cited; rename or genuinely compute the informative fraction; drop the classical
    method from the reporting path or label it a non-certified diagnostic that may
    never appear as eps_lo. Deliberately NOT fixed by substituting realized support
    for m, which would have made the criterion pass while invalidating the certificate
    (C005).
- id: M004
  date: '2026-09-13'
  category: communication
  severity: medium
  summary: Sent an instruction that retracted a claim in one section while a closing
    paragraph still asserted it — a self-contradiction the team had to flag back.
  root_cause: 'I composed a long instruction by appending a new correction section
    to a message whose closing section already carried the older conclusion, and did
    not re-read the whole message before sending. The retraction and the retracted
    claim ended up in the same artifact. Contributing factor: the message was long
    and the closing paragraph was boilerplate carried over from prior turns, which
    made it read as already-covered rather than as an active contradiction.'
  prevention: 'When a long instruction supersedes an earlier conclusion, re-read the
    whole message before sending and delete the superseded lines rather than leaving
    them alongside the new ones. The superseding and the superseded must never coexist
    in one artifact — this applies to specification documents as much as to messages,
    and it is the same rule that was already imposed on the team''s spec files (delete
    void entries, do not annotate them). A consistent rule applied only outward is
    a rule half-applied. Also: when a delegated probe or worker is the source of a
    pending number, verify it is still alive before telling anyone to expect that
    number; a queued callback is not evidence of a running worker.'
  status: active
  context: 'While retracting the "h5 lacks the environment-axis fields" claim mid-message,
    I wrote the retraction in section 1 and then left a stale closing paragraph that
    still asserted the opposite ("Step 0 must run on Parquet, not h5 (h5 lacks two
    environment axes)"). The executing team caught the contradiction and flagged it
    explicitly instead of silently choosing, which was the right call. Note also that
    the same long message instructed them about not letting errors drift into Worker
    code — the message itself was the vehicle for exactly that kind of drift.


    Separately in this session: a mount probe worker failed and the team did not notice,
    continuing to report "raw numbers will follow" as though it were still running.
    And my own disk tools return only the container-root mount, three identical rows,
    so no tool I hold can produce an authoritative full mount table — meaning a capacity
    figure I relayed to the user (about 517 GB free on the data disk) has never been
    verified by me.


    This is the mirror image of the schema-inference errors already logged (M001,
    M002): there the failure was trusting an adjacent artifact instead of reading
    the target; here the failure is not re-reading my own artifact before sending
    it.'
  fix: 'Confirmation sent: section 1 governs, the closing line is void. The team''s
    flag-don''t-pick behavior was explicitly endorsed as the standard practice. Also
    corrected the team''s belief that the mount probe was still running — it had failed
    — and closed the capacity question on directory-scan evidence instead of the unavailable
    raw numbers.'
- id: M005
  date: '2026-09-13'
  category: resource_misuse
  severity: medium
  summary: 'My own remediation for the capacity misread (use raw `df -h`) would have
    reproduced the identical error: `df` deduplicates by device and omits the data
    disk entirely on this host.'
  root_cause: 'I prescribed the retry command without understanding why the first
    reading was wrong. `df -h` looked like the authoritative raw source — rawer than
    the disk probe that had failed — so it appeared to be a strengthening of the evidence.
    In fact `df` on this host is itself the lossy view, and the genuinely raw source
    was `mount`, which the already-completed probe had captured. Two compounding assumptions:
    that "rawer" and "more authoritative" coincide, and that re-running a check is
    safer than interrogating the existing artifact.'
  prevention: 'When diagnosing a measurement error, diagnose the MEASUREMENT MECHANISM
    before prescribing a retry — a remediation that repeats the same command will
    reproduce the same blind spot. Concretely: before trusting any resource readout,
    ask what the tool would have to omit for this result to be misleading, and prefer
    the rawest available source (`mount` over `df`, `/proc/mounts` over a formatted
    summary). Separately: a process''s exit status is not a verdict on its artifacts
    — when a worker or tool reports failure, read what it actually produced before
    deciding it succeeded or failed. And do not treat a revision as complete until
    superseded content is deleted from every file it touched, not just the one being
    edited.'
  status: active
  context: 'After M001 (the original ~30 GB capacity misread), my remediation instruction
    was to "close the capacity question with raw `df -h` numbers." Review then diagnosed
    the actual mechanism: on this host `/dev/md0` is mounted at both `/init` and `/root/autodl-tmp`
    with XFS project quotas, and `df` deduplicates by device — printing only the 150M
    `/init` quota view and omitting the ~550 GB `/root/autodl-tmp` view. So bare `df
    -h` still would not have shown the data disk, and my fix would have reproduced
    the identical wrong answer a fourth time.


    Two adjacent facts from the same round: a mount-probe worker was scored `failed`
    while having in fact written a complete, valid `probe.json` containing the full
    `mount` table — the failure was in incidental steps (`ls` against another project''s
    directory, `git status` in a non-repo). And the ROADMAP accumulated duplicate
    stale header blocks across successive updates, which is the same "superseded content
    left in place" pattern logged as M004.'
  fix: Capacity evidence restricted to `mount` or an explicit-path `df -h /root/autodl-tmp`
    (C008). The probe's `probe.json` was identified as usable and the team directed
    to read it rather than re-run the probe. Roadmap header deduplicated.
- id: M006
  date: '2026-09-13'
  category: agent_behavior
  severity: medium
  summary: The team entered a self-imposed work stoppage in response to a "do not
    re-run the probe" instruction that was a redirection, not a halt; it then deferred
    the mandatory spec sync on that basis.
  root_cause: 'My instruction combined a redirection ("read probe.json") with a prohibition
    ("do not re-run the probe") in the same sentence, and a separate approved task
    sat nearby in the same message. The team read the prohibition as a general halt
    and generalized it to an adjacent approved task. Contributing factor: the message
    was long and carried several unrelated directives, so a scoped "don''t retry"
    was easy to over-extend.'
  prevention: 'Never phrase a scoped instruction as a prohibition when the intent
    is a redirection. "Do not re-run X, read Y instead" reads as "stop X" to a literal
    reader; the safe form states the positive action first ("read Y for the answer;
    no need to re-run X"). More generally: when a team member reports stopping work,
    the first response is to check whether the stop was actually ordered and whether
    the halted item was load-bearing — a cooperative halt on a misread instruction
    is more costly than a redundant execution, because it silently freezes the critical
    path while looking like compliance. Also: a document-workers-read-first sync must
    never be the thing that gets deferred under an ambiguous order; name it as mandatory
    and unconditional when issuing it.'
  status: active
  context: 'The executing team paused work and reported "Stopping both as instructed"
    for (a) the literature_map migration and (b) the mount-probe read, after I said
    not to re-run the probe. No stop order was ever issued: the literature_map migration
    had been explicitly approved, and the instruction on the probe was "do not re-run
    it, read the existing probe.json" — a request to use available evidence, not to
    halt. The team then declined to sync memory.md/findings.md, which still carry
    the superseded gate that can pass circularly, on the grounds of honoring the same
    supposed stop order — leaving the two documents that Workers read first on the
    old specification.


    The proximate damage was avoided because A_k, the data chain, and the other workers
    were already in flight and kept running. But the two documents that Workers read
    before writing code would have propagated the old gate.'
  fix: 'Immediate correction: no stop order was issued; the literature_map migration
    is approved as designed, and the probe instruction meant "read probe.json, do
    not re-run." The memory.md/findings.md sync was reissued as a top-priority item
    because it is the file set Workers read first.'
- id: M007
  date: '2026-09-13'
  category: experiment_design
  severity: high
  summary: A two-sided acceptance window `k_cert in [5,15]` selected against the best
    rungs — direction-only reaches k_cert 17, so the strongest certificate was marked
    FAIL because it was "too high".
  root_cause: The window was carried forward after the concern that motivated its
    upper endpoint was retired. I re-derived the lower endpoint when the framing changed
    but did not re-examine the upper one, so an obsolete guardrail survived and inverted
    in effect. The inversion was invisible without computing k_cert per rung — the
    gate looked reasonable as an interval and only the measured table showed it rejecting
    the strongest rung.
  prevention: 'When a threshold window has two endpoints, state what each endpoint
    protects against and re-validate both whenever the underlying concern changes.
    An upper bound written to stop a specific overclaim becomes harmful the moment
    that overclaim is withdrawn, because it then penalizes exactly the outcomes the
    work wants. Concretely: prefer a one-sided floor plus an explicit richness/reporting
    requirement over a two-sided window, unless the upper bound guards a live and
    named hazard. Also: for any "certified region exists" style gate, check whether
    the region can be satisfied trivially by a degenerate configuration (here, a channel
    so coarse that every pair is indistinguishable and every floor pins to its maximum)
    — if so, the gate needs a spread or non-degeneracy conjunct, not just an existence
    test.'
  status: active
  context: 'The MVP gate required `k_cert` to fall inside the window [5,15]. Measured
    at n=3.9e6, tv_hat=0.30: M=1 (direction only, base 2) reaches k_cert = 17; M=2
    reaches 8; M=4 reaches 5; M=8 reaches 4; M=32 (library default) reaches 2. A larger
    k_cert means the certificate survives to a larger k, which is strictly better
    — so the upper endpoint of 15 marked the best-performing rung as FAIL and would
    have pushed the workflow toward a finer rung that certifies less.


    The window''s upper bound originated in a different concern: an earlier claim
    lived at "k in the hundreds" and the cap was meant to keep the claim from outrunning
    the evidence. When that claim was retired (k is capped at 30 by the data), the
    upper endpoint outlived its justification and silently inverted from a guardrail
    into a penalty on good results. This is distinct from the sufficiency errors already
    logged (M003): there the criterion was too weak to certify what it claimed; here
    the criterion is too strong in one direction and rejects desirable outcomes.


    Related, and caught in the same review: the certified stratum is TV < ~0.48 by
    construction (the two error radii must fit inside 0.5 - tv_hat, and they are strictly
    positive), so on a coarse channel where TV between pairs is driven toward zero,
    nearly every pair satisfies the certification condition and the floor reads ~0.49
    for all of them — the maximum possible value. The gate would pass while conveying
    nothing about between-service differences.'
  fix: Gate restated as `k_cert >= 5` with no upper cap (D009), over the feasible
    [1,30]. Added a third conjunct requiring the eps_hi / floor spread across pairs,
    so a pass requires that the upper side is not uniformly vacuous.
- id: M008
  date: '2026-09-13'
  category: agent_behavior
  severity: medium
  summary: Asserted that memory.md/findings.md still carried the superseded gate and
    issued a priority sync instruction; the files were already correct, and the claim
    had been inherited unverified from a prior report.
  root_cause: I relayed an inherited claim as my own finding and attached a priority
    instruction to it. The claim had come from the executing team's prior report,
    and I treated it as established rather than as an unverified assertion to check
    — even though the whole point of that round was that stale documentation would
    mislead Workers, which made checking the files the obvious first step.
  prevention: 'Before asserting the state of any file, read it. This applies with
    particular force when the assertion is about to become an instruction that consumes
    another role''s effort, and when the claim arrived from someone else''s report
    rather than from my own earlier verified read — a handoff does not transfer verification.
    The specific tell to watch for: phrasing like "still carries X" or "has not been
    updated", which describes a state I am inferring from history rather than observing.
    Cheap to check in seconds, expensive to propagate.'
  status: active
  context: 'I told the executing team that memory.md and findings.md still carried
    the superseded circular gate, and instructed them to sync those files as top priority,
    on the grounds that Workers read them first and would otherwise write the old
    gate into code. When I read the files, memory.md already contained the correct
    gate (PASS requires the certified region to be non-empty, i.e. k_cert exists;
    `eps_lo <= eps_hi` explicitly marked REMOVED from PASS), findings.md contained
    no gate content at all, and the only occurrence of that expression was a correct
    explanatory comment in experiment_plan.yaml.


    This is the third instance of the same pattern in one session. The first: I stated
    that memory.md contained a literature_map claim that it did not contain. The second:
    I reported that the mount-probe worker was still running when it had already failed.
    In all three cases I asserted remembered or assumed state as verified fact without
    reading the artifact, and in this instance I escalated that assumption into an
    instruction that consumed the team''s attention on a non-existent defect.


    Notably, the third instance closely mirrored an error I had just attributed to
    the team: they had reported the same non-existent defect to me in the prior round,
    and I absorbed it rather than checking. So the correction propagated one hop further
    before being caught, which is the compounding risk.'
  fix: Verified the files by direct read, corrected the instruction in the same turn,
    and told the user explicitly that the premise I had issued was wrong and that
    the correction was mine to own. Asked the user to discount my unverified assertions
    accordingly.
- id: M009
  date: '2026-09-13'
  category: other
  severity: medium
  summary: Wrote a PHIST certificate radius off by ~10x into the ROADMAP — took 0.083
    (the n=1e4 row) as the n=1e6 value, and invented 0.058 for n=1e7. Both were in
    the artifact I had open.
  root_cause: I was rewriting a paragraph that already contained the figure, and treated
    the existing text as a source rather than re-reading the artifact's table. Retyping
    a number from my own draft, inside a document I was already editing, felt like
    copying — so no verification step fired. The draft's value had itself been set
    from a misread row.
  prevention: 'When a number from an artifact is going to be written into a plan or
    reported upward, copy it from the artifact rather than restating it from working
    memory, even when the artifact is open and the number feels fresh. Specifically:
    prefer pasting the source row over retyping a rounded value, and when two adjacent
    figures are needed from the same table, take both from the same read rather than
    one from memory and one from the table. A numbers-bearing table that will inform
    a decision deserves a direct copy; a paraphrase is where the wrong-row error enters.'
  status: active
  context: 'Writing the PHIST object definition into the ROADMAP from a worker''s
    verification report, I transcribed a radius figure as "≈0.083 at n = 1e6, ≈0.058
    at n = 1e7". The artifact''s actual table gives, for m=32 with alpha=0.05 and
    a joint 95% union bound: n=1e4 → 0.0862, n=1e5 → 0.0273, n=1e6 → 0.0086, n=1e7
    → 0.0027. So the first figure was lifted from the wrong row, off by roughly 10x,
    and the second (0.058) does not correspond to any row at all — it appears to have
    been extrapolated rather than read.


    The error was caught by a review pass that recomputed the table independently
    and flagged the mismatch against the artifact. I had the artifact open at the
    time and could have copied the numbers directly.


    This sits in a cluster with the earlier session errors — the schema inference
    (M002), the disk misread (M001/M005), and the capacity figure I relayed unverified
    (M004) — all instances of a value stated without reading the source that held
    it. What distinguishes this one: the source was already in my context, so the
    failure was transcription rather than lookup, which makes it the cheaper of the
    two to have avoided and the more embarrassing to have made.'
  fix: 'Corrected the ROADMAP to the verified table, including the m=128 column for
    the sample-penalty comparison, and told the executing team explicitly that my
    prior figure was wrong and where it had come from. The corrected values change
    a planning-relevant conclusion: Q2''s certificate is tighter than Q1''s by a wide
    margin, not marginally.'
- id: M010
  date: '2026-09-13'
  category: other
  severity: high
  summary: 'Retracted my own replacement throughput figure: the 2.4 MB/s came from
    the liberouter XS endpoint, not the Zenodo month endpoint, so it could not be
    transferred — while I was rejecting the worker''s figure for the same class of
    over-generalisation.'
  root_cause: I wanted to refute the pessimistic figure and reached for the strongest
    counter-number available in my context without checking whether it measured the
    same thing. The XS fetcher and the month downloads shared a server and a data
    disk, which made the rate feel like a host property; the differing endpoint was
    visible in my own notes and I did not connect it.
  prevention: 'Before generalising a performance measurement, state the endpoint,
    host and service it came from, and check that the target shares them. A throughput
    number is a property of (source, path, time window), not of the machine — two
    fetches on the same server from different origins can differ by an order of magnitude
    or more. Concretely: when a rate is cited to justify a plan, name its endpoint
    explicitly alongside it; if the endpoint differs from the one the plan depends
    on, the figure is not evidence. This is the same trap as a single-mount disk probe,
    one layer up: a measurement that is real but scoped to something other than the
    thing being decided.'
  status: active
  context: 'A worker reported that the only permitted fetch mechanism was foreground
    curl at 82,894 B/s, implying ~94 hours for the remaining 11 months, and asked
    me to choose between cutting the month set, finding a faster channel, or changing
    corpus. I rejected the premise and told the team not to scope on it — correct
    instinct — but I justified it with my own figure: I cited ~2.4 MB/s aggregate
    and "full record ~3.2 h, not 94 h" as the corrected number, and wrote it into
    the ROADMAP as "fetch method PROVEN."


    That 2.4 MB/s was measured on a **different endpoint**. It came from the XS h5
    fetched from `liberouter.org` (CESNET DataZoo bucket). The month archives come
    from `zenodo.org` — different host, different CDN, different rate limits. I transferred
    a rate across endpoints as though it characterised the host, which is precisely
    the class of error I had just flagged in the worker''s report.


    So the record briefly held an inverted state: the pessimistic figure was rightly
    discarded, but the replacement was also unsound, and the replacement was mine.
    Both are now retracted; the decision-bearing measurement (a >5-minute window against
    the month endpoint via the managed tool path) has been specified and no scope
    decision is permitted until it lands.


    Note also the accompanying reasoning error: I concluded "detached launch is policy-blocked"
    was refuted because the XS fetcher ran detached. That part is sound — the refusal
    text concerns GPU processes and the managed tool path demonstrably runs detached
    work. But I then treated the XS fetcher''s *speed* as evidence about the month
    endpoint, which does not follow from the same observation.


    Separately in this round: I corrected an attribution error I had made, where I
    described the prior turn''s memory.md rewrite as unnecessary when in fact the
    executing team had performed it. And I declined the scope-decision fork, which
    was the right call — but declining it for the wrong reason, with a number I had
    not validated.'
  fix: Both throughput figures retracted in the ROADMAP (M010), with an explicit prohibition
    on deriving any ETA from either and on reducing the month set / altering the split
    / changing corpus before the month-endpoint measurement lands. Told the user directly
    that my own number was wrong and why.
- id: M011
  date: '2026-09-13'
  category: agent_behavior
  severity: medium
  summary: Asserted an in-flight transfer was alive and would finish shortly, based
    only on a directory-size snapshot; the team's process-level check showed it had
    died with ~116 MB left.
  root_cause: I had one convenient reading in context (a directory size that had grown
    between two calls), and it supported the conclusion I preferred — that the transfer
    was healthy and no action was needed. Wanting to refute a stalled-transfer narrative,
    I treated a supporting quantity as proof of liveness without asking what a liveness
    check would actually consist of. The team's counter-evidence prompted the question
    that should have preceded my assertion.
  prevention: 'Liveness questions require liveness evidence. A size, timestamp, mtime,
    directory listing, or counter answers "how much" — never "is it running". Before
    asserting that a process is alive, query the process directly; if no such check
    is available, say the liveness is unverified rather than inferring it. More generally,
    when a claim rests on a proxy quantity, name the proxy and check whether it can
    actually distinguish the states in question: a growing directory cannot distinguish
    "still running" from "killed mid-write", and a directory size cannot distinguish
    either from a stale snapshot.'
  status: active
  context: 'I asserted that the in-flight XS transfer was alive and would finish "within
