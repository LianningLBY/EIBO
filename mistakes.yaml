- id: M103
  date: '2026-09-14'
  category: experiment_design
  severity: high
  summary: 'Fourth instance today of a check that cannot fail: X6''s validity gate
    reports 0/120 violations while ~75/120 rows are mathematically incapable of violating.'
  root_cause: 'Control design consistently failed to include the failure it was meant
    to detect. Each of the four cases chose a configuration in which the hypothesis''s
    falsifying outcome was unreachable: a fixed axis for a claim about that axis;
    an empty stratum for a statistic defined on it; a construction whose output is
    affine regardless of the data; a bound clipped to a boundary that cannot exceed
    any non-negative truth, with a sample size small enough to clip and truth values
    including zero. The common cause is that the tests were built to CONFIRM rather
    than to DISCONFIRM, and no step in the workflow asked for the falsifying output
    before the PASS was recorded.'
  prevention: 'Before treating any control, test or validation gate as evidence, ask
    what a FALSE hypothesis would produce and confirm the test can produce it. Concretely,
    three failure shapes to check for by name: (i) the test holds fixed the very axis
    the claim varies along (fixed-k validation of a claim about k); (ii) the test
    is defined on an empty or degenerate population (a stratum with no members, a
    threshold that filters everything); (iii) the test''s own construction forces
    a pass (clipping to a boundary that cannot violate, comparing two objects that
    share the structural property being tested, an affine curve compared against an
    affine reference). For replication counts, always report the TESTABLE subset size
    alongside the total, because a bound pinned at a boundary inflates the denominator
    with rows that cannot fail. And when an audit prints a column of identical or
    boundary values, treat that as the anomaly it is rather than as data to list.'
  status: active
  context: 'Four separate checks in one session could not exercise their own failure
    mode. (1) The original X3 known-truth control: the estimator was validated at
    FIXED k while the claim lived ACROSS k, so the validation held the claim''s own
    axis fixed and could say nothing about it. (2) X12 at k=15: the informative stratum
    was EMPTY (0/946), so the pre-registered statistic was defined on an empty set
    and the run reported a clean completion with zero evidence. (3) The parametric
    route: D_k is affine in k by construction (any fitted order >= 1) and identically
    0 for order 0, so the test could not return sublinear and its "passed decisively"
    control compared two curves that were both affine by construction. (4) X6''s validity
    gate: `violation = bound > truth + 1e-12`, but the bound is clipped at 0 and VALIDITY_SAMPLE_SIZE
    = 400 makes it clip for most rows (classifier errors near chance), so ~75 of 120
    rows are mathematically incapable of violating; additionally all 24 rows with
    requested truth 0.00 compare a zero bound against zero. Reported as "0/120 violations"
    when the honest form is "45/45 testable rows comply". Each of these produced a
    PASS-shaped output that read as strong evidence and was not.'
  fix: 'Standardised remedy adopted across the project: every control or test must
    answer "what would this output if the hypothesis were FALSE?" before it is used
    as evidence, and if no output could falsify it, it is not a source of evidence.
    Made concrete as three checks: (a) a zero-intervention or null setting must reproduce
    its reference exactly (adopted after the D056 off-by-4); (b) a fitted curve must
    be proven non-saturated over the fitted window, with exact-zero increments counted
    (adopted after D063); (c) a replication-based check must report its TESTABLE row
    count, not its total, and must assert a minimum fraction of strictly positive
    bounds (adopted here, D071). Also upgraded the audit template: two independent
    audits passed over self-certifying anomalies printed in their own output (constant
    D_k values in variant B, all-zero bounds in X6), so audits must now scan for constant,
    repeated and boundary values and require any such run to be explained rather than
    listed.'
