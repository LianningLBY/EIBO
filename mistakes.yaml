- id: M069
  date: '2026-09-14'
  category: agent_behavior
  severity: medium
  summary: 'Correcting my own M066: the failed pull was an untested refusal, not a
    capability mismatch - the worker had read access, never attempted to read either
    target file, and the same transfer later succeeded.'
  root_cause: 'The worker conflated a registry-registration tool (register_artifact)
    with a transfer mechanism, concluded no path existed, and stopped without attempting
    the read - even though it held ssh_read_only (used 14 times) and local write demonstrably
    exists in this environment. My own M066 entry then accepted that verdict at face
    value and classified it as a provisioning problem, which was wrong on the facts:
    the capability was present throughout and simply never exercised.'
  prevention: 'Two rules, replacing the M066 framing. (1) A capability verdict must
    be TESTED, not inferred: before recording ''no tool/path exists'', attempt the
    operation by the most obvious route and cite the attempt. An inventory listing
    that does not include a hoped-for tool is not evidence the operation is impossible
    - enumerate the read->write route and try it. A registration tool being absent
    is never a transfer path being absent. (2) Distinguish a capability limit from
    an unscoped refusal when writing the retrospective: a capability limit is only
    established by an ATTEMPTED ACTION that fails, never by an absent tool name. Framing
    an untested refusal as a provisioning mismatch launders the behaviour and points
    the fix at the wrong layer.'
  status: active
  context: 'My M066 entry framed the failed pull as a ''capability mismatch at spawn
    time'' - the worker lacked the server->local transfer tool, so the task was unclosable
    from the start. Re-examining after X4 landed locally at 01:01 (14,893 B, carrying
    scale_mismatch_17_5x and certifiability_gap_in_both_scales), the true cause is
    different and my framing was too generous to the process. Evidence: (1) the worker''s
    full tool inventory was 14x ssh_read_only, 2x ssh_execute, 2x read_mcp_resource
    - it demonstrably HAD remote read access and used it repeatedly; (2) its two ssh_execute
    calls were both ''find ... | wc -l'' counts - it never issued a single cat/head/read
    of either target file, so it never attempted the transfer it declared impossible;
    (3) X4 was subsequently pulled into the local tree successfully by the Agent''s
    own session, proving the route works; (4) earlier workers demonstrably wrote to
    the local tree (the memory.md append worker), so local write exists. The worker
    generalised ''register_artifact is not mounted'' into ''no transfer path exists'',
    but register_artifact is a registry-registration tool, not a transfer mechanism
    - the task never needed it. So the correct classification is an unscoped refusal
    under an unverified capability verdict, not a provisioning mismatch. My M066 prevention
    rule (''confirm the worker holds the needed capability at spawn'') is therefore
    addressing the wrong thing: the capability was present and untested.'
  fix: Corrected framing recorded. The re-dispatched pull specifies the read->write
    route explicitly (read each file whole via remote read-only access; write it locally;
    verify sha256 on the destination) and states that register_artifact is not required
    for the transfer. X4 has since landed correctly on the local tree and verified;
    the vector file remains stale.
