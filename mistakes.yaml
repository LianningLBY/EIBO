- id: M101
  date: '2026-09-14'
  category: code_bug
  severity: high
  summary: The D056 fix landed in a stray artifacts/X3/ layer while the canonical
    _project/data/ mirror kept pre-fix bytes, with two contradictory manifest entries
    both live and citable.
  root_cause: The fix worker wrote its corrected output to a newly-created layer rather
    than to the path the artifact already occupied, leaving the canonical mirror holding
    pre-fix bytes. The manifest then accumulated a second entry for the same artifact
    instead of superseding the first, so both remained citable and contradictory.
    Compounding it, the worker generated its report from material read before a later
    rewrite of the same file, so its quoted hash and table were already retired. No
    process step verified the canonical path's hash after the repair, which is why
    a byte-level fork survived a prose-level correction.
  prevention: 'Two rules. FIRST: a repair must write to the location the artifact
    already occupies. If a worker writes an artifact to a path that does not already
    hold it, that is a signal to STOP and confirm placement, because a new layer silently
    forks the artifact and the documented canonical path can be left stale. Verify
    placement by hashing the canonical path after any repair, not by assuming the
    fix landed correctly. SECOND: a worker report must be generated AFTER its artifact
    is frozen. A report quoting a hash or a table the worker read before a later rewrite
    will publish retired numbers, and even when the headline conclusion is unchanged
    the supporting figures are wrong. Also generalisable from the same episode: when
    two copies of one artifact exist, treat it as a blocker like any other same-nominal-quantity
    conflict -- do not pick one and move on.'
  status: active
  context: 'The D056 fix corrected an off-by-4 in x3_control_occupancy_dose_response.py
    and re-ran the control. But the corrected output was written to a NEW layer, artifacts/X3/data/,
    while the artifact''s established location under artifacts/_project/data/ (the
    canonical layer per CLAUDE.md, holding 36 registered files versus the stray layer''s
    2) kept the PRE-FIX bytes: 290,859 B / sha 5a82bf7d / p=1.001 / k=5 D_k=0.3415
    (the shifted axis). The fixed file was 291,163 B / sha 88625bba. The manifest
    then carried TWO live contradictory entries for the same artifact: art_20260914_b9b161
    describing the old p=1.001 table and pointing at _project/data/, and art_20260914_4d9b49
    describing the corrected table and pointing at X3/data/. Both were type: data
    and both citable. So any reader following the documented canonical mirror path
    received the wrong bytes, and the entry with the fuller description pointed at
    them. This is the same failure class as the earlier X5 manifest inversion, in
    a different form: not a description disagreeing with its bytes, but one artifact
    name existing at two addresses with the authoritative one stale. Separately, the
    fix worker''s own report quoted its pre-fix table and a stale sha (the file was
    rewritten at 06:46 after it read it), so its published numbers were retired even
    though the top-line conclusion happened to be unchanged.'
  fix: 'I copied the corrected bytes over the canonical path myself and verified:
    _project/data/x3_control_occupancy_dose_response.json is now 88625bba..., 291,163
    B, with plain no-thinning p = 0.651 and k=5 D_k = 1.694909 matching analytic truth.
    Logged D061. Dispatched three cleanup items: retire art_20260914_b9b161 so only
    one live manifest entry remains; state in writing which layer is authoritative
    (and consolidate into _project/ if the X3/ layer was accidental, which the file
    counts suggest); and resolve the newly-exposed 0.651-versus-0.539 conflict, where
    the original control and the corrected dose-response agree at 0.651 for the plain
    no-filter baseline while variant B reports 0.539 for nominally the same construction.'
