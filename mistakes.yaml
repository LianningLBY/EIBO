  date: '2026-09-13'
  category: experiment_design
  severity: low
  summary: Wrote that M=1's eps_lo "stays 0"; it is actually a small positive number
    (0.004-0.020) that never reaches the 0.05 threshold. Gate conclusion unaffected,
    but the claim was over-strong and one computation would refute it.
  root_cause: 'I reasoned from the threshold side only: since eps_lo can never exceed
    0.05 on M=1, I wrote it as 0, which reads as the natural way to say "the lower
    side is vacuous here". The distinction between "vacuous" and "identically zero"
    is not salient when the conclusion is unaffected, which is exactly why the overstated
    wording slipped through.'
  prevention: 'Distinguish "never satisfies the condition" from "equals the extreme
    value" when a threshold is involved. A quantity that fails a threshold is bounded
    away from it on one side, not pinned to zero or to any other extreme, and writing
    the stronger form invites a single-computation refutation that then casts doubt
    on the correctly-stated result beside it. Concretely: before writing a quantity
    is exactly 0, exactly 1, or never changes, compute it at the boundary of its admissible
    range and check. The bound, not the equality, is what the argument usually needs.'
  status: active
