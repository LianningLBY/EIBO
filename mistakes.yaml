- id: M097
  date: '2026-09-14'
  category: experiment_design
  severity: high
  summary: C3's reframe was carried by an unsupported control (heterogeneity confound)
    and a causal mechanism claim contradicted by the very sweep cited beside it.
  root_cause: 'Two independent failures of the same kind. (a) The control for part
    (ii) differed from the real-data construction along a dimension that can CREATE
    the effect: homogeneous-within-item control vs pooled-heterogeneous-flow real
    path, so between-flow heterogeneity was never excluded and the "dependence is
    real" conclusion was unsupported. (b) The causal attribution to sparse occupancy
    was written as MEASURED without checking it against a prediction the attribution
    itself makes; the contradicting evidence was already present in variant B''s threshold
    sweep in the same artifact family, unread. Both are instances of the project''s
    dominant error class: a plausible conclusion carried by a justification that was
    never tested against the alternative it claims to exclude. Compounding both, a
    corrected plan line was silently overwritten by a later rewrite of the same entry,
    so the correction did not persist.'
  prevention: 'Two generalisable rules. FIRST: a known-truth control must MATCH the
    real-data construction in every structural respect that could itself generate
    the signal. Here the control was homogeneous within item while the real data pooled
    heterogeneous flows -- and that mismatch alone is sufficient to produce the claimed
    effect, so the control validated nothing about the real data. Before citing a
    control as discriminating, state explicitly which alternative it EXCLUDES and
    confirm the control differs from the real path only in the dimension under test.
    SECOND: when a mechanism is attributed causally, look for a PREDICTION that the
    attribution makes and check whether the existing sweep already contradicts it.
    Here "sparse occupancy causes the deflation" predicts that removing sparse contexts
    moves the estimate toward linear; the artifact in the same family showed the opposite
    direction, and nobody read the sweep against the prediction. A causal word like
    MEASURED must be earned by a dose-response or an intervention, not by an observed
    correlation.'
  status: active
  context: 'The D046 C3 reframe asserted two things that an independent critical (verified
    by me in code, D052) found unsupported.


    (1) PART (ii) "the dependence is real and first-order" rested on variant C''s
    nested-Markov-vs-iid test, whose known-truth control is HOMOGENEOUS within item:
    x3_variant_c_nested_lr.py:161 synthetic_iid_case uses probabilities = np.linspace(0.20,
    0.80, CONTROL_ITEMS), so every flow in an item shares ONE probability. But the
    real-data path (line 233 real_data_report) pools ALL flows of a service into ONE
    item. Consequence: with within-service heterogeneity (half the flows at p=0.30,
    half at p=0.70), the POOLED transition counts exhibit theta_0 ~ 0.42 and theta_1
    ~ 0.58 -- strong apparent first-order dependence with ZERO true within-flow dependence.
    The control therefore cannot distinguish "genuine within-flow dependence" from
    "between-flow heterogeneity", and C''s 45/45 Markov result is consistent with
    both. I had written in the framing and ROADMAP that (ii) "establishes the dependence
    is real and first-order"; it does not.


    (2) PART (i)''s causal sentence "the mechanism is MEASURED (sparse occupancy)"
    is CONTRADICTED BY VARIANT B''S OWN SWEEP, which was in the same artifact family
    I cited. Verified from x3_variant_b_support_conditioning.json: the plain arm''s
    power exponent DECREASES monotonically as the occupancy threshold tightens --
    T=5/10/20/50/100 gives p = 0.539/0.420/0.372/0.260/0.210 against a no-filter baseline
    of 0.651; the twin moves the OPPOSITE way (1.042/1.027/1.016/1.011/1.007 vs 0.897).
    If sparse contexts manufactured sublinearity, REMOVING them should push the plain
    arm toward LINEAR (p -> 1). It pushes it further sublinear. So B supports "cannot
    be fixed by conditioning" but not "sparse occupancy is the cause". The two arms
    moving in opposite directions is itself unexplained.


    (3) The gate''s two arms are systematically unequal: twin_services_used = [0,
    1] -- only the two largest services (n ~ 1,375,270 / 359,864) versus plain''s
    200,000 per side -- so the twin is easier and the gate tests the well-occupied
    regime, while what breaks the estimator is the sparse regime.


    (4) A correction I had already made to experiment_plan.yaml (variant A is a delete-one
    JACKKNIFE correction, not "k-NN-family") was OVERWRITTEN when that entry was later
    rewritten: the plan again reads "finite-support-corrected / k-NN-family" and "jackknife"
    appears 0 times.'
  fix: 'ROADMAP corrected in place (the contradicted mechanism sentence replaced with
    the measured sweep numbers and marked RETRACTED; (ii) marked NOT ESTABLISHED).
    D052 logged. Two discriminating controls dispatched: (a) a heterogeneous-i.i.d.
    arm -- within-item per-flow direction rates drawn from the empirical per-flow
    distribution, i.i.d. within flow -- which decides whether (ii) survives (if it
    also returns Markov 45/45, heterogeneity fully explains C and (ii) is dead); (b)
    an occupancy dose-response arm to convert "sparse occupancy" from correlation
    to causation or kill it. A fourth candidate variant (fit a low-order Markov and
    compute D_k under the FITTED model) was identified as the one route that estimates
    the same growth question while bypassing occupancy collapse. The plan''s variant-A
    text was corrected again, with the meta-lesson recorded that a correction must
    be re-verified after any subsequent write to the same file. Framing novelty positioning
    against the classical sparse-KL literature (Miller 1955; Grassberger 1988; Paninski
    2003; Kraskov 2004) recorded as an outstanding obligation. Dropping C3 to a two-claim
    paper is held in reserve for the user, not decided unilaterally.'
