- id: M104
  date: '2026-09-14'
  category: communication
  severity: medium
  summary: Described a per-k result as "nearly every k" when two rungs (k=3, k=4)
    are marginal; caught by downstream reading the artifact against my summary.
  root_cause: My local tree was stale so I could not open the artifact, and I characterised
    its shape ("nearly every k") from a relayed summary rather than restricting myself
    to the quantities I had actually seen. A summary of per-rung results does not
    carry the per-rung shape, and I generalised across rungs I had not read. The downstream
    role checked the file against my prose and found the discrepancy.
  prevention: 'When relaying numbers from an artifact I cannot open locally, either
    pull it first or describe only the quantities I have actually seen, and never
    characterise a SHAPE ("nearly every k", "monotone", "uniformly") from aggregated
    statistics — a median or a total cannot tell you the shape across rungs, and the
    shape is often the load-bearing part. Concretely: state the endpoints and the
    aggregate as measured, and say explicitly that intermediate rungs are unverified
    if they are. This is the same class as the project''s standing rule to verify
    by reading the file rather than a derived view; the new part is that a SUMMARY
    I write from someone else''s numbers is itself a derived view, and needs the same
    scepticism as a tool''s derived output.'
  status: active
  context: 'I described the position-wise i.i.d. null result as beating first-order
    Markov at "nearly every k", on the basis of a relayed summary of a server-side
    artifact I could not open (my local tree was stale). Once the artifact was pulled
    locally, I read the full per-prefix table myself: k=2 45/0, k=3 25/20, k=4 33/12,
    k=5 42/3, k=6 44/1, k=7-8 44/1, k=9-29 43/2, k=30 41/4, zero ties. The k=3 and
