- id: M106
  date: '2026-09-14'
  category: code_bug
  severity: high
  summary: 'My unanchored `data/` .gitignore rule silently excluded the ENTIRE evidence
    chain (artifacts/**/data/: 56 JSON artifacts, 0 tracked) while tracking their
    producing scripts -- inverting the project''s core byte-traceability discipline
    and falsifying the README. Caught by an independent reviewer measuring tracked-vs-on-disk;
    fixed by anchoring and negation, verified by count.'
  root_cause: I wrote an unanchored `data/` pattern intending it to match only the
    root data directory, not knowing or not checking that git matches such patterns
    at every depth. I then described the .gitignore's behaviour in a comment and in
    the README from my INTENT rather than from a measurement of what git actually
    tracked. The one-second check that would have caught it (`git ls-files 'artifacts/**/*.json'`
    returning 0 against 56 files on disk) was never run, because the change "looked
    right".
  prevention: 'Two rules. FIRST: after any .gitignore change, VERIFY BY MEASUREMENT
    -- run `git ls-files <the paths that must be tracked>` and compare the count against
    `find`, and run `git check-ignore -v` on a representative path from each directory
    that must be included. Reading the diff, or reasoning from the edit''s intent,
    cannot detect an unanchored pattern matching at depth; the diff looks exactly
    right. SECOND: never write an unanchored directory pattern in a .gitignore that
    is meant to scope one location -- anchor it (`/data/`), because git''s matching
    is depth-agnostic and a bare name silently captures same-named directories anywhere
    in the tree. Both rules apply generally: this is a "check whether what you asserted
    is what the system actually does" failure, the same family as the other defective
    checks found in this project, and it was again caught by comparing an assertion
    against a measured count rather than against the reasoning that produced it.'
  status: active
  context: 'I wrote the project''s .gitignore while fixing the repository scope requested
    by the user. My intent was to exclude bulk corpora and keep the evidence chain
    (artifacts/) tracked. I wrote an UNANCHORED rule `data/` under the heading "Bulk
    data and weights: never track". In git, a pattern with no leading slash matches
    at ANY depth, so `data/` matched not only the root data/ directory but also artifacts/_project/data/,
    artifacts/X3/data/, and artifacts/X6/data/ -- which is where the artifact JSON
    that constitutes the evidence chain lives. I did remove the earlier `artifacts/`
    exclusion, and I wrote a correct explanatory header saying artifacts/ MUST be
    tracked, so the file''s stated intent and its actual behaviour contradicted each
    other. Measured result: 56 artifact JSON files on disk under artifacts/, 0 tracked
    by git, while the runner scripts that PRODUCE those artifacts were tracked. That
    is the exact inversion of the project''s central discipline ("every reported number
    maps to an artifact''s bytes"), and it also falsified the README''s claim that
    artifacts/ is tracked. An independent reviewer caught it by running `git check-ignore
    -v` on a specific artifact path and comparing `git ls-files` against `find`.


    A second, related defect in my own fix: I initially placed the negation `!artifacts/**/data/`
    AFTER the bulk-extension rules, which is the wrong order -- a later ignore rule
    would override the earlier negation and could have silently re-excluded bulk kinds
    under artifacts/. I also carried forward an `artifacts/**/*.npz` rule that I had
    assumed was load-bearing; on checking, there are ZERO .npz files under artifacts/,
    so it was dead and its interaction with the new negation was undefined.'
  fix: 'Anchored the bulk rule to the repository root (`/data/`) so it no longer matches
    at depth, added an explicit `!artifacts/**/data/` negation placed BEFORE the extension
    rules so those still win for genuinely bulky kinds, and deleted the dead `artifacts/**/*.npz`
    rule after verifying 0 such files exist. Verified by measurement rather than by
    reading the diff: 56 of 56 artifact JSON tracked, 0 ignored, 0 untracked outside
    artifacts, 13.4 MB total and largest 1.9 MB (acceptable), secret scan clean, and
    logs/ + chats/ still 0 in the index. Committed the evidence chain (e0ba1da) and
    a README correction (4242dd7) that states all 56 artifacts are tracked and that
    any future artifact too large to track must be named as server-only, because an
    untracked artifact silently breaks the byte-traceability claim. Kept the known-stale
    local variant-C file visible in the commit message rather than enshrining it silently.'
- id: M107
  date: '2026-09-14'
  category: code_bug
  severity: high
  summary: 'I violated my own C028 within minutes of writing it: restored the X3 metrics
    keys via a yaml.safe_dump whole-file rewrite that preserved all data but collapsed
    registry.yaml from 1,832 to 867 lines. Also caught that the supplied acceptance
    test (after == delta + 5) was arithmetically wrong - the true union is 34, not
    27 - and would have passed an incomplete restore.'
  root_cause: 'I reached for the most convenient mechanism (load, merge in memory,
    dump) without asking whether it was permitted for this file, minutes after writing
    the constraint that forbids exactly that mechanism for it. The convenience was
    the trap: the operation succeeded, the data was preserved, and the destruction
    was confined to formatting - which is precisely why the parsed-content comparison
    I used to sanity-check it did not catch the problem. Two independent failures
    in one action: the wrong mechanism, and a check blind to that mechanism''s characteristic
    damage.'
  prevention: 'For any edit to a hand-maintained append-only knowledge file: NEVER
    round-trip it through a serializer (yaml.safe_dump, json.dump with indent, a formatter,
    or a formatter-on-save setting). A serializer preserves the parsed data while
    destroying the file''s actual content - formatting, block-scalar folding, ordering,
    comments - and the loss is silent because the parsed result compares equal. What
    that means practically: "the parsed content is identical" is NOT evidence that
    the edit was safe, precisely because that comparison is blind to everything a
    serializer changes. The correct method is an anchored text splice that leaves
    every line outside the edited region byte-identical, verified line-by-line before
    and after the region. And when a count-based acceptance test is specified, recompute
    the target from the actual key sets rather than trusting a delta formula derived
    from an earlier count - a formula like after == delta + 5 encodes an assumption
    about overlap that may be false, and a wrong acceptance test fails a correct restore
    or, worse, passes an incomplete one.'
  status: active
  context: 'While restoring the X3 metrics keys that had been lost to the seventh
    partial-dict overwrite, I first did it by loading registry.yaml with yaml.safe_load,
    merging the key sets in Python, and writing the whole file back with yaml.safe_dump.
    The data was preserved - I verified the parsed content was identical to the pre-edit
    state everywhere outside X3.metrics - but the serializer collapsed the file from
    1,832 lines to 867, rewriting the formatting wholesale and folding multi-line
    block scalars. registry.yaml is a hand-maintained append-only knowledge file that
    C028 (which I had written minutes earlier) explicitly protects from whole-file
    replacement, and whose long single-quoted narrative entries are meaningful content,
    not incidental formatting. I reverted from the backup I had made, and redid the
    edit as a text-level splice: extract HEAD''s 28-key block and the live file''s
    6-key block by anchor, insert both between the same anchors, and verify the lines
    before and after the block are byte-identical. I then applied C028''s own test
    before placing it - proof that current is a strict subset of candidate, that every
    current key AND value is preserved, and that the rest of the file is unchanged
    - and placed it only after that test passed. Final state verified by read-back:
    X3.metrics = 34 keys, no HEAD key missing anywhere, and the damage confined to
    X3 (all other experiments matched HEAD exactly).


    Separately, the acceptance test I had been given for this restore was arithmetically
    wrong and would have passed a partial restore: it asserted after == delta + 5,
    but HEAD has 28 keys, the live file had 6, and their overlap is ZERO, so the correct
    union is 34 and the formula gives 27. I computed the true union myself rather
    than applying the given formula.'
  fix: 'Reverted the whole-file rewrite from backup and redid the restore as an anchor-based
    text splice with C028''s strict-containment proof (current subset of candidate,
    all keys and values preserved, rest of file byte-identical) taken BEFORE placing
    the result. Verified by read-back: X3.metrics = 34 keys, zero HEAD keys lost across
    all experiments, damage confined to X3, all knowledge files still parse. Recorded
    the working method in the correction dispatch: anchor-based text splicing with
    containment proof, never a serializer round-trip.'
  related_decisions:
  - D076
- id: M108
  date: '2026-09-14'
  category: agent_behavior
  severity: high
  summary: I fixed x3_axis_validation.py in the LOCAL tree and never pushed it to
    the server tree where it runs, so the dispatched rerun reproduced the old output
    and wasted a run plus a full audit sweep. The worker's "the correction did not
    land" report was correct; the error is mine and violates the project's own two-trees
    rule.
  root_cause: I edited the runner in the local tree and treated the edit as complete,
    without propagating it to the server tree where the script actually executes.
    The task premise then asserted the correction was already in place and the rerun
    reproduced the old output. The local file was fixed AND committed, both true,
    neither of which is evidence about the tree the code runs in - the same blindness
    as parsing a file and concluding the edit was safe.
  prevention: 'For any runner that executes on a remote tree: an edit is not in effect
    until it is pushed to the tree where the code runs, and the push must be verified
    by reading the file back ON THE REMOTE TREE - never by the local edit succeeding,
    and never by a local commit existing. Concretely, before dispatching a re-run
    task, state which tree the change is in and verify the change is present there;
    and never write an assertion of completed work ("the already-corrected X", "the
    fixed runner") into a task title or premise without checking that assertion against
    the tree the task will operate on. The general form: a local action and a remote
    effect are different facts, and the convenience of "I already did that" is exactly
    what makes the gap invisible. This is the same family as the session''s other
    defective checks - the check that cannot detect the condition it is supposed to
    detect - because "the local file is fixed and committed" is a true statement that
    says nothing about the tree that matters.'
  status: active
  context: 'The axis-validator task was dispatched as "re-run the already-corrected
    axis validator." The rerun reproduced the old output: the artifact still carried
    the bare hard-coded label "parametric_artifact": "verified-correct" and the stale
    embedded self-reference pair (122,495 B / ae3ccc37...) against real bytes 122,617
    B / 9f7578be..., with no pre-write snapshot note. An independent verification
    confirmed the script''s line 345 still hard-codes the bare label and that "axis-verified"
    / "non-diagnostic" / "D057" / "pre-write" / "snapshot" have ZERO occurrences anywhere
    in the server copy.


    I checked this myself on disk and the root cause is mine: the LOCAL runner at
    x3_axis_validation.py line 350 already reads "axis-verified; conclusion remains
    NON-DIAGNOSTIC per D057" and line 360 already contains the self_reference_note
    explaining the pre-write snapshot, and that local file has been committed since
    the first commit (3860c7b). The fix was made in the local tree and never propagated
    to the server tree, where the script actually executes. So the rerun did exactly
    what a rerun of unchanged code must do, and it emitted the old output correctly.


    The cost was concrete: one full rerun plus a full 10-artifact audit sweep, both
    wasted on an unfulfilled premise. The worker''s report was honest and correct
    - "the corrected label did not land. The source still emits the old bare label,
    and the rerun output contains no requested notes" - and it correctly did not convert
    "the correction is not present" into "verified correct."


    This project has a standing documented rule that the two trees are separate and
    that a "file is missing" verdict is a statement about which tree. I have been
    enforcing that rule all session and then violated it myself by treating a local
    edit as if it were in effect where the code runs.'
  fix: Confirmed the local runner carries both fixes and that it is committed; ruled
    that the fix must be pushed to the server tree and the rerun performed there,
    with the artifact verified to show the corrected wording and the self_reference_note,
    and the new real size/sha reported. Adopted the reviewer's better structure for
    the status field - two fields (parametric_axis_verified plus parametric_conclusion_status)
    instead of one string, so "axis aligned" and "conclusion usable" cannot be conflated.
    Accepted the reviewer's point that a task title must not assert work is already
    done unless that has been verified before dispatch.
