- id: M105
  date: '2026-09-14'
  category: agent_behavior
  severity: high
  summary: Agent overwrote the Director-owned, append-only findings.md with whole-file
    semantics (113,414 -> 3,885 bytes, all sections lost); the recovery worker then
    overwrote my git-based restoration with an inferior /tmp backup, and its "byte-for-byte"
    proof was circular.
  root_cause: 'The original destruction was a wrong-filename plus whole-file-replacement
    write against a file the Agent is forbidden to write and which is append-only.
    The recovery then failed for an independent reason: its source-selection rule
    was "the most complete /tmp copy", with /tmp as the only candidate set, so it
    never considered the version-control history that held the true pre-damage state.
    Its verification was circular -- it compared the restored file against the very
    backup it had selected, so "byte-for-byte verified" was guaranteed regardless
    of whether that backup was correct or complete.'
  prevention: 'Three rules. FIRST: for any append-only or owner-restricted file, whole-file
    replacement must be structurally impossible for roles that do not own it -- a
    guard that refuses and reports, not a correct filename. A filename is a habit;
    a guard is a control. SECOND: when recovering a damaged tracked file, the candidate
    set MUST include the version-control history, and the selection rule must be "the
    newest complete pre-damage state", not "the largest copy in /tmp". The last commit
    before the damage is exactly that state and is the strongest evidence available.
    THIRD and most general: a byte-for-byte or equality check is only meaningful against
    an INDEPENDENT reference. The recovery verified the file matched the backup it
    had itself chosen, which is guaranteed and therefore proves nothing -- the same
    structural failure as this session''s other defective checks (an empty stratum,
    an affine-by-construction curve, a bound clipped to a boundary). Whenever writing
    a verification, ask: could this comparison succeed because I chose both sides?
    If yes, it is not verification.'
  status: active
  context: "findings.md is Director-owned (constraint C024: the Agent must NOT write
    it) and append-only (C023: a decrease is data loss). The Agent, while editing
    experiment_plan.yaml, passed the wrong target filename and used WHOLE-FILE REPLACEMENT
    semantics, destroying findings.md: it fell from 113,414 bytes and 34 '##' sections
    to 3,885 bytes with ZERO section headers. The Agent then dispatched a recovery
    worker instructed to restore byte-for-byte from \"the most complete\" candidate,
    and correctly gave that worker a candidate list, a pre-write backup, and a prohibition
    on creative writing.\n\nTHE RECOVERY ITSELF WENT WRONG, and I caught it by checking
    rather than waiting. The worker chose its source from a candidate set of /tmp
    copies ONLY, and picked /tmp/findings_safety3_1789337314.md at 101,721 bytes /
    30 '##' / 133 '###' -- declaring it \"the most complete\". But the authoritative
    pre-damage state was in the git commit I had made 5 minutes BEFORE the damage
    (08:40:02 vs damage at 08:45:26): 113,414 bytes / 34 '##' / 149 '###'. It was
    missing from the worker's candidate list. The four sections unique to the git
    copy were exactly the load-bearing recent ones:\n  ## 2026-09-14 ~10:15 UTC --
    The gate question is CLOSED by mutual agreement\n  ## 2026-09-14 ~10:45 UTC --
    Research phase launched (framing + plan + Dream)\n  ## 2026-09-14 ~11:30 UTC --
    I wrote a false mechanism claim into the authority file (M050)\n  ## 2026-09-14
    ~12:30 UTC -- C2's mechanism was inverted in both parts; C3 was unfalsifiable
    (M051)\nI restored from git at 08:53:53 and verified byte-for-byte against HEAD.
    The recovery worker then OVERWROTE my correct restoration at 08:54:21 with its
    inferior 101,721-byte copy -- and its report would have claimed \"byte-for-byte
    verified\" because it compared the file against the backup it had just chosen.
    I re-restored from git at 08:55:02 and re-verified. The worker did preserve my
    version first as /tmp/findings.md.damaged_1789376061 (113,414 B, same sha), which
    is why nothing was permanently lost."
  fix: 'Restored findings.md from `git show HEAD:findings.md` -- the pre-damage commit
    made 5 minutes before the damage -- and verified it byte-for-byte identical to
    HEAD (113,414 bytes, sha ffcee5ade580a69a, 34 ''##'' / 149 ''###''), then re-restored
    after the recovery worker overwrote it, and preserved an authoritative safety
    copy. Dispatched D074: stop the recovery worker, verify the current bytes (do
    not re-write), and add the last commit to the recovery-source set permanently.
    Root-cause fix demanded: no write path in the Agent''s tooling may target findings.md
    with whole-file semantics -- add a refusing guard rather than relying on passing
    the right filename. Also generalised: for the eight long-lived files, a write
    that REDUCES size or section count is a defect, not a success, because "the command
    succeeded" is exactly the signal that hid this.'
