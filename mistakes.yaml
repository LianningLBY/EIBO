    item is load-bearing enough to act on, read the surrounding region rather than
    trusting a count. Generalised: whenever an easily-computable proxy is used to
    answer a harder question, state what the proxy can and cannot distinguish - the
    failure is never the proxy itself but the silent assumption that it tracks the
