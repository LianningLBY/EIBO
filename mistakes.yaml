    the prevention to the wrong party (here mine, when the Agent''s cancellation is
    what prevented it), and it puts a false event into the durable record that later
    reasoning will treat as fact. The same standard applies to self-flagellation as
    to self-congratulation: a claim about what happened must be checked, not inferred
    from what could have happened.'
  status: active
  context: 'My M068 entry claimed that my unconditional ''you dispatch the rebuild''
