    my working memory with that pattern attached. The memory entry documenting the
    trap was written by me earlier in the same session, so this is recurrence of a
    documented failure mode rather than ignorance of it.
  prevention: 'A check prescribed in a dispatch must be validated against the same
    standard as the content it guards, and specifically: before prescribing any presence/absence
    test, ask what ELSE in the target could match the pattern legitimately. If the
    target legitimately quotes, retracts, or annotates the very text being tested
    for, a file-wide pattern test cannot answer the question - only a scoped test
    on the specific field can. Escalating rule for the recurring pattern: whenever
    a check is expressed as a count, a pattern, or another aggregate, state explicitly
    what that aggregate can and cannot distinguish, and prefer the narrowest scope
    that still covers the claim. Note also the second-order lesson: this was the third
    instance in one hour and the first where I propagated it outward to another role
    rather than merely concluding wrongly myself - documenting a trap does not prevent
    prescribing it.'
  status: active
  context: 'In a dispatch I prescribed the verification condition `test $(grep -c
    "data-processing inequality" <local file>) -eq 0`, with count=0 as the success
    criterion, for a file whose correction removed a false claim containing that phrase.
    My own memory entry 2063 already recorded the trap: ''a phrase-presence check
