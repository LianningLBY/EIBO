- id: M012
  date: '2026-09-13'
  category: experiment_design
  severity: high
  summary: Propagated "no rung passes the joint gate at k=5" to the user and the roadmap
    as a decisive Q1 result; it is an artifact of the ensemble running at n=1e4, where
    the fine rungs are alphabet-vacuous by arithmetic. At corpus scale M=4 is viable.
  root_cause: The report's own summary sentence — "no selected rung has a positive
    joint fraction at k=5" — was compact and quotable, and I adopted it as the finding
    rather than reading it against the ensemble's single n=1e4 setting. I had ordered
    the ladder computed across a wide n grid, so I assumed the joint analysis inherited
    it; only the k_cert tables did. The qualifier "synthetic ensemble" was present
    and I relayed it, but I treated it as a caveat about the compression factors rather
    than as a warning that the numeric conclusion was regime-specific.
  prevention: 'When a sweep or ensemble reports a negative or null result, first check
    the parameter grid at which it was actually run against the grid the decision
    cares about. A negative result at an untested-parameter setting is not evidence
    about that setting. Concretely: for any statistical negative, verify that the
    configuration could in principle have produced a positive — here, that the concentration
    radius was below the threshold at all, which one arithmetic line settles. Also:
    when a report spans many configurations but its headline summarises one of them,
    identify which configuration the headline''s number came from before quoting it.'
  status: active
  context: 'The channel-ladder report returned "no selected rung has a positive joint
    fraction at k=5" and I propagated that to the user as a decisive Q1 result — "Q1''s
    problem is quantified and worse than expected, tending toward honest failure"
    — and wrote it into the ROADMAP as "the decisive Q1 result" with a table.


    The conclusion is an artifact of the ensemble''s sample size. It ran at n = 1e4
    per law, and at that n the fine rungs cannot hold a valid upper certificate by
    arithmetic: at k=5 the radii are M=4 → 1.8374, M=8 → 10.27, M=16 → 57.95, because
    m = (2M)^5 reaches 32,768 / 1,048,576 / 33,554,432 against n = 1e4. Their joint
    fraction is zero by construction, not as a finding about coarse-graining. At the
    corpus scales the picture reverses: at n=1e6, M=4 has radius 0.1837 at k=5 and
    supports tv up to ~0.32; at n=3.9e6, radius 0.0930 and tv up to ~0.41. So the
    experiment never tested the regime the corpus actually offers, and Q1 is undetermined
    rather than negative.


    The report itself carried the qualifier ("synthetic ensemble; mechanism quantification
    only; not a corpus result"), and I did relay a caveat about assumed compression
    factors. But I foregrounded the negative joint fraction as a substantive finding
    and drew a directional conclusion from it, when the arithmetic alone shows the
    fine rungs were structurally incapable of contributing at that n.


    Notably, the task instruction I had issued asked for the ladder to be computed
    across n in {1e3, 1e4, 1e5, 1e6, 3.9e6, 1e7} — which the k_cert tables do — but
    the joint-distribution ensemble was run at a single n=1e4. I read the joint fraction
    without checking which n produced it.'
  fix: 'ROADMAP corrected: headline reframed as "Q1 UNDETERMINED, not negative", with
    the verified radius table across corpus scales showing M=4 viable to tv≈0.32-0.41,
    and the genuine surviving finding (near-constant ~0.455 floor on coarse rungs
    across four orders of magnitude of true TV) kept prominent. Re-run at n=2e5 and
