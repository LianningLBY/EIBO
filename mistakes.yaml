- id: M071
  date: '2026-09-14'
  category: agent_behavior
  severity: high
  summary: The status line reported X12 as running on the GPU while the live reading
    showed the card idle, no registry entry, and the checkpoint still in PREPARING
    - a dispatch reported as a run, enabled by a spec that granted but did not require
    the managed submission path.
  root_cause: The X12 spec gave the worker the tool group containing submit_on_allocated
    but did not require its use, so the run could proceed unmanaged via direct ssh.
    With no managed submission there is no registry entry, no published PID or log
    path, and therefore no authoritative way to answer whether the job is running.
    The status line was composed from the dispatch record - which said a worker had
    been sent - rather than from a live query, and so reported a dispatch as a run.
  prevention: Two rules. (1) A resource/status line must be derived from a live query
    of the authoritative source (list_available_gpus, registry), never from the dispatch
    record - a dispatch is not a run, and without a managed submission there is no
    PID/log/GPU attribution to check against, so the line silently becomes an assertion.
    (2) When a task must be monitored, the spec has to REQUIRE the managed submission
    path explicitly; granting a tool group is not requiring the action. 'The tool
    was available' and 'the action was required' are different, and only the second
    produces the metadata that makes the status verifiable. This is the fourth instance
    this session of declared-vs-actual divergence (M057 dispatched-not-landed, M060
    correction-on-the-mirror, M066|M069 done-status-not-actual, M070 narrated-near-miss)
    and the first where the enabling cause was identified in advance by the executing
    role rather than after the fact.
  status: active
