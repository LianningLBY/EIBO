- id: M100
  date: '2026-09-14'
  category: experiment_design
  severity: medium
  summary: Used a uniform 1/53 chance baseline for the X12 detector agreement rates
    on an imbalanced label distribution; the correct majority-class baseline is 14.73%
    (24.89% held-out), and prototype at 13.53% is BELOW it.
  root_cause: I computed the chance baseline as 1/n_classes without checking whether
    the class distribution was balanced. It is strongly imbalanced (majority class
    14.73% train-side, 24.89% held-out), so the uniform baseline was wrong by roughly
    an order of magnitude in the direction that flatters the detectors. Compounding
    it, D051 had already used the same wrong baseline in the opposite direction and
    D054 was correcting D051 -- I recycled the incorrect quantity from the decision
    under repair instead of re-deriving it.
  prevention: 'For any per-class accuracy or agreement statistic on an IMBALANCED
    label distribution, the baseline is the MAJORITY-CLASS rate, never 1/n_classes.
    Check the class distribution FIRST and state the baseline WITH the number, because
    a uniform-baseline comparison can be wrong in BOTH directions -- it manufactured
    a false alarm at D051 ("at or below chance") and a false reassurance at D054 ("far
    above chance") from the same data. A quick sanity test: a classifier that always
    predicts the most common class satisfies the majority baseline exactly, so any
    reported rate at or below it is evidence of no skill, not of skill. Corollary:
    when correcting an error, re-derive the quantity you are correcting AGAINST rather
    than reusing it -- I inherited the wrong baseline from the very decision I was
    fixing.'
  status: active
  context: 'After the X12 L0 label-space check landed, I wrote D054 stating that the
    detectors "predict FAR ABOVE CHANCE (48.6% / 13.5% / 58.1% against a 1.9% baseline)".
    I computed that baseline as 1/53 = 1.89%, i.e. UNIFORM over the 53 service classes.
    An independent review then pointed out the true label distribution is strongly
    IMBALANCED. I verified it two ways: from the cached train-side per-service flow
    counts (45 services, 5,058,007 flows) the majority class is 745,293 flows = 14.73%
    (top-5 = 14.73/14.64/10.10/7.47/6.79%), and from the held-out test distribution
    the reviewer measures 24.89%. Under EITHER baseline the qualitative picture changes:
    lightgbm (48.58%) and ronetc (58.10%) are above it, but PROTOTYPE (13.53%) is
    BELOW it -- worse than always guessing the majority class. So my sentence over-claimed
    for one of the three detectors. D051 had made the mirror-image error earlier (calling
    the panel "at or below chance" against the same uniform 1.89% baseline), and D054
    was my attempt to correct that -- but I corrected it using the SAME wrong baseline,
    just in the opposite direction. Also noted: `all_rows_accepted = true` for lightgbm
    comes from a hard-coded `np.ones(...)` at line 486, so its accepted_rate of 1.0
    is a design residue rather than a measurement, and its OSCR/FPR95 are computed
    in a never-reject degenerate state.'
  fix: 'Corrected the ROADMAP''s detector-panel section: the uniform baseline is replaced
    by the majority-class baseline with BOTH measurements recorded (14.73% train-side,
    24.89% held-out), the prototype-below-baseline fact is stated explicitly, my over-claim
    is marked as such, and the hard-coded accept flag is labelled STRUCTURAL with
    its consequence spelled out (never-reject does not mean perfect, it means no rejection
    capability). Logged D059. Dispatched to the Agent: the rule that any citation
    of those agreement rates must carry the majority-class baseline, and the STRUCTURAL
    labelling in artifact and caption.'
