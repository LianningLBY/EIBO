- id: M116
  date: '2026-09-14'
  category: agent_behavior
  severity: high
  summary: Ninth partial-block metrics overwrite dropped four X3 records (BASELINE_BLOCKER_STATUS,
    D058, D059, D061). Recovery required distinguishing genuinely-lost from renamed-survivors,
    since a naive whole-block restore would have duplicated seven records that survive
    under current names.
  root_cause: 'A partial-dict metrics write dropped four records. Recovery was made
    non-trivial by an earlier renaming pass: some records survived under new keys,
    so a name-based diff both overstated the loss and would have caused duplication
    if restored naively. The underlying gap is that nothing asserted the key-count
    invariant at write time - had the write verified its count against the pre-read
    count, the loss would have been caught at the moment of production rather than
    discovered by a diff hours later.'
  prevention: 'TWO rules. (1) The existing one stands: never write a structured map
    with a partial dict; read the whole block, merge in memory, write the whole block,
    read back and check the key count against the pre-read value. Nine failures makes
    this a hard procedure, not a habit. (2) NEW, and specific to recovery: when restoring
    lost keys to a shared record, FIRST subtract what is present, by CONTENT and not
    by name. A key set can be renamed while its substance survives, so a name-based
    diff overstates the loss and a name-based restore duplicates records. The discrimination
    is: absent-and-content-missing (restore), present-under-a-new-name (do not restore),
    newer than the snapshot (preserve), and legitimate progress since the snapshot
    (preserve). Restoring a whole older block is the wrong default because it silently
    reverts all four categories except the first. The general form, and this session
    has now shown it nine times: the integrity check must compare against what the
    record is FOR - the decisions it carries - not merely against the key names it
    happens to use.'
  status: active
  context: 'A metrics write that carried only a subset of keys silently dropped four
    records from X3.metrics: BASELINE_BLOCKER_STATUS (the dose-response-family rule
    closing the blocker), D058 (containment is not blocked by the AUC diagnostic),
    D059 (the agreement baseline is the MAJORITY class, not uniform 1/53 - the rule
    that any cited agreement rate must carry the majority-class baseline beside it),
    and D061 (the fix landed in a stray layer; two process rules). The live block
    went from 35 to 32 keys.


    This is the ninth instance of the same partial-block overwrite family, but it
    has a property the earlier eight did not: because some records survived under
    RENAMED keys after the D069-to-D077 numbering correction, a naive restore would
    have been wrong in a new way. I checked each candidate key by content rather than
    by name and found that D057, D063, D064, D065, D069, D070 and D071 were all present
    under current names - so re-adding them from the older block would have created
    two live records for one decision, which is its own defect class (the same "two
    live entries" problem the manifest invariant was written to prevent).


    So the recovery required a four-way discrimination: (1) restored because genuinely
    absent and content missing - BASELINE_BLOCKER_STATUS, D058, D059, D061; (2) NOT
    restored because present under a new name - D057, D063, D064, D065, D069, D070,
    D071; (3) newer live records that must be preserved - the D077 block, D074, D066,
    D070; (4) legitimate progress since the older snapshot - X12_k5 RUNNING to DONE,
    plus X6 and X3 updates. Restoring the whole old block would have handled (1) and
    destroyed (2), (3) and (4).'
  fix: Restored exactly the four genuinely-lost records by inserting them at text
    level with quoted values, verified by content-probe that the renaming survivors
    were NOT re-added, and confirmed all 18 entries and every other key intact. X3.metrics
    32 to 36 keys, nothing removed. Committed with the discrimination recorded so
    a later reader can see why seven other keys were deliberately not restored.
