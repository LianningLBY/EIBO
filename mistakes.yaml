    messages, so calling it ''pre-registered'' was my word, not a recorded fact. (2)
    The split I specified is itself not strict-safe: the corpus months are LOCAL-time
    (UTC+3) buckets spanning 2024-05-31T21:00:00Z to 2025-05-31T21:00:00Z, so adjacent
    month buckets share TIME_FIRST boundary values, and the guard''s strict inequality
    max(train TIME_FIRST) < min(test TIME_FIRST) cannot be satisfied by any clean
