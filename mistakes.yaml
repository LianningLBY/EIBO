- id: M033
  date: '2026-09-13'
  category: agent_behavior
  severity: medium
  summary: Editing E2 by anchoring on its id line created duplicate YAML keys, so
    the new content was silently discarded while the file still parsed; the repair
    then left an orphan that broke parsing, requiring a second fix.
  root_cause: 'I matched a fragment (`- id: E2`) rather than the complete entry, so
    the replacement inserted a new block ahead of the old entry''s remaining keys
    instead of substituting the entry. The duplicate keys made the parser keep the
    last definition — the untouched original — so the edit appeared to succeed while
    its content vanished. I did not re-verify content afterwards, only that the edit
    returned success.'
  prevention: When editing a structured file, replace the whole logical unit — never
    anchor on a fragment such as the opening key line — because inserting before a
    unit's remaining keys creates duplicates that parsers resolve silently in the
    wrong direction. After any structured-file edit, verify by re-parsing AND by asserting
    on the specific fields that had to survive; a successful parse alone is insufficient,
    since duplicate keys parse fine while dropping content. Treat "the edit tool returned
    success" as evidence about the tool, not about the file's content.
  status: active
  context: 'I edited experiment_plan.yaml to add a channel declaration to entry E2
    by replacing the anchor line `  - id: E2` with a full new entry block. Because
    I anchored on that single line rather than the whole entry, the original entry''s
    keys (claim, priority, description, depends_on, ...) were left in place *below*
    my inserted block, producing duplicate keys within one YAML mapping. YAML keeps
    the last occurrence, so my new text was silently discarded — the file still parsed
    and still showed the old content — and only a subsequent structural check revealed
    the declaration was missing despite the edit reporting success. My follow-up repair
    then replaced the original body while leaving an orphaned fragment behind, which
    DID break parsing (`mapping values are not allowed here` at a stray colon), and
    I had to locate and delete the orphan.


    Two distinct failure modes in sequence: silent content loss under duplicate keys
    (no error, edit "succeeded"), then a real parse error from the leftover fragment.
    Both came from editing a structured file by matching a fragment rather than the
    whole logical unit.


    Related pattern worth noting: this is the third time this session that an edit
    reported success while the intended change did not take effect or injected collateral
    damage — an earlier roadmap edit consumed a `## Current phase` heading, and another
    left duplicate headers. In all three cases the signal that caught it was a structural
    check afterwards (section count, heading uniqueness, entry count, re-parse), not
    the edit''s own success return.'
  fix: Merged the duplicate-key entry into a single correct E2 block containing both
    the channel declaration and the original scale-gap table content, deleted the
    orphaned fragment that broke parsing, and verified by re-parsing plus eight assertions
    covering every field that had to survive (claim, five ladder rungs, scale-gap
    columns, a-priori invariant, alpha split, k_cert bound).
- id: M034
  date: '2026-09-13'
  category: agent_behavior
  severity: low
  summary: 'Accepted a capability constraint as blocking a fix that did not need that
    capability: the wrong field text lives only in an older artifact, while the current
    source already states it correctly, so a re-run suffices.'
