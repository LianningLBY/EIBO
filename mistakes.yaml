    The agent also showed my three confirming examples were confounded: two of them
    record a *local* path inside the file (`schema_report.json` has `local_pwd: /efs/workspace/...`,
    `lower_side_comparison_report.json` has `project_root: /efs/workspace/...`). I
    had the files open and did not look inside them.


    The actual mechanism, which fits all four observations and which I should have
    derived the first time: **the axis is where the writing process runs, not which
    directory it targets.** Workers running on the platform machine write directly
    into the shared tree and are visible. The readout script must run on the server
