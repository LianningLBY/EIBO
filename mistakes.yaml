- id: M077
  date: '2026-09-14'
  category: resource_misuse
  severity: high
  summary: X1 was registered QUEUED + conclusion=success - an incoherent pair that
    per-field validation cannot catch and that makes a completed P0 experiment eligible
    for re-allocation and re-run.
  root_cause: The registration path set the conclusion field at the point the run
    finished but left the status at QUEUED, and no cross-field validator existed to
    reject the combination. I found it by reading the registry entry directly rather
    than trusting the reported state, which is the same destination-check discipline
    that has caught the previous instances in this family.
  prevention: 'A status and a conclusion are two claims about the same object and
    must be coherent with each other, not merely valid in isolation. Per-field vocabulary
    validation cannot catch an impossible PAIR, so any state machine needs a cross-field
    check: a non-terminal status must not carry a terminal conclusion, and a terminal
    conclusion must imply a terminal status. More generally, when writing bookkeeping
    that several readers will act on (coverage views, schedulers, the paper), verify
    the entry as a WHOLE - reading one field is how an incoherent pair survives. Note
    the hazard direction: a stale non-terminal status is not merely cosmetic, it is
    an instruction to the scheduler to do work again.'
  status: active
  context: 'A completed, verified experiment (X1 - the P0 headline table, rebuilt
    to 340/986/336 with all 20 cells, effective_alpha printed from the code path,
    six dead values quarantined, and the under-split regression guard added) was registered
    with status=QUEUED and conclusion=success simultaneously. X1''s updated_at was
    2026-09-14T01:47:35Z. Both field values are individually legal, so no single-field
    validator rejected the pair, and I only caught it because I read the entry directly
    while verifying the submission. The concrete hazard: QUEUED is a non-terminal
    state that makes the experiment eligible to be picked up by the allocation flow,
    so a finished experiment could be re-allocated and re-run, burning GPU time on
    work already complete. The stakes are elevated because X1 is the paper''s central
    result, so a confused status there propagates into coverage reporting and any
    downstream scheduling decision. The root is that the registry enforces per-field
    vocabularies but not cross-field coherence, and the project already has the analogous
    discipline elsewhere (impossible field combinations are checked on the bracket
    objects, and the eps_lo <= eps_hi per-row invariant exists precisely to catch
    incoherent pairs).'
  fix: 'Ordered X1 set to status=DONE (work is finished and independently verified).
    Ordered a cross-field coherence guard added: status=QUEUED must not coexist with
    a terminal conclusion, and conclusion=success must imply a terminal status - the
    registry analogue of the existing impossible-combination checks on the bracket
    objects.'
- id: M078
  date: '2026-09-14'
  category: experiment_design
  severity: high
  summary: X12's full run passed --label-field CATEGORY (provider groups) when the
    project's bracket is defined per APP service pair, so the containment test would
    have compared quantities of different granularity - the C016 object-mismatch class,
    on the path to the paper's falsifiable-containment claim.
  root_cause: CATEGORY was available in the HDF5 schema alongside APP, and the script
    offered both as choices with CATEGORY as the default. Nothing asserted which axis
    the experiment required, so the wrong one was selected and then propagated into
    the explicit full-run command. The project's own definition of the service axis
    (APP) lives in memory.md and its downstream artifacts, but no check tied the script's
    label field back to that definition.
  prevention: 'A label field is an object definition, not a display setting: the choice
    determines WHAT the experiment is about, so it must be verified against the project''s
    established axis rather than accepted from a default or an explicit flag. Concretely,
    for any classification or holdout experiment, assert the class count matches the
    expected granularity - a cheap count check distinguishes ''services'' from ''provider
    groups'' immediately, whereas both fields exist and both run without error. Corollary:
    an explicitly-passed wrong argument is a STRONGER form of the error than a default,
    because it looks deliberate and resists the ''stray default'' explanation; check
    the intent, not just the mechanism.'
  status: active
  context: 'The X12 detector-validation script carries `parser.add_argument("--label-field",
    default="CATEGORY", choices=["APP","CATEGORY"])` at line 718, and the full-run
    command in the registry spec passed `--label-field CATEGORY` EXPLICITLY: ''.../x12_detector_validation.py
    --h5 ... --label-field CATEGORY --k-packets 15 --holdouts 0.05 0.10 0.20''. So
    it was the intended invocation, not a stray default. CATEGORY is the provider-level
    grouping while APP is the service label - verified from memory.md line 591 (''APP
    (service label)''), the QUIC22 note (''102 service labels + 3 background = 105
    APP classes''), and the fact that every downstream number is APP-based: 53 distinct
    services, 45 at threshold, the 990 pair set, and q1_eps_lo_symbol_map.json''s
    integer service ids. Consequences if run as specified: open-set holdouts become
    provider holdouts (a much easier problem, since detectors can exploit provider-identifying
    regularities), the containment statistic would be computed over provider pairs
    while C1''s bracket is defined per APP service pair, and the comparison would
    be between quantities of DIFFERENT GRANULARITY - the C016 object-mismatch class.
    It also changes the difficulty of the whole Step 6 validation (fewer classes,
    larger per-class mass, higher separability). The smoke run used the same default,
    so the smoke''s evidence about separability is on the wrong axis too.'
  fix: 'Ordered: default changed to APP; --label-field APP in the full-run command;
    the artifact must record which field was used AND the resulting class count. Added
    a cheap guard - assert the distinct class count is in the service range (tens),
    not the category range (~a dozen) - which would have caught CATEGORY immediately.
    Folded into the same re-run as the split fix since both live in the same script.'
