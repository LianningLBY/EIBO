- id: M030
  date: '2026-09-13'
  category: experiment_design
  severity: medium
  summary: Ordered a masked-vs-unmasked contamination test at k=30, but the two code
    paths are identical on the k=30 eligible set (all such flows have PPI_LEN >= 30),
    so it is identically zero by construction and would have read as "no contamination".
  root_cause: I selected k=30 because it is the maximal k and the denominator of the
    ratio, without checking whether the masked and unmasked arms can differ there.
    The comparison sounded meaningful because both arms were well-defined, and I never
    asked on which rows they would produce different values — the question that would
    have exposed the construction immediately.
  prevention: 'Before specifying a diagnostic, verify that the two conditions it contrasts
    can actually differ on the population it samples — here, check whether the masked
    and unmasked code paths diverge on the eligible rows. A test whose two arms are
    identical by construction reports zero and invites the wrong conclusion; a null
    result from such a test is not evidence of absence. Concretely: for any A-vs-B
    comparison, state the set on which A and B are evaluated and confirm it contains
    rows where A != B; if it does not, move the comparison to a regime where they
    diverge, and label a structural zero as such rather than as an empirical null.'
  status: active
  context: 'I ordered a masked-vs-unmasked comparison at k=30 as evidence of padding
    contamination, and repeated that requirement across several review cycles without
    checking whether the test could measure what it claimed. Reading the code: the
    masked path uses kk = min(PPI_LEN, 30), while the unmasked path uses kk = 30 unconditionally,
    so they differ only for flows with PPI_LEN < 30. But the k=30 eligible set is
    defined by use = lens >= 30, i.e. every admitted flow already has at least 30
    slots. On that set min(PPI_LEN, 30) = 30, so the two paths produce character-identical
    symbol sequences and the difference is identically zero by construction.


    The consequence is a misreading hazard rather than a wasted run: a reported "k=30
    masked-vs-unmasked difference = 0" reads as "there is no contamination", when
    it actually means "this measurement point cannot detect contamination". Those
    are different statements and the artifact would have carried the first reading.


    Where the test can work: the PPI_LEN histogram gives 50.61% of flows with >=30
    slots and 49.39% below, with 6.56% at exactly 2 packets, so contamination can
    only arise at k < 30 where short flows are admitted to the pool — especially k=5,
    where the numerator includes flows with as few as 5 packets.


    A secondary gain: this gives the PHIST-immunity claim a mechanism rather than
    an assertion. PHIST does not touch the prefix array at all, and meanwhile the
    padding defect is confined to k<30 short flows, so PHIST is immune to both the
    coverage bias and the padding problem for a concrete reason.'
  fix: Directed the comparison to k=5 and k=10 on a fixed admitted set (both arms
    over the same flows with lens >= k), reporting difference quantiles and the count
    of changed pairs, with the caveat that "no change at this k" must not be written
    as "no contamination". Retained the k=30 measurement but relabelled it as a structural-zero
    demonstration (proving the two paths coincide when lens >= 30) rather than as
    contamination evidence.
