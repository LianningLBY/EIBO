- id: M121
  date: '2026-09-14'
  category: agent_behavior
  severity: high
  summary: I diagnosed the axis re-run's new artifact path as a "path split" defect
    and instructed byte-moves plus a runner-constant change. A systematic check showed
    18/18 runners share the pattern - it is the register_artifact SNAPSHOT mechanism
    D070 had already documented. My fix would have put unregistered bytes where the
    manifest claims a registration, or bypassed the snapshot step. Retracted before
    it was acted on.
  root_cause: I sampled one instance, formed a plausible local story, and published
    a fix before checking whether the pattern was universal or whether the project
    had already ruled on it. It had - D070 documented that register_artifact itself
    produces artifacts/<EXPID>/, in my own words - and I did not re-read it before
    contradicting it. The universality (18/18) was the signal that would have caught
    it, and I only looked for that after publishing.
  prevention: 'When a pattern appears UNIVERSAL - every instance exhibits it, all
    18 of 18 - suspect the reading rather than the system. A genuine defect is usually
    local or intermittent; a uniform pattern across all instances is almost always
    the mechanism working as designed. Concretely: before proposing a fix for a pattern,
    ask whether the pattern is what the system is supposed to do, and check the project''s
    own record for a prior ruling that explains it - here D070 had already documented
    the mechanism in my own words, and I published a contrary diagnosis without re-reading
    it. Second and sharper: before instructing a change to how a system produces or
    stores data, verify the change does not bypass a step that gives the data its
    authority. Here the manifest''s copy is authoritative precisely BECAUSE it is
    a registration snapshot, so "make the paths match" would have destroyed the distinction
    between registered and unregistered bytes.'
  status: active
  context: 'After the axis-validator runner was synced and re-run, the new artifact
    appeared at the server''s top-level /root/eibo/artifacts/x3_axis_validation.json
    (123,295 B / 4061258e) while the manifest''s live entry cited artifacts/X3/data/x3_axis_validation.json,
    which still held the OLD bytes (122,617 B / 9f7578be). I diagnosed this as a "path
    split" defect and published an instruction (D091 section 3) telling the Agent
    to reconcile it by either moving the new bytes to the manifest''s path and changing
    the runner''s ARTIFACT constant to match, or updating the manifest entry''s path.
    I also wrote a BLOCKED_ON entry and a mistake record (M120) using that framing.


    I then ran a systematic check across every runner in the project and found 18
    of 18 exhibit the same pattern: each writes to artifacts/<name>.json while the
    manifest cites artifacts/<EXPID>/data/<name>.json. That universality should have
    falsified my diagnosis immediately, because a defect affecting every runner uniformly
    is not a defect in any of them.


    The correct mechanism was already documented in D070, in my own words: "artifacts/<EXPID>/
    is produced BY register_artifact itself". The flow is runner writes top-level,
    register_artifact SNAPSHOTS into <EXPID>/data/, and the manifest cites the snapshot.
    A registration is a snapshot taken at registration time, so after any re-run the
    registered copy is stale until it is re-registered. That is working as designed,
    not a defect.


    My instruction was not merely wrong but actively harmful in both branches: moving
    the new bytes to the manifest''s path would place unregistered data where the
    manifest claims a registration exists, and changing the runner''s constant to
    write directly into <EXPID>/ would bypass the snapshot step altogether. Both would
    have corrupted the very invariant D070 established.


    I caught it and retracted D091 section 3 in the same session before the Agent
    acted on it, rewrote the BLOCKED_ON entry myself, and stated the corrected action:
    re-register the artifact so the snapshot is refreshed, then pull the registered
    copy.'
  fix: Retracted D091's path-reconciliation instruction in full (D092), rewrote the
    BLOCKED_ON entry to say "re-register the snapshot" rather than "reconcile a path
    split", and stated plainly in the retraction that my first diagnosis was wrong
    and why. Instructed the Agent to do nothing with the old wording. Recorded that
    the D057 label refresh has the same mechanism and therefore also needs a re-register
    afterwards, not a path change.
