    to the nearest open issue without checking where that issue's remediation actually
    lies. I accepted the framing initially too, and only found the discrepancy by
    opening the current source file to see whether the wrong text was still there.
  prevention: 'When a capability limitation is raised as a blocker, check whether
    the task actually requires that capability before accepting it as blocking. Concretely:
    for any wrong value in a generated artifact, determine whether the artifact is
    patched or regenerated — if regenerated, the fix belongs in the source and a re-run,
    and the "cannot edit the output file" limitation is irrelevant. More generally,
    distinguish "I lack capability X" (often true) from "therefore this task is blocked"
    (often false), by asking what the minimal action actually requires.'
  status: active
  context: 'The executing agent reported that fixing a wrong field description in
