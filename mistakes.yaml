- id: M018
  date: '2026-09-13'
  category: experiment_design
  severity: medium
  summary: Predicted the divisibility re-run would lift eps_lo and potentially reverse
    Q1 at M=1/M=2 by removing a one-hot distortion; the two routes agree to 0.0002
    and divisibility recovers nothing — the distortion was not there.
  root_cause: I diagnosed a real general weakness of the one-hot representation and
    then assumed it was the operative cause of the specific collapse, without checking
    whether the ensemble's construction would let that weakness express itself. The
    reasoning moved from "this method is weak in general" to "this weakness produced
    the observed numbers" without the intervening step.
  prevention: 'Before predicting that a methodological change will reverse a conclusion,
    check whether the mechanism it targets is actually load-bearing in the experiment
    as built. Here the one-hot representation is genuinely weak in general, but the
    synthetic ensemble''s three-fixed-cell law makes it separable there, so the weakness
    could not bite — a general defect in the method does not imply the defect is active
    in this instance. Concretely: when diagnosing a collapse, ask what the experiment
    would have to look like for the suspected cause to be responsible, and verify
    the experiment has that shape before making the cause the basis of a prediction.
    Also: state such predictions as hypotheses to test rather than as expected reversals,
    so the report of a refutation is a result rather than a correction.'
  status: active
  context: 'When the channel-ladder ensemble showed the lower side (eps_lo) collapsing
    at coarse rungs, I diagnosed a specific cause: the classifier-based lower bound
    was being run on a one-hot feature map, a representation on which no classifier
    can generalise, so the lower side was necessarily noise-level. From that I predicted
    that re-running with the divisibility/rejection-generic route — which works directly
    on the discrete cell alphabet without a low-dimensional embedding — could lift
    eps_lo above the 0.05 threshold and potentially reverse Q1 at M=1 or M=2, i.e.
    reopen the coarse rungs.


    I stated this to the user as a specific, decision-relevant prediction and ordered
    the re-run on that basis. It is refuted. The two routes agree to about 0.0002
    across all rungs at k=5 (M=1: 0.0042 vs 0.0040; M=2: 0.0235 vs 0.0234; M=4: 0.0856
    vs 0.0855; M=8: 0.1745 vs 0.1741; M=16: 0.2493 vs 0.2488), and the report''s `divisibility_crosses_where_classifier_does_not`
    field is empty — divisibility never recovers a rung the classifier missed.


    So the one-hot concern was empirically unfounded, and the proposed fix was aimed
    at a distortion that does not exist. The reason, on reflection, is that the synthetic
    law occupies three fixed cells, so the one-hot map is separable there and generalisation
    is not the binding constraint; the ensemble was never a test bed where the one-hot
    weakness could bite.


    What survives: M=1''s infeasibility is now confirmed by two independent arguments
    (the compression test and the lower-side medians), only M=4 carries a positive
    joint fraction, and the verdict form is unchanged. The re-run closed a route rather
    than opening one — which is a legitimate use of a check, but I had framed it as
    likely to reverse a conclusion, and that framing was wrong.'
  fix: Recorded the refutation in the roadmap with the full side-by-side table, stated
    explicitly that the one-hot hypothesis was empirically unfounded and the proposed
    fix addressed a non-existent distortion, and required the team to write in memory
    that M=1/M=2 fail on both lower-side routes and that "a tighter lower bound would
    rescue the coarse rungs" is now refuted.
