    what it contained; caught only by post-edit counting.
  root_cause: 'I treated the consolidation as a substitution — old block out, new
    block in — without enumerating what the old block contained and checking each
    item had a destination. Compounding it, I had added and then renamed one entry
    within the same pass, so the duplicate could only have been caught by a collision
    check I did not run until after the fact. The trigger was the same as several
    earlier entries: a locally efficient action whose verification step I deferred.'
  prevention: 'After any edit that removes content, verify by count and by spot-checking
    that specific items still exist — do not infer success from the edit tool returning
    success. Concretely: (1) before replacing a block, enumerate the items in the
    old block and confirm each has a counterpart in the new one, either merged or
    retained; (2) after the edit, re-count the items and compare against the intended
    total, since an unchanged count where a reduction was intended is the signal that
    something was dropped rather than merged; (3) grep for a distinctive phrase from
    each item being merged away, to prove it survived in its new form. When several
    entries are being consolidated in one pass, do the consolidation as a single deliberate
    replacement of the whole section rather than a sequence of independent edits,
    since sequential edits cannot see each other''s collisions.'
