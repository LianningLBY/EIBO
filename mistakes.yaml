- id: M115
  date: '2026-09-14'
  category: experiment_design
  severity: high
  summary: 'max_tpr is a genuine formula bug, not a naming defect: numerator counts
    correct predictions over ALL flows while the denominator counts only that service''s
    positives, so values exceed 1 (up to 341, 22 of 53 services). Proved arithmetically
    - max_tpr x n_positive is an integer for 53/53 services, and the implied numerators
    exceed the denominators. Fix is (correct & positive).sum(); add a 0<=v<=1 assertion.'
  root_cause: The rate was computed with a numerator over all flows and a denominator
    over one service's positives. No range assertion guarded the name, and no check
    verified that the numerator and denominator ranged over the same population, so
    a formula error that produces impossible values passed through production and
    surfaced only when a reviewer noticed a value above 1. The same absence of a name-claim
    assertion produced the two earlier instances of this class.
  prevention: 'Keep the rule, and sharpen it: when a computed field is emitted under
    a name that asserts a range or an identity, ASSERT THAT CLAIM IN CODE at the point
    of production - a rate asserts 0 <= value <= 1, a maximum asserts it is >= every
    element it summarises and equal to one of them, a self-referential size or hash
    asserts it cannot be written before those bytes exist. One line each. Second and
    more specific: when a rate is computed, check that its NUMERATOR AND DENOMINATOR
    range over the same population. A recall-style denominator (this class''s positives)
    with an all-items numerator is a silent formula error that produces plausible-looking
    numbers above 1, and the only reliable detection is the range assertion or an
    explicit numerator/denominator population check. The general form, which this
    session has now demonstrated in eight different guises: the name and the value
    are separate claims, and nothing verifies the second against the first unless
    it is made to.'
  status: active
  context: 'The field max_tpr in the k=5 detector artifact is not merely mis-named:
    its value is affirmatively WRONG. I established this arithmetically from the artifact
    rather than accepting the naming-defect explanation. For every one of the 53 services
    in metrics.lightgbm.holdouts[''0.05''].per_service, max_tpr times n_positive is
    an exact integer (53 of 53), which proves the numerator is a count and the denominator
    is that service''s n_positive. The implied numerators then EXCEED the denominator:
    service 0 gives 1.0673 x 53,116 = 56,692 correct against 53,116 positives; service
    1 gives 1.2483 x 6,009 = 7,501 against 6,009; service 13 gives 1.4121 x 182 =
    257 against 182. So the computation is (correct predictions across the whole holdout)
    divided by (this service''s positive flows) - the numerator ranges over all flows
    while the denominator counts only this service''s positives. That is a recall
    denominator with an all-flows numerator.


    Consequence: the value cannot be quoted for a weak reason AND for a strong one
    - not only does the name claim a rate in [0,1] that the number cannot be, but
    the number itself is computed wrong. The same wrong formula feeds maximum_pair_tpr
    at the pair level (170.5 lightgbm, 192.9 prototype, 2.10 ronetc).


    Secondary consequence I confirmed: the near_zero_tpr_threshold = 0.01 guard can
    never fire, because every maximum_pair_tpr is far above 0.01. So that NO-INFORMATION
    branch is dead code. It is not load-bearing, since pcap_encoder is separately
    and correctly marked not_run, but it must not be described as a guard.


    This is the third field in this project whose name asserted something its value
    violated - after the retired lower_side_fraction name and the self-referential
    artifact_size_bytes - and the first where the value is affirmatively wrong rather
    than merely misleading.'
  fix: 'Recorded the arithmetic proof and the exact fix: the numerator must be constrained
    to the service''s own positives, (correct & positive).sum() rather than correct.sum(),
    after which every value lies in [0,1] and the name becomes true. Ruled that max_tpr
    and maximum_pair_tpr must not be quoted until that fix lands, and that the fix
    is stronger than a rename because a wrong value currently travels under a right-sounding
    name. Also required a one-line range assertion - anything named as a TPR or rate
    asserts 0 <= value <= 1 at production - which is the check that would have caught
    this at the point of production rather than at a reviewer''s anomaly. The containment
    verdict itself is unaffected: it comes from the binomial_test block, which does
    not consume max_tpr.'
