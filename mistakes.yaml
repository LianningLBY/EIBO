    a pre-registration - it is establishing one, and it is the better design. The
    underlying dataset property - that month buckets share boundary timestamps because
    they are local-time buckets compared as raw UTC - is a genuine finding that belongs
    in the paper''s hygiene section, alongside the packet-level-splitting prohibition.'
