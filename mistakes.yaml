- id: M066
  date: '2026-09-14'
  category: resource_misuse
  severity: medium
  summary: The SERVER->LOCAL pull worker was spawned without the transfer capability
    the direction required, so it could not complete despite executing correctly;
    its 'done' status did not mean pulled, and the tree inversion remains open.
  root_cause: Capability mismatch at spawn time. The dispatch specified a per-artifact-direction
    reconciliation (including SERVER->LOCAL pulls) but the worker was provisioned
    with read/execute plus LOCAL->SERVER upload only. The task was therefore unclosable
    from the start, and because the worker executed its scannable portions correctly
    and reported 'done' with a 'BLOCKED at transfer' status body, a reader taking
    the status at face value would believe the inversion had been closed.
  prevention: 'When a task''s success criterion is DESTINATION-SIDE (''the local tree
    now carries the new content''), verify at spawn time that the worker actually
    holds the capability the transfer direction requires - a read/execute plus local-to-server-upload
    toolset cannot close a server-to-local task no matter how well it executes, and
    the failure is silent until the destination is checked. Relatedly: a worker ''done''
    status is not evidence its task is complete when the criterion is destination-side;
    the check must be performed on the destination. This session has now produced
    three distinct instances of ''done/landed/dispatched'' diverging from ''the intended
    state actually holds'' (M057 dispatch-not-landed, M060 correction-on-the-mirror,
    and this blocked transfer), which is why the destination check is mandatory rather
    than a nicety.'
  status: active
  context: 'The pull worker (spawned 00:38 to move two server-ahead artifacts into
    the local tree) reported Status: BLOCKED at transfer and left both targets unchanged.
    Its own statement: ''The required register_artifact transfer tool is not mounted
    in this session; tool discovery exposed only remote read/execute and local-to-server
    upload operations.'' It was spawned with read/execute plus LOCAL->SERVER upload
    only, so it could not fetch SERVER->LOCAL - the one direction the task required.
    Everything else about its execution was correct: it produced a 54-row pre-pull
    inventory with both trees'' mtimes/sizes/sha256 (establishing server-newer on
    both targets: local 1dfb...0be83 vs server 119b...a940d for the vector file; X4
    server-only 3fd9...e3113b), normalised a +0800 server timezone against UTC before
    comparing, correctly refused to overwrite the server copies, left both targets
    untouched rather than making a partial change, and explicitly labelled its local
    checks as pre-pull state rather than claiming post-pull verification. I verified
    independently that the local tree is unchanged: the vector file is still 2,620
    B / Sep 13 23:12 with grep -c ''data-processing inequality'' = 1, and x4_frontier_function.json
    is still absent. So the tree inversion remains open.'
  fix: 'Dispatched a resolution with two paths: (A) re-dispatch with whatever transfer
    capability the deployment provides for SERVER->LOCAL, noting the worker may be
    wrong that register_artifact is the required tool; or (B) if no such tool exists,
    stop retrying and instead remove the actual harm - mark the stale local copy explicitly
    SUPERSEDED with the server hash, add a marker recording that X4 lives server-side,
    and redeclare authority for these two artifacts as SERVER per-artifact. Both paths
    satisfy the real requirement (a reader must not pick up the stale side); leaving
    it as-is does not.'
- id: M067
  date: '2026-09-14'
  category: communication
  severity: high
  summary: The `_ref_radius` field suffix asserted the correct radius convention while
    the executed call passed alpha=0.05, so the name vouched for the opposite of what
    the value was - the third instance this session of a field name asserting a property
    its value lacked.
  root_cause: The field names were written from the INTENDED convention while the
    value came from a call that used a different alpha, and nothing reconciled the
    two. The artifact therefore carried a proclamation of correctness alongside an
    incorrect number. The wrap-around cause is that declared convention fields (alpha_law,
    alpha_convention prose) were treated as evidence of what the code did, when only
    the call site is.
  prevention: 'A field''s name is a claim, and it must be verified against the executing
    code path, not against intent. To establish what a value IS, grep the call site
    that produced it - never the field name, never a declared convention field, since
    a declaration is not evidence the code used it. A mislabel is worse than a missing
    label because the name vouches for a property the value lacks, so a reader who
    trusts it is actively misled rather than merely uninformed. Remedy at write time:
    make the name carry the executed value, or emit the effective parameter from the
    code path into the artifact.'
  status: active
  context: 'The X1 headline table''s fields are suffixed `_ref_radius` and the artifact
    declares `alpha_law: 0.025`, so a reader takes `_ref_radius` to mean ''computed
    with the reference radius'' - i.e. the correct convention. But the executed call
    was tv_upper_bound(..., alpha=0.05), a per-law under-split giving constant 2.7162
    instead of 2.9604. So the field name vouched for the exact property the value
    lacked, across all 20 cells of the P0 headline table, and it took a dedicated
    convention-check worker plus independent recomputation to detect. This is the
    third instance of the same shape this session: (1) `lower_side_fraction` named
    the band''s EDGE (tv_hat > T(n)) as though it were a proven lower bound, and was
    relayed to the user as a bound; (2) `NOT_PERFORMABLE` asserted a quantity did
    not exist while another artifact''s own object definition declared it. In each
    case a NAME asserted a property the value did not have, and a reader trusting
    the name would be wrong. The underlying pattern is broader: this is also the fourth
    consecutive declared-vs-executed mismatch in the project (2x inlined radius vs
    reference, capped vs full-n lower join, wrong alpha, and this one).'
  fix: 'Rebuild dispatched requiring the affected fields to be RENAMED to carry the
    executed alpha (e.g. `_alpha_0p025`) or the effective alpha emitted from the code
    path into the artifact; renaming preferred because a printed parameter still leaves
    the old name lying to anyone who greps for the suffix. The check added to the
