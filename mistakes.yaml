- id: M037
  date: '2026-09-13'
  category: code_bug
  severity: high
  summary: E3's Q1 radius omitted the 0.5 factors that the repo's own tv_upper_bound
    applies, making the per-side radius exactly 2x too large and understating the
    Q1 headline (0.2919 vs the correct 0.3434).
  root_cause: 'E3''s runner reimplemented the concentration radius inline instead
    of importing the repo''s `tv_upper_bound`, and dropped the 0.5 coefficients on
    both the sqrt(m/n) and the sqrt(2 log(2/alpha)/n) terms. Both terms were scaled
    identically, so the error is exactly a factor of 2 per side and 2x on the summed
    radius. It survived because: (a) the artifact''s `upper_side_formula` metadata
    documents the SAME wrong formula, so the self-consistency check passed; (b) E3''s
    internal validation compared dense-count TV recomputations (error 0.0) which never
    touch the radius; (c) the error direction is CONSERVATIVE (larger radius => smaller
    upper fraction), so it produced a plausible, pessimistic-looking number that nobody
    had reason to question; (d) the binding side failing at every rung made the headline
    look like a clean, coherent finding.'
  prevention: 'A worker must not inline a formula that already exists in the repo.
    Require every numeric constant or closed-form radius used in a deliverable to
    be either (a) imported from the reference implementation, or (b) explicitly reconciled
    against it with a printed side-by-side on at least one real row. Additionally:
    when a discrepancy appears between two implementations of one quantity, resolve
    it against the REFERENCE implementation in the repo before reporting any number
    derived from either — and treat a clean power-of-2 ratio (exactly 2x here) as
    a signature of a dropped constant factor, not of a difference in statistical convention.'
  status: active
  context: 'E3''s remote runner (`/root/eibo/scripts/run_q1_absolute_e3.py`) uses
    `radius_i(M) = (sqrt((2M)^5) + 2.9604)/sqrt(n_i)`. The project''s own reference
