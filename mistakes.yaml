- id: M093
  date: '2026-09-14'
  category: experiment_design
  severity: high
  summary: Recorded a bias-direction claim from a PROXY estimator and let it carry
    the verdict; the real known-truth control showed the opposite direction and killed
    SUBLINEAR.
  root_cause: A load-bearing clause that made a provisional verdict look safe was
    written from a proxy construction of "an estimator of this shape" rather than
    from the actual estimator, and it was recorded before the kill-control it pre-empted
    returned. The proxy's bias direction was opposite to the real estimator's, so
    the verdict's supporting argument was not merely weak but backwards. Compounding
    it, the pre-registered rule made the known-truth control decisive precisely because
    this failure mode was anticipated — yet an interim narrative was still written
    that assumed the control would pass.
  prevention: 'A reassuring claim about an estimator''s failure mode must be measured
    on THAT estimator — a proxy reconstruction of "an estimator of this shape" carries
    no weight about bias magnitude OR sign, and it is especially dangerous when it
    is the load-bearing clause that makes a verdict safe. Corollary: when a pre-registered
    kill-control is dispatched, do NOT record any interim narrative that pre-empts
    its outcome. Note also that a passing self-consistency check (estimator reproduction
    at 1e-9) says nothing about bias: reproducing your own published numbers proves
    reproducibility, not correctness.'
  status: active
  context: 'X3''s original run reported SUBLINEAR (p=0.838, sqrt_AIC advantage 88.84,
    increment ratio 1.556) over k=5..30 on 990 pairs. Its two pre-registered confounds
    were (a) no known-truth control and (b) the flow population changes with k. While
    controls were in flight, the ROADMAP recorded a reassuring note: the k-dependent
    smoothing bias INFLATES D_k, therefore the observed SUBLINEAR is CONSERVATIVE
    with respect to that bias. That note was produced by a synthetic probe on "an
    estimator of this shape" — a reconstructed proxy, not the actual estimator. When
    the real known-truth control ran, using a construction whose analytic truth is
    exactly LINEAR at p=0.30/q=0.70 (D_k = k * 0.3389191441548814), the estimator
    returned SUBLINEAR (p=0.651, adv 29.52, ratio 2.631), and the real-occupancy twin
    also returned SUBLINEAR (p=0.897, adv 22.10, ratio 1.787). The measured ratio
    est/true FALLS with k: 1.0002 at k=5 -> 0.6769 at k=30; twin 0.9987 -> 0.8824.
    So the bias DEFLATES large-k divergence and MANUFACTURES sublinearity — the opposite
    of the recorded claim. The fixed-population control passed (p=0.844, adv 74.15,
    ratio 1.503), so composition was never the cause; the estimator was. Per the pre-committed
    adjudication rule the verdict was downgraded to INCONCLUSIVE (D044).'
  fix: X3 downgraded to INCONCLUSIVE per the pre-committed rule; C3 retracted in the
    framing; the bias-direction claim explicitly retracted in the ROADMAP with a pointer
    to the measured numbers; the four surfaces (registry, framing, plan, ROADMAP)
    propagated in one pass; the original artifact left UNMODIFIED; the estimator fix
    made a separate work item that may not be used post hoc to restore the verdict.
- id: M094
  date: '2026-09-14'
  category: experiment_design
  severity: high
  summary: X12 ran at a silent default k=15 where its mandatory informative stratum
    is EMPTY, so it would have produced zero evidence while reading as DONE.
  root_cause: 'k was never fixed by any decision. The experiment_plan.yaml X12 entry
    contains ZERO explicit k= specifications -- it writes "eps_hat_k^hi < 0.5" and
    "k-packet features" but never a value -- while the script''s parser carries --k-packets,
    type=int, default=15. So k=15 was nobody''s choice; it was an unchecked script
    default. The failure is silent by construction: unlike the label-axis default,
    which the class-count guard stopped loudly (CATEGORY -> 9 classes -> raise), an
    empty informative stratum triggers no guard, so the run completes cleanly and
    reports DONE.'
  prevention: 'An experiment''s decisive parameter must be pinned by an explicit DECISION
    and recorded in the plan, never left to a script default -- and no parameter that
    selects WHICH POPULATION a pre-registered statistic is evaluated on may carry
    a silent default. Two generalisations: (1) audit every parser for silent defaults
    on such parameters; a loud guard-protected default (the label axis) is tolerable,
    a silent one (k) is not, because the failure mode is a clean DONE over an empty
    or wrong set rather than a refusal. (2) Before dispatching, check that the plan
    STATES every parameter the result depends on; an unstated decisive parameter is
    a plan defect to fix, not a detail to remember at submit time. Corollary: when
    a reviewer recommends a fix, verify its PREMISES and its SIDE-CLAIMS against the
    source artifact and the executing code -- here the main point was right and correctable,
    while its accompanying assurance (the panel need not be rebuilt) was wrong and
    would have shipped a broken run.'
  status: active
  context: 'X12 (the detector-validation experiment, the project''s only GPU-class
    work and the sole carrier of the RC3/RC6 reviewer concerns) was submitted with
    --k-packets 15. X12''s pre-registered PRIMARY statistic is the one-sided containment
    / floor-violation test, and the plan makes the informative stratum (eps_hi < 0.5)
    MANDATORY for it. I verified against X1''s rebuilt headline table (x1_headline_table.json,
    per_rung/1, M=1) that the upper-side counts per k are: k=5 -> 340/990 (0.3434,
    INFORMATIVE); k=10 -> 28/990 (0.0283, INFORMATIVE); k=15 -> 0/946 with saturation_label
    CERTIFICATE_LOST; k=30 -> 0/820. So the informative stratum is EMPTY at k=15 and
    the run would have produced ZERO validation evidence while still reaching DONE
    -- and a DONE is easily read as "RC3/RC6 mitigated", the entire purpose of the
    experiment. The plan had already pre-committed that an empty stratum contributes
    no evidence and must be stated rather than papered over.


    The same parser already had --label-field, default="APP" after an earlier fix;
    two defaults in one file, one corrected, one still silent.


    SECONDARY NOTE: the same review''s sub-claim that "the detector panel need not
    be redone because X1 is not a dependency" was FALSE and would have produced a
    broken run -- features are k-dependent (x12_detector_validation.py line 165: k
    = min(k_packets, ppi.shape[2])), so changing k invalidates the feature extraction
    and the trained detectors. Caught by reading the script, not by trusting the recommendation.'
  fix: 'Kill the k=15 run and re-submit at --k-packets 5 (the only k with a populated
    informative stratum at 340/990, and additionally C1''s headline cell), dropping
    --cpu-only so ronetc trains on cuda:0 and the experiment becomes the GPU-class
    run it is meant to be. Structural fix adopted so it cannot recur: make k REQUIRED
    in the script with an actionable error (exactly as train/test months now do, a
    pattern that works and is kept), or at minimum emit an explicit K_DEFAULT startup
    log so the value is never invisible; and pin k in the experiment_plan.yaml X12
    entry with the reason (k=5 is the only informative k).'
  related_decisions:
  - D047
- id: M095
  date: '2026-09-14'
  category: agent_behavior
  severity: medium
  summary: Broke experiment_plan.yaml by inserting apostrophes/colon into a single-quoted
    YAML scalar; caught and repaired on re-parse.
  root_cause: I inserted prose into a single-quoted YAML scalar without checking the
    quoting style. Apostrophes terminate a single-quoted scalar and a bare colon is
    parsed as a mapping indicator, so a syntactically-innocuous content edit produced
    an unparseable file. The failure mode is that the edit appears to succeed (the
    write returns) while the file is structurally broken — nothing in the write path
    validates syntax unless I explicitly re-parse.
  prevention: 'Never write prose containing apostrophes or bare colons into a YAML
    scalar without checking the quoting style first. Before ANY edit to a structured
    file, determine whether the target region is a plain scalar, a single-quoted scalar,
    a double-quoted scalar, or a block scalar, and escape accordingly. Always re-parse
    the file with a real parser immediately after editing, and treat a parse failure
    as a blocking defect to fix before any other action. This is the same lesson as
    "verify by reading the file, not a derived view" extended to WRITES: verify by
    re-parsing, not by assuming the edit was syntactically safe.'
  status: active
  context: 'I edited experiment_plan.yaml to insert the D047 k=5 pin into the X12
    description. The X12 description is a YAML single-quoted block scalar. My inserted
    text contained (a) two apostrophes ("from X1''s rebuilt table", "would read as
    ''handled''") and (b) a colon-containing phrase. Apostrophes inside a single-quoted
    YAML scalar terminate it, and a bare colon inside an unquoted scalar is read as
    a mapping indicator, so the file failed to parse: "while parsing a block mapping
    ... expected <block end>, but found ''<scalar>''". I caught it immediately by
    re-parsing with yaml.safe_load and repaired it. Notably the Agent had hit the
    identical failure this same session ("第一次因 C3 行一个裸冒号被拒，我改后重写通过") — the same class,
    one file over.'
  fix: Removed the apostrophes from the inserted text and re-parsed with yaml.safe_load
