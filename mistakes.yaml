- id: M118
  date: '2026-09-14'
  category: agent_behavior
  severity: medium
  summary: 'Three instances of "the change was made but not propagated": (1) local
    fix never pushed to the server tree; (2) runner synced but never re-run; (3) re-run
    server-side but never pulled locally - so the shipped copy is still stale each
    time. Change and propagation are separate, separately verifiable steps.'
  root_cause: A change and its propagation are separate operations across three boundaries
    that exist in this project (local tree, server tree, stored artifact). Each was
    verified independently of the others, and in each case the later step was assumed
    from the earlier one rather than measured. The result was three consecutive rounds
    in which the fix was real and the evidence still showed the defect.
  prevention: 'For any change that must take effect somewhere other than where it
    is authored, enumerate the propagation steps explicitly and verify EACH at the
    destination, not at the origin. The concrete checklist that would have caught
    all three: (i) is the change present in the tree where the code RUNS; (ii) has
    the thing that CONSUMES the change been re-executed since; (iii) has the resulting
    artifact been PULLED to the tree we will ship. Each is a separate yes/no, each
    verifiable by reading, and none is implied by the previous. The strongest general
    form: never report a fix as complete on the basis of having made the edit - report
    it complete only after measuring the artifact that the fix was supposed to change,
    in the tree where that artifact is used.'
  status: active
  context: 'Three instances in one session of the same underlying failure: a change
    was made, and the separate step of propagating it to where it takes effect was
    not, so the system behaved as though no change had been made.


    (1) x3_axis_validation.py was fixed in the local tree but never pushed to the
    server tree where it executes. A re-run therefore reproduced the byte-identical
    artifact and the fix appeared ineffective. Caught by a reviewer reading the server
    copy and finding the bare label still present. Logged as M108.


    (2) The runner was then synced to the server (16,592 B, D057 wording at line 350)
    but was NOT re-run, so the stored artifact remained the old 122,617 B with the
    bare label. The code was fixed and the artifact did not reflect it. Logged as
    D084.


    (3) The runner was then re-run server-side and produced 123,295 B with the D057
    wording, both notes present, and all computed values unchanged - but the output
    was never PULLED to the local tree, so the copy the repository holds is still
    the stale 122,617 B.


    Each time, a person reading only one tree would reach the wrong conclusion, and
    in each case the wrong conclusion was the optimistic one: "the fix is in place",
    "the artifact is fixed", "the re-run landed". The check that distinguishes them
    is the same each time - compare the artifact actually held against the artifact
    the code would now produce - and it was not run until a reviewer or a diff forced
    it.


    The general shape matches the session''s other recurring defects: a claim about
    state was made from the act of making a change rather than from measuring the
    result.'
