- id: M113
  date: '2026-09-14'
  category: experiment_design
  severity: medium
  summary: The k=5 artifact's maximum_pair_tpr (170.5 / 192.9 / 2.10) and the per-service
    max_tpr (up to 341, 22 of 53 above 1.0) cannot be rates, so the field name and
    value disagree - the third instance of this project's 'field that cannot equal
    what its name claims' class. The containment verdict itself is unaffected since
    it comes from binomial_test, but the field must be renamed before citation.
  root_cause: The field was named for the intent (a maximum TPR) while the computation
    aggregated differently (apparently summed or accumulated across a pair, and likewise
    per-service). No range or identity assertion guarded the name, so the mismatch
    was invisible at production time and only surfaced when a reviewer noticed a value
    outside the possible range. The same absence of a name-claim assertion produced
    the two earlier instances of this class.
  prevention: 'Before a computed field is emitted under a name that asserts a range
    or a semantic identity (a rate, a fraction, a maximum, a size, a hash), assert
    the name''s claim in code: for anything named as a probability or rate, assert
    0 <= value <= 1; for a field named maximum, assert it is >= every element it summarises
    and equal to one of them; for a field named to identify the file''s own bytes,
    assert it cannot be written before those bytes exist. A range assertion is one
    line and it converts a silently mis-named aggregate into a hard failure at the
    point of production. The wider rule, which this session has now demonstrated at
    least eight times in different guises: a field is part of the evidence chain,
    and a field whose name and value disagree is a defect even when every number in
    it is arithmetically correct, because the name is what a reader will cite.'
  status: active
  context: 'The completed k=5 detector-validation artifact (artifacts/X12_k5/data/x12_detector_validation_k5.json,
    191,867 B) carries a field named maximum_pair_tpr whose values cannot be probabilities:
    lightgbm 170.54, prototype 192.89, ronetc 2.10. The same defect exists one level
    down, in metrics.<detector>.holdouts[''0.05''].per_service[*].max_tpr, whose 53
    values span 0.0022 to 341.06 with 22 of them exceeding 1.0. A field named max_tpr
    asserts a true-positive RATE, which by definition lies in [0,1]; a value of 341
    cannot equal what the name claims. The pair-level value near 2.10 is consistent
    with something summed or accumulated across the two services of a pair rather
    than maximised, and the per-service spread shows the same conflation.


    This is the third instance in this project of the same defect class, which the
    project had already named and recorded: a field whose value cannot equal what
    its name claims. The prior two were the retired lower_side_fraction name (which
    turned out to name two different objects) and the self-referential artifact_size_bytes/artifact_sha256
    pair (which record a pre-write snapshot and so can never match the file''s own
    bytes).


    Critically, the defect does NOT contaminate the headline result. The containment
    verdict comes from the binomial_test block (violation counts, observed rates,
    p-values, reject_null), not from maximum_pair_tpr, which is reported alongside
    the test rather than consumed by it. All nine cells return reject_null: false,
    so the pre-registered one-sided floor check passes. The risk is purely at citation
    time: a reader lifting maximum_pair_tpr = 170 as evidence of detector sensitivity
    would be quoting a mis-named aggregate.'
  fix: 'Recorded the defect and its class, and separated in writing what is established
    from what is not: the containment result stands (nine cells, no rejection, floor
    not falsified on the informative stratum), while maximum_pair_tpr must not be
