- id: M061
  date: '2026-09-14'
  category: experiment_design
  severity: high
  summary: I asserted that smoothing bias would "manufacture sublinearity" (helping
    the X3 verdict); a known-truth probe shows it inflates D_k with k and thus works
    AGAINST sublinearity, so the result is conservative rather than suspect - the
    direction was asserted from plausibility, never measured.
  root_cause: I reasoned from a verbal mechanism to a direction without pinning the
    sign. The story - sparse contexts are noisier, smoothing pulls values toward uniform,
    so the estimate shrinks - is locally plausible and even true in part, but the
    dominant effect is that two differently-smoothed conditional laws separate in
    relative terms, inflating the symmetric KL. I asserted the story's direction as
    fact because it was plausible, and it was conjoined with a true observation (sparse
    contexts do get noisier), which masked that the SIGN was never measured.
  prevention: 'A claimed SIGN (increases/decreases/inflates/shrinks/conservative/anti-conservative)
    is a measurable claim and must be pinned by a control or probe BEFORE being written
    - especially when used to argue a result is safe. "It would manufacture the effect"
    and "it makes the result conservative" are opposite claims, and getting the direction
    wrong flips a caveat into a false reassurance. Plausibility gives a story, not
    a sign: the verbal story here ("sparse contexts shrink the estimate") was even
    locally true, while the dominant effect at these k ran the other way.'
  status: active
  context: 'Reviewing X3, I stated to the user and recorded in the ROADMAP that Jeffreys
    add-0.5 smoothing on sparse prefix contexts would "manufacture sublinearity" -
    i.e. that the estimator''s k-dependent bias HELPS the observed SUBLINEAR verdict,
    making the result suspect. I then ran a synthetic probe with an estimator of this
    shape on data whose truth is exactly linear (D_k = k*KL_1, KL_1 = 0.010205 pinned
    analytically). Result: est/true = 1.98 at k=5, 2.12 at k=10, 4.17 at k=15, 7.67
    at k=20, 8.91 at k=25, 9.67 at k=30. The bias INFLATES D_k with k, which STEEPENS
    the curve and therefore works AGAINST sublinearity. So the observed SUBLINEAR
    is CONSERVATIVE with respect to this bias - the opposite of what I had asserted.
    The independent review of X3 reached the same conclusion independently (noting
    D_k/k falls from 0.345 at k=10 to 0.284 at k=30, concave in the direction opposite
    to what the bias would manufacture).'
  fix: Corrected in the ROADMAP's X3 confound block (which now states the verified
    direction and that the exponents/magnitudes are biased estimates not to be quoted
    as a corpus law) and recorded as memory entry 306. The correction was also folded
    into the dispatched X3 controls spec so the control artifact records the direction
    explicitly.
- id: M062
