    or field count. A correct-looking promotion candidate can carry an unedited false
    assertion in its original descriptive fields, and promoting it moves that assertion
    from a stale-labelled location into the authoritative one, which is worse than
    leaving the defect visibly quarantined. Concretely: for every artifact where a
    claim has been retracted anywhere, check that the specific fields asserting it
    have been rewritten BEFORE the file is promoted; and verify by asserting on the
    FIELD content, never by a phrase count, since a retraction commonly quotes the
