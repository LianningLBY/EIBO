- id: M120
  date: '2026-09-14'
  category: experiment_design
  severity: high
  summary: The axis-validator re-run succeeded but wrote to artifacts/x3_axis_validation.json
    while the manifest's live entry cites artifacts/X3/data/ - so the cited path still
    holds stale bytes and a new unreferenced copy exists. D070's invariant broken
    by a re-run; found by checking paths, not numbers.
  root_cause: 'The runner writes to a path computed from its own ARTIFACT constant,
    while the manifest records a path decided at registration time. The two had drifted:
    the runner writes to artifacts/x3_axis_validation.json, the manifest cites artifacts/X3/data/x3_axis_validation.json.
    A re-run therefore created a new file at the runner''s path and left the manifest''s
    path holding old bytes. No check compares the two, and every numeric verification
    - size, sha, unchanged computed values - passed, because the numbers were all
    correct.'
  prevention: 'An artifact''s location has TWO sources - the producer''s output path
    constant and the manifest''s recorded path - and nothing in the pipeline keeps
    them in sync. So after any change that causes a RE-RUN, compare the runner''s
    output path against the manifest''s live entry path BEFORE trusting the result,
    and treat a mismatch as a defect of the same class as a duplicate entry or a broken
    resolver. Concretely: (1) after any re-run, verify the bytes landed at the path
    the manifest cites, not merely that a new file appeared; (2) when reconciling,
    prefer the producer''s path as canonical, because a manifest entry pointing anywhere
    else goes stale on every subsequent run; (3) never accept "the re-run landed"
    as evidence the evidence layout is correct - those are separate facts, verifiable
    separately, and the numeric checks passing tells you nothing about the second.
    The general form, consistent with this session''s C031: ask not only "did the
    change take effect" but "did it take effect in the place the system will look".'
  status: active
  context: 'After the axis-validator runner was successfully synced to the server
    (16,592 B, matched sha, AST OK) and re-run, the new artifact was written to /root/eibo/artifacts/x3_axis_validation.json
    - the path derived from the runner''s ARTIFACT constant PROJECT / "artifacts"
    / "x3_axis_validation.json". But the manifest''s live entry points at .../artifacts/X3/data/x3_axis_validation.json,
    and that path still holds the OLD bytes (122,617 B / 9f7578be). So the re-run
    succeeded and simultaneously created a second location, while the manifest-cited
    location went stale.


    I found this by checking the path names rather than the numbers: the sync report''s
    size and sha were all correct and the computed values were unchanged, so every
    numeric check passed. The defect is structural, not numeric - a re-run writes
    wherever the runner''s constant says, and nothing guarantees that is where the
    manifest points.


    This is the D070 layer question resurfacing in a new scenario. D070 established
    that register_artifact itself produces artifacts/<EXPID>/ and that the two layouts
    coexist with no canonical claim, and the invariant adopted was "exactly one live
    manifest entry per artifact whose path resolves to bytes". A RE-RUN is a new way
    to break that invariant, because the runner and the manifest are two separate
    sources of the artifact''s location and they had drifted apart.


    A naive pull would have been wrong in two ways: pulling to the manifest''s path
    would put the new bytes somewhere the runner does not write, so the next run re-splits
    them; pulling to the runner''s path would leave the manifest pointing at stale
    bytes and break the "path resolves to CURRENT bytes" property.


    I also asked to see the local sha after the pull rather than accepting "the re-run
    landed", which is what surfaced the problem - the run was real and the evidence
    layout was broken at the same time.'
  fix: 'Ruled a one-time reconciliation under D070''s invariant: determine the canonical
    path by evidence (the runner writes to artifacts/x3_axis_validation.json, so an
    entry elsewhere goes stale on every run, which argues for the runner''s path),
    then either move the bytes and change the one-line ARTIFACT constant to match,
    or update the manifest entry and retire the old one. End state must be one live
    entry whose path resolves to the 123,295 B / 4061258e bytes, with the local tree
    holding those same bytes at that same path. Instructed to report the canonical
    path chosen, the local sha after the pull, and a duplicate-basename/broken-resolver
    recount. Also instructed to check whether the parametric runner has the same path-split
    before re-running it, so the fix is not immediately undone elsewhere.'
