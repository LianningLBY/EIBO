- id: M123
  date: '2026-09-14'
  category: agent_behavior
  severity: high
  summary: 'M108 repeated on a different runner: I fixed x3_parametric_growth.py locally
    (14,233 B, d057_caution present) and never pushed it to the server (13,276 B,
    absent). A worker caught it by checking its premise and stopping. The lesson was
    recorded but not attached to the step where it applies, so it did not operate.'
  root_cause: I made a fix in the local tree and treated the edit as the completion
    of the task, exactly as in M108. The earlier lesson was recorded but never attached
    to the workflow step where it applies, so it did not fire. The worker's premise
    check is what caught it, not any control of mine.
  prevention: 'A rule that exists only in a mistake ledger does not operate; it must
    be attached to the step where it applies. Concretely for this project: any fix
    to a runner that executes on the server must be followed IMMEDIATELY by a sync
    step whose verification is reading the file back on the remote tree and comparing
    size and sha - not by a note that the fix is done. And because I have now made
    this error twice on two different runners, the check belongs in the dispatch itself:
    before writing a task that re-runs a runner, state the local size and sha and
    the server size and sha, so the divergence is visible at the moment of dispatch
    rather than after a wasted run. The general form: prefer a check that is forced
    by the workflow over one that depends on remembering a lesson.'
  status: active
  context: 'Hours after logging M108 - where I fixed x3_axis_validation.py locally
    and never pushed it to the server tree - I did exactly the same thing to a different
    runner. I fixed x3_parametric_growth.py at the source (adding the D057 non-diagnostic
    wording and a d057_caution field, in both the working-tree copy and the tracked
    artifacts/X3/intermediate/ copy) and treated the fix as complete. The server''s
    copy was never updated.


    The divergence is stark and verifiable: LOCAL x3_parametric_growth.py is 14,233
    B / sha 08f49cf702e26b1b with d057_caution present; SERVER x3_parametric_growth.py
    is 13,276 B / sha 4445de273e130a89 with d057_caution absent and zero non-diagnostic
    hits. The worker dispatched to re-run it checked the premise first, found neither
    copy carried the fix, reported the specific bytes and the literal errors, and
    stopped - which prevented a second wasted round in which an unfixed re-run would
    have regenerated the identical withdrawn wording and we would have asked why the
    fix had no effect.


    I had also written a task book presenting the intermediate copy as a server-side
    prerequisite when it is a local-only repository artifact (M122), and this worker
    found the truth by testing rather than assuming.


    The important lesson is not the repetition of M108 but that a recorded lesson
    did not operate. M108''s prevention text said "an edit is not in effect until
    it is pushed to the tree where the code runs, and the push must be verified by
    reading the file back ON THE REMOTE TREE". That rule existed, was written by me,
    and I still did not run the check. A rule that lives only in a mistake ledger
    is not a control.'
  fix: Confirmed the divergence and issued a corrected task that front-loads the sync
    (backup, transfer, py_compile, compare size and sha and report both) and gates
    the re-run on the sync matching. Explicitly credited the worker's stop as the
