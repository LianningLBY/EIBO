- id: M073
  date: '2026-09-14'
  category: agent_behavior
  severity: medium
  summary: I sent an urgent cancellation of a memory.md append as a 'duplicate', based
    on a phrase count rather than a content comparison; the append was actually the
    fuller version (promoted section + rename procedure) and had already landed cleanly
    - the same phrase-vs-content error I had corrected in the Agent one message earlier.
  root_cause: 'I substituted a phrase-presence test for a content-coverage test: grep
    -c returned 2, so I inferred ''the rule is already there in full''. The existing
    occurrence was a sub-block bullet without the rename procedure; the incoming one
    was a promoted top-level section with the procedure. I did not read either before
    deciding, and I fired an urgent cancellation on that inference.'
  prevention: 'A phrase count is not a content check. Counting whether a string appears
    answers ''is the string present'', not ''is the topic covered'' - and the two
    diverge exactly when the existing occurrence is partial (a bullet, a mention,
    a note) while the new one is fuller (a section, a procedure, an action). Before
    declaring new content redundant, READ the existing occurrence and compare what
    it says to what the new one would add. Corollary: ''already present'' is a content
    claim requiring the same evidence standard as ''absent''. And a second-order lesson,
    since I made this error in the same hour I corrected it in someone else: correcting
    a mistake is not immunisation against it - the failure mode was fresh in my context
    and I still reproduced it, because the habit (grep -c as a proxy for coverage)
    ran without being re-derived.'
  status: active
  context: 'A worker started appending the ''field name is a claim'' rule to memory.md.
    I checked grep -c "FIELD''S NAME IS A CLAIM" -> 2 and concluded the rule was ''already
