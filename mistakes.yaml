- id: M055
  date: '2026-09-13'
  category: experiment_design
  severity: high
  summary: 'X8''s mandatory per-item check asserts TV(vector) >= TV(marginal), but
    "marginal" names two different objects: the theorem holds for the PHIST pooled
    cell law and FAILS to hold (no DPI relation) for the k-prefix symbol law, which
    is what the artifact actually compares against.'
  root_cause: I wrote the check from the intuition that "the vector is finer than
    a marginal, so it should be larger" without specifying which marginal. That intuition
    is true for the pooled cell law (same channel, pooling is deterministic) and false
    for the k-prefix symbol law (different channel, no functional relation). The framework
    already records the correct statement — PHIST and k-prefix have no DPI order —
    so the spec contradicted our own framing.
  prevention: Before writing a per-item assertion from a stated inequality, verify
    (a) that the inequality is a theorem for the two objects named, and (b) that BOTH
    objects are unambiguously identified. "Marginal" is a relational word — it means
    different things relative to different objects, and here it silently named two
    different distributions in the same sentence. Any inequality used as an automated
    detector must be checked against the framing's own DPI statements first.
  status: active
  context: 'X8''s spec and the framing both state "TV(vector) >= TV(marginal)" as
    a DPI theorem and require it asserted per-item as a self-failing object-mismatch
    detector. But the "marginal" in that sentence is ambiguous between two DIFFERENT
    objects. (1) The PHIST-side pooled cell law = the average of per-flow 32-vectors
    within a service. This IS a deterministic function (pooling) of the per-flow vector
    law, on the SAME flows and SAME channel, so TV(vector) >= TV(pooled) is genuinely
    implied by DPI. (2) The k-prefix symbol law = the symbol of the first 5 (direction,size)
    codes. This is NOT a function of the PHIST 32-vector: the two consume different
    aspects of the flow (packet order and prefix length vs whole-flow size and inter-packet-time
    histograms). Neither object is a function of the other, so no DPI order relates
    them in either direction — and the framework''s own PHIST analysis says exactly
    this ("PHIST and k-prefix have NO DPI order in either direction"). So X8''s mandatory
    check, as written, asserts an inequality that is not a theorem. The observed medians
    do order correctly (vector 0.8674 > k-prefix marginal 0.5349), but that is an
    empirical fact about this corpus, not a guarantee; per-pair it can go either way
    and a "violation" would not be the object-mismatch bug the spec claims it detects.
    A check whose premise is false cannot function as a detector.'
  fix: 'Rewriting X8''s required check to assert the inequality that IS a theorem:
    TV(vector) >= TV(pooled cell law), both computed on the SAME flow set and the
    SAME channel, where pooling is deterministic. Reporting the vector-vs-k-prefix-median
    ordering as an EMPIRICAL observation (with the 2.7x/7.34x cancellation analysis
    already in place), never as a guaranteed per-item inequality.'
- id: M056
  date: '2026-09-13'
  category: experiment_design
  severity: high
  summary: 'The per-item check has a second defect beyond the wrong object: both sides
    are LOWER bounds, so it cannot falsify — a pass means only "no contradiction".
    My "self-failing detector" framing was wrong twice.'
  root_cause: I wrote "self-failing detector" from the intuition that DPI guarantees
    an ordering, without checking the estimator type on either side. Both sides are
    lower bounds, and a lower bound is free to sit below the other quantity's value
    without violating anything.
  prevention: 'Before calling any assertion a "detector" or "self-failing check",
    verify BOTH: (a) the inequality is a theorem for the two objects actually named,
    and (b) BOTH quantities are of a type whose comparison can contradict the theorem
    — i.e. at least one must be an UPPER bound or a point estimate. Comparing two
    lower bounds cannot falsify anything. A check that cannot fail is not a check
    (this is the same failure class as C019, fourth instance).'
  status: active
  context: 'X8''s spec called the per-item inequality a "self-failing object-mismatch
    detector": assert TV(vector)_i >= TV(marginal)_i on every pair, must hold 990/990,
    failure is a BUG. Verified there were TWO defects, not one. (1) The object naming
    (M055): "marginal" named two different objects; the theorem holds only against
    the PHIST-side pooled cell law, not the k-prefix symbol law — and no DPI order
    relates the latter pair at all. (2) NEW: even against the correct object, the
    check CANNOT falsify, because BOTH sides are LOWER BOUNDS. The vector run is `tv_lower_bound(...,
    method=''michel'')` with guarantee text "asymptotic HPLB estimate, not an exact
    finite-sample certificate"; the pooled side carries tv_hat. A lower bound on TV(vector)
    may sit below TV(pooled) even when DPI holds, so a failure is EXPECTED rather
    than diagnostic. Passing yields only "no contradiction"; failing yields nothing.
    The check is a one-sided sanity check, not a detector. So my "self-failing detector"
    description was wrong twice over — wrong object AND wrong quantity type.'
  fix: Require the artifact to record vector_side_quantity_type (lower-bound vs point-estimate)
    and, if a lower bound, report pairs_where_the_check_can_falsify = 0 so no reader
    reads a pass as "the theorem is verified". Retain the old record rather than replacing
    it.
