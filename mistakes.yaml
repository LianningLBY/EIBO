- id: M126
  date: '2026-09-14'
  category: agent_behavior
  severity: high
  summary: A worker declared server-to-local fetch unavailable after finding only
    a local-to-server tool; ssh_fetch_file exists and had already worked twice today.
    Third instance of "concluding a capability is absent from one failed path" - and
    the first two were mine, including the git credential the user had to correct
    me on.
  root_cause: The worker tried a managed transfer tool, found it was local-to-server
    only, and generalised to "server-to-local fetch is unavailable" without searching
    for a function that does the reverse. ssh_fetch_file existed, was reachable via
    a documented invocation pattern, and had already succeeded twice the same day.
  prevention: 'Never conclude that a capability is missing from a single failed attempt.
    Before reporting a path as unavailable, SEARCH the framework for the function
    that performs it - the successful worker did exactly that and found ssh_fetch_file,
    while the failing one reported absence. Concretely: grep the tool layer for the
    operation by name or by intent, and if a function exists but a parameter blocks
    it (here a default size cap), raise the parameter or chunk the operation rather
    than concluding the capability is absent. A default limit is not an absence. This
    has now happened three times today and two of them were my own conclusions, so
    it is not a rare failure mode - it is the default way this system misreports its
    own capabilities.'
  status: active
  context: 'A worker tasked with pulling the D057 artifact stopped and reported: "managed
    server-to-local fetch unavailable in this session. The available managed transfer
    tool is local-to-server only (ssh_upload_file)." It backed up the local stale
    copy but did not replace it.


    That conclusion is false. core.tools.ssh.ssh_fetch_file exists - binary-safe,
    server to local, reading via head -c max_bytes - and had already worked twice
    earlier today: the axis-validator pull (local went 122,617 to 123,295, matching
    the server) and the x12 runner pull (local is now 56,232 B with the pair-level
    code). The successful axis worker found it by grepping the framework for a fetch
    function rather than reporting its absence, and the call form is visible in its
    log.


    This is the third instance today of the same error, and the first two were mine:
    I declared the git credential unreadable after one failed shell attempt (the user
    corrected me, and a working path - sync_code_to_remote injecting the project token
    - existed the whole time), and I earlier inferred a compute class from an idle
    GPU rather than from the plan entry. Now a worker did the same thing with the
    fetch path.


    There is a real constraint the worker would have hit: ssh_fetch_file''s max_bytes
    defaults to 1 MiB, and the X6 artifact is 1,998,647 B. But that is a parameter
    to raise, not evidence the path is unavailable - and discovering it would have
    been the natural next step after finding the function.'
  fix: Sent the correction with the exact working call form from the successful axis
    pull's log, noted the max_bytes constraint and which of the three files exceeds
    it (X6 at 1.99 MB), and instructed that after a bounded-range fetch the final
    sha must be verified against the server's rather than the path being declared
    unavailable. Re-issued all three pulls with the hash-update requirement after
    each, since the manifest hashes written earlier now describe the previous bytes
    for all three files.
