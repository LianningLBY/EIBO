  root_cause: I had computed M_max as a function of n earlier and then, when consolidating,
    compressed it into a memorable absolute ("M>=8 never certify") because that phrasing
    read as a cleaner finding. The compression dropped the parameter the claim depends
    on. The same consolidation preserved an "assumption-free" summary of both thresholds
    that I had already invalidated for one of them, because I edited the detailed
    line without re-reading the summary that referenced it.
  prevention: 'When stating any impossibility or bound as a citable result, name the
    parameters it is conditional on and verify the claim at a value of each parameter
    away from the one that motivated it. A threshold derived from an expression containing
    a free variable is not an absolute — write it as the function it is. And after
    correcting a claim in one part of a document, re-read every place that claim is
    summarised, since a summary block can silently contradict a correction made minutes
    earlier in the same file. On file mechanics: when a tool manages a header or field
    itself, do not supply one in the content; and prefer replacing a whole logical
    line over appending near it, since append leaves the superseded text in place.'
  status: active
  context: 'I wrote "M=8/16 never certify (radius > 0.5 for any tv)" into the roadmap''s
    citable-results block, presenting it as an assumption-free absolute. It is false
    as stated. The certification condition is `sqrt((2M)^k/n) + sqrt(2 ln(2/alpha)/n)
    < 0.5`, which depends on n, so M=8 is only infeasible *at a given sample size*.
    Verified: at k=5, r(M=8) is 0.5199 at n=3.9e6 (infeasible) but 0.4951 at n=4.3e6
    (feasible), 0.4592 at 5e6, and 0.3247 at 1e7 — the crossover is n ≈ 4.22e6, only
    about 8% above the corpus mean per-service count. Since per-service counts in
    this corpus span orders of magnitude, the largest services plausibly exceed it,
    so a reviewer checking M_max on a large service would find M=8 feasible and the
    claim would read as overstatement. The correct form is the one already used elsewhere
    for M_max: report it as a function of (k, n, tv).


    This sits in the same family as several earlier entries — a bound or impossibility
    stated as absolute when it is conditional on a parameter. Related and notable:
    I made this error while consolidating a document specifically to remove over-strong
    claims, and the same edit also left the "two computed thresholds are assumption-free"
    line intact after I had just established that T(n)''s constant is numerically
    calibrated rather than derived, so the block contradicted a correction I had made
    moments earlier in the same file.


    Separately, my consolidation left two "Last updated" header lines, because the
    roadmap-writing tool inserts its own header and I had included one in the content
    — the same "superseded content left alongside its replacement" pattern (C007)
    I have been enforcing on others. I also appended rather than replacing the (L)
    line, briefly duplicating it.'
  fix: Rewrote the M>=8 claim as n-scoped with the crossover value and a pointer to
    the M_max(k,n,tv) functional form; rescoped the assumption-free statement to say
