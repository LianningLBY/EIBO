- id: M075
  date: '2026-09-14'
  category: agent_behavior
  severity: high
  summary: I prescribed a file-wide phrase-count check as the success criterion for
    a field-level correction, despite having documented that exact trap earlier in
    the session; the check misjudges in both directions and it was propagated into
    a dispatch to another role.
  root_cause: I reused a check form (grep count equals zero) that was already known-unreliable
