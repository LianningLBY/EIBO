- id: M102
  date: '2026-09-14'
  category: experiment_design
  severity: high
  summary: Variant B's plain curve is frozen for 14 of 25 points (constant tail from
    k=16), which manufactures the reported p=0.539 (refit before the freeze gives
    1.093/LINEAR); the 61% excluded-mass argument rests on that frozen axis.
  root_cause: Variant B's threshold filter saturates its retained-context set at k=16
    (contexts grow as 2^k while per-context samples collapse), pinning D_k at a constant
    for the upper 14 of 25 points. The power-law fit was then computed across that
    frozen tail without any check that the curve still varied, so the constant tail
    pulled the exponent down and produced a spurious sublinear verdict. The defect
    propagated because two separate reviews and an audit all examined that curve for
    a DIFFERENT defect class (label shift) and treated its output as data, and because
    the excluded-mass figure computed on the same axis was carried into the structural
    argument without an independent check.
  prevention: 'Two rules. FIRST: a fitted growth curve must be checked for SATURATION
    before any exponent is reported from it. A tail that is exactly constant means
    the underlying statistic stopped varying -- usually because a filter, threshold,
    or occupancy gate saturated the retained set -- and any exponent fitted across
    such a tail is an artifact of the constant, not a measurement of shape. Assert
    non-constancy over the fitted window, and refuse to emit a fit when it fails.
    A cheap tell: count exact-zero increments, and check whether two widely separated
    x values return identical y. SECOND: scope an audit by ANOMALY SIGNALS, not by
    the task description. The audit here was asked to check label alignment, checked
    only that, and therefore printed a frozen curve -- whose anomaly certifies itself
    on sight -- as normal data. A defined audit must enumerate the defect classes
    it looks for independently of what it was asked to verify, and treat anything
    self-certifyingly odd in its own output as a trigger to investigate rather than
    as data to report.'
  status: active
  context: 'Variant B (the exposure-conditioning repair attempt for C3) reports a
    known-truth control whose plain arm "fails the gate" with power exponent p = 0.539,
    and a threshold sweep showing p falling monotonically as the filter tightens (0.539
    / 0.420 / 0.372 / 0.260 / 0.210). Both were cited in D052 finding 2, in D055,
    and in registry D052_FINDING_2 as evidence that the estimator''s deflation is
    "structural, not a tuning problem" (the argument: eliminating sparse contexts
    would require discarding 61% of transition mass and the arm still fails). I verified
    that variant B''s plain known-truth curve is FROZEN: D_k_median is pinned at exactly
    5.908567858844014 for every k from 16 to 30, so 14 of 25 increments are exactly
    zero. I then verified the freeze is not a data property but an artifact of B''s
    own threshold filter: the ORIGINAL unfiltered control''s plain curve, same construction,
    has 0/25 zero increments. And I verified the freeze CREATES the reported result:
    refitting B''s own curve with B''s own power form over the full window reproduces
    p = 0.539, but truncated to k<=16 (before the freeze) the same fit gives p = 1.093,
    i.e. LINEAR. So the reported sublinearity is a fitting artifact of a constant
    tail, and the 61%/0.608 excluded-mass figure was computed on that same frozen
    axis. The freeze also appears on the same code path in the corrected dose-response
    (plain arm freezes at k=29 / k=27 at retained 0.10 / 0.05), so it is systemic
    to threshold-filtered curves rather than a one-off. Compounding it: the sibling
    audit that the fix worker ran was scoped to check only for a +4 LABEL shift; it
    concluded "Verified-correct labelling" for B and printed the freeze as normal
    data, listing k=20 and k=30 with identical values in the very row it produced.'
  fix: 'Verified and logged D063 (62 decisions total). Corrected every ROADMAP surface
    that cited the 61%/0.608 figure as valid evidence: the C3(i) supporting paragraph,
    the variant-B table row, and the "structural not a tuning problem" claim, each
    now marking the figure unusable pending recomputation on a non-frozen axis. Dispatched
    to the Agent: fix the freeze by making the retained-context set keep growing with
    k (or report retained-context counts per k and REFUSE to emit a fit when the curve
    is constant over a tail), recompute the excluded-mass figure, and add a no-freeze
    assertion to every curve passing through the threshold filter at the same level
    as D056''s bit-identical and analytic guards. Upgraded the sibling-audit protocol
    to check four things rather than one: (a) label shift, (b) constant tails, (c)
    non-monotone jumps, (d) exact-zero increments.'
