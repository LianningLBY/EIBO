- id: M096
  date: '2026-09-14'
  category: communication
  severity: high
  summary: My X12 submit command omitted --k-packets, so the run silently inherited
    the default k=15 where its mandatory informative stratum is empty.
  root_cause: 'My submit command specified every parameter except --k-packets, so
    the decisive parameter silently took the script''s default of 15 -- a value at
    which the mandatory informative stratum is empty. The omission was mine, not the
    Agent''s; it submitted the command faithfully and reasonably did not invent a
    flag. The lesson generalises: an incomplete command is not a neutral instruction,
    it is an instruction that delegates a decision to a default, and in this project
    defaults have now caused three separate failures.'
  prevention: A dispatch command is a SPECIFICATION, and an omitted parameter is not
    neutral -- it silently selects whatever the code defaults to. Before dispatching
    any command that produces a reported statistic, enumerate the parameters that
    select WHICH DATA or WHICH OBJECT the statistic is computed on, and confirm each
    is explicitly present; verify the flag names against the actual parser output,
    not from memory (this project has a standing rule against restating what the code
    implements). Conversely, when receiving a command that omits a parameter the statistic
    depends on, treat the omission as a blocker to raise, not a default to accept
    -- a run that completes cleanly on the wrong population is more dangerous than
    a run that refuses, because it produces a DONE that reads as success. And when
    a failure is traced, attribute it to the artifact that actually caused it (here,
    my command) rather than accepting a downstream role's self-blame.
  status: active
  context: 'X12 (the detector-validation experiment, sole carrier of the RC3/RC6 reviewer
    concerns) ran with --k-packets 15, where its mandatory informative stratum is
    empty (0/946 per X1''s rebuilt table), so it could not produce containment evidence.
    The error was traced to the submit command recorded in the registry: "cd /root/eibo
    && ... x12_detector_validation.py --h5 <H5> --label-field APP --train-months 202406
    ... 202411 --test-months 202501 ... 202505 --cpu-only --output-json ... --output-csv
    ...". It names every parameter EXCEPT --k-packets. The k value therefore came
    from the script default (15). The Agent submitted exactly the command it was given,
    did not invent a flag, and was then self-critical for "not checking the default".
    That self-criticism was misplaced: the command handed to it was incomplete, and
    the omission originated with me. Two prior failures in this same experiment (label-axis
    CATEGORY default; split-derivation default) had already shown this project is
    vulnerable to unchecked defaults, and the session had explicitly logged that class
    — yet the command still omitted the decisive parameter.'
  fix: 'Adopted a two-sided rule and stated it explicitly to the Agent (correcting
    its misplaced self-blame on the record): (1) the person AUTHORING a dispatch command
    must name every parameter the primary statistic depends on, and must verify the
    parameter list against the script''s parser rather than recalling it; (2) the
    person SUBMITTING must not silently inherit a default for a parameter that determines
    the population or object the pre-registered statistic is evaluated on -- if such
    a parameter is absent from the spec, stop and ask rather than proceeding. Reinforced
    structurally: make --k-packets required with an actionable error (as the train/test
    months default already does, a pattern that works). Also revised the plan so the
    k value is pinned in the X12 entry with the per-k informative-stratum counts.'
