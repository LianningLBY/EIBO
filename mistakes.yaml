  severity: medium
  summary: Wrote wrong decision ids into two constraints (C028 referenced a nonexistent
    D077 instead of D075; C030 the same for D078 vs D077) by guessing the tool-assigned
    number instead of reading it back. Both caught only by an explicit post-hoc check.
  root_cause: The decision numbering is assigned by the log_decision tool at call
    time, so the next id is not knowable before the call returns. I composed the constraint
    text - including the decision_id reference - before or independently of reading
    that return value, so I wrote the plausible next number instead of the actual
    one. Neither error was visible to any validator, because both ids were well-formed
    and the referenced decisions simply did not exist yet.
  prevention: 'Never write a sequential id that a tool assigns. Read the id from the
    tool''s return value and use that literal string. This applies to decision ids,
    mistake ids, constraint ids, experiment ids, and artifact ids alike. After creating
    any cross-reference between two files (a constraint pointing at a decision, a
    mistake pointing at a decision, a registry entry pointing at an artifact), read
    the referencing file back and confirm the id resolves - because a guessed id is
    syntactically valid and semantically dead, which means no parser catches it and
    only an explicit lookup does. The general form, and it matches this session''s
    other recurring lesson: I asserted a value I did not measure. The id existed in
    the tool output; I did not read it.'
  status: active
  context: Twice now I have written a decision id into a constraint's decision_id
    field by guessing the next number rather than reading it back from the tool result.
    (1) Constraint C028 was created with decision_id D077, but the log_decision call
    had returned D075 - the D077 reference did not exist. (2) Constraint C030 was
    created with decision_id D078, but that log_decision call returned D077. Both
    times I noticed only because I checked the reference afterwards, and both times
    the fix was a one-character edit. The failure mode is that the numbering is assigned
    by the tool, not by me, so any id I write before reading back the tool's response
    is a guess - and a plausible-looking guess, which is why it is not caught by inspection.
