- id: M090
  date: '2026-09-14'
  category: resource_misuse
  severity: medium
  summary: I cancelled a worker assuming it had not yet written, but it had partially
    applied its renames, so cancellation left two identically-named RETIRED files
    in different directories instead of restoring the pre-cancel state.
  root_cause: I treated 'just started, few events' as equivalent to 'wrote nothing',
    and cancelled on that basis without checking the affected paths first. Cancellation
    stops further writes but does not undo completed ones, so the partially-applied
    rename survived and produced two same-named retired files in different directories.
  prevention: 'Before cancelling a worker, check whether it has already written to
    disk - a low event count or a recent start is not evidence of no writes, and cancellation
    preserves whatever partial state exists rather than rolling it back. After any
    cancellation, READ the affected paths rather than assuming the pre-cancel state;
    a partially-written worker leaves a mixed state that must be reconciled explicitly.
    Related, and the same family as the retrieval/placement separation: when a naming
    scheme is designed to avoid collisions within a single directory, check whether
    the same scheme applied across two directories can still produce two identically-named
    artifacts that a reader cannot distinguish.'
  status: active
  context: 'I ordered cancellation of a worker (the X5 duplicate-consolidation worker
    at 03:00:15) on the reasoning that it had just started and therefore had done
    nothing, inferring ''low event count = no writes''. It had in fact already performed
    part of its renaming, so cancelling left the disk in a MIXED state rather than
    returning it to the pre-cancel state: two files now carry RETIRED_duplicate_do_not_cite
    names, one in artifacts/ and one in artifacts/_project/data/, a state my own spec
    had not anticipated because I designed those names to be unique within their own
    directory. The canonical path was nevertheless correct (it held the corrected
    content with vacuous_by_clipping present), so no data was lost - but the divergence
    existed and had to be discovered by reading the tree rather than by assumption.
    The executing role independently identified the same principle and stated it better
    than I had: cancelling is not the same as returning to the pre-cancel state; a
    worker cancelled after partial writes leaves a mixed on-disk state, and a low
    event count is not evidence that nothing was written. It also committed to checking
    whether a worker has written BEFORE cancelling rather than after.'
  fix: Corrected ruling sent requiring the surplus copies to be deleted (including
    suffixed variants and retired-alias names - now three such names exist) and the
    canonical single-file state asserted, after the server-authoritative re-run. The
