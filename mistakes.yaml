- id: M099
  date: '2026-09-14'
  category: experiment_design
  severity: high
  summary: Wrote D055 on a dose-response control that had a confirmed off-by-4 k-indexing
    defect, after deferring the discrepancy that would have caught it; half of D055
    had to be retracted.
  root_cause: An anomaly was surfaced (two artifacts giving p=1.001 and p=0.651 for
    the same nominal construction) and I classified it as a tension to resolve later
    rather than as a validity blocker on the artifact that produced it. Having deferred
    it, I then wrote D055 on the un-validated artifact and reported its "disagreement"
    with variant B to the user as a substantive finding. The underlying defect is
    an off-by-4 offset between the script's accumulation loop and its k label, which
    no test caught because the control's zero-thinning setting was never required
    to reproduce its own reference.
  prevention: 'Two rules. FIRST: when two artifacts report the SAME nominal quantity
    at the SAME nominal setting and disagree, treat it as a BLOCKER on both artifacts''
    validity and resolve it before writing anything that depends on either -- not
    as a tension to note and proceed past. The discrepancy I was shown (p=1.001 vs
    0.651 for one construction) was a five-minute arithmetic check away from being
    solved, and instead I built a decision on top of it. SECOND: every control that
    has a ZERO-INTERVENTION setting must reproduce its own reference exactly at that
    setting -- bit-identical where the code path is shared, and matching analytic
    truth at its labelled k regardless. A null setting is a free correctness test
    for the whole pipeline up to that point, and skipping it means shipping a control
    whose axis was never validated. Corollary for x-axes generally: never rely on
    a derived quantity being labelled with the right abscissa; assert the label against
    an independent analytic value at at least two points before fitting anything to
    it.'
  status: active
  context: 'The occupancy dose-response control (x3_control_occupancy_dose_response.json)
    was built to decide whether sparse occupancy causally produces the estimator''s
    sublinear bias. I wrote D055 declaring its verdict joint_tracks_thinning = true
    and asserting that this control and variant B''s real-data threshold scan "point
    in opposite directions", and I reported that disagreement to the user as an unexplained
    tension. The Agent had flagged an anomaly: the dose-response baseline at retained_fraction
    = 1.0 reported exponent p = 1.001 (LINEAR) while the SAME nominal construction
    reports p = 0.651 in the original known-truth control and p = 0.539 in variant
    B. I registered that as a tension to resolve later rather than as a blocking validity
    failure, and proceeded.


    THE ACTUAL DEFECT, found by me afterward: the dose-response curve at zero thinning
    is the original control curve shifted by exactly +4 in k. dose(k) == orig(k-4)
    matches 22 of 22 comparable points to within 1e-9 (dose(9)=1.694909=orig(5); dose(30)=6.357235=orig(26)).
    The defect is in that script''s own k axis, not the shared estimator: the original
    control and variant B both match analytic truth AT THEIR LABELLED k (est/true
    1.0002 at k=5), and the dose-response names the same functions (x3_controls.py:fit_growth,
    d_chain_fast). A constant k-shift flattens a sublinear curve, which is exactly
    why the anomalous baseline read as LINEAR. So joint_tracks_thinning is computed
    on a defective axis and is worthless, and the "two controls disagree" claim was
    an artifact of the bug.


    COST: a published decision (D055) had to have half of it retracted (D056), and
    the user was told a false "unexplained disagreement" that they may have acted
    on.'
  fix: 'Logged D056 withdrawing the dose-response verdict and superseding the dose-response
    half of D055; corrected the ROADMAP header, the ROADMAP C3 block, and both the
    experiment_plan X3 entry and its C3 claims line (the "evidence is now split" wording
    replaced with the verified off-by-4 finding). Dispatched the fix: locate the exact
    off-by-4 line, re-run, and verify against analytic truth at its own labels (est/true
    ~ 1.0 at k=5 on the un-thinned arm). Part (i) of C3, the heterogeneous arm''s
    DEAD verdict, the ~58x magnitude gap, the original control''s FAIL and variant
    B''s gate failure all stand untouched.'
