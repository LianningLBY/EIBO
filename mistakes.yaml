- id: M026
  date: '2026-09-13'
  category: agent_behavior
  severity: high
  summary: Flip-flopped twice on artifact visibility, both times from directory-based
    inference; the real axis is local-vs-remote execution, and my earlier "fix" was
    inert twice over.
  root_cause: I inferred visibility from the target directory rather than from where
    the writing process executes, which is the operationally relevant variable. I
    also accepted three corroborating examples without inspecting their contents,
    when two of them contained the disconfirming detail.
  prevention: 'Before asserting a visibility or existence claim, open the artifacts
    that appear to support it and check their internal provenance — two of my three
    "confirming" examples declared a local path in their own contents, which I would
    have seen by reading them rather than listing them. More generally: when two opposite
    claims have both been asserted from listings alone, neither is established; stop
    alternating and identify the mechanism that explains every observation, then test
    it against a case where the two hypotheses predict differently. Here the discriminating
    case was an artifact produced on the server versus ones produced locally, and
    it separated them cleanly.'
  status: active
  context: 'I asserted twice, in opposite directions, that container-root artifacts
    are/are not readable from my side, each time from insufficient evidence.


    First I claimed they are unreadable ("outside the shared project tree, so I cannot
    read them — only relay"), and used that as a standing reason for many rounds.
    Then I tested it, found three artifacts present in my tree, and reversed to the
    opposite claim ("container-root writes do synchronise"), which I reported to the
    user and required be written into memory. The executing agent then applied the
    very rule I had just given it — look for a same-kind counterexample before asserting
    visibility — and found one: `xs_compression_early_readout.json` is absent, and
    its producer ran with `pwd=/root` and failed its local-path completion check with
