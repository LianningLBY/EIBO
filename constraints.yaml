- id: C041
  added: 2026-09-16 15:08 UTC
  summary: 'Distinguish TWO reasons an upper-bound coverage fraction can be uninformative,
    and do not merge them. (1) RADIUS SATURATION (the general, structural reason):
    the radius 0.5*sqrt(m/n)+0.5*sqrt(2 ln(2/alpha)/n) is a pure function of n, identical
    across arms and invariant to block size B, so at n=2791 it is 0.0816 = 1.63x the
    true TV of 0.05 and coverage there is trivially guaranteed. This is the limitation
    that matters and it is about the DESIGN, not about dependence. (2) ESTIMATE INFLATION
    (specific to strong dependence): under extreme dependence the plug-in tv_hat itself
    inflates toward the metric ceiling (measured 0.121 iid -> 0.482 at B=64 -> 1.000
    at B=1024 against a true TV of 0.10), which also makes coverage easy. Do NOT report
    (2) as evidence that the bound fails to track dependence, and do NOT report coverage
    1.000 as evidence that it tracks it. Any citation must give the true-TV-to-radius
    ratio per cell.'
  scope: all
  reason: 'My first version of this constraint asserted the coverage test was ''vacuous
    under strong dependence''. That merged two distinct effects and mis-weighted them:
    the dominant reason the small-n cells cannot fail is that the radius exceeds the
    truth (1.63x at n=2791), which is independent of any dependence at all. Corrected
    after an independent check showed the original dependent arm already reached indicator
    lag-1 0.47-0.9999, i.e. the dependence axis was never the weak point.'
  decision_id: D131
- id: C042
  added: 2026-09-16 15:18 UTC
  summary: 'A corpus-level autocorrelation figure is NOT the dependence a synthetic
    arm exercises — measure the arm''s own generator before calling it a stress test
    or a non-test. The runner''s dependent arm at conc=0.1 reaches indicator lag-1
    0.47-0.9999, so the existing 80 cells already are the strong-dependence test,
    and coverage stayed 1.000 across all of them. The genuine remaining limitation
    is the opposite axis (see C042): the radius is a pure function of n, so small-n
    cells cover trivially.'
  scope: all
  reason: 'The prior constraint C040 rested on a conflation I have now measured away:
    max_measured_lag1=0.0256 is the corpus lag-1 autocorrelation of the service indicator
    in /flows traversal order, which is the INPUT used to choose the B ladder — NOT
