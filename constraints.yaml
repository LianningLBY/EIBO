  decision_id: D133
- id: C043
  added: 2026-09-16 15:18 UTC
  summary: 'The coverage calibration''s real limitation is saturation, not weak dependence:
    the radius is a pure function of n, identical across arms and invariant to B,
    and at n=2791 it is 1.63x the true TV so coverage there is trivially guaranteed.
    Only the large-n / low-TV cells (n=100000, radius 0.0136 < true 0.05) carry information.
    Never cite the all-1.000 coverage without the true-TV-to-radius ratio.'
  scope: all
  reason: 'The coverage calibration saturates at 1.000 in all 128 cells, and the radius
    term 0.5*sqrt(m/n)+0.5*sqrt(2 ln(2/alpha)/n) depends ONLY on n — it is identical
    between the i.i.d. and dependent arms at every n and invariant to block size B.
    Measured: n=2791 radius 0.0816 against a true TV of 0.05 (1.63x the truth), so
    small-n cells cannot fail to cover. At n=100000 the radius is 0.0136, below the
    0.05 truth, and only there is coverage 1.000 informative. Any write-up must state
    the true-TV-to-radius ratio per cell, or a reviewer will dismiss the result with
    ''your radius was simply larger than the truth''.'
  decision_id: D133
