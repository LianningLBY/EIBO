- id: C037
  added: 2026-09-16 08:24 UTC
  summary: 'Worker dispatch can fail silently: a launch stalls non-terminal with no
    first tool call, no agent text, and no terminal callback, cycling on upstream
    connection errors. When launches fail like this, do NOT rewrite the task brief
    or front-load the first command — a one-line echo brief fails identically, so
    content is not the cause. Check whether the launched worker''s log stopped after
    the startup lines with an empty recent_tools, and whether its event_count keeps
    creeping on a slow retry cycle. Treat the item as unmeasurable (not disproven)
    and report the dispatch fault rather than substituting another attempt for a result.'
  scope: all
  reason: On 2026-09-16, ten worker launches produced no measurement of either open
    item (repo sync, coverage-calibration execution). Content, brief length, task_type,
    tool_groups and concurrency were each eliminated as causes; a one-line `echo`
    over SSH failed identically. The productive launches all clustered in the session's
    early phase and everything after degraded, i.e. the fault is intermittent-to-degrading
    rather than total. Workers stall non-terminal in a reconnect/retry loop with no
    first tool call, which is why neither output nor callback arrives. Recorded because
    the natural but wrong response is to keep rewriting the task brief.
- id: C038
  added: 2026-09-16 08:44 UTC
  summary: 'The remote-execution capability can be absent from the tool surface entirely.
    When launches produce no first tool call, check the available tool list for an
    arbitrary-command executor BEFORE diagnosing anything else — if none exists, no
    task brief can succeed and no amount of retrying, polling, or prompt revision
    will help. Distinguish "capability absent" from "connectivity broken": these need
    different responses, and a missing capability does not recover on its own. Do
    not report either as a failure of the credential or of the target host.'
  scope: all
  reason: 'On 2026-09-16 the execution path available to Workers had no arbitrary-command
    capability: every server-related tool was registry/query only (host listing, GPU
