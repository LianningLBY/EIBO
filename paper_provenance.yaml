  caption: 'The EIBO measurement. Raw QUIC flow records are quantized into a k-prefix
    symbol over a (direction, size) alphabet at resolution M. The quantized symbol
    feeds two branches that carry different certification strength: an upper branch
    combining a plug-in TV estimate with a confidence radius, which is finite-sample
    strict, and a lower branch built from a classifier-based high-probability lower
    bound, which is asymptotic. The branches meet at the per-pair interval, whose
    gate is the conjunction eps_lo > 0.05 and eps_hi < 0.5.'
