  caption: Estimator limit. (a) Estimated-to-true divergence against exactly-linear
    truth for the plain-i.i.d. known-truth control (1.0002 at k=5 falling to 0.6769
    at k=30) and the real-occupancy twin (0.9938 to 0.8820). (b) The fraction of contexts
    holding fewer than five transitions, rising from 0.000 to 0.998. (c) The effective
    sample size per context, falling from 200000 to 1.09. The estimator deflates large-k
    divergence exactly where contexts are sparse.
