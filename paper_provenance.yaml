    0.5) falls monotonically as the alphabet resolution M increases at k=5, from 340/990
    = 0.3434 at M=1 to zero at M=8 and M=16, while the saturated fraction rises from
    0.0 to 0.391. (b) The crossover sample size at which the M=8 certificate ceases
    to exist, as a function of the true TV distance; the direct and closed-form derivations
    agree to zero absolute difference at every grid point.
