figures:
- id: fig2_certificate_horizon
  location:
    section: results
    figure_number: 0
  caption: Certificate horizon. (a) The certifiable fraction (upper side \epshi <
    0.5) falls monotonically as the alphabet resolution M increases at k=5, from 340/990
    = 0.3434 at M=1 to zero at M=8 and M=16, while the saturated fraction rises from
    0.0 to 0.391. (b) The crossover sample size at which the M=8 certificate ceases
    to exist, as a function of the true TV distance; the direct and closed-form derivations
    agree to zero absolute difference at every grid point.
  type: statistical
  source:
    note: 'manifest: X1 headline table, E3, X4 frontier function'
    experiments: []
  output_path: figures/paper/fig2_certificate_horizon.pdf
  deprecated: false
- id: fig3_estimator_control
  location:
    section: results
    figure_number: 0
  caption: Estimator limit. (a) Estimated-to-true divergence against exactly-linear
    truth for the plain-i.i.d. known-truth control (1.0002 at k=5 falling to 0.6769
    at k=30) and the real-occupancy twin (0.9938 to 0.8820). (b) The fraction of contexts
    holding fewer than five transitions, rising from 0.000 to 0.998. (c) The effective
    sample size per context, falling from 200000 to 1.09. The estimator deflates large-k
    divergence exactly where contexts are sparse.
  type: statistical
  source:
    note: 'manifest: X3 control occupancy dose-response, X3 parametric growth'
    experiments: []
  output_path: figures/paper/fig3_estimator_control.pdf
  deprecated: false
- id: fig4_cross_corpus
  location:
    section: discussion
    figure_number: 0
  caption: 'Robustness across corpora. (a) Per-side fractions on the primary corpus
    and on CESNET-QUIC22: the lower side reproduces almost exactly (0.9960 against
    0.9967) while the upper side and the joint gate differ. The QUIC22 joint gate
    combines a full-n upper side with a lower side capped at 20,000 flows per service,
    shown hatched; capping can only weaken eps_lo, so the bias is conservative. (b)
    The gate gap by minimum per-pair flow count, narrowing from 18.2 percentage points
    unmatched to 9.7 points once pairs are matched at a minimum of 20,000 flows.'
  type: statistical
  source:
    note: 'manifest: X11 full bracket, X1, E10'
    experiments: []
  output_path: figures/paper/fig4_cross_corpus.pdf
  deprecated: false
- id: fig5_channel_sensitivity
  location:
    section: discussion
    figure_number: 0
  caption: 'Channel sensitivity. Matched difference in the radius-free estimate tv_hat
    between the SNI-dependent arm and the SNI-independent random-identifier arm, as
    a function of alphabet cardinality B. The difference grows with identifier cardinality
    before both arms saturate. The quantity is the radius-free estimate only: no two-sided
    interval is emitted by this experiment, and no certificate-level implication follows.'
  type: statistical
  source:
    note: 'manifest: X9_E dose-response channels'
    experiments: []
  output_path: figures/paper/fig5_channel_sensitivity.pdf
  deprecated: false
- id: fig1_bracket_overview
  location:
    section: measurement_design
    figure_number: 0
  caption: 'The EIBO measurement. Raw QUIC flow records are quantized into a k-prefix
    symbol over a (direction, size) alphabet at resolution M. The quantized symbol
    feeds two branches that carry different certification strength: an upper branch
    combining a plug-in TV estimate with a confidence radius, which is finite-sample
    strict, and a lower branch built from a classifier-based high-probability lower
    bound, which is asymptotic. The branches meet at the per-pair interval, whose
    gate is the conjunction eps_lo > 0.05 and eps_hi < 0.5.'
  type: conceptual
  source:
    note: conceptual
    experiments: []
  output_path: figures/paper/fig1_bracket_overview.pdf
  deprecated: false
