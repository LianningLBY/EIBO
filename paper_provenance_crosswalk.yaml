why_this_block_exists: Several quantitative claims cite evidence through a NESTED
  path (a dict key one level down, a list row selected on two fields, or a dict-valued
  metric) that the write-time evidence validator cannot resolve. The values are correct
  and artifact-derived. Per a Director ruling on 2026-09-15 the registry is NOT restructured
  to fit the tool; instead every nested path is written out in full here, beside its
  value, its artifact home, and that artifact's manifest sha256, so a human can follow
  each number to its source.
known_limitation: The validator does not resolve nested registry paths, list-row selections,
  or dict-valued metrics; claims listed here report as 'tier 3 (untraced)'. That tier
  label is a property of the validator, not a provenance gap.
