meta:
  venue: USENIX Security 2027
  track: Cycle 2
  paper_type: empirical
  template: docs/paper/usenix.sty
  template_note: >
    OFFICIAL KIT OBTAINED AND VERIFIED 2026-09-15. Fetched from the USENIX
    Security 2027 Call for Papers page, which links
    https://www.usenix.org/sites/default/files/usenixsecurity2027_latex_templates.zip
    The archive contains usenixsecurity2027_latex_templates/usenix.sty and
    usenixsecurity2027_latex_templates/usenixsecurity2027.tex. Both were
    extracted to docs/paper/. A minimal document using
    \documentclass[letterpaper,twocolumn,10pt]{article} + \usepackage{usenix}
    was compiled with pdflatex in this environment and succeeded (exit 0,
    63,930-byte PDF). The kit is NOT a .cls; it is a .sty used with the
    standard article class. No third-party or hand-rolled geometry is used.
  page_limit: 13
  deadline: 2027-01-26
  registration_deadline: 2027-01-19
  core_claim: >
    On real QUIC wire data, a two-sided epsilon-indistinguishability bracket is
    computable per service pair whose upper side is a finite-sample strict bound
    and whose lower side is an asymptotic lower bound; the guarantee asymmetry is
    the result, not a caveat. At the coarsest pre-registered channel (k=5, M=1),
    336/990 = 33.9% of service pairs satisfy the joint gate, and a finer alphabet
    strictly reduces the certifiable fraction until the certificate is lost
    entirely beyond M=4.
  created_at: 2026-09-15T01:05:00Z
  revised_at: 2026-09-15T02:06:00Z
  revision_note: >
    Revised after Director approval to fold in two constraints: (1) every artifact
    is resolved through artifacts/manifest.yaml content_sha256, never through a
    server path; (2) paper_provenance.yaml is a required gate artifact and no
    quantitative claim is frozen without it. Venue requirements upgraded from
    assumed to verified against the official 2027 CFP.

binding_claim_constraints:
  - id: BC1
    rule: >
      X9_E (channel sensitivity) is scoped to tv_hat ONLY (D087). The paper may
      write "identifier content changes radius-free separation, beyond a pure
      cardinality effect". It MUST NOT write "SNI destroys the epsilon-certificate"
      or "degrades the bracket".
    why: >
      eps_hi is comparison_unavailable at every rung (an arm saturates) and eps_lo
      is absent. Writing a certificate/bracket effect would be an object
      substitution (same class as X12/D064).
    applies_to: [results, discussion, abstract]
    carries: [fig5_channel_sensitivity]
  - id: BC2
    rule: >
      X11's joint gate ANDs a full-n upper side with a capped-20k lower side (D093).
      State the per-side n beside the gate, and state that the resulting bias is
      CONSERVATIVE.
    why: >
      2,145/3,321 pairs capped; a weaker eps_lo understates the gate, so the
      reported gate is a floor, not an overstatement.
    applies_to: [results, discussion, abstract]
    carries: [fig4_cross_corpus, tab_cross_corpus]
  - id: BC3
    rule: >
      X8's DPI check is a smoke-test, NOT a verifier (D091). Never cite
      dpi_violations: 0 as theorem verification.
    why: >
      0/990 testable pairs; a lower bound below a point estimate is expected and
      falsifies nothing.
    applies_to: [results, discussion]
  - id: BC4
    rule: >
      C3 is reframed (D046): a methods/limits finding, not a growth-rate claim.
      The withdrawn sublinear-growth wording must not reappear in any form.
    why: >
      The estimator's own known-truth control returned sublinear on exactly-linear
      data, so the growth question is neither confirmed nor refuted.
    applies_to: [results, discussion, abstract, introduction]
  - id: BC5
    rule: >
      The target venue must not be silently downgraded.
    why: Director instruction.
    applies_to: [meta, report]
  - id: BC6
    rule: >
      Every artifact is resolved through artifacts/manifest.yaml -> content_sha256
      -> local git-tracked path. NEVER through a server path. A server scratch copy
      is not an artifact of record.
    why: >
      Director instruction 2026-09-15. For X12_k5 specifically the canonical bytes
      are 193,228 B / sha256 bebe6bf00ec3b48a541c948353b7db8574fa7721fec64199c614b239adf0a8d5
      (includes the backfill_note explaining the violations/trials backfill). A
      server scratch copy exists at 192,372 B / 71fa0233 WITHOUT that note; numbers
      read from it would have no provenance.
    applies_to: [all]
    verified: >
      VERIFIED 2026-09-15: the manifest entry for exp_id X12_k5 named
      x12_detector_validation_k5.json resolves to
      artifacts/X12_k5/data/x12_detector_validation_k5.json, whose on-disk bytes are
      193,228 and whose sha256 begins bebe6bf0 and contains backfill_note. Matches
      the stated canonical form.
  - id: BC7
    rule: >
      paper_provenance.yaml is a gate. No quantitative claim is frozen without an
      exp_id -> registry entry -> manifest sha chain recorded in it.
    why: >
      Director instruction 2026-09-15. Every figure/table number must trace to an
      exp_id.
    applies_to: [all]

structure_contract:
  venue_requirements:
    source: "USENIX Security 2027 Call for Papers (official)"
    source_url: "https://www.usenix.org/conference/usenixsecurity27/call-for-papers"
    verified_at: 2026-09-15
    verified_status: verified
    body_page_limit: 13
    body_page_limit_quote: "Paper submissions can include up to 13 pages of body text"
    references_limit: unlimited
    appendix_limit: unlimited
    camera_ready_limit: 20
    review_model: double-blind
    required_content:
      - open_science_appendix
    required_content_quote: "Papers must include an 'Open Science' Appendix on submission"
    recommended_content:
      - ethics_appendix
    recommended_content_quote: "An Appendix discussing Ethics is recommended"
    formatting_requirements: >
      U.S. letter, two-column, 10-point Times Roman on 12-point leading, text
      block 7in x 9in. Author names must NOT appear (anonymous review). Papers
      must be self-contained without optional appendices; reviewers are not
      required to read appendices.
    prohibited_practices: "modifying whitespace or formatting defaults (negative vspaces, savetrees, titlesec, removing author blocks, changing fonts)"
    note: >
      Replaces the earlier unverified entry. The mandatory required section is the
      Open Science Appendix (submission-time artifact list with anonymous links);
      the Ethics appendix is recommended, not mandatory. A "Limitations"
      subsection is not a USENIX-mandated section but is retained inside the
      Discussion because BC4-BC7 and the negative C3 result require explicit
      scoping. Cycle 2 mandatory registration is 2027-01-19; the paper deadline is
      2027-01-26.
  technical_core:
    role: study_design
    section_ids: [measurement_design]
    required_for_claims: [C1, C2, C3]
    completeness:
      - problem_formulation
      - measurement_protocol
      - channel_definition_and_hygiene
      - upper_side_construction
      - lower_side_construction
      - guarantee_asymmetry
      - rung_ladder_and_frontier
      - estimation_procedure_and_controls
      - reproducibility_boundary
    source_coverage:
      - item: "TV upper bound: plug-in TV estimate plus a DKW-type confidence radius at alpha_law = 0.025"
        source_ref: "registry X1 conventions_corrected; eibo.statcore::tv_upper_bound"
        destination: measurement_design/upper_side
        manifest_sha: "via artifacts/manifest.yaml content_sha256 for the X1 assembly artifact"
      - item: "TV lower bound: Michel adaptive high-probability lower bound (asymptotic)"
        source_ref: "registry E10; literature_map michel2020high"
        destination: measurement_design/lower_side
      - item: "channel definition: (direction,size) quantized into M bins across k positions, m = (2M)^k; rung ladder M in {1,2,4,8,16}, k in {5,10,15,30}"
        source_ref: "registry X1 k_coverage_denominators; E3"
        destination: measurement_design/channel_and_hygiene
      - item: "hygiene regime: flow- and time-disjoint splits, packet-level splitting prohibited, SNI/address not consumed, padding-mask verification"
        source_ref: "registry E8; X9_E splits; literature_map zhao2025sweet, zhao2026shortcutcatcher"
        destination: measurement_design/channel_and_hygiene
      - item: "frontier function M_max(k,n,tv) closed form"
        source_ref: "registry X4 (TWO_ROUTES_AGREE)"
        destination: results/horizon
      - item: "divisibility lower bound at large k where the plug-in certificate is lost (realizability-conditional)"
        source_ref: "registry X6; literature_map tao2024discriminative"
        destination: results/horizon
      - item: "step-0 occupancy gate"
        source_ref: "registry E1 (gate_verdict PASS_XS_SUBSET_full_paired_design)"
        destination: results/datasets
      - item: "chain-rule estimator construction and known-truth control design"
        source_ref: "registry X3; X3_A; X3_B"
        destination: results/estimator_limit
      - item: "detector-validation protocol: one-sided binomial on the informative stratum"
        source_ref: "registry X12_k5 (canonical 193,228 B / bebe6bf0 via manifest)"
        destination: results/detector_validation
    reproducibility_boundary:
      main_text: "protocol, channel definition, alpha convention, gate definition, and the frontier closed form"
      supplement: "per-pair ledgers (990 rows), the 20-cell upper-side table, X11's n-stratification table, X6's label audit, X3's cross-variant comparison"
      released_artifacts: >
        runners plus the artifacts/manifest.yaml content_sha256 chain; XS-subset
        pair tables; the estimator control artifacts. Described in the mandatory
        Open Science Appendix with anonymous access links.
  evidence_ownership:
    section_ids: [results, discussion]
    evidence_policy: "Each table/figure has exactly one analysis_home; other sections cite without re-analysis."
    validation_units:
      - id: VU1
        kind: experiment
        name: "Bracket construction (C1)"
        claim_ids: [C1]
        evidence: [tab1_headline_bracket, fig1_bracket_overview, fig2_certificate_horizon]
        analysis_home: results/bracket
      - id: VU2
        kind: experiment
        name: "Certificate horizon and divisibility (C2)"
        claim_ids: [C2]
        evidence: [fig2_certificate_horizon, tab1_headline_bracket]
        analysis_home: results/horizon
      - id: VU3
        kind: experiment
        name: "Estimator limit (C3)"
        claim_ids: [C3]
        evidence: [tab3_estimator_control, fig3_estimator_control]
        analysis_home: results/estimator_limit
      - id: VU4
        kind: experiment
        name: "Detector validation"
        claim_ids: [C1]
        evidence: [tab2_detector_validation]
        analysis_home: results/detector_validation
      - id: VU5
        kind: experiment
        name: "Cross-corpus and sensitivity"
        claim_ids: [C1]
        evidence: [fig4_cross_corpus, fig5_channel_sensitivity]
        analysis_home: discussion/robustness
    evidence_coverage:
      - evidence_id: X1
        disposition: body
        analysis_home: results/bracket
      - evidence_id: E10
        disposition: body
        analysis_home: results/bracket
      - evidence_id: E3
        disposition: body
        analysis_home: results/horizon
      - evidence_id: X4
        disposition: body
        analysis_home: results/horizon
      - evidence_id: X6
        disposition: body
        analysis_home: results/horizon
        note: "realizability-conditional; never called distribution-free (D065)"
      - evidence_id: X13
        disposition: body
        analysis_home: discussion/missing_mass
      - evidence_id: X12_k5
        disposition: body
        analysis_home: results/detector_validation
        manifest_note: "canonical 193,228 B / bebe6bf0 (with backfill_note); resolved via manifest"
      - evidence_id: X11
        disposition: body
        analysis_home: discussion/robustness
        note: "per-side n stated; bias CONSERVATIVE (BC2)"
      - evidence_id: X9_E
        disposition: body
        analysis_home: discussion/robustness
        note: "scoped to tv_hat per BC1/D087"
      - evidence_id: E1
        disposition: body
        analysis_home: results/datasets
      - evidence_id: E8
        disposition: body
        analysis_home: measurement_design/channel_and_hygiene
      - evidence_id: X3
        disposition: body
        analysis_home: results/estimator_limit
      - evidence_id: X3_A
        disposition: body
        analysis_home: results/estimator_limit
      - evidence_id: X3_B
        disposition: body
        analysis_home: results/estimator_limit
      - evidence_id: X8
        disposition: appendix
        destination: appendix/vector_law
        rationale: "vector-law relation; DPI check is a smoke-test only (D091/BC3)"
      - evidence_id: E9_Q2v3
        disposition: appendix
        destination: appendix/phist_side
      - evidence_id: X9
        disposition: omit
        rationale: "the original +0.39 SNI delta was a clipping artifact and its attribution is confounded (M127); X9_E replaces it"
      - evidence_id: E7
        disposition: omit
        rationale: "conclusion=failed; produced no usable artifact and carries no approved claim"
  budget_policy:
    basis: "USENIX Security 13-page body limit (verified); empirical-measurement paper type; five figures plus three tables"
    tolerance: 0.15
    hard_ratio: null

required_artifacts:
  - id: paper_provenance
    path: paper_provenance.yaml
    status: required
    gate: true
    built_by: "Director's Agent via auto_build_provenance, during the first data-pull pass"
    rule: >
      Every quantitative claim in the draft traces exp_id -> registry entry ->
