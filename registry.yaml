    updated_at: '2026-09-14T11:10:05.361Z'
    hypothesis: 'The anonymised destination-host identifier exported with this corpus
      is a DETERMINISTIC FUNCTION OF THE SNI, so it is a legitimate PRE-ENCRYPTION
      SIDE CHANNEL and must be EXCLUDED from the declared channel. MECHANISM UNDER
      TEST: including it would let any consumer partition flows by destination host
      with no cryptographic work, so the certified bracket computed on a channel that
      carries it would be a bracket over a DIFFERENT, richer object. HYPOTHESIS: the
      bound delta between an SNI-INCLUSIVE and an SNI-EXCLUDED channel is MEASURABLE,
      so the exclusion becomes a QUANTIFIED PRICE rather than an unstated assumption.
      FALSIFIABLE BY: a delta indistinguishable from zero (which would make the exclusion
      free and the stated assumption harmless) or an undecomposable difference. OBJECT
      DECLARATION, REQUIRED IN ONE SENTENCE: both channels are laws over the SAME
      object -- the same flows, the same (direction,size) channel, the same k-prefix
      symbol alphabet -- differing ONLY by whether the SNI-derived identifier participates
      in the partition; the delta is therefore LIKE-FOR-LIKE. This must be confirmed
      rather than assumed, because this project has already been bitten by an object-conflation
      (the word marginal silently named TWO objects, M055) and by an inequality asserted
      across objects with no DPI order relating them (in either direction) between
      the k-prefix symbol law and the PHIST vector law.'
    spec:
      command: 'to be finalised by the Worker: builds the SAME per-pair bracket twice
        on the same flow set -- once on the SNI-EXCLUDED declared channel (direction,
        size) and once on the SNI-INCLUSIVE channel -- and reports the per-pair bound
        delta as a measured price. It must CALL the repository functions (src/eibo/statcore.py::tv_upper_bound
        and the packing helper), never restate a radius formula.'
      compute_class: '*** CPU ONLY -- CORRECTED. X9 TRAINS NOTHING AND MUST NOT TOUCH
        CUDA. *** It is a BOUND-COMPARISON measurement: the TV bracket delta between
        an SNI-inclusive and an SNI-excluded channel, computed on the H5 corpus through
        the same statcore machinery as X1/X3. This is the SAME compute class as every
        other X-experiment in this project EXCEPT X12. THE PRIOR TEXT ON THIS FIELD
        SAID ''CPU-primary; the GPU is available if the worker finds a GPU-eligible
        step'' -- THAT WAS WRONG AND IS WITHDRAWN, because it implied a GPU expectation
        from the mere fact that a card was free. NO GPU STEP EXISTS IN THIS EXPERIMENT.'
      data_path: /root/autodl-tmp/eibo/data/CESNET-QUICEXT-25-XS.complete.h5 -- the
        same corpus and the same XS subset the main axis uses
      declared_channel: 'the observable channel is (direction, size). The exporter''s
        PPI array carries THREE rows: row 1 direction, row 2 size, row 0 inter-packet
        timing. ROW 0 IS DELIBERATELY EXCLUDED. No TLS-fingerprint-side data (QUIC_USER_AGENT,
        QUIC_TLS_EXT_*, QUIC_*CID) is consumed.'
      deliverable: the bound delta between an SNI-INCLUSIVE and an SNI-EXCLUDED channel,
        reported as a MEASURED PRICE so the exclusion is a quantified choice rather
        than an unstated assumption. Report the delta per pair and in aggregate, with
        the sensitivity of the aggregate to the inclusion rule stated explicitly.
      k_and_ladder: k=5, M=1, so the numbers sit beside X1's rather than beside a
        different construction
      object_declaration_REQUIRED: 'One sentence naming WHICH object each channel
        is a law over, confirming the two are the SAME object differing only by the
        channel -- so the delta is a LIKE-FOR-LIKE comparison. This is a required
        output, not a nicety: this project already has one retracted claim from the
        word marginal silently naming two objects (M055).'
      service_threshold: 2000
      split_policy: flow-disjoint AND time-disjoint; packet-level splitting PROHIBITED;
        D043 buffer-month discipline where the month structure allows (train 202406..202411,
        buffer 202412 UNUSED, test 202501..202505)
      why_this_matters_for_channel_declaration: 'A reviewer reading the dataset docs
        will see three channels and ask why the bound was computed on two. The exclusion
        must therefore be stated explicitly AND priced. That is the whole point of
        the experiment: convert a stated assumption into evidence.'
