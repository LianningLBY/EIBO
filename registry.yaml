      single number: M_max = 0.5*(n*B^2)^(1/k) with B = 0.5 - tv_hat - sqrt(2*ln(2/alpha_law)/n).
      Mechanism -- CORRECTED (M051): the earlier clause ''a finer alphabet multiplies
      the number of cells without adding separation'' was WRONG. A finer alphabet
      resolves MORE, not less: measured tv medians at k=5 rise monotonically with
      M (0.5805 -> 0.8833 -> 0.9248 -> 0.9462 -> 0.9673). What fails as M rises is
      CERTIFIABILITY, not resolution: the certified floor is (1 - eps_hi)/2, so an
      easily-distinguished pair has a SMALL floor, and when eps_hi = tv + radius >
      0.5 the certificate is lost; the radius also grows with the alphabet. The (1/k)
      exponent and the B^2 term then drive M_max down as k rises. And because the
      criterion is a CONJUNCTION (eps_hi = tv_hat + radius < 0.5), the binding feasibility
      boundary is the certifiability crossover, not the radius-only one.'
