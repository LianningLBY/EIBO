novelty_check:
  verdict: NO PRIOR WORK FOUND that measures a two-sided TV / epsilon-indistinguishability bracket on real encrypted traffic. The contribution claim is not challenged by anything in this map.
  date: '2026-09-15'
  searched:
    method: Literature clusters dispatched by the Paper Agent across three directions (open-set/hygiene/baselines; information-theoretic bounds; TV estimation/testing), plus an explicit novelty-threat hunt that asked 'has anyone measured a two-sided bracket on encrypted traffic?'
    evidence: 42 entries in this map, each carrying a verification_level (fulltext / abstract / unverified) and a per-entry note stating the object it reports.
    CAVEAT_ON_SCOPE: This block records the RESULT of that search and the exclusion rule below. It does NOT record the literal query strings or the databases searched, because those were not captured at search time. The negative verdict is therefore only as strong as the cluster notes' consistency, not as strong as a reproducible query log would be. Treat it as a motivated search, not an exhaustive one.
  exclusion_rule_what_would_not_count:
  - 'TV or divergence estimation as general statistics, without an applied encrypted-traffic measurement (covered: han2015, jiao2018, wei, reeve, chan2013, diakonikolas2020) -> methodology we USE, not a competing result.'
  - Anonymity / QIF channel bounds evaluated on models or synthetic channels rather than real traffic (serjantov, chatzikokolakis2008, venkitasubramaniam, ghaderi) -> establishes the IT-limit pedigree, but no measured bracket on captured traffic.
  - Classifier / representation performance on encrypted traffic, including open-set methods (ET-BERT, YaTC, NetGPT, TrafficLLM, OpenCBD, Li2023 Facing Unknown) -> reports accuracy-style metrics, not a two-sided interval on the observable laws.
  - Self-defense / countermeasure evaluations (Athanasiou 2025, Dyer 2012 Peek-a-Boo) -> adjacent application, not a certificate.
  falsification_condition: A prior paper WOULD be a threat if it reports, for real captured encrypted traffic, a per-object interval on the total-variation distance whose sides carry explicitly different certification strength (a finite-sample strict bound on one side, an asymptotic bound on the other) -- i.e. the same asymmetric-guarantee object this project measures. None of the 42 entries does.
  honest_limitations:
  - Some entries are verified at ABSTRACT level only, and at least one carries an explicit note that the paper was NOT fetched, so its exclusion rests on metadata. Per-entry notes record this; the verdict above inherits that weakness.
  - A motivated search can miss work phrased in different vocabulary (e.g. 'distinguishability certificate', 'tolerance interval on distributions on QoS observables'). The exclusion rule above is stated so a reader can judge the miss risk.
